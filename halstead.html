<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Halstead Componentry: The Resilience Fund — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
/* AE: the background as a citable news article (Andrew, 10 Nov 2026) */
.news{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px 18px;margin:0 0 1rem}
.news .paper{font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0;border-bottom:1px solid var(--line);padding-bottom:6px}
.news h2.headline{margin:10px 0 4px;font-size:1.35rem;line-height:1.25}
.news .stand{font-weight:600;margin:4px 0 6px}
.news .byline{font-family:var(--sans);font-size:.85rem;color:var(--ink-2);margin:0 0 6px}
.news .cite .lnk{margin-left:8px}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}
.lockbox{background:var(--panel,#ECEFF3);border-radius:12px;padding:16px 18px;margin:1.5rem 0}
.lockbox label{display:block;font-weight:600;margin-bottom:6px}
.lockbox input{font:inherit;font-size:1.3rem;letter-spacing:.2em;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;max-width:200px;margin:0 8px 8px 0}
.lockbox .bad{color:var(--warn,#9b2c2c);margin:.4rem 0 0}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}
.attach{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px}
.attach figure{margin:0;flex:1 1 220px;max-width:340px}
.attach .att{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in}
.attach img{display:block;width:100%;height:170px;object-fit:cover}
.attach figcaption{font-size:.85rem;color:var(--ink-2);margin-top:5px}
#lightbox{border:none;padding:0;max-width:96vw;max-height:94vh;background:transparent}
#lightbox::backdrop{background:rgba(0,0,0,.78)}
#lightbox img{display:block;max-width:96vw;max-height:86vh;border-radius:6px}
#lightbox p{color:#fff;margin:8px 4px 0;font-size:.92rem}
#lightbox button{position:absolute;top:8px;right:8px;border:none;border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.paper h3.ptext{font-size:.95rem;margin:18px 0 4px;padding-top:12px;border-top:1px solid #E6D3A6}
.paper .body>.prose,.paper h3.ptext+.prose{white-space:pre-line}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
h3.lpart{margin:26px 0 4px;font-size:1rem;color:var(--pine)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examq{margin:0 0 18px}
.ptsbadge{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--pine);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.pn{display:inline-block;min-width:1.4em;color:var(--ink-2);font-family:var(--sans);font-size:.85rem}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.clip{margin:10px 0 12px;padding:10px 12px;border-radius:10px;background:var(--panel, #ECEFF3)}
.clip .btn{margin-right:10px}
.steps li{margin:.35rem 0}
.spmore{margin:12px 0}.dec.settled{opacity:.6}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.hs.sopen{text-decoration:underline dotted var(--pine);text-underline-offset:3px}
/* Say it simply (11 Nov 2026, GUIDE 2p): on only when the cartridge has key.simple (build.py puts S.simple in) */
.simp{display:block;position:relative;margin:6px 0 10px;padding:8px 38px 8px 12px;border-left:4px solid var(--pine);background:#E8EEF6;border-radius:8px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.95rem;line-height:1.45;white-space:normal;color:var(--ink)}
.simp .simpl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pine);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:30px;height:30px;border:0;background:none;color:var(--ink-2);font-size:1rem;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:#fff}
#hlpal .simpb{border:1px solid var(--pine);background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;font-weight:600}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.nb .tools .addnote{border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem;font-weight:600}
.nb-edit{border:1px solid var(--pine);border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-edit textarea{display:block;width:100%;box-sizing:border-box;font:.95rem/1.5 var(--serif);border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical;min-height:4.5em}
.nb-edit .row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:.85rem}
.nb-edit .sw{border:1px solid var(--line);background:#fff;border-radius:999px;width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.nb-edit .sw[aria-pressed="true"]{border:2px solid var(--pine)}
.nb-edit .sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-edit .save{margin-left:auto;border:1px solid var(--pine);background:var(--pine);color:#fff;border-radius:6px;padding:3px 12px;font-size:.85rem;cursor:pointer}
.nb-card.mine .s{cursor:default;white-space:pre-wrap}
.nb-card .hlnote{font-size:.9rem;margin:6px 0 0;padding:4px 8px;background:#f5f5f0;border-radius:6px;white-space:pre-wrap}
.nb-card .acts{display:inline-flex;gap:10px;margin-left:auto}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}

/* model answer (practice sims, 4 Nov 2026): its own tab, open at any time; tap a sentence to see what it does */
.model{margin-top:.4em}
.model .mtext{font-family:var(--serif);font-size:1.04rem;line-height:1.7;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.model .mtext p{margin:0 0 .8em}
.model .mpart{font-family:var(--sans, system-ui, sans-serif);font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted, #667);margin:0 0 .2em}
.model .ms{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .15s;-webkit-tap-highlight-color:transparent}
.model .ms:hover{background:var(--panel)}
.model .ms:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
.model .ms.on{background:var(--amber-bg);box-shadow:inset 0 -2px 0 var(--amber)}
.model.all .ms[data-c="0"]{background:#e3ecf8}.model.all .ms[data-c="1"]{background:#e3f3e6}.model.all .ms[data-c="2"]{background:#fbe7d3}
.model.all .ms[data-c="3"]{background:#efe5f6}.model.all .ms[data-c="4"]{background:#f6f1d5}
.model .mnote{font-family:var(--sans);font-size:.92rem;background:var(--panel);border-left:4px solid var(--amber);border-radius:6px;padding:8px 12px;margin:-.3em 0 .9em}
.model .mnote b{display:block}
.model .mcrit{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);margin-top:4px}
.model .mkey{display:flex;flex-wrap:wrap;gap:6px;margin:.5em 0}
.model .mkey span{font-size:.78rem;padding:2px 9px;border-radius:999px}
.whoorg{margin:18px 0}.whoorg h3{margin:0 0 8px;font-size:1.05rem}
.whogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.whop{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.whop.other{opacity:.62}
.whoav{flex:none;width:56px;height:56px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.05rem}
.whotag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:99px;background:var(--panel);color:var(--ink-2);font-weight:600}
</style>
</head>

imes and driving freight and insurance costs sharply higher almost overnight. Halstead's own warehouses in Sheffield and its European distribution hub were never built to absorb a shock like this, and the company's biggest clients — from automotive assembly lines to food-processing plants — run on tight, contractually enforced delivery windows. The board has authorised a one-time Supply Chain Resilience Fund: a fixed sum, released outside the normal budget cycle, meant to buy the company through the disruption without breaking a single client relationship. It will not be topped up, and it will not roll over. The Asia-Pacific Sourcing Office, the European Distribution Hub, and Head Office Finance now have to agree, together, exactly where that money goes — and they don't all see the same picture of how bad things really are."},"lock":{"v":1,"teach":{"2026-11":"LL2GZPUGljBrECAAMYI/YvfRhsG5WZUJgJweqdDcX1ZODkz3J5J+nA7r6PtQeJVrDDmhe+5XiUcnQbh3","2026-12":"oddhuip8YMnmgUelJ0QnhUZa18yQY5xKpjPvAQ9lh3osBbSU/yiLr2hLQ7arsbLIMNbzT35J8hx5D/G/","2027-01":"L7q6gpfkDFEI8t8k/bqAY/OwtpZxVHfYW7NSsA3q3bpfQXg5P0E1bfm/746OK3l6UU1i5ZDwlV42JRq0","2027-02":"yC0EJxcF4Jde0oKOblEYKOZ+Vgp+g2eKh9ee60N8q5zHUrLr+p8W069msgKP+Oo5j5+aePGz2RsSPGrM","2027-03":"JeFrb7Aeo1zOuotJIf7tn44MyKP4LHhlVhRXPjjaLXL9/7OU3jMC1w86WeKSxP4ELh5CtaI/zASBDKh4","2027-04":"4N0wevDPvHKUOUhahCxK04q87Ia+oS/GkHio/9qlebXYs/3DH3F233dtJkZ3I7wCQx0ItiSaNQ/CvLN9","2027-05":"rL4+BD8oQW2oQCSaBU8NFC4+SbmiaBwmFFpzqA32vbZ0hxxc1ysf0T5jmQCjS4NVXP2i+VpkLosqlz1u"},"slot":7200,"iter":30000,"iv":"gq1GE9OEX9kRvtTl","data":"Rydb+s3UHYFbsVPgMImlrBYDQlRriY3MQX05Prp5RiTN2mZPMGusQD1PZZSknmmTK76GP11NikAQKLqXumAwVq1VcPk6Zj7Irg8TEBiB5MEURVm0esz7NjhLli2XK6HrycXvLLASi2m8sXjcBboyfJxvc8yz4skflnbScCRmYYcjgPWrSQX4Un3LGAYljxiSog2msvxISeiwBYOgkLApqQmbXXBLtzvU5P2E2uiOEt2SMMS8mLKg/KWchjyxWXENE+Fa3dqaKvsAyMwghH/KoXzYEjVeZVodGIBB/yoQHVig/80bpVdFBC/ncLw2ApJxd/ZL0CGXN4WKaR5Cz5j/6hUGYUXpYqYyAWs0usnCXOI9bdd0V/LROARmTxledxOo1ddTyXBTOQHZgNkMsrQrk2xfi8VFhNgSdU7csp9G1wG+6V <script>
/* ---------- class code (studio/lock.py): a locked page shows only a cover until the code for the current
   two-hour slot (or the one before) is typed. The key stays in this tab (sessionStorage) so a reload keeps it. ---------- */
(function () {
  "use strict";
  let started = false;
  const runMain = () => {   // the main script comes after this one in the page: wait until it has been read
    if (started) return; started = true;
    const go = () => { const m = document.createElement("script"); m.textContent = document.getElementById("main").textContent; document.body.appendChild(m); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
  };
  let P = null; try { P = JSON.parse(document.getElementById("lock").textContent); } catch (e) {}
  if (!P) return runMain();
  const C = P.cover, L = P.lock, KEY = "simlearn-unlock:" + C.id;
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const aes = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const open = async (key, ivAndCt) => new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: ivAndCt.slice(0, 12)}, key, ivAndCt.slice(12)));
  async function finish(raw) {
    const text = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(L.iv)}, await aes(raw), b64(L.data)));
    const data = JSON.parse(text);
    if (C.image) data.image = C.image;
    document.getElementById("scenario").textContent = JSON.stringify(data);
    try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    runMain();
  }
  async function tryCode(code) {
    const n = code.toUpperCase().replace(/[^A-Z0-9]/g, ""), now = Math.floor(Date.now() / 1000 / L.slot);
    for (const s of [now, now - 1, now + 1]) {   // + 1: a phone a few minutes slow at the start of a slot
      const wrap = L.slots[String(s)];
      if (!wrap) continue;
      const base = await crypto.subtle.importKey("raw", enc.encode(n), "PBKDF2", false, ["deriveKey"]);
      const kek = await crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: enc.encode(C.id + "|" + s), iterations: L.iter},
                                               base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
      try { return await open(kek, b64(wrap)); } catch (e) {}
    }
    return null;
  }
  function cover(msg) {
    const ctx = (C.context || "").split("\n\n").filter(Boolean).map(p => `<p>${esc(p).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</p>`).join("");
    document.title = C.title;
    document.getElementById("app").innerHTML = `
    <div class="wrap start">
      <h1>${esc(C.title)}</h1>
      ${C.image ? `<figure class="hero"><img src="${C.image.src}" alt="${esc(C.image.alt)}"></figure>` : ""}
      ${ctx ? `<div class="prose">${ctx}</div>` : ""}
      <div class="lockbox">
        <label for="code">This ${C.exam ? "exam" : "simulation"} opens in class. Type the class code your teacher shows you.</label>
        <input id="code" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="12" placeholder="4-digit code">
        <button type="button" class="btn" id="unlock">Open</button>
        <p class="bad" id="bad" role="alert">${msg || ""}</p>
      </div>
    </div>`;
    let busy = false;
    const go = async () => {
      const v = document.getElementById("code").value;
      if (!v.trim() || busy) return;
      busy = true;
      document.getElementById("unlock").disabled = true;
      document.getElementById("bad").textContent = "";
      let raw = null; try { raw = await tryCode(v); } catch (e) {}
      if (raw) return finish(raw);
      busy = false;
      document.getElementById("unlock").disabled = false;
      document.getElementById("bad").textContent = L.until && new Date().toISOString().slice(0, 10) > L.until
        ? "This page needs updating before it can open. Please tell your teacher."
        : "That code doesn't work. Check the spelling, or ask your teacher: the code changes every couple of hours.";
    };
    document.getElementById("unlock").onclick = go;
    document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }
  async function teacherLink() {   // "#t=..." from the teacher tool: opens the page this month without a code
    const h = location.hash.match(/^#t=([A-Za-z0-9_-]+)$/);
    if (!h || !L.teach) return null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    const raw = Uint8Array.from(atob(h[1].replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - h[1].length % 4) % 4)), c => c.charCodeAt(0));
    const key = await aes(raw), d = new Date();
    const months = [-1, 0, 1].map(k => { const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1)); return x.toISOString().slice(0, 7); });
    for (const m of months) {
      if (!L.teach[m]) continue;
      try { return await open(key, b64(L.teach[m])); } catch (e) {}
    }
    return null;
  }
  let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (!window.crypto || !crypto.subtle) return cover("This browser can't open the class code. Try another browser, or ask your teacher.");
  if (saved) finish(b64(saved)).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} cover(); });
  else {
    const hadLink = /^#t=/.test(location.hash), expired = "This teacher link has expired. Get a new one from the teacher tool, or type the class code.";
    teacherLink().then(raw => raw ? finish(raw) : cover(hadLink ? expired : "")).catch(() => cover(hadLink ? expired : ""));
  }
})();
</script>
<script id="main" type="text/plain">
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
// AE written papers (30 Oct 2026) give two briefing notes, not emails: name them as the paper and the students' guide do.
const DOCS = S.course === "AE" ? "briefing notes" : "emails";
const STORE = "simlearn:" + S.id + ":v" + S.version;
const PRINTED_AS = {"Show me the data": "The data behind it", "Give me a counter text": "A counter text", "Give me another one of these": "Another text like it"};   // a practice paper's drawer texts, as printed
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const SPEAK = S.format === "speaking", SP = S.speaking || null;
const SOLO = !!S.solo;   // one researcher on their own (e.g. coursework): one role, no group, no hand-over   // speaking exam: roles prepared alone, listening marked by the tool
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:[], hlNotes:{}, hl:{}, hlLabels:{}, hlGroup:"colour", rq:{}, budget:{}, rationale:"", ack:false, group:null, pick:null, plays:{}, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (!Array.isArray(st.notes)) st.notes = [];   // (older tabs kept notes:"")
if (!st.hlNotes || typeof st.hlNotes !== "object" || Array.isArray(st.hlNotes)) st.hlNotes = {};
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","rq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};
  if (str(s.mode)) out.mode = s.mode;
  if (str(s.role)) out.role = s.role;

function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);

function keepTabInView(prev){   // after a re-render, keep the strip where it was and make sure the open tab is visible
  const nav = document.querySelector(".tabs"), a = nav && nav.querySelector('[aria-selected="true"]');
  if (!nav) return;
  nav.scrollLeft = prev || 0;
  if (!a) return;
  const n = nav.getBoundingClientRect(), b = a.getBoundingClientRect();
  if (b.left < n.left) nav.scrollLeft -= n.left - b.left + 8;
  else if (b.right > n.right) nav.scrollLeft += b.right - n.right + 8;
}

  ${HO ? `<div class="wrap"><div class="handbanner"><b>Hand-over from ${esc(hoName)}</b> (${esc(roleName(r))})${handoverWhen(HO.made) ? ", saved " + esc(handoverWhen(HO.made)) : ""}.
    This tab shows their ${AE2 ? "papers" : "emails"}, what they chose and their highlights. Use it to tell your group what they found.

  <main class="wrap" id="main"></main>

document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("[data-copyref]"); if (!b) return;
  const ref = b.previousElementSibling.textContent, out = b.nextElementSibling;
  try { await navigator.clipboard.writeText(ref); out.textContent = "Copied"; }
  catch(err) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent = "Selected: press Ctrl+C (Cmd+C)"; }
});

// speaking exam: listening only, the shared parts plus this role's own
const qParts = sec => SPEAK ? (sec === "listening" ? ((SP.listening || {}).parts || []).filter(p => !p.roles || p.roles.includes(st.role)) : [])
                            : ((EX && EX[sec] && EX[sec].parts) || []);
const qItems = sec => qParts(sec).flatMap(p => p.items.map(it => ({...it, part: p})));
// "mixed" parts (speaking exams): an item with options is multiple choice, one without is typed in
const isShort = it => it.part.type === "short" || (it.part.type === "mixed" && !it.options);
const QN = {};   // question numbers run through each section, as on a paper (reading 1–n, listening 1–n)
function numberQuestions(){ ["reading", "listening"].forEach(sec => qItems(sec).forEach((it, i) => { QN[it.id] = i + 1; })); }
numberQuestions();
const answered = it => String((st.ans || {})[it.id] || "").trim() !== "";
function qCount(sec){ const a = qItems(sec); return `${a.filter(answered).length} of ${a.length} answered`; }
const pts = n => `${n} point${n === 1 ? "" : "s"}`;
// "Your exam grade combines the three: listening a third, …" (the weights in exam.points; writing and speaking are graded holistically)
function shareLine(P){
  const parts = Object.entries(P).filter(([, w]) => w), tot = parts.reduce((a, [, w]) => a + w, 0);
  if (!tot) return "";
  const same = parts.every(([, w]) => w === parts[0][1]);
  return same ? `The ${parts.length === 2 ? "two" : "three"} grades count equally.`
    : `The grades are weighted: ${parts.map(([k, w]) => `${k} ${Math.round(100 * w / tot)} %`).join(", ")}.`;
}
// "3 of 15 answered on this tab · reading: 25 points in all" (one point per question)
function tabCount(parts, sec){
  const a = parts.flatMap(p => p.items), all = qItems(sec).length;
  return `${a.filter(answered).length} of ${a.length} answered on this tab · ${sec}: ${pts(all)} in all`;
}
const initials = t => t.trim().split(/\s+/).map(w => w.charAt(0)).join("").toUpperCase();   // "Not given" -> "NG": no need to show the key
function qOptsHTML(it, opts){
  const v = (st.ans || {})[it.id] || "", ent = Object.entries(opts);
  const long = ent.length > 6;   // a long list (e.g. seven headings): a drop-down; otherwise every option stays visible
  if (long) return `<select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">Choose…</option>${ent.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}. ${esc(t)}</option>`).join("")}</select>`;
  const short = false;   // always one option under another (Andrew, 22 Oct 2026)
  return `<div class="${short ? "row" : ""}">${ent.map(([k, t]) => `<label><input type="radio" name="q_${esc(it.id)}" data-q="${esc(it.id)}" value="${esc(k)}" ${v === k ? "checked" : ""}><span>${initials(t) === k.toUpperCase() ? "" : `<b>${esc(k)}</b> `}${esc(t)}</span></label>`).join("")}</div>`;

function qPartHTML(p){
  const num = it => QN[it.id];
  let body;
  if (p.type === "gap") {
    const opts = Object.entries(p.options);
    const sel = id => { const v = (st.ans || {})[id] || ""; return `<select data-q="${esc(id)}" aria-label="Question ${QN[id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`; };
    const ids = Object.fromEntries(p.items.map(it => [it.id.split(".").pop(), it.id]));   // [[2]] in the text = item R4.2
    body = `<div class="prose gaptext">${p.text.split("\n\n").map(par => `<p>${esc(par).replace(/\[\[(\d+)\]\]/g, (m, n) => ids[n] ? `<b>(${QN[ids[n]]})</b> ${sel(ids[n])}` : m)}</p>`).join("")}</div>
      <ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`;
  } else if (p.type === "shared" && Object.keys(p.options).length > 6) {   // e.g. headings: the list once, a letter per item
    const opts = Object.entries(p.options);   // "paragraphs": the options are paragraph numbers, so no list is needed
    body = (p.paragraphs ? "" : `<ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`) + p.items.map(it => {

    }).join("");
  } else {
    body = p.items.map(it => `<div class="qitem"><span class="qq"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>

        : qOptsHTML(it, p.type === "shared" ? p.options : (it.options || {}))}</div>`).join("");
  }
  return `<section class="qpart" id="qp_${esc(p.id)}"><h3>${esc(p.title)} <span class="ptsbadge">${pts(p.items.length)}</span></h3>${p.instructions ? `<p class="inst">${esc(p.instructions)}</p>` : ""}${body}</section>`;
}

const PLAYS = () => SP.listening.plays || 2;
const timesWord = n => n === 1 ? "once" : n === 2 ? "twice" : num(n) + " times";
// where a paused (or interrupted) recording stopped: kept in the page only, so a student can check an email and
// carry on without losing a play. Leaving the tab removes the player, so the position is kept here.
const clipPos = {};
function clipState(id){
  const used = (st.plays || {})[id] || 0, left = PLAYS() - used, pos = clipPos[id] || 0;
  if (pos > 0) return {label: "▶ Continue", off: false, msg: left > 0 ? `Paused. You can still start it ${left === 1 ? "once more" : timesWord(left)} after this.` : "Paused. This is your last play."};
  if (left <= 0) return {label: `Played ${timesWord(PLAYS())}`, off: true, msg: `You've heard this recording ${timesWord(PLAYS())}.`};
  return {label: used ? "▶ Play again" : "▶ Play", off: false, msg: `You can play it ${left === PLAYS() ? timesWord(left) : left === 1 ? "once more" : timesWord(left) + " more"}.`};
}
function clipHTML(p){
  if (!p.src) return `<p class="clip muted small">The recording isn't on this page yet. Tell your teacher.</p>`;
  const s = clipState(p.audio);   // counted per recording, not per part
  return `<div class="clip" data-clip="${esc(p.audio)}"><audio preload="none" src="${esc(p.src)}"></audio>
    <button type="button" class="btn" data-play="${esc(p.audio)}" ${s.off ? "disabled" : ""}>${s.label}</button>
    <span class="small muted" data-left="${esc(p.audio)}">${s.msg}</span>
    <progress max="1" value="0" data-prog="${esc(p.audio)}" style="width:100%;margin-top:6px"></progress></div>`;
}
function tabSpeakListening(){
  const L = SP.listening;
  $("#main").innerHTML = `
    <h2 style="margin-top:0">Your recordings <span class="ptsbadge">${pts(qItems("listening").length)}</span></h2>
    <p>${esc(L.intro || "Listen with headphones.")} Read the questions before you press play. You can pause and continue (also after looking at another tab); each new start from the beginning counts as one play.</p>
    <p class="qcount" id="qcount" aria-live="polite">${qCount("listening")}</p>
    ${(seen => qParts("listening").map(p => { const first = !seen.has(p.audio); seen.add(p.audio); return first ? qPartHTML(p).replace("</h3>", "</h3>" + clipHTML(p)) : qPartHTML(p); }).join(""))(new Set())}`;
  wireQuestions("listening");
  document.querySelectorAll(".clip[data-clip]").forEach(box => {
    const id = box.dataset.clip, a = box.querySelector("audio"), b = box.querySelector("[data-play]"),
          prog = box.querySelector("progress"), msg = box.querySelector("[data-left]");
    let starting = false;   // a new play asked for, counted only once the sound really starts
    const show = () => { const s = clipState(id); b.textContent = s.label; b.disabled = s.off; msg.textContent = s.msg; };
    a.addEventListener("timeupdate", () => { if (a.duration) prog.value = a.currentTime / a.duration; if (!a.ended && a.currentTime > 0) clipPos[id] = a.currentTime; });
    a.addEventListener("playing", () => {
      if (starting) { starting = false; st.plays = st.plays || {}; st.plays[id] = (st.plays[id] || 0) + 1; save(); }
      b.textContent = "❚❚ Pause"; b.disabled = false;
      msg.textContent = PLAYS() - st.plays[id] > 0 ? "Playing. You can play it once more afterwards." : "Playing: this is your last play.";
    });
    a.addEventListener("pause", () => { if (!a.ended) { clipPos[id] = a.currentTime; show(); } });
    a.addEventListener("ended", () => { delete clipPos[id]; prog.value = 1; show(); });
    a.addEventListener("error", () => { starting = false; show(); msg.textContent = "The recording didn't load (this didn't use up a play). Check your internet connection and try again, or tell your teacher."; });
    b.onclick = () => {
      if (!a.paused) { a.pause(); return; }
      const pos = clipPos[id] || 0;
      const go = t => { const run = () => { try { a.currentTime = t; } catch(e) {} a.play().catch(() => { starting = false; show(); }); };
        if (t > 0 && a.readyState < 1) { a.addEventListener("loadedmetadata", run, {once: true}); a.load(); } else run(); };
      if (pos > 0) return go(pos);   // continuing: not a new play
      if (((st.plays || {})[id] || 0) >= PLAYS()) return;
      starting = true; b.disabled = true; msg.textContent = "Loading…";
      go(0);
    };
  });
}

          <audio controls preload="none" src="${esc(o.src)}" style="width:100%"></audio>
          ${o.text ? `<details class="vmtext" ${(st.heard || {})[c.id] ? "" : "hidden"}><summary class="small">Show the text</summary><div class="prose">${hlHTML(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`), c.id, "opt")}</div></details>` : ""}`

// Pictures attached to an email (from 27 Oct 2026, design sims): "attachments": [{"src", "alt", "caption"}] on a

function attachHTML(c){

document.addEventListener("click", e => {

function wireMail(c){

  wirePanel();
  let wasOK = budgetOK();
  $("#main").oninput = e => {

  };
}

/* ---------- What happened next (11 Nov 2026: moved here from the teacher's feedback, so students read the story
   while they still care). S.ep (scrambled): the epilogue for each option, or (budget) for each line's band. Once
   revealed, the ending is kept for the decisions as they were then (st.ending), so changing a decision afterwards
   doesn't show another ending. ---------- */
function epData(){ try { return S.ep ? JSON.parse(unscramble(S.ep, `${S.salt}|epilogue`)) : null; } catch(e) { return null; } }
function showEnding(){
  const box = $("#ending"), E = S.ep && !EXAM ? epData() : null;
  if (!box || !E) return;
  if (!st.ending) {
    // only after "Create my submission" has worked (st.handed), with every decision made: never before hand-in
    const B = S.budget, ready = st.handed && (B ? budgetOK() : S.decisions.every(d => st.decisions[d.id])) && words(st.memo || "") >= 50;
    box.innerHTML = ready ? `<div class="consent"><b>What happened next?</b>
      <p class="small">Now that you've handed in, read how the story ends for ${SOLO ? "your" : "your group's"} decisions. You see the ending for the decisions as they are now, and it doesn't change afterwards.</p>
      <button type="button" class="btn" id="endbtn">Show what happened next</button></div>` : "";
    const b = $("#endbtn");
    if (b) b.onclick = () => {
      st.ending = B ? Object.fromEntries(B.items.map(it => [it.id, budgetVal(it.id)]))
                    : Object.fromEntries(S.decisions.map(d => [d.id, st.decisions[d.id]]));
      save(); showEnding();
    };
    return;
  }
  const paras = [E.dateline];
  if (E.by_item) {
    for (const [id, v] of Object.entries(st.ending)) {
      const g = E.by_item[id]; if (!g) continue;
      paras.push(g[v < g.range[0] ? "low" : v > g.range[1] ? "high" : "ok"]);
    }
  } else {
    for (const d of S.decisions) { const t = (E.by_decision[d.id] || {})[st.ending[d.id]]; if (t) paras.push(t); }
  }
  box.innerHTML = `<section class="opened"><h2>What happened next</h2>${paras.filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("")}</section>`;
}

      note: EXAM ? (ai === "yes"
        ? "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers, your decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers and your decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.` : (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, " + (SOLO ? "your" : "your group's") + " decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and " + (SOLO ? "your" : "your group's") + " decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
  if (S.model) $("#out").insertAdjacentHTML("beforeend", `<p class="small">Now compare your text with the <b>Model answer</b> tab.</p>`);
  if (!st.handed) { st.handed = true; save(); }
  showEnding();
}

/* ---------- Model answer (practice sims): S.model = {intro, argues, paragraphs: [[{t, what, crit}]], after}.
   Its own tab, open at any time (Andrew, 4 Nov 2026: students may look before doing the sim). ---------- */
function tabModel(){ $("#main").innerHTML = `<section class="model" id="model"></section>`; showModel(); }
const CRIT_COL = ["#e3ecf8", "#e3f3e6", "#fbe7d3", "#efe5f6", "#f6f1d5"];
function showModel(){
  const M = S.model, box = $("#model");
  if (!M || !box) return;
  const crits = [...new Set(M.paragraphs.flat().map(x => x.crit))];
  let n = 0;
  box.innerHTML = `
    <h2>A model answer</h2>
    ${M.intro ? `<p>${esc(M.intro)}</p>` : ""}
    ${M.argues ? `<p class="small"><b>It argues:</b> ${esc(M.argues)}</p>` : ""}
    <p class="small muted">Tap any sentence to see what it is doing. Then look at your own text: where does it do the same?</p>
    <p><label class="small"><input type="checkbox" id="mall"> Colour every sentence by exam criterion</label></p>
    <div class="mkey" id="mkey" hidden>${crits.map((c, i) => `<span style="background:${CRIT_COL[i % 5]}">${esc(c)}</span>`).join("")}</div>
    <div class="mtext">${M.paragraphs.map((p, pi) => `${(M.parts || [])[pi] ? `<div class="mpart">${pi + 1} · ${esc(M.parts[pi])}</div>` : ""}<p data-p="${pi}">${p.map(x => `<span class="ms" tabindex="0" role="button" data-i="${n++}" data-c="${crits.indexOf(x.crit) % 5}">${esc(x.t)}</span>`).join(" ")}</p>`).join("")}</div>
    ${M.after ? `<p class="small">${esc(M.after)}</p>` : ""}`;
  const flat = M.paragraphs.flatMap((p, pi) => p.map(x => [pi, x]));
  const open = el => {
    box.querySelectorAll(".mnote").forEach(x => x.remove());
    const was = el.classList.contains("on");
    box.querySelectorAll(".ms.on").forEach(x => x.classList.remove("on"));
    if (was) return;
    el.classList.add("on");
    const [, x] = flat[+el.dataset.i];
    const note = document.createElement("div"); note.className = "mnote"; note.setAttribute("aria-live", "polite");
    note.innerHTML = `<b>${esc(x.what)}</b><span class="mcrit">${esc(x.crit)}</span>`;
    el.closest("p").after(note);
  };
  box.querySelectorAll(".ms").forEach(el => {
    el.onclick = () => open(el);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(el); } };
  });
  $("#mall").onchange = e => { box.classList.toggle("all", e.target.checked); $("#mkey").hidden = !e.target.checked; };
}

render();
</script>
</body>
</html>
