<script id="lock" type="application/json">{"cover":{"id":"rung","page":"rungpro","title":"The Missing Rung","tab":"The Missing Rung (Pro) — SimLearn","image":"","context":"This is a thought experiment set in the near future. The United Kingdom, its institutions, its student loans and the history mentioned in the sources are real. The AI agents, the commission, every person quoted, every study and every figure in the sources, apart from the history they name, are invented for this classroom exercise. Practise citing these sources as if they were real, but never cite them, or any 'fact' from this scenario, in real academic work.\n\nFor more than a century, Britain's professions trained their own: a trainee solicitor spent two years drafting contracts and checking documents under a partner's eye, and a junior auditor learned the trade by working through other people's accounts. The routine work earned fees and made tomorrow's partners. Meanwhile, the state encouraged young people to go to university: in 1999 the government set a target of half of all young people entering higher education. Two generations earlier, coal and steel towns had lost their main employers, and their workers had been told to retrain, move or accept lower pay.\n\nIn July 2033, a year before the commission began its work, this report went out on national radio:\n\nGraduation day in Leeds. Chloe Brennan, 22, has a law degree, 140 job applications behind her and a job in a café near the station. “I think the firms are just saving money,” she said. Five years ago, the Leeds law firm Firth Doyle took on twelve trainees a year; this year it took two. “The agents produce a better first draft than most trainees did, they do it in minutes, and our clients are paying about a third of what they used to,” said its managing partner, Martin Firth. “If nobody's training now, who's going to run this firm in 2050?” Across the city, the electrician Dean Walsh can't find apprentices fast enough, and now earns more than his cousin, a solicitor."},"lock":{"v":1,"teach":{"2026-11":"ybq8sneOOJd4gSD8Vq6Y7e3sVV1vP5UwF88IKZNU/JGtWtw9lQVOOILkXx6On7CYIM3D93e7XmEpoocD","2026-12":"aOZy4KZaK6h1C6LdFcmJ4HI3T4x695RglBhEjo/Wd6Rqts+0MUqK0J4srl8ppMi6kPq1siPfhJ+4wiIA","2027-01":"j8MKJT2w1a0C70xqXWFMB3Pbrdn2WMdIMW0ANgMm/znrQJ8FM0pQMvt7m3fgwchNOhmTsHyQ09fCdEaE","2027-02":"WO4g+0XE6QmVbXhujx7fyVAQ0j4Z16A3jon08Q8P1iB66Pf2hvs5Q1MDno+SNHY9tOMeHo0acBDgo9O+","2027-03":"COD9q8wuAxhylWldQrLaJoagRn9B/m70J8d7BttUy7SAaJeFrt+SEcZI44V0bHnUxCTlYl0O7lEqvyoY","2027-04":"edY+OSEzKQTB32fTBg8yWBLIckRuSQV3ICveSVThwIXR4p7P+/Qj7PrF4tY/APubp9rBtOFflLDbGn+b","2027-05":"NeT8nK9H6vXwWiXfU7FlJbeeGjndKKzDyL9XDwECCrGpPW+SMtq1ar2Y5onDBmiSDYwPQw8CvTTSyTpg"},"slot":7200,"iter":30000,"iv":"qXHeh7SlP6VxTOBj","data":"l9h7JmdnnXqhAb8i88pMtThDjZDNhIt6sX1b141pXQi/fbQas4QOpwFPK+HYOTk/Lt4w6xQ4yJxfG/YkO3SeUHBSZmv27m2y14/zoXKtUIqlxPtZc8EoEgpjEFQzvi6PEhPylMNFKlCZecLILxFvUgZ8cz0YuFrRZhtl7/dmnMSAUzERznKh8A4dOpXrYwPkLZWua3fG3PDKhJIrv0QAoSppyC3hhloGzzSmypUN0Sn/AILISK41o6Ei/X48tjv+tReaFuU1TKgZsk1SW6k5cxJUJ8dCOz0fn/y+8IZS3Vydgj4aXCdSGF1aw3+1sqJxrs+GSNBol7/4Gl3a+z1rxEG1WblnD6pfO+1bWZKqJaVjuCX3ETElKE2PSVXL2TLZ+EcVOr/+1OzGdNGPgwQHlvtn2GP+KyXs7e/PrJfxvnjkbpAYLIJ7HtkG9AzS7GMQB9BOJrw79iHkANbjgHBmSgF4nr7LfqdZp9tp6RO4fwXy08q2jzwGrYYyjDfCUqJ8VQczuLi0FBqJbsEuRos0UOt/wPLsPPzTaNqc7/kxgEcCj03mGq6bgT0ONnsZukzO9kavpdlxOa0LnXiI14WU+4uVRdvWiEFzSoBKKi2hQkUw6H9kKb/xTtURD8AfSO5E6VL/PYcERx5gV0XhVkvtR6j8cAQ+zMQr1QPSSJQvnV9psqSjWKuKe4BMPn3FgM4DlsBWZnj0cs5ryM8trDA+t2XtvofgQZ/WTjIWxS23OXfNgful13kFpBS+oC28bj28rS8M3kAOqh82trXIM89+2LeDqIToSyxHE7iNTBtOBxOodmU7XuzcviQm/nz8WO1PngWCDZhXJrjJwTLRGCDzy4UylpmAjtfj8tfImp98Qamze0fxxR1ZApRn1TWpBNGt/S0JEb9lhWt7XtAILJ7UpWCGJWZu8DFDBIARqzhy4aQLWGMAy5e5KPp0Fd7deZFudu0Ts5LDjX4LebPGVEXbEqBmKIah5S/qIDg4HEqituT/qLHgdv8dzE8Y1kc1++PLGd0szeN3RZw4KP3xRT2y9Ki1hONS80vskQ4lBGoW3OidofvV5FTkyBsnLiQs9sg+9jrQjxew4UFr592UHQGbQyQy+DiypKgG/5ZHDsHJNgnd3TXnHUtF5oKbDWxaM9Pvikp68cvqr76wD6/1pzEWk5vX21Ymni0otJlZt1Yro3frHmQxgLVmsWaD+QrkKm4v8D+raTVaZDKZ2nTzqlP <script>
/* ---------- class code for a Pro page (studio/lock.py, build.py build_pro): the same code as the Lite sim (C.id is
   the Lite code), typed here; the key opens the Pro page, which then replaces this document. tryCode and teacherLink
   are copied from studio/template.html (build.py refuses a shell whose copies differ). The key stays in this tab
   (sessionStorage) so a reload reopens the page. Everything is inside this function: the Pro page's own globals
   (S, ROLES, ...) are declared after document.open() in the same window. ---------- */
(function () {
  "use strict";
  let P = null; try { P = JSON.parse(document.getElementById("lock").textContent); } catch (e) {}
  if (!P) return;
  const C = P.cover, L = P.lock, KEY = "simlearn-unlock:" + C.page;
  const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const aes = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const open = async (key, ivAndCt) => new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: ivAndCt.slice(0, 12)}, key, ivAndCt.slice(12)));
  async function finish(raw) {
    let html = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(L.iv)}, await aes(raw), b64(L.data)));
    if (C.image) html = html.replace('const PRO_COVER="";', () => "const PRO_COVER=" + JSON.stringify(C.image) + ";");   // one copy of the picture
    try { sessionStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  async function tryCode(code) {
    const n = code.toUpperCase().replace(/[^A-Z0-9]/g, ""), now = Math.floor(Date.now() / 1000 / L.slot);
    for (const s of [now, now - 1, now + 1]) {   // + 1: a phone a few minutes slow at the start of a slot
      const wrap = L.slots[String(s)];
      if (!wrap) continue;
      const base = await crypto.subtle.importKey("raw", enc.encode(n), "PBKDF2", false, ["deriveKey"]);
      const kek = await crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: enc.encode(C.id + "|" + s), iterations: L.iter},
                                               base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
      try { return await open(kek, b64(wrap)); } catch (e) {}
    }
    return null;
  }
  function cover(msg) {
    const ctx = (C.context || "").split("\n\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
    document.title = C.tab || C.title;
    document.getElementById("app").innerHTML = `
    <header><div class="wrap"><div class="brand">SimLearn<span>PRO</span></div><h1>${esc(C.title)}</h1></div></header>
    <main><div class="wrap"><section class="card">
      ${C.image ? `<img src="${C.image}" alt="">` : ""}
      ${ctx ? `<div class="prose">${ctx}</div>` : ""}
      <div class="lockbox">
        <label for="code">This simulation opens in class. Type the class code your teacher shows you.</label>
        <input id="code" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="12" placeholder="4-digit code">
        <button type="button" class="btn" id="unlock">Open</button>
        <p class="bad" id="bad" role="alert">${msg || ""}</p>
      </div>
    </section></div></main>`;
    let busy = false;
    const go = async () => {
      const v = document.getElementById("code").value;
      if (!v.trim() || busy) return;
      busy = true;
      document.getElementById("unlock").disabled = true;
      document.getElementById("bad").textContent = "";
      let raw = null; try { raw = await tryCode(v); } catch (e) {}
      if (raw) return finish(raw);
      busy = false;
      document.getElementById("unlock").disabled = false;
      document.getElementById("bad").textContent = L.until && new Date().toISOString().slice(0, 10) > L.until
        ? "This page needs updating before it can open. Please tell your teacher."
        : "That code doesn't work. Check the spelling, or ask your teacher: the code changes every couple of hours.";
    };
    document.getElementById("unlock").onclick = go;
    document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }
  async function teacherLink() {   // "#t=..." from the teacher tool: opens the page this month without a code
    const h = location.hash.match(/^#t=([A-Za-z0-9_-]+)$/);
    if (!h || !L.teach) return null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    const raw = Uint8Array.from(atob(h[1].replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - h[1].length % 4) % 4)), c => c.charCodeAt(0));
    const key = await aes(raw), d = new Date();
    const months = [-1, 0, 1].map(k => { const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + k, 1)); return x.toISOString().slice(0, 7); });
    for (const m of months) {
      if (!L.teach[m]) continue;
      try { return await open(key, b64(L.teach[m])); } catch (e) {}
    }
    return null;
  }
  let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (!window.crypto || !crypto.subtle) return cover("This browser can't open the class code. Try another browser, or ask your teacher.");
  if (saved) finish(b64(saved)).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} cover(); });
  else {
    const hadLink = /^#t=/.test(location.hash), expired = "This teacher link has expired. Get a new one from the teacher tool, or type the class code.";
    teacherLink().then(raw => raw ? finish(raw) : cover(hadLink ? expired : "")).catch(() => cover(hadLink ? expired : ""));
  }
})();
</script>
