<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Almara Hosting Review — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
}
</style>
</head>

assed on paper — a minimum wage, a heat-work ban during peak summer hours, an ombudsman's office — and argues the tournament itself is driving that change faster than isolation ever could. Critics counter that enforcement is patchy, the reforms arrived only after international pressure, and hosting rights are functioning as a reputational shield rather than a lever. With eighteen months until kickoff, broadcast and sponsorship contracts are signed, stadiums are largely built, and the Hosting Integrity Panel must recommend whether to uphold Almara's hosting rights on binding new conditions or strip them and relocate the tournament.","scar":{"label":"The Draznik Withdrawal","text":"Twelve years ago the Council abruptly stripped hosting rights from Draznik after a leaked report on prison-labour use in stadium construction, relocating the tournament eight months before kickoff. The move generated headlines but no lasting change: migrant workers went unpaid for months amid the contract collapse, broadcasters and sponsors pressed damages claims that the Council ultimately settled, and Draznik's government simply relabelled the same labour scheme for its next major project. The Panel remains wary of any recommendation that reads as decisive on television but leaves no enforceable mechanism behind it."},"proof":{"label":"The Lantao Framework","text":"Nine years ago, facing similar allegations against the People's Republic of Lantao, the Council chose neither withdrawal nor silence: it imposed the Lantao Framework, which made continued hosting conditional on external labour inspection, regular public reporting and financial consequences for missed safety targets. Verified injury rates fell by nearly half over eighteen months, and the framework has been a reference point in the Council's debates on hosting conditions ever since."},"constraint":"The Panel must submit its recommendation within three weeks — any later, and the Council's sponsors say contractual relocation or condition clauses become impossible to invoke before broadcast production schedules lock in."},"roles":[{"id":"A","label":"Role A","dept":"Human Rights & Labour","characters":[{"id":"anand_kessler","name":"Dr. Priya Anand-Kessler","title":"Migration & Labour Sociologist","subject":"Heat, Debt, and the Build","email":"Thought you should see this before the Panel meets again — it's the clearest account I've read of how the sponsorship system actually traps workers, not just what happens once they're trapped.\n\nFrom the paper:\n“Almara's kafala-derived sponsorship system ties a migrant worker's legal residency to a single employer, who holds the worker's passport and can, in practice though rarely in law, block a change of job or an exit visa. This is the mechanism, not a side effect of it, that explains why recruitment debt — typically eight to fourteen months' wages, paid to agents before a worker ever boards a flight — functions as coercion rather than an unfortunate cost: a worker who wants to leave a dangerous site cannot simply resign without forfeiting both the debt already sunk and any chance of repaying it elsewhere. Fieldwork across eleven construction sites tied to Rugby Grand Cup infrastructure found that three-quarters of workers interviewed had never seen the written contract terms they were recruited under, and nearly half reported unpaid wages lasting two months or longer at some point during their tenure. It should be said plainly that Almara's 2027 wage-protection decree, requiring electronic payment and a minimum monthly floor, has measurably reduced the worst delays on Council-audited sites specifically — the reform is real, not cosmetic, where auditors actually look. But Council audits cover fewer than a third of active sites, and the sponsorship link itself, which is what manufactures the coercion in the first place, remains untouched by any reform passed so far. Removing that link, not adding another wage rule on top of it, is the change that would actually alter workers' bargaining position.”","citation":"Anand-Kessler, P. (2029). Sponsorship, Debt, and the Architecture of Consent: Migrant Labour on Almara's Rugby Grand Cup Sites. Journal of Global Labour Studies, 14(2), 88–114.","offers":[{"id":"a","title":"Another voice, same position","text":"2LrqszpPlci8O5r6JMTsH8YVDWFn2IUtpSUAshRA1TYbBiBXnwImkE+JiQWlQbMxAe4oYjyboOJbJe0W/rmbBS5kGmelVQ+mxmRe5emTZWaACz5la/cxvpjOq2ZhGziuta/zKC2QA7MwvQbUEdSR+1oaiY7U8p+1dvHpmBdz8aJoefADh7r60VfShjVbieq99ddAgttPqPRX1JNiJbpbNP/X5dXGPT9Okt+UGyZBS7mk9i1z9PmZYP1VS23zzGlHb+7JhpjPJ5jhxqoC3jxGJonkPZQTuAJFLY4/HgTrCPYjEA6uybiQZSxdYwp7X+97T3I8iTxTj6Dr/0c2GEROWqkc704fr12jP1KweapUDrRTWjrQkiFc2xTF2rJcLnHFJNptmBE3qkZND6ZmgzmR9EbqHFA7AhgvELi2JxcbqfwHltHUYuGKIQveRcP+csaY3/w3qSg2Ns9pF4J4mgtkTgVmHJkfSoKqlqr7XaiO3WkRhZ/OEGeuzCCKWSG4GxVysfilAFkQwk0lFVcevmrzsy+ANTcpwTxG7DpiE/Gd+iskk/gXLnGjjSGPCAW8baL2hu4K3Lacrlj0WStzPJmxslFFy6NbwhbuYd0JooyLBtHNyxQQ8Pp5yo8xLNrZ5bkGz4fKEWnXnoqgXBPny5T2AeE634b8Ee5bKPwgBqbIuEQBz7Uro98wZFYsRVqi4UbIcuRNqkR0TcsGSZu5ZnCDG56VZpUlHfCAM/C2XG5LEPCwYgl/1taEtHMz8w+7bSU/Cyy0CSdPWZSrR4HPfKF8kNauGHE8wK5udDbU6VVoZvpBsCJfTo83FV89UXrjshXOvQL+RFV/py+z6WJ8KDfU83fWcB+GKiLUETnGj7XFPpXoH/le/nYV3j/cUZbPsUn3kOQ5MEc="},{"id":"b","title":"A competing angle","text":"xdNVu8LMESUHO5AhsbV969AzJrkDxMSLkfxYyzboKCwQlPlW7lOl+I654mbjM3PUVwlsVS9qF7DxRwjqp3B51uYOhRxHW0gnRzih4FuTuU9KPJU8tz0fYjAmMW0Nt2yuX4mydbTuzfpSTOwVfktCB5rucTUUQOx8Nl8kJJo6DgQF2WdUlQrRUuKsyy+TsUZUIrjenYTAPJYgJgs+QGBYZLkve6f2toovrPRhtVvAMA6Imn6YE0XQlmbnKzyfldJBv63ZvUVjuZfe1zzyDlnhdvtBoSn4eVfeEjY+Y6DZM6El5FvkTB2WvNjhZ/Y/gFm8cWj1nYOKP0AP6RVAO0WbbpDH7+m/F4FNOD2Y08Rqt1ZOzBgCMii09X4rpd+SVV9ZGKD8zRqTim/mRqwIXuZXjOiKgkwT66KSHSfPciwSzxTZsMMoRD35toH4kWJHSEsK72fV027f6x8vCVB82OnTJwdfAG6sUQnqbvlYyxgtKXEIpO5xwoNPlGNCDlyXeJLtq0TbQ2Dd7Z7tERtTod9kC3aNnnSY912SAB5UCriqOYrL4YK41jW7KJfLA9bFMsHb6BYTTsdWQw/QWGiffGg70RdXntEFamXViyg8qdreqSgPziDMz20Y55BTDG719sqJc6rTOyluFg4f2my0sawSk38YCHZMBFiTk7KDkLZEDTg3P8YwSqPtPfPbIwHraoHW9ZgqfE5CdDM6nBUX0lFhzbRbEaqTnnPW2rhLu6 terms of up to seven years, a code the government has not suspended, amended, or even publicly addressed since signing. The clause's drafting history explains why: it was written broad enough to be signable by any host, including ones with laws squarely contradicting it, because narrowing the language to require actual decriminalisation would have made the bid process itself politically impossible for several past hosts, not just Almara. The result is a clause that generates goodwill headlines at signing and provides no basis for enforcement action later — the Council's own legal office has confirmed it cannot compel a change to domestic criminal law under any hosting contract currently in force. Press-freedom protections fare no better: three journalists covering stadium construction have been detained since 2027 under vague \"national security\" provisions, and the hosting contract's press-access guarantees, unlike the labour provisions Anand-Kessler documents, carry no audit mechanism at all. None of this means enforceable protection is impossible — a narrower clause requiring specific, auditable commitments, rather than broad aspirational language, could plausibly be negotiated even now. It means the current clause was never built to do the job it is being asked to do.”","citation":"Berrada-Lindqvist, Y. (2029). Silence by Design: Non-Discrimination Clauses in International Hosting Contracts. International Sports Law Review, 22(1), 45–71.","offers":[{"id":"a","title":"Another voice, same position","text":"1n8Lzcsj4p4ScOynbZiveDyxCkDG84TbAo6t8cb5DlE2vxgQu6rJEYeinIqLuiQWtHP/9uPeGIzPWzolfnA071nOgOwRLRkIJ0fR76yyPpSPTjf6rqiJFSc32i1H6IO4EjKBoaSV5JiacDZRDQf0yVe3yJaXqDJtxvmzmvL7iEtJelZXToUAqHVjodhaQhbbgovpx5Wfpx/7M9lO4xTmJkX8gENj04PrEDULGbteMjB84EmTBkRwxCGSMk4b64qi4sJQipN0ch1JxqRGUINsdSlwOnWx+yOH1U5m8iFa3rYHa68dSea4J3XX8Jgjz3p9Oqp++sVskU6Jz40RYcYMd9kkc+RtCef58BfJksYVOWjq7NP8xr2y5RRLItFkTEhdiViNCQSxT5HhgE5VzO5PqWbi+aMc6phfWvhnzuVk7kWMWQEeDmPgrDpvsLxGqnpg+KCliEMPgw8X2pktU dd0ooKYwMnxP1x1X7wLZe/5i0rGRqoAMxJptiOZFcTJVe6cDay9j+r1OLzgAydTII2jzrUEhhSrNkjwTL7X/4G/6gg3S5wfpz8L8l0HCzjXmk2siStU+bRpws0lmVMZ63cBNelQRH5+0aRiXa0VDmKrJwcdIeKReG8bkPBL60u8HP92tzFYcg=="}]},{"id":"mahlangu_voss","name":"Dr. Naledi Mahlangu-Voss","title":"Occupational Epidemiologist","subject":"Counting the Dead","email":"This is the one the Panel keeps getting wrong in meetings — the death toll everyone quotes and the death toll this paper defends are not the same number, and the gap matters.\n\nFrom the paper:\n“Official figures from Almara's labour ministry record 47 worker deaths on Grand Cup infrastructure sites since the 2023 hosting award, attributing 6 to heat stress and the remaining 41 to \"non-work-related causes,\" predominantly cardiac events. This classification is not obviously wrong on its face — cardiac events are a real and common cause of death — but it excludes heat stress as a contributing factor by design: Almara's post-mortem protocol does not test for heat-related organ damage unless a death occurs during the four hottest months, despite physiological evidence that chronic heat exposure elevates cardiac risk year-round for outdoor labourers. Re-analysis of the 41 death certificates using WHO-recommended heat-attribution criteria reclassifies at least 23 of these deaths as heat-related with reasonable confidence, and a further 9 as indeterminate rather than confidently non-heat-related. This does not mean the true heat toll is simply 29 (the official 6 plus these 23) rather than 6 — it means the official figure is built on a classification protocol designed to produce a low number, not on a genuine absence of heat involvement. To be fair to Almara's position, worker mortality on major infrastructure projects is elevated in most fast-construction contexts globally, including in states with far better labour protections, so some baseline of deaths should not be read as evidence of exceptional Almaran negligence on its own. What is exceptional is the classification method, not necessarily the underlying hazard.”","citation":"Mahlangu-Voss, N. (2029). Heat, Undercounting, and the Politics of Cause of Death on Almara's Construction Sites. Occupational and Environmental Medicine, 86(4), 210–227.","offers":[{"id":"a","title":"Another voice, same position","text":"qEhyq/ulWnD5Hfk+RiIMWHvzItbCA+Il29hsjlYcbCY5UIXYcFB7HYNv6fmbD8zsRsKtLWlXKmgMlzWwfdEjFwzyAX3w00wKLjojdrl5khM+g7YjHGFSqQOwDYOmxEdQ7CBRNW4raYLqsl/9w4yTE7ClUX8cP/eDpIHYPEEFpccyklllx4Svyvu2iGfjznQROPIAlH/PaKHnqNlEZN68BrKI1H90QegCB09CUpx+7th4LkTwX7sOn7ALsCrAj3IDYQwhc0Du12+waEqyWnpkKthyoo/a0EZT5mDTkU+zqmu70nVfMEhQ/BAhCQpI2kNNmldesSs65RSkebFtEhrjghbXQ/PRYj5acNmSqCL6m28Bskv11fXUh+4RrcYC0BgICxMQ6YUVMjCUQ+6RHmLZ5I+sNdj/UfWgj0V8BCbSlW2Md2Q4FrBU9VeBFTKwapC6bw00rMbXfkfH+5AM5gvpMNC57KNT6IddBDPtJgVrmk0bZXLwf73tN7MiJ+Tb4VLjoL0AY7TxXqKzULUHCttgRNANlJoOEAGq/4THVI+cO5bxVz/JMnVz8Q8FUGGrmWZRLunsH31v5zJ+mPhn586JeonzYqV74vNpCvcI/Mkos6J2VlbRaUz8kQgiSqrr9wHlHnlErKh80cxpVbhsfexAXiPyhuMME3hnUAkJSU/5J54/RQudu8DgFgNNRYnz19+8c1yZFzvSbtYC2Qj781LOqqK03JAl7srqxEGhNlsnFKa6pW8bSSYhZNgBYJXliJP9DvFwllBZfd+WQmOAnA=="},{"id":"b","title":"A competing angle","text":"BPcgKIT1LB8Kfi+W8WnJ0zXQB5poXspBCyGz/NO7orY0fkC/iHYEWoQuJe9HIZyhx+3VIHn8DewSCFG6f3NlSscPeJV7l0bLvWZg/AlkAWKYzV+pL7IiulbMNixgfmycIELVWwDxjER1sSRBIoqbQ5ZiBaZnrbo16dPXJfXe71awG8YyO7fwRzAoqUrWt5gnC85dbvsWFFslQ6ponp0Lkv1pmaRCET3gktA0166NPxS0KMhzQ1YhfarjViTpbICkx6gF8XfsuAO93xoZQn+M2bOfwDaSm+qO7jEGgCStrXSy5fOR+xTUu4kp9a6TUXQf++zKEurIZwQRTP4nxRKExV7/tHcUl4mYQgnBu9Wq1xBMf81heLF9w0Rc8sXqmZGtIpIGHf7TTAI9t1wI4jcnnNPC7Wcpuar7TxAcz4sP9NPKBbqdkN7h+PjEndme4j+yfMZloKoafdogZj2jBx4R3KywqTez0UjEbkAPtpmddJfFmgMmHfqphMFD9+3fg/XIbS7qD31X0q+cG5CnqsGgLNdrD5pTiLvUV51+JtVJdidnND9Xuz3v6QJgyuREAJtzU/vGaX+xFVM2/17M3rF0hrd/8c2J/Sb/HgQQghee2TJYwbVOraA5N5rZoCbNZ7Laek6cSH7egIDA0sofgr+7Zp4zq9BO6e4fI+gbXquIs205/07RkLN97F+T3GwjCZY4KppX4pfvsB2EVbCl3Vn48hqBm9JMl/39C3SE5IWtwQq1wsrR/q1e72js8PXhOiYRvzCZPFOv3vXypEhzu84Z6hioPEosd97wgQa9t0IOj0XK8/plJ4bGKxDuiTM5k0pr9a15eqXpPDWWon nal or amateur, and no funded plan to establish one before or immediately after the tournament — the closest comparable case, a 2019 host with a similarly nonexistent domestic base, became the clearest white-elephant example in this dataset, with its primary stadium now hosting an average of four events per year. It would be too strong to say infrastructure legacy is doomed without a pre-existing league; two hosts in this dataset built successful post-tournament leagues from scratch using tournament momentum and sustained government subsidy. But subsidy-dependent success of that kind requires a level of continued government investment that erodes much of the \"self-sustaining economic legacy\" argument Almara's bid used to justify the hosting award in the first place.”","citation":"Thorne-Adeyemi, M. (2028). White Elephants and Working Stadiums: Post-Tournament Infrastructure Use Across Twelve Grand Cup Hosts. Journal of Sports Economics, 29(3), 301–329.","offers":[{"id":"a","title":"Another voice, same position","text":"UVgnJPM64kBcxY0RJQAISf7C2VgBlvbRBMKfi1Xh5Yus2+sU9EEQK76kybncunqeRpmfsu7W+V7fayEkYRQOylglIwFWzrUM3Sl+AQ9ETv3tVF0nBvEuySUZXzzEiAhuk4dLJwoTCtRkbu+DDrCi/HgohuNJqgqY49e6jzLA0x9g3gcNG+bjpk8X2/eB4BF+JhSWC7EZP+XFCk2QIu+4IrfPloHGkn9X6B/Z2fxh+DI9MWDWNkC2OyFId0njs0R5nUC5gVz7jXyuRx0pncACZkL3f0wT+EgBylCkX6mF8xRiuwyLqpzWpOaZbuYmKUqxxzjAyQt04h3I91f0+6ufmOa+kv5vQpPGXmWMoffnnAle7l/730ACR5b2YySv0xYaOaLM6b8spo6W7XUzyaTxN4/TC9sRM6nh75568BvO2l2oibSrllYeuR5zlNBjFdU7FgGBYwZZneB8CXamap18WaXHCgyLOnmF+Dqcu8lJ3jGwlk5AkIdEjZVx+7KWdMqD+WjNQdFvkubLQLBOgBCGeLJRQC0ySkh8Wc6RS69Z53G4i6bp3fNMlfSo9sCO+UBXYXxOArqDV7AqGkJuGYS2ACWjTReERjyPyUeEIuzieqWiP8w2MgB6iViycIw+glBlT32l6TUbr7rkh4gdaIEWRGobmsueliEF/G9xOpNrYY0JPv9nc/Z4jjJatuS0mXfQg/1V10yMalNCzSbw7sbjKFIfX6aUXv+g0v8QJMDX6n/6WOCbWa/73QpqOs5U3w9jf2Z2zOMRxXE87BDcsQgeKwAbirRJSW1gYnN0AKVgRFZ+R15R9jEtsdHJU1h/NbmItry/zpdK1WxO0BHW6pCYspLCXPW/zgVvYdVekirvGLWlRax6lfEGoRWYl5cRMTDRUS1cvNPhU/JaFTZTdyIMRxVuHkTR4jlkgpFlZKKibMcIo3IkTHBQ7cr+2Ncf0/pgv7j ing the Game","email":"This is the strongest evidence for the 'engagement grows the sport' argument I've found — but read the second half before you use it, the durability finding is the part that matters for our recommendation.\n\nFrom the paper:\n“Youth rugby registration in the three most recent non-traditional Grand Cup host nations rose by an average of 340% in the two years surrounding the tournament, a genuinely large effect that lends real weight to the Council's original \"grow the game\" rationale for awarding hosting rights to markets like Almara. The mechanism is straightforward and well-supported by survey data: visible elite competition, school outreach programmes timed to the tournament, and a wave of new junior clubs founded in the eighteen-month window before and after kickoff. The complication is durability. In two of the three markets studied, registration numbers fell back to within 40% of pre-tournament baseline within four years, once the outreach funding, which was tournament-linked rather than structurally embedded in national sport budgets, expired. The third market, the only one to pair hosting with a funded ten-year domestic league commitment, has so far retained the bulk of its participation gains, though its tournament is too recent for a four-year comparison. Almara's current sports ministry budget includes no comparable multi-year domestic league commitment, funded or announced, which suggests the participation gains a host-stripping decision would sacrifice may be considerably smaller and shorter-lived than headline registration figures from hosting-year-one would imply, unless such a commitment is secured as a condition of continued hosting rather than assumed to follow from it automatically.”","citation":"Vasquez-Okafor, E. (2029). Does Hosting Grow the Game? Youth Participation Effects Across Emerging Rugby Markets. International Journal of Sport Policy, 21(2), 133–158.","offers":[{"id":"a","title":"Another voice, same position","t ate — meaning a longer relocation window, which the Panel currently has, meaningfully reduces exposure rather than making relocation categorically unaffordable. Second, several major sponsors have contractual human-rights morality clauses of their own, activated by sufficiently severe and documented findings, that would allow them to exit without triggering the penalty they'd otherwise owe the Council — several sponsor relations contacts have indicated privately that a Council-initiated relocation on human-rights grounds would likely be treated by their own boards as satisfying that clause, reducing the sponsor-side exposure below the US$90–150 million figure calculated under a standard breach scenario. Neither point makes relocation cheap. Both suggest the commercial case against relocation is somewhat weaker, and considerably more negotiable, than the headline figures alone suggest.”","citation":"Reyes-Lindström, T. (2029). Contractual Exposure and Relocation Cost Modelling for the Fourteenth Rugby Grand Cup. Council Commercial Affairs Working Paper 14-07.","offers":[{"id":"a","title":"Another voice, same position","text":"8Ojoqg9IphGEhb+BmOcgtd3YLV8+zeIzDGUWOwrLdvIIdPtALRwodlaGHSlMV/RCQtl/4uJX1QTMpT8gwP4Ix8fc6PMtfNZkCW1hkSaewngWWKU5/nBBRfRalq7+SWXxuIi1GOO+9d41wBESRZjZlNO22JaB9hMuSI43cGYtUu53CwmcTobG/oLINmWqtl3LgM7JaogoirOGZ0ql/426DVtpKZm4/8mgs60675LX5xopfV0QBisjL3sYuhK3OMwtjbdr+HgN+EEncR+ukNHoP6E+Y/iU9WwEHSzEsdYGoeMxkuE5r7Qq2NJidWfiRE6xx7YVhPvvezizmv9oJwUNRQj425O0W8sFkZDnpP9MpzVFM+oTXgOdZNapiUlxMYeMPnZeOEVl/Xyw3eurmJJfEjaq0tZk0jVoX4ZnUDi2Q0c3Ld/JT78jnBbxMQUnur5ZZnFxvCpI2KP/rSvABo6qcvWvA8kYo1YcAn0WW5LnJzxtclVvsq9LsoXmezMq6/et7vD4UsmZTgPlav5W9kibHOAig2W69oDVwv4ZaZPpi/3/9NCfJpRYId0GCu8VzQoA1jQWC0o8Pw+YYeeNMTaP6sE3NH5tONfvyys2ZuiIf+HUN/6LAXC8aUDWuSacfi0DrbHylgC1846DYIj73a3g1doHoqbrmfWF6OTlh81O5CNbBpIOsgoeAWtCETh8yN4UXkwdp4MegZ2rG+R2VbwnFJXUlGYd4StQ+BjdLRkT8+hHqlDlIlgdFKlfrkUcQLzhs1EUaOnFkmQvOeqLKGDE/W+gzy7mTayF3iPlDANJkQ+nj+godVcf9tBEslKFg2BMeav6U5d2Z62sVesiQppdsRirt ters":[{"id":"marchetti_osei","name":"Prof. Helena Marchetti-Osei","title":"International Sports Law Scholar","subject":"Contracts Without Teeth","email":"Before anyone recommends stripping the hosting rights outright, this is the legal reality check the Panel asked for — it's not as simple as declaring the contract void.\n\nFrom the paper:\n“The Council's hosting agreements contain no explicit human-rights termination clause; the closest available legal basis for revoking Almara's hosting rights is the general \"material breach of good governance obligations\" provision, which has been tested in arbitration exactly once, when Draznik's government challenged its revocation, and the arbitration panel ruled the Council had acted within its rights but only because the leaked prison-labour documentation met an unusually high evidentiary bar. Almara's documented abuses, while serious, are in several respects less straightforwardly documented than Draznik's were: the labour violations rely on sampled fieldwork and contested death-count methodology rather than leaked government documents, and the discrimination concerns rest on unenforced rather than actively-prosecuted criminal law. This does not mean revocation would fail in arbitration, but it means the Council should not assume Draznik's precedent transfers cleanly, and a revocation recommendation built primarily on the assumption that \"we did it before, we can do it again\" is legally weaker than the Panel's public rhetoric sometimes suggests. A conditional-hosting approach modelled on Lantao carries substantially less legal exposure, since it does not require proving breach to an arbitration standard — it simply requires the host's continued consent to new terms, which Almara's government has signalled openly it would prefer to outright revocation.”","citation":"Marchetti-Osei, H. (2029). Precedent and Exposure: The Legal Architecture of Hosting Rights Revocation. International Sports Law Review, 22(2), 88–119.","of es that did the actual work, not monitoring in general. First, inspectors were appointed and paid by the Council directly rather than by the host government, removing a conflict of interest present in two of the comparison cases. Second, findings were published quarterly on a fixed public schedule rather than released at the host's discretion, which prevented the selective-disclosure pattern seen in a comparison case where a host published favourable findings promptly and delayed unfavourable ones by over a year. Third, and most consequentially, payment milestones tied to Council commercial disbursements (broadcast revenue share, sponsorship coordination fees) were withheld automatically on missed benchmarks rather than requiring a separate Council vote to trigger a penalty — removing the political cost of penalising a host that a discretionary vote requires every single time. Any conditional-hosting arrangement for Almara that omits the automatic-withholding feature specifically is, on this evidence, likely to underperform Lantao regardless of how rigorous its inspection regime looks on paper.”","citation":"Sørensen-Ibarra, K. (2028). Designing Enforcement: A Comparative Study of the Lantao Framework. Global Governance Quarterly, 34(1), 55–82.","offers":[{"id":"a","title":"Another voice, same position","text":"IUVXJtvTJ72zXUWMD34pi7HpiyJ6+KIlqoEmy1nrrJ4kOyW6H6X5pAMn+So4UeIbibXcCvz38XWE+09L2ZyQlQa2tJ8REd+kbrp3lU8UTIppsDdV0E4cdeSUPaTmGXL5iRRR3jleOKB9v8WBzyCTVu91vZBMgWi+cbt1BL98keN9ato/QMNH8GyF+p+sstWSfGi7Qk2uvj/ogDJHVbMl9rUbej3Ke9RYYaOzvzcsaV0WcteMxORKWNAhzYhAZfww2OQX33iqQxVSDMf9u/1qEmlyzO5uhu2vyzsz6H9onHcoGc3DMBvlgdfChVa+FdHWTk55yi2NqUX9C0hTFrSU1jEP4ke6Tv10Jdp5jrbFJoCYY6hZcZOJ9JC8umzm6YIC9KwFyhJYXVtI90ncF2MFAmolqIxvcXz90XD4RDdn4E4s97mEI4XFVwgM3atFTE7MnWZwhOoa6bYBylBlYbByBSnit12nscPGemsAvmVOiPPnqqEr4+4KIpux27jAqnFBbyfzRwkCRH7+WYt47P22htC5kzHQAZ16NqlvlBifZYujEiDhxVbTkOQsInVq00rBJmae8Rsc6U/2uN90Q9sF4fbi0i2PgbMGwoWPkBT1sqHzg6o0o9ZpP7U4Biqoc1PfmMOVLQXA0YdPypZnzkGrKqdp4kE +wZfRaEoJlqJTXzMmZ55mrtHyUgpMhG/zDMtHo5/L5sWS/LXdXHBvlkRmg473D2Bp2Uvg4yt8m15cmCKirUkL"}]},{"id":"osei_lindqvist","name":"Dr. Amara Osei-Lindqvist","title":"Political Scientist","subject":"The Draznik Precedent","email":"This is the piece I think about most when someone on the Panel calls withdrawal 'the clean option' — it wasn't clean for anyone who actually worked on those sites.\n\nFrom the paper:\n“A decade on, the Draznik Withdrawal is remembered by sports governance scholars primarily as a legal and reputational case study — what it meant for the Council's arbitration standing, what it cost the Council in settlements — and almost never as a labour outcome, because the labour outcome was quietly bad. Interviews conducted three years after the withdrawal with 28 workers who had been employed on Draznik's original stadium sites found that 21 went unpaid for between two and six months during the contract collapse that followed relocation, with no Council or host-government compensation mechanism activated on their behalf, since the withdrawal agreement addressed broadcaster and sponsor claims explicitly but was silent on worker claims entirely. Nineteen of the 28 subsequently worked under a renamed but functionally identical sponsorship-labour scheme on Draznik's next major infrastructure project, since the withdrawal did nothing to alter the domestic legal structure that had produced the original violations. The Council's own public accounting of the withdrawal, reviewed for this study, mentions worker welfare in one sentence and legal exposure in eleven pages. None of this is an argument that withdrawal is never justified — in a case with sufficiently severe, well-documented, and otherwise unaddressable harm, it may be the least-bad option available. It is an argument that withdrawal alone, without an explicit worker-transition mechanism built into the withdrawal terms themselves, has already been tried once and failed the people it was nominally protecting.”","citation":"Osei-Lindqvist, A. (2027). After the Cameras Left: A Case Study of the Draznik Withdrawal. Comparative Politics of Sport, 9(3), 201–229.","offers":[{"id":"a","title":"Another voice, same position","text":"WA6qeEQ/QS0snv5cFyKk8Ov+kgUyptIjXzAcj/poknw+co7YVUuUqIB9+9wfhAuFqznMi/VxFQY7DrPXgGzhZ934CYw3fp1tUSBRTnSH9c1XcmBwEQ2bMFBhVexZCIAjV8jVFloE6NaY9z2FgwiTMGpkUd2lc8/AoWTM7KsYdDi1zqozL0GuJ+0uKtHpvac4wZjPU4jxSm13GO0o746ssfv15fyoc66VdvXnw+vm80ifCaxJCRiA+OIfYHboGJ25iBaY6bPVIEtuBETPle3LFQPha3yt3nbXnEwnG5mumVvXMx6WzWDPSNzucKCrNovjwxvIRzic/klTMF9InKIOHeOPghQ8sT9fmOuDVAiTAiqM307WvQ4SZCJFU5mPkyzM0uo6pJ+EWwPVDfU48dGT8i4NWDbMyXhyPSbuVACRWGu58/1ALhOt2nLuKl9NJxEsEFBKFJpYJXFxIeM/7mfA2Dv5OHNMG4ycMXfxzlMWSk+AmYBFKk2M42cmEKGWvrBlhwG7ES74hNEIP1sQ43GAS64ZPviJeDVBDxOcd+mtkOW3TVxH6YFFbn0MJqdU1WZ29NqJRFklsxqXpET3LpApafX6SSxco6YArXnN6L/NpGKzBuC8HgTKXK+mLIBluvvMikLwT/qLoRdl+Ykul2GyY0MwpQaTUxKBK1kQRByEMO0K1cbcAR5cX71b//2W3AxTTGu7ufvKbASuh/FOGtt8LSAFfVrSYFzML2OTzcZpdmVZajYrORACLfeZnKBwu+xLcjWnIQozxaMIyHf/oa8T"},{"id":"b","title":"A competing angle","text":"v/aaN1EU39Ru4DAE8fR188IvkUtEScAPBB22+StPRLb9dvIt3WrufaXK1Mo+AJYYxD3YH4dXjgF7Vl0WsL+MfwXiTWcdM2mH+pq+rSkIx6UuaLdg6oq4qRqTkM3W+SZoSHkpFgu/9e2NGrxu+/Gt+ogm02jxYW+C5fU7lomifM2wUE7mXh1cg6LmOX1ingWiPj8AWCe11og8zGkQ0MvSo2JOItHDo2VsFmfl9g+f91W3w99+3f7n4n0hZPA3tQkDmRr+76EvHYcBKCXwq4E7tHwYDa3N0kjAFSJSJ6VBDZza/YGdpddUk+gAG8eY+NFgn9EHelXEkkiyHshKARUqwzGVqQ2rdyf1hgmYYPrVZKtNhDChLf04kzSQk1253Pi+OW5UYrQNKCrEWqTnCJ9dtRLP8+7gmVuuACu4NSDW8eZqW/K7obCYhNlG3f4mhlSqfuwu9sJQntkenXBr4CuV1vEuCIy689jvVHEuYuWeb6LQSVni0qQN2uLTx/q/zF0HJCvDKpGJAIcExseQl56YLuH4wJbIANPSvnFJPbahRWRf2SxqaDYmVBtaWMsOp3yd4TjD4TpZvN8AWPsOgNzRd89i+dL74sL2r8uFZ9igU5DFbfdQ/hsajfVkdobMyFkMRG2U9jdu5QKpEH2EHCJbjfAG/VdiM5rrkPhtsbKh07Pkbkra+NAPGM4jXZd6Lg6YTBOP8nir+hixb8nma6Pm8o2QtKYNUbg="},{"id":"c","title":"The underlying data","text":"3B1oS4rK9gxa8rGbF2U04tRDpyJBqNBYFc2MgtQIXGshSA5FDLgB+9sb0Sd16dNTNkkti3SuM/2lCnIV9rPG7KI/ad44kfT12P+fifs6/F1mWA9k2gIgfDHBxn3oTs31mYrUF1BI222UR7VrRRruCo/vzxvWGHhNc tle":"Should the Council uphold Almara's hosting rights on binding conditions, or strip them?","A":"Uphold hosting rights, attaching binding new conditions","B":"Strip hosting rights and relocate the tournament to a confirmed alternate host","short":{"A":"Uphold with binding conditions","B":"Strip and relocate"}},{"id":"F2","title":"How should any conditions on Almara be enforced?","A":"Council-appointed inspectors whose findings trigger financial penalties automatically, without a separate Council vote","B":"Host-government self-reporting, verified periodically by Council staff visits","short":{"A":"Council inspectors, automatic penalties","B":"Self-reporting, staff visits"}},{"id":"F3","title":"Should individual teams and players be able to opt out of competing in Almara?","A":"Grant discretionary opt-outs — teams and players may decline to travel without penalty","B":"Require full participation — all qualifying teams and their players compete in Almara under a single Council policy","short":{"A":"Discretionary opt-outs","B":"Full participation required"}}],"writing":{"type":"policy_brief","label":"hosting recommendation brief","addressee":"Aroha Fitzgerald, Chair of the Global Rugby Council's Hosting Integrity Panel","words":420,"instructions":["State a clear position on each decision — not just what you chose, but why","Cite specific sources in Harvard style (Author, Year) every time you use a claim, e.g. (Osei-Lindqvist, 2027) — including anything a teammate told you. The full reference is under each paper in the Inbox","Acknowledge the strongest objection to your recommendations and answer it directly (your 'However…' notes are a good start)","Write for a divided Panel: some members want a different outcome — bring them along, don't just announce a verdict"]},"two_player":{"roles":[{"id":"P1","label":"Player 1","dept":"","characters":["anand_kessler","mahlangu_voss","thorne_adeyemi","vasquez_okafor","reyes_lindstrom"]},{"id":"P2","label":"Player 2","dept":"","characters":["berrada_lindqvist","marchetti_osei","sorensen_ibarra","osei_lindqvist"]}]},"teacher_url":"https://teacher.lite.simlearn.online/","salt":"2f08cc41"}</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
let st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:""};
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");
const budgetVal = id => { const v = parseInt((st.budget || {})[id], 10); return isNaN(v) ? 0 : v; };
const budgetTotal = () => B ? B.items.reduce((s, it) => s + budgetVal(it.id) * it.unit_cost, 0) : 0;
const budgetOK = () => B && Math.abs(budgetTotal() - B.target) <= (B.tolerance || 0);

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderStart(){
  const two = st.mode === "2" && TWO;
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start">
    <h1>${esc(S.title)}</h1>
    <p class="lede">You work for ${esc(S.org)}. Your ${two ? "team of two" : "group"} has to ${B ? `split a ${money(B.target)} budget` : `make ${num(S.decisions.length)} decisions`} — and each of you holds information the other${two ? "" : "s"} ${two ? "doesn't" : "don't"} have.</p>
    <form id="startForm">
      <fieldset><legend>${two ? "Which player are you?" : "Your role"}</legend>

// Split text into sentences: returns [{s, gap}] where gap is the whitespace before the sentence (text = all joined).
function splitSentences(text){
  const out = [], n = text.length;
  let start = 0, i = 0, quoteEnd = -1, depth = 0;
  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };
  while (i < n) {
    const ch = text[i];
    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }
    else if (CLOSE_B.includes(ch) && depth > 0) depth--;

      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";

        const isAbbr = ch === "." && (ABBR.has(word) || initial || /^([a-z]\.)+[a-z]$/i.test(word));
        if (!isAbbr && (next === "\n" || /[A-Z0-9\u00C0-\u024F\u201C\u2018"(\[\u2014\u2013\u20AC\u00A3$-]/.test(next))) { push(j); let m = j; while (m < n && /[ \t]/.test(text[m])) m++; push(m); i = m; continue; }
      }
      i = j; continue;
    }

  push(n);
  return out;
}

function citeOf(citation){

  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;

  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;
    const content = enc.encode([...p, foot].join("\n").split("").map(c => c.charCodeAt(0) < 256 ? c : "?").join(""));
    objs[8 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${9 + i * 2} 0 R >>`;
    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });
  // assemble with byte offsets (all strings here are ASCII)
  const parts = [], offs = []; let len = 0;
  const add = b => { parts.push(b); len += b.length; };
  add(enc.encode("%PDF-1.7\n")); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));   // marks the file as binary
  for (let n = 1; n < objs.length; n++) {
    offs[n] = len;
    const o = objs[n];
    if (typeof o === "string") add(enc.encode(`${n} 0 obj\n${o}\nendobj\n`));
    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }
  const xref = len;
  let x = `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${st.choices[c.id] || "-"}`).join(", ");
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · Role ${r.id}${r.dept ? " (" + r.dept + ")" : ""} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
</html>
