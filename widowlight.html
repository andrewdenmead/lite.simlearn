<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Widowlight: The Key Art Decision — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

oned the first film and still holds creative-approval rights over its marketing. The film's lead, Odalys Marsh, has become a genuine name since the first film, and international licensing deals across more than forty territories are waiting on a finished campaign image before they can close. Everyone agrees the poster needs to look like it belongs to a bigger release than the first one did. Nobody agrees on what that should actually look like, or how far is too far. Nightjar's three-person design team has three weeks to lock the key art before it goes public at the film's festival premiere — the first image the world sees, with no realistic chance at a second one if it misreads the room.","scar":{"label":"The Cinder Row Collapse","text":"Two years ago, a different studio's horror sequel to the festival hit Cinder Row abandoned its original black-and-white, restrained key art for a full saturated blockbuster campaign — bright colours, the cast's biggest star glamour-lit above the title, released identically worldwide on the same day. Long-time fans called it \"a different movie wearing the same name\" online, opening-weekend word-of-mouth cratered, and the studio quietly pulled the campaign's paid media spend after ten days."},"proof":{"label":"The Nightgarden Precedent","text":"When The Nightgarden sequel kept its predecessor's minimal, yellow-toned key art largely intact — resisting pressure to \"scale up\" the visual language — it opened thirty per cent above the distributor's internal forecast and was later credited by trade press as proof that a distinctive festival identity could carry directly into a wider theatrical release without a costly rebrand."},"constraint":"The key art must be finalised within three weeks, before Widowlight: The Second Winter's festival premiere — the first published image will set the tone for the entire campaign, and there is no budget or time to replace it if it misfires."},"listening":{"name":"The Marquee Cut","questions":[{"q":"How fast can a poster change filmgoers' plans, per the survey?","options":{"A":"After one viewing","B":"After the trailer","C":"Within seconds"}},{"q":"What percentage of horror fans said posters change their plans?","options":{"A":"Almost 80 per cent","B":"68 per cent","C":"About 40 per cent"}},{"q":"Why did 1970s horror posters use almost no colour?","options":{"A":"Studio mandate","B":"Cheap, crime-scene style","C":"Actor preference"}},{"q":"How many horror sequels did Lobby Card Analytics study?","options":{"A":"Twelve","B":"Forty-one","C":"One hundred"}},{"q":"What happened to sequels that changed more than 50 per cent of their look?","options":{"A":"They broke records","B":"No measurable effect","C":"Underperformed more often"}},{"q":"What did audiences say about sequels with no visual change at all?","options":{"A":"Felt tired","B":"Felt fresh","C":"Felt confusing"}},{"q":"According to Lobby Card Analytics, what's the real \"sweet spot\"?","options":{"A":"Change everything","B":"Change nothing","C":"Change a little"}},{"q":"How much can a known actor's face raise licensing offers?","options":{"A":"Around 50 per cent","B":"Around 15 per cent","C":"No real effect"}},{"q":"About how many weeks before premiere should the poster drop, per Frontline Box Office Research?","options":{"A":"Two to four","B":"One to two","C":"Eight to ten"}},{"q":"How has regional-variant use changed in five years, per Frontline Box Office Research?","options":{"A":"Stayed the same","B":"Roughly doubled","C":"Disappeared completely"}}]},"roles":[{"id":"A","label":"Role A","dept":"Key Art & Concept Design","characters":[{"id":"mara_voss","name":"Mara Voss","title":"Creative Director, Nightjar Creative","subject":"First round — client wants it bigger","email":"Hi team — quick briefing on where things stand with Widowlight: The Second Winter. I had a call with Kestrel Bay's head of marketing yesterday, and she was direct about it: they want to see at least one full comp round that \"reads bigger\" than the original — bolder colour, more dynamic composition, something that visibly signals the jump in budget. Off the record, I think there's more going on than just this one poster. Kestrel Bay is one of the biggest accounts Nightjar has ever landed, and if this campaign lands well, it opens the door to more studio-scale work for us going forward. That's a real opportunity, and I don't want us to dismiss it just because it makes us uncomfortable creatively. At the same time, I haven't decided how far I think we should actually take it — I want to know more before I commit us to a direction.\n\nWhat I don't know is whether the actor's team is locked into a specific treatment, because that decides how much room we have for everything else. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Her face, inside our look","text":"AihOplDI2PXE0A8b8V+zqYARGfAHs34utOCIh7Rz48cSojOGdToRdWK7OeqndbUqEb4cW6jBGLwMxR3lVKmYe8bH8ZL/jVbad40w0KfhNWLRyuwX+/bx34MGTcwXh0olaKBXWLsUMMzQYXYkEXZt/inOIkQHxWTn805NLSG5CBLbPGMbAghW8SNjd9v0+OnMIKyCl1pQa/uO21ly1MOc3VUbLdMlEYCCMYbPxv+/R6ZouO6bsREN1KD9K/9WCw887WjMEJ4rBPIOFouqB5J37orKHrL/dihH4REWMqUZzaChEEux/wWA5TYroqTbGs15wUAzhkE2ac3Cbv2C4mxlcgE+bgH7ZjU6oNFtz4qmglAqrbNX2kP9nPuYzFPWhdUb"},{"id":"o2","title":"Why the account matters","text":"7N/EQk0cwpUaxuTQ3/9xgZ6tgCa+AHvP+P4JquLgGt70qBa2O7Nyui1/Bye5HRtmaToWz7XcErFaWc2JNaXxXi/rCcGS2gx/YqR5EdgctUHpmIR7SUeh8ExA7olxmWupYXtN0lalQG2VXQBpSZq7Cp1BajmJvGdz6Ez/PWNfNYPf+glKp7kX1OAa0jfvarLH3/gz9dmeNtv4QTumaMmVTLF3xAdoEvCyQl+mlnPSbvjLjvZo3RmBZfmmAYK6zeKXMOp+2hrEIDoi/6l4D/MSUANYVWm/22ENGwih5lJQIjuIYnNqpJVjFmGpAo9Srw2SAHdSI19MRxTbcETNDUGPHqzmtgr75OP53ciriS4akb3brTT0JnzrkwoPGBU="},{"id":"o3","title":"Two rounds in three weeks","text":"tsQgIw0kT8KGO/r6RjxzdGrwrUv92fJBHewGN9xKL8v5+jSxnGi43ZVZSuzezjXteDDRm5VlxvEsqJiUUgixPST9Mw3i43AgKHVB9U1PvzMzLoi2vdZL0dea9TGP9ELp8/zNl7OnBPJlU1EE4RYqXIxxJ2n5INiaDIYXHEIHfm5B9pnQb/9dJpalU3wl/aCN22ne3SLQMXLWqTIRfp/TtFoVk/JEp2iwWQ/CAo  be the reason this film loses a real opening weekend to something louder. I don't think there's a clean internal consensus you're going to get from us right now — we're still arguing about it ourselves.\n\nWhat I don't know is whether audiences outside our own bubble care about the look as much as we do. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Two signatures on every image","text":"GrYsaJEesenyJeSRva5GjUn8Aqg8DClDfauh2Qd8szdlpD0aoTJk87dLyLn8sbpAM6BOFesBjXiZZSiLyGt0rszo0pGpnklUBPCIf44+I2q3i73a5N7l9IoJKMwf8Xr/jSVdGEowMbDFXffsqpD7cuROmqd3uzeFXn8PboNHcayqXT95QQ+b2x608Emgp44tDyhSe7CnmjQbZq/lMvjvHhDJ6tZlXjYviuoIG+pnTCGx9/eYmRq4WTSN0pL7SV5ljU6jrQPkrWWQhaYewkqkuGK8ePlZPH/LbQBSPbsdDK6+1cr+mDZXhY9ecXhbWlNPk42/sytr4LEACdu1dQx5UVpnr6yka+iqbB6WNpAI"},{"id":"o2","title":"The case for going louder","text":"t35MP+AWDcHSRIdUDTvOEKiflTo+xX4CqFIqnCJJYUu5hT1+gwWA8RrpTVOUwprR1y5ne6Vt7GumLXDcS4lYM0s3ioFMSWVwDt8hFpto89B+BpqGr7hm1+vggMXuE1BL4ZO/PiqX0H4qK5ys+hqwMn4hxcG5P0aCDwe9qQbRzblwv6FpQJsjGtNhM2IQNdtu1p5I6nGstktoVtQx02YOsQLE8amiwzScRglsLX90U9xYxZHsjXRaynG3+92+SDZL1kHy/tpPaPoRJyANLIELgWP8cVq/E648AUSha8aiwJ4qXEB33M36gO2qCok8t0ha2DsLSRFWxBYyh4xv90XOxDf3axoznqrgrTnxCGFl6A2CAUvajKeNE4di+xz5yWHdkxgNW+LJ1uUaOMU+/4VugIV/LGpVlY9JT4fTIH/MTmtHWt/jBhgpmTM="},{"id":"o3","title":"What the regional numbers settle","text":"NnFsUP+BnyYCM57aki8fcBqsAo8/9tJzJ0QSjxHtMlcVHMFwxkYO/gZ0DbUWMDJr54aMAdoPTDF/orONS77WRtNQkLazaxy6hLr1LisRtA0LCRW8dk3ywGk6aIWeyjT6P0m/ef8HDmnE20nqlwESvE4wX+sKe6ZhtdGRskZ4cdTIwNFe/0QMip7/iqB5p1hPbfB34skoYtP+Bxlk+0ayQZTL9+Nb6fEUYrXiYI2Z2RD5iyVsMdlDtTb7OOAiGOqyITy1VY8/Od//ehh5t7xKdBuM0+DVLmyhf8/yaaOjU4I8BEq0ZY+wlIyy2Nm2b14QVPyiroc6LuERsTHJhK+kthL/CbKgVzkL9rJaIbtk2OlJm8Nhrl/ziAilNuAVuDsdQcLBAsL2SN99dQ=="}]},{"id":"felix_bauer","name":"Felix Bauer","title":"Contracts & Clearances Counsel, Kestrel Bay Studios","subject":"Re: billing — what the contract actually says","email":"I saw the 50%-above-title figure being discussed and wanted to clarify before it gets treated as fixed. The actual contract language guarantees Odalys Marsh \"prominent and clearly legible\" billing — that's the real floor. It does not specify an exact size or require placement above the title; that's a standard opening negotiating position from talent management, not a contractual obligation. In practice, this gives the design team more genuine room than the conversation so far might suggest, though I'd want to understand the business context better before saying exactly how much room I'd advise using.\n\nI try not to give legal guidance in a vacuum: what I'd need to know is how audiences are actually reacting to the concepts, and I haven't seen that data. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"How to use the legal room","text":"JV5epQA1MisnhjwJ2lYBcr++zASamAeYJVJUieMrtgiOescPsH7HOTRcO7QZg4HjXFvFZfbDzxo1P5zjEouNLtr7u2jbq0iixASyYU6QSwV5+r0n2PZfjNPgILKknVhg+gc7LQiEJZTdSxsP93bSeB9eCpeBFAw4qdRamb6+lNhi0q/GkWTBkRD6KCU1l3CYwITdAb3m7v2FtxqmPKRVZc96+uVRlX8YSoby/av1VJoiBn7XX4jHcXIQtGUn0Sqpsrv3iYO4dTmjGgXsqb89C7+b5AcsTD9IdCSOuwOyYKPOtbsS2YX8CucGFz4GRq3eBQiaEFwhd+9EYp7OTK7U3pbKp1OtQ6Vdd7kg3yZksvi6xjhYmeVQTpUFP/ZKr8brQJZcysk8NF9ybAR0D0oQCxRMtVr+m07iypH26SW2ypOnJq5/Z5HXjw=="},{"id":"o2","title":"What 'prominent' means in practice","text":"YXVT5z7vi4dv6G7i1jnwoyNL8xK7oHlGx7RzSJSez6uVwqzvCFqIuw3+LkdmNYeva/bIF/VJEhRAhKdmrNGylmGH/Jg0O519I+PUdQi+L14ILBmigetIUgL5HlhBhroh8s1iBdXDLfFg47mn8/B9cL2SxHHDTzvZem/r30AzS2b2K/kn+Nfywzva2aOwCED3bVW5wYJ+UHNEuw9Aq7VcC+dyGmqe4p65z9nif3bXVjibJGhZ1mSYlc/LG/z8kk+eXrXUyI4pb2fZeAiQT5s5Oz2A5QvnVCBPcjQkUfe8XUaJrZNLrl/LSzO3E0VklQ+/ivLzn8/JxStyAw4NVAWNUbkBlX9k/nZBEwaLfFwWmZ2EGpLH1YWS2l2cwQ85Ww=="},{"id":"o3","title":"Letters, not courtrooms","text":"h5KGMJ58N7dJ+o5w1V5STvMEpV/u3pwqSQDbyCLF2P+OcO4JovudVD8gTD2Sf/IZ4dM3OUqcEJKUbAC2kS/H8Ko3l9d4fQ6Lz8Ydgz8phg/+a5kDpLQXvKhtETK04gdwd6/G7W6PB4n9VgIYFrV7Ubt1dwn7Hj92FBab6MPy3vbNFzFpgKzDfJqgPbtsRJ0YunSrk8ZIw55OdmKfqT S3B2dW+SXiZsquQURz5U8dQocSi/uw3wslaOjd8hp7NE4EfsJ7SbZDoa5IxxhzFkLz1DaLJJuae/YkAUvcFlexB4BomdPCUPFRM3KK6l5CDKxJ4BvzTTsoesBqDWwxMOGTK+fp9kOJFvVwriMbF3TZIYyK19wbGXO+dHU7IiQTu6aoBbGtCKx3TLIj+JKlvyq7CP19cwuVVqXSVyNlOSfG/5f2uhK16YYRzt9nhIKnKuN0ViSSm6OpjbtiycTXM="},{"id":"o3","title":"A staged rollout","text":"0t0a12pn0qt+BW6RwA1u1U6uvMB2uIHD9C/5+4nuQCKkhjpAdT8p6tgM4R8OZ6IiS3BsvAjlyYcITUg2znIS3S44/Ma9Bn49/jQ5Rme6W1iSwFySqSWHRpUnw8vKhfOLyUmytt+rBqvteE8QB8+CoQdE1p8UJvNZTTP7qAyuyf7IsHPy3qzV5WJXo7QmWlbh44uUN1PhwihVLrEUBQm6sk04t+baL37u9GpH3+ETh33MBQZ3/VAGsTOmNSwG7IeXXJZZbqnEXcyglpspv/B4CoAwbm1HdIHWtL1eznTIIK6CyxC9j4qgkFPh6jBPUX0/fue5akXv0+53U42MjPMkIj91KYJyRpZE85NLaZ2hVZE54AeUXn00WkGR5aUBIMlXwi6PAtbXWzPlgwvvwGE05b9UfGzxg5pXatvsD5F2zVTFiI3dXzxv"}]},{"id":"erik_lindqvist","name":"Erik Lindqvist","title":"Regional Distribution Director, Kestrel Bay Studios (Nordic & European Territories)","subject":"What's actually working in my market","email":"I want to make sure my market's perspective doesn't get lost in the global planning conversation. In my territories, the original Widowlight significantly beat our internal forecasts — and when we surveyed audiences afterwards about why they went, the poster's distinctive, non-Hollywood look came up unprompted, repeatedly. My team has heard directly, more than once, that \"looking like every other studio horror poster\" is one of the biggest turn-offs for the audience that made the original a hit here. I'm not saying a universal one-sheet can't work, but I'd want whoever's deciding this to know that restraint has real, measurable value in this market specifically, not just sentimental value.\n\nWhat I don't know is how far the festival's first image travels beyond the festival itself. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Not every market on day one","text":"KivMg6PhwK4uMs2oWvRUybDu+1rwbPt1xDMo3InNQOqbkGxPScLRmOQohO0p6zfynZ1MGEHXTsi0f/kOTjbIefgUXkWJyAxmDYo9mizrD1lpMWI+izdHhdZvyebinN7r86Tjfjt88I+0SRoEgGF+Jxxya1WYowgoQaQxnXPA4u0PWj+JNxs+e0ninqoInhRZPQ4k4FdxKT3dnx0MuaektUEzSZX5MBUKtb1qB6DqCtbetuCxLfGyUuaLbHiR/YquJkYqPTBltft9oXVscx73yLKDDpQo09GD3muoU7xHb/KUJkstlnRBg1h278UHoanaViBMKUk3z0CJDk+CN8EgqoJxW2y2CN/OHFfYd2bhDIjbbAb4hf/8ftF5sCw7bHzgTH+ieca8IdMto8ix7pyD4H7nGr922w=="},{"id":"o2","title":"What my audiences said","text":"iLPLY5mCekzE4lCCIIyH3uNbhF72swXutLW/Vfq51rjWN7EI4Qis9Jfh4vLidBk7MbJHxAJlQMhTfCIp4cUVMoPzQTAdkYwzik59+zEWt7IQs2xwBVtcitaboLQzBCsS2CQV4oe4qHzB/JuHrVdgty4EmrBsp2+jLsMpHF8ruBiKrvZ72qs1ddCfGWxwxk6maum1/zmRIvwAKsuDy/rBVKfGDIsADeublvCKPy6Rcon7cYZIubvFxvRlyqWZGhP41t4eaYbNHN8IYyjx/o4QHGsaO99pDPrpcfTpzmFK4nR/TH3LDpaIO5gTTWhMpX4EuYwl4eiS0ErVxFSUcWf2mNyE2XwAb1qg0eCAD1roixWgIP5y9A=="},{"id":"o3","title":"Ten days per variant","text":"rqHz7tGx5x2X1Lkr+0emNdsKBPewepOANI7rryUIsP16bsFNLQf6mO+tgtqvA/ABcsbqb4LZmf/r72+PwQKhb751QrPFlBrzbYM8wQ6YFFE3PzKHqtD6nRlKoEkaIdkgpMYaGwDBLPadWCqr0087Jh8cdLDfX8kE7Q3EQGlkeTXynvEr9/NAV9UnXn4f9hXktbbhH8dnMsWb7PvROVUM5OmXJeRIG7ZRUA2+DxTuSe+V6IHOf0tUWZAe33jhemRnWVDUUYvOIJDuk/SmegRuSifTvt9v2Rirl/ph2BPavbqpxYskZDW9hgm4BIhbpxeOqzefVLEaekNVR9xL6TYPvw8kL4kK0WT2aIHiyY2xa1kUIQP0KGLn61sOH37y82xeZhAqkauHSQ=="}]},{"id":"yusuf_demir","name":"Yusuf Demir","title":"Head of Audience Insights, Kestrel Bay Studios","subject":"Early concept-testing read — mixed results","email":"Wanted to get you the concept-board testing results before you go much further, since I know timing is tight. The honest summary is: it's mixed, and not in a way that points cleanly one direction. Audiences who had seen and loved the original strongly preferred the minimal, moody concept boards — sometimes quite emotionally, a few even said the bolder ones felt \"like a different movie.\" But audiences with no prior exposure to Widowlight at all responded noticeably better to the bolder, more legible commercial concepts — they found the minimal boards a little confusing or hard to place as horror at first glance. Internally, the studio hasn't yet decided how much weight to put on protecting existing fans versus reaching a bigger new audience, and honestly, I don't think that's a data question — that's a judgement call for whoever's making this decision.\n\nWhat I don't know is how much room the contract leaves on billing, which decides how hard the poster can lean on Odalys for new audiences. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"How we test concept boards","text":"e4M+d700gZdH/IN1UF3aVp/vEnbSWcJq6AEe7mNvjzCGBE7UfQxV0Vx/7F2IfXkCPqCAgrOzjKe6sZDQJWNpLBLmRO9QkQ3pd7WrG0FfezTgpquLZRihRbLu2LFwVrOPIeAeCVMeSomSAlCpQnQHkVf6kYnQOZN8y5xcm/Y5QiDt6Xyc1T+tDDqOyARwS/Uyve1La0pe8WXUyn7CwNeE04BCnr2SfEkT6lCz4rf22OYvDLKZZV2fLGuIV5mq/IEy39XrP5GNF6rxcbgep8lsvpQJ/4+jHLs4BuzxSrT2sYWQ5DpY2XiuxzogTGYiWQBJ7oBgjvE8tvt4m1f3hW9g3sBqbjubqslNR9FR"},{"id":"o2","title":"The split, resolved","text":"1WB/Iu6RUj62vwGbYaGNx8uSNPUzo6XaAs+LMk+cblOq0GPH4hvjCV6rB0evxlaXfvSX9ujwjWux9ZsO1e20tpmtn8pgVEi1elrEvfD+FL+2M2p/Y9Ne5UcBgHPOA2akngaxK26R6jPaYgjcn66rBSKjtd7qgvb+EJic8oh0n9Mo266Qj4ZD68xoRg8Z0SpFiEyqvKfPwO06RG6f4oKedGp/Jxin9XyjLWZ8Xpd+L1Dfv/SZPe23DdFCqyEZtA38dAXhPWeCQ2xPWOk7FWKYf8jDooQ3aiL+aDZm20OQBu0QVKeREAsdCLtOfIxuN3qoKL2/xmie7DSuKGxhXmY458H5n1POTanYweTnR/lscI6jQNWV3Z/heg=="},{"id":"o3","title":"What newcomers said","text":"/ggqJEFuEecXrFByNrjvGgwqsFRIRzuuZfxg5iZcUZx1ANPtKaH4LmxIrjTHGoYoyWjTG3NI74mWGv7h/ka8+8MMTWDTQhhOZtbQwupLuVGqsPUyIuH5byWwSrgmf3H4JbD0F00RAczYiNYlXp1T1E/PF8VjXTfiq/hwIMVmgtxLsfFVfGIfxfoX+qCk+vLIugWT85xjPZ99IHyrTEEDMo4q1yPur7UocwgC+GyzpFggIHDjIoPPj9w6UBuyt/Um6voFW4Ozdc724JmFjfkjiZpqB+2d/sntzneXMOSzO15HjHzlFUzVQ2b0dt68vSkHNmZtFlcLN2SWmCkdgcMzt27wtEGC7AUy7BTnkEHPuKYRSQybX+H8yqZ6wX0EJUYhaGO5BEVGjLz7Mf9sajzvDQVMmIU="}]}]}],"decisions":[{"id":"D1","title":"Decision 1 — Colour & Composition","A":"A stripped-back, desaturated treatment built around negative space and muted tone — continuing the original film's distinctive, restrained visual identity, even if it doesn't visibly signal the bigger budget.","B":"A bold, saturated blue-and-orange treatment with dynamic, high-contrast lighting — signalling a bigger, more commercial horror-thriller in line with the sequel's expanded budget, even if it loses the original's distinctive look.","short":{"A":"Restrained, muted look","B":"Bold blue and orange"}},{"id":"D2","title":"Decision 2 — Billing & Star Prominence","A":"Feature Odalys Marsh prominently, in a clear, recognisable photographic treatment — using the actor's rise in profile since the first film, even though it moves away from the original's faceless look.","B":"Keep the actor obscured or de-emphasised, with the title and concept imagery carrying the poster — continuing the original's \"faceless dread\" approach, even though she now tests as a ticket-driver.","short":{"A":"Feature Odalys Marsh","B":"Keep her obscured"}},{"id":"D3","title":"Decision 3 — Rollout & Regional Variants","A":"One universal global one-sheet, released simultaneously worldwide to simplify licensing and territory sign-off, with no room to adjust it market by market.","B":"Differentiated regional variants — letting some markets run a version tailored to local audience taste, staged rather than released all at once, even if it slows territory approvals.","short":{"A":"One global one-sheet","B":"Staged regional variants"}}],"newsflash":"dRMom6o1s0YKIyTwC9exxZwvHOS7sTV2FTme6zf95nAm077yGe530h3/qr9KRWeASB6rxyK67KtKB8at7KD467YSBANfIJdsAJb5hVL1jKnp6QWdPFcqly6nwMpdrTI9tW/nopRSJ+j/egMaG5xVavn8+io6pNwDYomIeDqKFY1EvBLBY5D45mysxCaKcwlGyk1QzcmMCrHEOTms8LCs7fg4MUNtS3VmEMwjmGJoUv+5lK0f3TkF1AAURiXqNbbyH0X14nXL7GL1G0kzyzJwRWK9I+1jOGiNiV+YnVB+eJDVm9mx4dhY34FWZBhqay1QR4UV+FqIwR/zYDfS0zxH/HS0CpHgAKldrtyPqhV1bZPG4GMRSH01128ruOltNA5ddBPYC4Dx8d2boZ2NbgZiqxjH9X7e7bG1stekzTapsOiryXVZc1+F216D9+nkRAriwinPFG+NXxSLdjK4O6AwxgShgusubnOrUERh4Jt7i6TntXfQRRLszoFJjhZkKCKdbhiiOFbMu4CzVhwu4XIKq9raZiIE67OoUIAJ0af8sadeytejI2rLxF0ji2jo5ZCvKz3uX5PHoOXbWveWAc1Z7Q8b1ni0ZeDlFv3tOcfTKkp9PholoqYyNMIGSFe2oVeORQa5m+NaoZh eport the information that decides the question.","look_for":["You pick the facts, figures and deadlines that matter most for the decision, not just the first ones you read","You combine what different people told you (your contacts, your teammates and any podcast or news) and show how it fits together","You report it accurately, in your own words, and say who it comes from (\"As the finance director points out, …\")","You explain what the information means for the decision, not just what it says"]},{"name":"Building the argument","aim":"Make a convincing case: reasons, evidence and consequences, with the other side answered.","look_for":["Each main point has a reason, the evidence behind it and what follows from it (point, evidence, so what)","You show your priorities: what matters most, and why","You face the strongest objection or trade-off honestly and answer it, rather than just mentioning it","You say what risk remains and how to manage it"]},{"name":"Organisation and flow","aim":"Guide your reader through the text.","look_for":["A logical order for this kind of text (for example: purpose, recommendation, reasons, risks, next steps)","One main idea per paragraph, introduced by a clear opening sentence","Linking words and signposts that show how ideas connect (however, as a result, above all, this means that)","Headings or lists only where they help the reader"]},{"name":"Language","aim":"Say exactly what you mean, accurately and professionally.","look_for":["Vocabulary and structures that let you say exactly what you mean, including the language of the topic","Accurate grammar, word choice and spelling, so mistakes don't distract your reader","Claims that are as strong as the evidence allows (will, is likely to, may)","A consistent professional style: no slang or chatty asides"]}],"salt":"fd63e214","lc":"2A7UdD3XI5VrbWYaPpMhdObFGPrVk1op2YhzKdIFKqH2vQlV1r0gsbkZcHRoQPH/Gu8="}</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
let st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}};
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");
const budgetVal = id => { const v = parseInt((st.budget || {})[id], 10); return isNaN(v) ? 0 : v; };
const budgetTotal = () => B ? B.items.reduce((s, it) => s + budgetVal(it.id) * it.unit_cost, 0) : 0;

// Split text into sentences: returns [{s, gap}] where gap is the whitespace before the sentence (text = all joined).
function splitSentences(text){
  const out = [], n = text.length;
  let start = 0, i = 0, quoteEnd = -1, depth = 0;
  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };

    const ch = text[i];
    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }
    else if (CLOSE_B.includes(ch) && depth > 0) depth--;
    if (i > quoteEnd && (ch === "\u201C" || (ch === '"' && (i === 0 || /[\s(\[]/.test(text[i-1]))))) {
      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";
        const initial = /^[a-z]$/i.test(word) && !/['\u2019\w]/.test(pre);   // "Oduya, B." but not "don't."
        const isAbbr = ch === "." && (ABBR.has(word) || initial || /^([a-z]\.)+[a-z]$/i.test(word));
        if (!isAbbr && (next === "\n" || /[A-Z0-9\u00C0-\u024F\u201C\u2018"(\[\u2014\u2013\u20AC\u00A3$-]/.test(next))) { push(j); let m = j; while (m < n && /[ \t]/.test(text[m])) m++; push(m); i = m; continue; }
      }
      i = j; continue;
    }
    i++;
  }
  push(n);
  return out;
}
const isSentence = s => words(s) >= 3 && (/[.!?\u201D"')\]]\s*$/.test(s.trim()) || words(s) >= 5);

function hlSources(){

  c.text.split("\n\n").forEach((p, i) => parts.push({cid:"ctx", part:"p" + i, text:p, src:{name:"Context"}}));
  if (c.scar) parts.push({cid:"ctx", part:"scar", text:c.scar.text, src:{name:c.scar.label}});
  if (c.proof) parts.push({cid:"ctx", part:"proof", text:c.proof.text, src:{name:c.proof.label}});

    parts.push({cid:ch.id, part:"email", text:ch.email, src});
    if (AE2) {   // every drawer can be opened, so every drawer can hold highlights
      ch.offers.forEach(o => parts.push({cid:ch.id, part:"d" + o.id, text:unscramble(o.text, `${S.salt}|${ch.id}|${o.id}`),

// Harvard in-text citation from a reference: one author (Smith, 2024), two (Smith and Jones, 2024),
// three or more (Smith et al., 2024), or a body with no comma (World Bank, 2023).
function citeOf(citation){
  const y = (citation || "").match(/\((\d{4}[a-z]?)\)/);
  if (!y) return "";
  const who = citation.slice(0, y.index).trim().replace(/,$/, "");
  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;
}

  return `<details class="cc"><summary>${HL.map(([,,c]) => `<i style="background:${c}"></i>`).join("")}<span>My colour code${set ? "" : " — tap any sentence to highlight it"}</span></summary>
    <div class="grid">${HL.map(([k, name, c], i) => `<label><i style="background:${c}"></i><span class="sr" style="position:absolute;left:-9999px">${name}</span><input type="text" data-cc="${k}" maxlength="24" value="${esc(hlLabel(k))}" placeholder="${esc(HL_HINT[i])}" aria-label="${name} means"></label>`).join("")}</div></details>`;
}
// One set of listeners for all highlight interactions (click handlers only; no forms).
document.addEventListener("click", e => {
  const p = document.getElementById("hlpal");
  const hs = e.target.closest(".hs");
  if (hs) { e.preventDefault(); openPalette(hs); return; }
  if (p && !p.hidden && !e.composedPath().includes(p)) closePalette(false);   // (the palette may have redrawn under the click)
  const g = e.target.closest("[data-grp]");
  if (g) { const box0 = g.closest("[data-nb]"), grp = g.dataset.grp; st.hlGroup = grp; save(); refreshNotebook();
           const again = box0 && box0.querySelector(`[data-grp="${grp}"]`); if (again) again.focus(); return; }
  const j = e.target.closest("[data-jump]"); if (j) { jumpTo(j.dataset.jump); return; }
  const c = e.target.closest("[data-cite]"); if (c) { insertCite(c.dataset.cite); return; }
  const box = e.target.closest("[data-nb]");
  if (e.target.closest("[data-clear]")) { box.querySelector("[data-clearask]").hidden = false; e.target.hidden = true; box.querySelector("[data-clearno]").focus(); return; }
  const head = () => { const h = document.getElementById("nbhead"); if (h) h.focus(); };
  if (e.target.closest("[data-clearno]")) { refreshNotebook(); head(); return; }
  if (e.target.closest("[data-clearyes]")) {
    st.hl = {}; save();
    document.querySelectorAll(".hs.on").forEach(sp => { sp.classList.remove("on"); sp.style.background = ""; sp.removeAttribute("aria-describedby"); });
    refreshNotebook(); head();
    const live = document.getElementById("nblive"); if (live) { live.textContent = ""; setTimeout(() => { live.textContent = "All highlights cleared."; }, 50); }
    return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const p = document.getElementById("hlpal"); if (p && !p.hidden) { closePalette(true); return; } }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.classList && (t.classList.contains("hs") || t.dataset.jump)) {
    e.preventDefault();                         // Space would scroll the page
    if (e.key === "Enter") { if (t.classList.contains("hs")) openPalette(t); else jumpTo(t.dataset.jump); }
  }
});
document.addEventListener("keyup", e => {      // Space acts on release, so the palette doesn't catch the same key
  const t = e.target;
  if (e.key === " " && t.classList && (t.classList.contains("hs") || t.dataset.jump)) { if (t.classList.contains("hs")) openPalette(t); else jumpTo(t.dataset.jump); }
});
document.addEventListener("change", e => {   // ae2 note filters
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const box = e.target.closest("[data-nb]");
  st.nbf = st.nbf || {}; st.nbf[f] = e.target.value; save(); refreshNotebook();
  const again = box && box.querySelector(`select[data-f="${f}"]`); if (again) again.focus();
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.cc;
  if (k) { st.hlLabels = st.hlLabels || {}; st.hlLabels[k] = e.target.value; save(); refreshNotebook(); hlDescs(); }
});

/* ---------- main shell ---------- */
const ALL_TABS = [["context","Context"],["firstlook","First look"],["listening","Listening"],["inbox", AE2 ? "Sources" : "Inbox"],["decisions", B ? "Budget" : "Decisions"],["submit","Write & submit"]];
const TABS = ALL_TABS.filter(([k]) => k !== "listening" || (S.listening && S.listening.questions && S.listening.questions.length));
function render(){
  closePalette(false);
  $("#app").classList.toggle("wide", !!st.role && (st.tab === "submit" || st.tab === "decisions"));
  if (!st.role) return renderStart();
  if (!TABS.some(([k]) => k === st.tab)) st.tab = "context";
  hlDescs();
  const r = role();
  const pending = AE2 ? 0 : r.characters.filter(c => !st.choices[c.id]).length;
  $("#app").innerHTML = `
  <header class="bar">${topBar(r.dept ? r.label + " · " + r.dept : r.label)}
    <div class="wrap"><nav class="tabs" role="tablist">${TABS.map(([k,l]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${l}${k==="inbox"&&pending?`<span class="dot" title="${pending} choice(s) still open"></span>`:""}</button>`).join("")}</nav></div></header>
  <main class="wrap" id="main"></main>
  <footer class="wrap">${esc(S.disclaimer)}<br>Nothing you type here leaves this browser tab unless you copy it yourself.
    <button type="button" class="linkish" id="reset">Start again (choose a new role)</button>
    <span id="resetAsk" hidden> This clears everything you've done, including your text. <button type="button" class="linkish" id="resetYes">Yes, clear it</button> · <button type="button" class="linkish" id="resetNo">Keep my work</button></span></footer>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); });
  $("#reset").onclick = () => { $("#resetAsk").hidden = false; $("#reset").hidden = true; };
  $("#resetNo").onclick = () => { $("#resetAsk").hidden = true; $("#reset").hidden = false; };
  $("#resetYes").onclick = () => {
    try { sessionStorage.removeItem(STORE); } catch(e) {}
    st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}};
    pendingPick = {}; render(); window.scrollTo(0,0);
  };
  ({context:tabContext, firstlook:tabFirstLook, listening:tabListening, inbox:tabInbox, decisions:tabDecisions, submit:tabSubmit})[st.tab]();
}

function listeningAnswers(){
  try { return S.lc ? JSON.parse(unscramble(S.lc, `${S.salt}|listening`)) : null; } catch(e) { return null; }
}
function tabListening(){
  const L = S.listening, key = listeningAnswers(), done = !!(st.mcqDone && key);
  const n = L.questions.length, right = done ? L.questions.filter((q,i) => st.mcq[i] === key[i]).length : 0;
  $("#main").innerHTML = `
    <p>Your teacher will play <b>${esc(L.name)}</b>. Answer while you listen${key ? ", then press <b>Check my answers</b>" : " — your teacher will go through the answers afterwards"}.</p>
    ${L.questions.map((q,i) => `<div class="mcq"><b>${i+1}. ${esc(q.q)}</b>
      ${Object.entries(q.options).map(([k,v]) => {
        const cls = !done ? "" : (k === key[i] ? "right" : (st.mcq[i] === k ? "wrong" : ""));
        return `<label class="${cls}"><input type="radio" name="mcq_${i}" value="${k}" ${st.mcq[i]===k?"checked":""} ${done?"disabled":""}><span>${k}: ${esc(v)}</span></label>`;
      }).join("")}
      ${done ? (st.mcq[i] === key[i] ? `<p class="res ok">✓ Correct</p>` : `<p class="res no">✗ ${st.mcq[i] ? "Not quite" : "No answer"} — the answer is ${key[i]}</p>`) : ""}</div>`).join("")}
    ${!key ? "" : done
      ? `<div class="score">You got ${right} of ${n} right.</div>`
      : `<p style="margin-top:18px"><button type="button" class="btn" id="checkL">Check my answers</button>
           <span class="muted small">You can't change your answers afterwards.</span></p><p id="checkMsg" class="small" aria-live="polite"></p>`}`;
  if (done) return;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("mcq_")) { st.mcq[e.target.name.split("_")[1]] = e.target.value; save(); } };
  const b = $("#checkL");
  if (b) b.onclick = () => {
    const missing = L.questions.map((q,i) => st.mcq[i] ? null : i+1).filter(Boolean);
    if (missing.length && !b.dataset.sure) {
      $("#checkMsg").textContent = `You haven't answered question${missing.length>1?"s":""} ${missing.join(", ")}. Press the button again to check anyway.`;
      b.dataset.sure = "1"; return;
    }
    st.mcqDone = true; save(); tabListening();
  };
}

let pendingPick = {};   // cid -> offer id, chosen but not yet confirmed

  if (AE2) {
    $("#main").innerHTML = `
      ${colourCodeHTML()}${decStripHTML()}
      <p>Read your ${num(r.characters.length)} sources. Each one has <b>three drawers</b>: the data behind it, a counter text and another text like it. Open and close them whenever you like. As you read, <b>tap sentences</b> to highlight them and tag the part of the argument and the decision they matter for. Then tell ${pair() ? "your partner" : "your group"} what you found: they can't see your sources.</p>

function sourceHTML(c){   // ae2: a primary text with three drawers the student opens and closes freely
  const isOpen = o => !!(st.drawOpen || {})[c.id + "|" + o.id];
  return `<details class="mail" id="m_${c.id}" open>
    <summary><span><span class="from">${esc(c.name)}</span>, <span class="muted">${esc(c.title)}</span><br><span class="subj">${esc(c.subject)}</span></span></summary>
    <div class="body"><div class="prose">${hlHTML(c.email, c.id, "email")}</div>${c.citation ? `<p class="cite"><b>Reference:</b> ${esc(c.citation)}</p>` : ""}
      <div class="drawers">${c.offers.map(o => `<details class="drawer" data-c="${c.id}" data-o="${o.id}" ${isOpen(o) ? "open" : ""}><summary>${esc(o.title)}</summary>
        <div class="dbody"><div class="prose">${hlHTML(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`), c.id, "d" + o.id)}</div>
        <p class="cite"><b>Reference:</b> ${esc(o.citation)}</p></div></details>`).join("")}</div></div></details>`;
}
function callName(n){   // "Dr. Elena Whitfield" -> "Dr. Whitfield"; "Freja Lund" -> "Freja"
  const m = n.match(/^(Dr\.?|Prof\.?|Professor)\s+.*\s(\S+)$/);
  return m ? `${m[1]} ${m[2]}` : n.split(" ")[0];
}
function mailHTML(c){
  const chosen = st.choices[c.id];
  const open = !chosen;
  let offers;
  if (chosen) {
    const o = c.offers.find(x => x.id === chosen);
    offers = `<div class="offers done">
        <div class="opened"><p class="t">${esc(o.title)}</p><div class="prose">${hlHTML(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`), c.id, "opt")}</div></div>
        ${c.offers.filter(x => x.id !== chosen).map(x => `<div class="offer closed" aria-disabled="true">${esc(x.title)}</div>`).join("")}
      </div>`;
  } else {
    const pick = pendingPick[c.id];
    offers = `<div class="offers"><p class="ask">${esc(callName(c.name))} can tell you one more thing. Which do you want to know?</p>
      ${c.offers.map(o => `<button type="button" class="offer" data-c="${c.id}" data-o="${o.id}" aria-pressed="${pick===o.id}">${esc(o.title)}</button>`).join("")}
      ${pick ? `<div class="confirm"><button type="button" class="btn" data-confirm="${c.id}">Ask about this</button><span class="muted small">You can't change this afterwards.</span></div>` : ""}
    </div>`;
  }
  return `<details class="mail" id="m_${c.id}" ${open || st.tab==="inbox" ? "open" : ""}>
    <summary><span><span class="from">${esc(c.name)}</span>, <span class="muted">${esc(c.title)}</span><br><span class="subj">${esc(c.subject)}</span></span>
      <span class="state ${chosen?"":"todo"}">${chosen ? "Answered" : "Choose one"}</span></summary>
    <div class="body"><div class="prose">${hlHTML(c.email, c.id, "email")}</div>${c.citation ? `<p class="cite"><b>Reference:</b> ${esc(c.citation)}</p>` : ""}${offers}</div></details>`;
}
function wireMail(c){
  const box = $("#m_" + c.id);
  box.querySelectorAll(".offer[data-o]").forEach(b => b.onclick = () => { pendingPick[c.id] = b.dataset.o; rerenderMail(c); });
  const cf = box.querySelector("[data-confirm]");
  if (cf) cf.onclick = () => { st.choices[c.id] = pendingPick[c.id]; delete pendingPick[c.id]; save(); rerenderMail(c); updateDot(); };
}
function rerenderMail(c){
  const old = $("#m_" + c.id); const tmp = document.createElement("div"); tmp.innerHTML = mailHTML(c);
  old.replaceWith(tmp.firstElementChild); wireMail(c); refreshNotebook();
  const btn = $("#m_" + c.id + " [data-confirm]"); if (btn) btn.focus();
}
function updateDot(){ const pending = role().characters.filter(c => !st.choices[c.id]).length; const t = document.querySelector('.tab[data-tab="inbox"] .dot'); if (t && !pending) t.remove(); }

function tabBudget(){
  const flash = () => !S.newsflash ? "" : budgetOK()
    ? `<div class="flash"><b>Breaking news</b><div class="prose">${esc(unscramble(S.newsflash, `${S.salt}|newsflash`)).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}</div>
       <p class="small" style="margin-bottom:0">Does this change anything? You can still adjust your numbers above — keep the total within ${money(B.tolerance)} of ${money(B.target)}.</p></div>`
    : `<p class="muted small">When your total is within ${money(B.tolerance)} of ${money(B.target)}, some breaking news will appear here.</p>`;
  const totalHTML = () => { const tot = budgetTotal(), d = tot - B.target, ok = Math.abs(d) <= B.tolerance;
    return `<span>Total: ${money(tot)}</span><span class="${ok ? "on" : "off"}">${ok ? "✓ on target" : (d > 0 ? money(d) + " over" : money(-d) + " under")} (target ${money(B.target)})</span>`; };
  $("#main").innerHTML = `
    <div class="writegrid"><div>
    <p>Agree how to split the <b>${money(B.target)}</b> ${pair() ? "together" : "as a group"}, then ${pair() ? "both of you enter" : "everyone enters"} the same numbers here. The total has to land within ${money(B.tolerance)} of the target.</p>
    <div class="bud">${B.items.map(it => `<div class="row">
        <label for="b_${it.id}"><span class="l">${esc(it.label)}</span><br><span class="u">${money(it.unit_cost)} per ${esc(it.unit || "unit")} · up to ${it.max}</span></label>
        <input id="b_${it.id}" data-b="${it.id}" type="number" inputmode="numeric" min="0" max="${it.max}" step="1" value="${budgetVal(it.id) || ""}" placeholder="0">
        <span class="sub" id="bs_${it.id}">${budgetVal(it.id) ? money(budgetVal(it.id) * it.unit_cost) : ""}</span></div>`).join("")}</div>
    <div class="total" id="btotal" aria-live="polite">${totalHTML()}</div>
    <label class="small muted" for="rationale" style="display:block;margin-top:14px">Our reasoning (the main trade-off, and the biggest risk of this split)</label>
    <textarea id="rationale" style="width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px">${esc(st.rationale || "")}</textarea>
    <div id="bflash">${flash()}</div>
    </div>${NB_PANEL()}</div>`;
  wirePanel();
  let wasOK = budgetOK();
  $("#main").oninput = e => {
    const id = e.target.dataset.b;
    if (id) {
      const it = B.items.find(x => x.id === id);
      let v = parseInt(e.target.value, 10); if (isNaN(v) || v < 0) v = 0; if (v > it.max) { v = it.max; e.target.value = v; }
      st.budget = st.budget || {}; st.budget[id] = v; save();
      $("#bs_" + id).textContent = v ? money(v * it.unit_cost) : "";
      $("#btotal").innerHTML = totalHTML();
      if (budgetOK() !== wasOK) { wasOK = budgetOK(); $("#bflash").innerHTML = flash(); }
    } else if (e.target.id === "rationale") { st.rationale = e.target.value; save(); }
  };
}

// the student's highlights beside the decisions (or the budget), with the same filter as everywhere else
const NB_PANEL = () => `<details class="nbpanel sticky" id="nbpanel" ${st.nbClosed ? "" : "open"}><summary id="nbhead">Your highlights<span id="nbcount"></span></summary><p id="nblive" class="small muted" aria-live="polite"></p><section class="nb" data-nb="decisions"></section></details>`;

          <label class="small muted" for="hw_${d.id}">${OBJECTION}</label>

  $("#main").innerHTML = `
    <p>Agree the ${num(S.decisions.length)} decisions <b>${pair() ? "together" : "as a group"}</b>, then ${pair() ? "both of you enter" : "everyone enters"} the same answers here. For each one, note the biggest risk or strongest objection and your answer to it: you'll need it in your writing. Your highlights are beside the decisions.</p>
    <div class="writegrid"><div>
    ${S.decisions.map(d => `

  memo.oninput = () => { st.memo = memo.value; save(); count(); }; count();
  const keep = () => { memoPos = memo.selectionStart; };
  ["keyup","click","select","input","blur"].forEach(ev => memo.addEventListener(ev, keep));
  memoPos = null; refreshNotebook();
  $("#nbpanel").ontoggle = e => { st.nbClosed = !e.target.open; save(); };
  const rb = $("#rubric"); if (rb) rb.ontoggle = () => { st.rubricOpen = rb.open; save(); };
  $("#consent").onchange = e => { st.consent = e.target.checked; save(); $("#out").innerHTML = ""; };
  $("#make").onclick = makeSubmission;
}

function pdfByte(ch){

  if (u >= 32 && u <= 126) return u;
  if (u >= 160 && u <= 255) return u;
  if (PDF_WIN[u] !== undefined) return PDF_WIN[u];

const pdfClean = s => [...String(s).replace(/[ŁłĐđıħ‐‑−′″\u2009\u202f→←≈≤≥]/g, c => PDF_ALT[c])].map(c => {

function pdfWidth(text, font, size){

    else if (b > 126) out += "\\" + b.toString(8).padStart(3, "0");

function pdfWrap(text, font, size, width){
  const lines = [];
  text.split("\n").forEach(par => {
    if (!par.trim()) { lines.push(""); return; }
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const tryLine = line ? line + " " + word : word;
      if (pdfWidth(tryLine, font, size) <= width) { line = tryLine; return; }
      if (line) lines.push(line);
      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)

        while (n < chars.length) { const cw = pdfWidth(chars[n], font, size); if (n > 0 && w + cw > width) break; w += cw; n++; }

function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;

  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = AE2 ? [] : r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${(AE2 ? (st.opened || {})[c.id] : st.choices[c.id]) || "-"}`).join(", ");   // ae2: the drawers opened, e.g. "ac"
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · Role ${r.id}${r.dept ? " (" + r.dept + ")" : ""} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}
