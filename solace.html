<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Solace: The Wear Rate — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

tect an emergency when worn. A rival device-maker is bidding for the same contract, and Ardenne has given Solace six weeks to submit a final design and rollout proposal — detection method, physical form, and how the device will actually reach people — before the contract goes to someone else. Every part of that proposal pulls against the others: what fits inside a small, wearable casing, what the insurer's budget will actually cover, and what people will really put on their wrist each morning.","scar":{"label":"The Feldmark Pilot","text":"Solace's first device was distributed free to thousands of older residents in the Feldmark region through an earlier, smaller insurer pilot. Lab and field testing showed excellent detection accuracy. A follow-up check four months later found that more than half the devices were sitting unused in drawers, and local press coverage turned the pilot into a minor embarrassment — the regional insurer nearly withdrew funding entirely before Solace scaled the programme back."},"proof":{"label":"The Solace Aria","text":"Around the same time, Solace also sold a much simpler bracelet — the Aria — directly to consumers at full price, with no insurer involved: a manual SOS button and GPS, no automatic detection, styled to look like ordinary jewellery. It had none of the Feldmark device's technical sophistication, but a later study found people who bought an Aria were still wearing it daily well over a year later, at a rate far higher than the free devices ever reached. Its buyers, though, were a smaller, more confident group who had sought it out and paid for it themselves."},"constraint":"Ardenne has given Solace six weeks to submit a final proposal before the pilot region contract goes to a competing bidder."},"listening":{"name":"Wearable Weekly","questions":[{"q":"By 2050, Europe's population aged 80 and over is projected to...","options":{"A":"nearly double","B":"stay the same","C":"fall by half"}},{"q":"What share of medical alert device owners don't wear it on a typical day?","options":{"A":"About 20 per cent","B":"About 40 per cent","C":"About 60 per cent"}},{"q":"How do fitness tracker daily-wear rates compare in the same age group?","options":{"A":"Around 50 per cent","B":"Over 90 per cent","C":"Under 30 per cent"}},{"q":"What term does the podcast use for reluctance to wear alert devices?","options":{"A":"Alert fatigue","B":"Device shame","C":"Wearable guilt"}},{"q":"Which company relaunched its alert pendant as a jewellery collection?","options":{"A":"Aventine","B":"Solace","C":"Ardenne"}},{"q":"What happened to that company's daily-wear numbers after the redesign?","options":{"A":"Slightly dropped","B":"Stayed flat","C":"Roughly tripled"}},{"q":"What are several EU insurers increasingly tying reimbursement to?","options":{"A":"Real-world usage data","B":"Lab certification only","C":"Device price alone"}},{"q":"Which devices were most likely to be picked up and never used again?","options":{"A":"Paid devices","B":"Free devices","C":"Trial devices"}},{"q":"How long ago did that company redesign its pendant?","options":{"A":"One year ago","B":"Ten years ago","C":"Three years ago"}},{"q":"According to the podcast, what kind of problem is this mainly now?","options":{"A":"An engineering problem","B":"A design problem","C":"A battery problem"}}]},"roles":[{"id":"A","label":"Role A","dept":"Product & Wearable Design","characters":[{"id":"priya","name":"Priya Kapoor","title":"Lead Industrial Designer, Solace","subject":"Casing size vs. battery — where we actually stand","email":"Hi — wanted to get you the real numbers before the proposal takes shape, because I think people are picturing a smaller device than what's actually possible.\n\nOur current front-runner casing is genuinely jewellery-scale — think slim bracelet, not a chunky fitness tracker. At that size, we've got room for a coin-cell-class battery that lasts four to five days on standby. If we keep full continuous sensing and an always-on cellular connection running, that same battery drains in well under twenty-four hours. There's no version of this where \"small and stylish\" and \"sensors running all the time\" both just work without a compromise somewhere.\n\nWhat I don't have is a hard number for how much space the sensor package needs at minimum: that's an engineering question, not a design one. I can tell you one more thing before you decide. Choose carefully.\n\nBest, Priya","offers":[{"id":"o1","title":"Keep it small","text":"rin7q2u4SSDF5ZDTgeKq6A3ntNERz6bRg3LhTGtuf/VRVBWZHFlv7z0vKh3PDnUopeMnZdff4GuY8N4+BnIyTpzQ84h30WiZNjXwiIRh4yHOeVGaa0WT1Ea4WoA9tXYDyVg8C/nZXZM3wlp/bX8Hg+gGzdxyAfXsOiLvqJUzUGzeXBIX6M0bVNaIaqoB4aCMS+LK7wYUzCCrIC1Wnewr1JJipMVZWCQsZxO/OSbegwQhlHGXvlcWjfSMd6A3d8o1ho+5zjpV61zpJwfuNYXYbsRTEwjNmVPiR0sl3rSTk/HGULse/VrJqDrQfvcIjn5dn0SpjyjlAD0Ek3LMk8SBkzybq6hbljKSYEgwb7YqPDU2fH+Lv7QhpD/vGM3VlzMZqe3El1qCKOCnR/a4elsIP9S2b13xe0ObKyBVPA=="},{"id":"o2","title":"Discreet, not tiny","text":"ojPRXio64OBalqgES1JrZJjq94zPYFMG/XdB65Stt9PsOeL2Z/431R24+olYwbopCEiP/bV78Xq4pRrWjNL68S5MrEa3cRb9d4Syk71+d95Pv88KxS0E9LOcWBFrWqtytoydiGG9Pd6FKBpJmk0RljJPinZWZdOT65a+ytci46K/8GBujTfT1u5EcEk0sLxEWTMDwCEsZiIgXtfC41+30xaLXHjp+MOIrnilb5f5V4TGmGJojpTvpqs1237z0xiNizWVtd5Wfk/LVFa1XEoeDS8be2QhQXeOcHugybjUnnHjOAVNAJmdqzxrYVqQNw6MBZyULcI0hmY3fRyvCDdQJAzbrLcVotzqwZrIJRshKCjPvOMdRe05kvhB56zRhhrq7BIc6c8wFZKbDd4T+xdoRjf2vFLX00wcf5eFOg=="},{"id":"o3","title":"Inside the casing","text":"mk2sB1tLWnXsVnZQhQWbpbq7YyHpStN4jPfAmq+e5iu7CU/v3j6x/dnI0F1xzWT1alm8LQ2ks1an344tVc4NrwIWt2dPBiXk1DeFVcZP/tRf674oiHj3eyd400rGEbkD2AP9vZA5GAIbiekNiPF5G7REdrTU4NJY9x0VLrfhGXC9AGfh6SIUWKkRcCIrxpkFa/NlUiVBLd5Fys7DE0r7Afk2yvs+fiVZxCeT3V+vuFVCJtWzHtG0v0Khmxa9OkKP/8CuhCXsHj+MYoNEeGQy/oCx4YyJN0LNQMLiAaD3xkMPz9KZjk3lS47v0v/Oq53ZttavImKQEnY4NLuJ7UUpF9ApVBv2xnR4ZAN87WpEpmiF6/uqUft/oe4="}]},{"id":"tomasz","name":"Tomasz Bilek","title":"Materials & Manufacturing Lead, Kessler Componentry","subject":"Real unit costs at pilot volume","email":"Hello,\n\nYou asked for cost numbers before the proposal is finalised, so here's where things stand from our side.\n\nAt pilot-region volume, a premium metal-finish casing — the kind that reads as jewellery rather than equipment — comes in at roughly double whatever cost cap your insurer partner is working with, based on what you've told us so far. A basic rugged casing in moulded plastic, at that same pilot volume, comes in comfortably under almost any reasonable cap. The gap only closes if the order volume gets much bigger — a multi-country rollout, not just the pilot region.\n\nWhat I don't know is exactly what Ardenne's cap is, or whether it could shift with a bigger order. I can tell you one more thing before you decide. Choose carefully.\n\nRegards, Tomasz","offers":[{"id":"o1","title":"Metal versus plastic","text":"MdB5wrQlyK4lf8Mkw99dT8sUeVyu///ALh+/79L6tgWnnup0AmTabEkGLShHQNRbzYoTFoolTUnHIfd8rtPuU6efRKibd2gp7biYo9shjPO31/BuETxp8Kab+l/7sJK3XJGWzQ9FTqw67XdA2og25dRz/M1tMlw62hJIN81ke+QmddWrZlixyeSdwXbui3QlTwPXZ0oDIcOLjs00HFYPKoLyo0JLZW/HPPWa7PQzPErOZcMGNoVHPNBn+O5sRjZFGwskmReSiSgwzGwb55CUsN02eU2/qQgIhPXfg8E/PKFldsN0fy3EWbgZCo726bM5WmP0iIUCdAymIgo+jYlfzYqk0S53mxvYJjvaaTO8Dt0fGjV6gVrcL7XC/HB7cswpyESmvecXmhfkLymH5LMnkSI1ktd1uSHySUpTbxoimQw="},{"id":"o2","title":"The case for plastic","text":"6mB1gTeDN1FqvJrGIZpYV22z7bQqInEkEFpMOIjF9vLAgpRjfaR8dNyWCKNPADfoloMYUtbROkZFSdEBo/cDWQ2O/kf/fwYerpX2EirI6nZpDGjTIobmRyyNtW7XVZd+PuSd1pz96RN3IqoMJN62GhhL13bMAf/zu5J4+AcwPYlHum9VUst+sYJCuoIm5IEdvKtE3AhbkIA+UEpqjxXlAaYnw9raWuqHe4GEgxbFb65dn5RluujWGeavOLm8EbFQda4NS1HP+mmi701kuArI4MOfPzruQoG/KQTFnA8Rq3BCoFczMwnebeA9qGiCLBStVl/L4yTnxOjGtTSnPj6k3eDe+BoMsH3HxXGUaX5Rpef0rKCkEB02797HHjCzn5NwYbkIbyFpB+enpAGRGGrmoSVHRGUZcfLRXobVFHk15g6legf7jDtiehjWV/bf"},{"id":"o3","title":"The cap and the casing","text":"me9jSO7/FLPlmmmSDq6t20GvQw3MOp9asNeWMtbmJr5g7J3PlB+ein9gvAMBKh+599Mp4JzxdoXppdXtAV5RyzMEuxCsI5fvppHd8DcsMOyauc7AtU60HUK+zGJSWJ78gjZpu2s0lpO5ljR1xZwpeR8ukffDY8a6YwKM991fFWYJj86L4KUAHktlipjbmhMqDQJ+XvZ9cYThw+Fze/PC7ZfBH7AS02wuQKsGFuCw3RJcIrrOFbWAb2P+26OfvsZjS9aKZjlT2r+aqE+xegT2z/PeskKvsxXEVzITKdEKR1QSmmtqqHm6SIreXliqOqVtvS5S5WWyK7p6iRdInWEDHuBo9XraBrYEy6Ij648j4ng="}]},{"id":"elin","name":"Dr Elin Vasko","title":"User Research Lead, Solace","subject":"What people actually told us in interviews","email":"Hi,\n\nSharing the headline finding from our latest round of interviews with older adults about safety devices, since I think it should shape more of this proposal than it currently does.\n\nAlmost everyone we spoke to said they'd happily wear something small and ordinary-looking that they'd chosen and bought themselves. Almost as many said they'd avoid or actively hide a bulkier, obviously medical-looking device — and this got sharper, not softer, when the device was described as something given to them for free because they were considered \"at risk\". Being handed a safety device seems to sting in a way that choosing one doesn't, regardless of how the device itself looks.\n\nI don't yet know how much of the 'obviously medical' look is actually required by regulation, and how much is just a design habit nobody has questioned. I can tell you one more thing before you decide. Choose carefully.\n\nElin","offers":[{"id":"o1","title":"Forty-two interviews","text":"hMrvZ1/6zgTHB3WpfhqmW8lpRh6FshFyr4G6Ivr0pwnsaAqs6bB7EFLINlLl2UW2WLalCgjXcovjs8rrjwPlQ1qW5CjysDH/NYvS2q47futXd6eUr8yINmIEoKBvCexRZsJcBE9tYfqBYXExivA8Q4qhaho0prQMlQJg5sXaBjJy3NHqXC1bfAMn2fXwSIBTrOMmtvxCNA/stWx49P88iGP+avBaejcv0aV6lmUmhRzumZKqksrzSl7v3lm8yD4xpbhj8ZSDYUE2u5ExPZ26ULA4M0ct1XShLwJ/hTRl1AlZSq5d79LvXaxVJbn+R+FovOEw1HZnKFlP+Tm9JQdqOUMdI2rkqyuZtP8R4AAnsqUQvDcHZPVwQ9KD+6KrTiU="},{"id":"o2","title":"A bracelet people would choose","text":"eYtxbUsXSryGT4c7PlVU9uJLbNhuvQQ9OG46TroYGO+tr2PV27QqVGckn51I29omasHzmBYuDHBt/tH+gvvfkOwOz8dNZoyH7koM0Y89gtDe81jr9nTSJOAqI+H3iv/46hdjKPpOSRyEIAlOYKINFq9VQ0fSfaO11pbpMbhJRZRUmY0wGQCAmUkTiKj5a1SvG5svTvrcTsbegmF4cp8/l4kWdCj2hA4qE3zAlNtC7lc8KAH7pqqwyR1LfxESTaCV8PJP4DuZQlzNKXC0LhnvmnXQbUdVP4H9rSJV1viJ0otcmuXSyEwdTn+VRE2Rom4SlmO0fGP+pjo/QVXlCNdkCPrJahaL5M6Kukz1ZZjC1cn8BAgrq8JS4GwnFNMfbgdCTfbeQdpb/Jw="},{"id":"o3","title":"Why 'free' stings","text":"DmrHWo2ef2W1BGfhw55F//prUfJlWU4rM7RJcEZTVWUxj5PoDXbBw1T32GwCaIcnibURUvGXusLgprGk0qmBXVvH6HVvlz+4qjc+7gMjrybP6rPynf0H/4MKYBvDIhMnK/GEbaCkbo2UMVlRgAdIhrnOQXvzGeozFT2+/HJ6SIDdShQGGw+i5tK/4IaeZLob1ZUTk2UUnshX2PpSm1jgSifKl6yonpc/ErgIRh5gVKCEM+ceD4m7aHlvILyov8TfxCNBnxBdaa0viwfZ10u5Jo6j/ThALD2wjeA4quRuWoyE1z3xScysNDEpaRcPh/BjP6YmyrDm2idVbD13nyzPqfui8+pMsrUBCk9vTaXrSTSY+OF6wmMNSJ4iMEg="}]}]},{"id":"B","label":"Role B","dept":"Interaction & Sensing Design","characters":[{"id":"jonas","name":"Jonas Reitz","title":"Firmware & Sensor Engineer, Solace","subject":"The real sensor footprint, and a timing problem","email":"Hi,\n\nQuick reality check before this goes further. Reliable automatic fall and vitals detection — the kind that would actually catch someone who's gone unconscious — needs a sensor and battery volume that's meaningfully bigger than what a slim jewellery-style casing usually allows. It's not impossible, but it means accepting a noticeably bigger device than \"looks exactly like ordinary jewellery\".\n\nThere's also a timing issue nobody's flagged yet. Getting a full multi-sensor detection system properly certified takes real time — longer than the simple button-only version. If Ardenne's deadline is genuinely fixed at six weeks, I'm not sure we can responsibly promise the full sensing path in that window, let alone build and test it.\n\nWhat I don't know is when Ardenne needs certified devices in members' hands. I can tell you one more thing before you decide. Choose carefully.\n\nJonas","offers":[{"id":"o1","title":"Why certification takes longer","text":"/Iw1XSEMNIgRpTG9Kx2zPHe75RmjTunq33KCn1DXBbBKqY7CMeXgi83tJh00gkCLBHEBSHs6KmxL+2KKAg2LJ5GFVRk+PkM20gfL0nDqSD7DuMup9BSLHsbwJ+jvWlmk866F3ohyUYwqfHHhvcXOHB4CapwFdQmaFBt9Re5MuTWroB+iSBhd1JPd5n8uXxcL/Kl6pCxqr+KRuUZiG6nvY2I8Ym0f4LufcozzcxOnN8DWeEPJicjuP+Z2r9ifIxjnZxzvgXtpyI4xao5bJYr/h6699Z5qWblFuSPsFEW2gPYrvb77Yqcic9Vq8J4aznq3QQKs00QxWaZYYSplRrPleMi+192pRg2B5rg2Wrk3RgSIuWE/YwMEIKp09LqyjzXKq6sKhDx7e25GDBATyspEu0fFkmXMAA=="},{"id":"o2","title":"Why a button now","text":"W3JwImVMxpUfICA+D+gKjVsb811KZRdTADwdzvTP7QLs5wm4SifJQoExfgcSJvgH5/AvFm3+KXnMR2gWVU6RW9LHbWNgcePVmDq4zk2Wwrmju9Q7qWlA+wVzdUuhydWx4Y9VaV0wAgdjcHJxLjR79QJ/3lAYiRKGEON2PiPq/zJBZVPvVAcMWODIxPVC8+uZhzJeZTYtfxT/MbZ+BB1/UYPKhuW4e6sZiGnbuaZT2YTxYmLLqIsXRiNTBYs7gLfagJ+mBV4rMsomV6BTXoDckay4KQsftq61vxtN4e/2PMWuhkqqJjmVbcUI2JFn0huHumB9LH9ySMo3qVZjJSD7YLMiURhyyHHVkMBWZQ+YNJwwzoI5LWQAjmh+trsy0jjDjQ=="},{"id":"o3","title":"What a button misses","text":"ZxJxLfTYJ0cZqN/mbplDoZRU3rdBQM95lwr5WNTIMUc2LiBv0zmBXSuXfjCVGl0HmLozV1GgfHYq8/lY4NI2bEYywBPbU66l0UA+kiJStlVOgNTYGdLfZp8uU2jJENesIYzQ5Bzd0IPzI6rA5dIDctgn3XQS1HM0gROsiNwvOSvcM5Xi9zR2bmmz1U4k3wUqBbAy3GEMQds0vbbImkEXtH5JUho5ERPgLsEKq92rwTRSEF0hrsvKCaviLJt8+s0OaDg6YZ4iWI6wre6vrFftlieDU2T2bZV4sowtisccNx++koAKl2V/R6mLr1gfCTA9/xOtbg2ARm0iHZEkSAXF"}]},{"id":"halima","name":"Halima Osei","title":"UX & Interaction Researcher, Solace","subject":"What actually goes wrong with the button version","email":"Hi,\n\nSharing some usability data that I think should inform the detection decision either way.\n\nOn the manual-button side: when a button-only device is worn as jewellery — on a wrist, close to fabric and other objects — we see a real rate of accidental false alarms just from everyday bumping and brushing. On the other side: looking back through the previous device's emergency logs, a meaningful share of genuine emergencies involved no button press at all, because the person was disoriented or unconscious when it happened. Neither option is clean. A button is comfortable and cheap, but it only helps if someone can actually use it in the moment.\n\nWhat I don't have any visibility into is how people end up with these devices in the first place: I only see what happens once someone is already wearing one. I can tell you one more thing before you decide. Choose carefully.\n\nHalima","offers":[{"id":"o1","title":"The bigger problem first","text":"iQsjeFx+OiobjLSUTx+h9xuu8nIPkymvAx3ovfGo3gPIMBORUSjARPuUm+CBXA4VRiL0w3chkMZ3e5Qm8zxglrJiglGy1gvev7sj4pcNmYO5nPaYcl+mtTbpLX03rCkipztnKEjbPh/ixV6DMbpS220MizkLS6itvHx6nWJflFwKsACVuLp7Vj22jFEQ4/diWWDcw6U44BgHnDK1XuS7MIUKo4b0EPsR3udq/bO0BzZL91dQ5N+05lFzvMU6e+olGq9ma6ikgtlLjDGTMJKiC8ksaqIu4CiYpSbwgbM/asqwn/x2IOkybYouXblVZ4+izTKxM0Wcw/XL102p0ZShXJo2gdMGowSHXznUSSUS+RmJodXqnyXqhx/9kFPIa3epYuClTDUBNV3MUgk="},{"id":"o2","title":"Two kinds of failure","text":"sh4AyXoUg9QuDX3deh1pUpyiIsUjejJYUS7Xn73iD64G2Ug66fuowKtmZQeC/VivtixUCQzTVP3nz4u6qa9aoaGMNhRIiseO85fED3xqP1yXRJffjbKPCxK4EulzEmvr1NRB+Ub4pxFThUxiTlThQsat5qeHmiFZgvpF/Ux/IHrWBeau63xazDc3qj5RL5UU/u7+vSU0+DOU0MXz3dh8vKRLn/T7ekYoSyPl7nvEgmCQznemQl1mG3qHP2J1GoQ0Xuida7Ihjr3p3LF7JvmxVGUKahDIuIsd1+wPeEp+ZEbPcuHrpun5JxwkufcZC4BCNQMh356Hrv8TlVeow30XWRaXwdKudVP0fZfmNaob0uJwJMewo6A+XotHomv3vWc2ygRnmnSnJYUj9bqxTdJfY1RPdj6YhGgqAT5l1/zURfpeFMYh0NuK+9B6wo4avLM8PqGC7e2GDjuSRjfIMQYwzb0P3MbDWavVRuqio9sf"},{"id":"o3","title":"Reading the emergency logs","text":"1OX1pOPE9xoMCdZYxNZzF8bcRu4tkHdVCKmnrH/hBjyD5eBGKThJSpHnN/bBWhLrDkCzmPInpg5xl/PnoLcVeEAZRqkpdy6qmv3lY/kxAbfFMj3Buiobwz20URNM7tc+XGmvxQNLkNId1F94vuiv0clw8cvgvnzMTVFYYccUNHARzDuV72Jl/rmKmV46LS7tYKioLp6TZidElFOaCFa5cFqXdnmiZcNrEPwiM/6uc9Rt38UbqCwooQq7Z4WW2/ByM3qVFZPiugRSOJ4A2Pzz5oIz92nO9XUVinQmGQ+Z/UlFOD2cO3gTUhKEwbfTNlEnnI/9N02DrL9o9Xg4TIS98lDfBitwOSR1254sGcdkCQYTz3/g0U1g5nINhr3S23SGVcmLw2YE54uYSMccDgtF"}]},{"id":"marketa","name":"Marketa Sørensen","title":"Clinical & Regulatory Liaison, Solace","subject":"What's actually required by regulation, and what isn't","email":"Hi,\n\nFlagging two regulatory facts that I think people are assuming rather than checking.\n\nFirst: whichever detection method you choose, this device has to be certified and labelled as a medical device under EU rules — that part isn't optional, and it's true no matter how the casing looks. What is a choice is how loudly that gets signalled visually; the labelling requirement itself doesn't dictate a bulky, clinical appearance.\n\nSecond: the certification pathway for full automatic multi-sensor detection genuinely takes several additional weeks beyond the simple button-only pathway — this isn't paperwork bureaucracy, it's the actual review process for a more complex device.\n\nWhat I can't judge is whether a device can be legally labelled as medical and still be seen as ordinary, everyday safety tech. That's a positioning question, not a compliance one. I can tell you one more thing before you decide. Choose carefully.\n\nMarketa","offers":[{"id":"o1","title":"What the label must say","text":"CBIoUE8fDR784aAj6QO/Ov/shtoMZLGVeh8qwXkNYMi4xCZ/tFGc1khyp/YSS+rwhgmO1C+qdsz6733Tp3cWkN8T+2BgR8OI+AVq9ZZCZKkx+B3QcZD9OMS3rZz3nK0XJICy0JkPUV1/2ILgnpuu7tGQ1XL352XnOpIuO8uKXn++hPkZyuFZx2ISopxI6jmZYjo39ct/DBWUJE3QibCXUHkeelO5wzSn2WrbofCw45PPbLob+RCGCqONPhFmmDXiRd/7pey1jQ+sJz3J15/mmKZLnNGWcURvZBfajOrSgdYODAEJDzkcpGb8tcDFAJKKoz6c+q3CNZMpXhL7asDXIoIHZlaw2DtiSMsbo6N64ikVWIvtIeo7ny3Zw6Sly+ULZLkq1mzxV5DhREMHNsY1uP9vONIiURRiby6OiZNgV8l2"},{"id":"o2","title":"The extra weeks","text":"OGIgwk6XpN+3bZ6cWSCGvr8fSO88AG00/WdJO4cG0vdU8BZau+ODK5EH6AXM6i2jGj7gt4X9ddLUsBtEvmaDkn2j5HGxF1zxITzQzAaHRfpmCuXrpe8j9JT5xM961LHZz0Vzno3QHaDKcRg9Ag9kZhmscwGp5tHR/xhAFD6GRuVEQRH3lIpGSr70zWaqat789ipWvE83zOQOinTE5G6oKFOplfNiaYiQ9Qa6jV/5fIeXF7Vuyv5s06bHxl/fa1+a/jjjTP5NcGSqUTvh0d1fH/trD8Nf5uT6TOh1DrDH3qa0Zmk3idIGYRlPgMhE3YDYgsK8jXBXv293eo9WtOguElNX7u8AEWzGRe3Wm9S87ABaKaVvfj9Y+Eipud9QOx6//bHyyaz+"},{"id":"o3","title":"Label it, then style it","text":"hyRMsEJ1jwchgh4FW/u9AUSveu4fi1q8BfK2AxbnP7mPDCHv3eabAVRLRyOOQnCsr5ne9ZFjxWk4yoRZdTDoxKI64XrlYT90Y2+jxgljeuLRT+IfvsXRqaXkV0CSJKokiYnwIxhmfCsGT3lDn0Y8zh2qEzNITmaHavS9gxKeIIvhUazlVdZ+gErDVFBIDC6RjD+/aaJIHvYdH7UdDsonjorWCMsUGj7KrXXg5xjw1JIQ9LrKGxjwKbTwRtcgtiWzdMfY8cUYN1vamt6zze02hMLrHF3VUKAUxF6Zrs+8TypjV8PHrYd6kZu8G1Zvk6cCXVA2KZgCugwL2Wuf19ui+dejEkdH6+McmfJchAQFj0ULY/8haaS/wqDH7g=="}]}]},{"id":"C","label":"Role C","dept":"Distribution & Brand Design","characters":[{"id":"ingrid","name":"Ingrid Voss","title":"Head of Preventive Care Partnerships, Ardenne Health Alliance","subject":"The real terms of the Ardenne contract","email":"Hello,\n\nPutting the actual terms in writing so there's no ambiguity going into the proposal.\n\nIf Solace wants the free, insurer-funded distribution route for the pilot region, the hardware and onboarding together need to come in under a fixed per-unit cost — we can share the exact figure on a call, but it is not flexible at pilot volume. Funding for the wider, multi-country rollout depends on the pilot region reaching a minimum sustained wear-rate at ninety days — not just on passing detection accuracy tests. Wear is where the last device from your side fell short. I should also be transparent: a competing device-maker is bidding for the same pilot region, and our timeline for a final decision is six weeks from now. Every device in the pilot must be fully certified before it reaches a member, and we plan to start distribution as soon as we decide.\n\nWhat I'd like to know is whether your own manufacturing side thinks that cap is realistic for the casings you're considering. I can tell you one more thing before you decide. Choose carefully.\n\nIngrid","offers":[{"id":"o1","title":"How Ardenne measures wear","text":"+QQxGeavEJrhgvVMdKwOVifdjV/o04SV5HkopQcR9J5dQiNJSduyZ7Jq9mf64qzeINWmmB4ammhIScNHYiDqASriWWC0lV+2livGkbSFCmSFM+pKOcj+iow30VOEKeruXNJuGBd76k+hHVTshRQ6eK0KXWu0Wo6PDCxhzPh05wAeZCRVeA2KPOsINACiR/qy4lFf8e9LkXqRngGXO4ebwZ+HsFdwOLXbIZsgS7g5/73xbG1HGLwe2KY7p89US5/TT80Sy4ENAm0bqvPEqwmdxyC1mWvM8daUzOPAZo6fCYr5i2YcKn5sTxZuTt4vpwYBeZ8u/pDwARs6fUY5bdLgz7dyqrWX5mJWFCASooQ+BccTnWgX0DQl05Ao1LyTIJcTDXk="},{"id":"o2","title":"Why free matters to us","text":"WLZdcVxAqY8bHIRe4CYKSvUmPAJ+529u05mbDK8ui5Mj5mb8AcYNk6Vi2to7ZTr3ykP/Fc5AjxEsZ9p0EfK2H8UU30nziMZ7bJoEGJVKJgQOGsBp3ANLdxkjdtRaOzSX8jcQC2xLGcb+63vYhbfBju09 :[{"id":"o1","title":"A promise we can keep","text":"JUNIO+KxDLTtkjYdl1JiMyw5qNL3v3MHCHflMrc6iBn7szC1fz4tf9e4tJ2fruH2+fgDZ9dyyCq1aQRIFM1EPHZ6PbhmqnA7vSp+M08ebh9aytMgn2ihuPz2cXBZOg7Bp9WG67NZW96867qYDPONLLXSgm8HQAchtPbSyqcjV6Hl5LbjB7I7XIp/9Z88iueEjNayGL90Gr/1KgLeCbrkywtC4jrqNZFUZa3casCgIlK0H5mCkncXGNegqJ97x/VK1bh+79OhvH5tyGlDLw6pxtlz0CiHGN27q1UI7GWMgYKzYUfA719XMv0vVpcnh5f1M+JxIAbPiYZBiorY4Fy2hvD0Y8RLAHSK2QKiKpw5kXYMFIrZCuhb8bPiC/L+It3O8j9yaK6y"},{"id":"o2","title":"What the campaign can't say","text":"BniRWovitAJpbCPnhl1/OZS8NrEMr9kKWcvPELEKIeVSIsYgvXrWKKNMlAkG0cXlaEg3kn+7Of3PkJ7jbq12tvt/u/1Zdl0vtg/AvGUwj7hyeFc/3IJ7Ms2yzg2FhPAVtRGoDHgmdd4EHwoEk2cNk5LB+mWOn1uwFFU4tIlsw3lvNRt1nHchh2gdMy2ZrqMy6NcE3GXFxTYLJ6cIyUoEyxWDjkTzDv3pyUUFK8fG8SxeJB1ksMkMz9zIjqYK8FSSTjDqvSQMq+6K0ov7QGeFoGIZqaTzFEGLTSr5+NzMUFXdUhrPRzRqOYV49GiBXJRT/X9topBN9jENbl2iN9jf9Rq8rlk="},{"id":"o3","title":"Two adverts, one audience","text":"nUo0uYIRx6pPLf4raLkGpHbKWwWiv88z1S03EOhgmbYDK3o0DY2CUYxmop7mlukpbhb7ciy0rgGqobkPPYZQKBpdYu/CyUwRBGwZFJEKqoCpZ5yyDpy+z3n954BY/Qzf40/PHeXi1kWlKA2bBRteM4JMPIMBnEnEPLVDznQExcpzppFJ+9rLC0KISguXXF6cUXnU/DceY5u8Apovt1QZRbhw8r6u+hnvurL/6xtVs35gqqjs/H47ydcmpQWNz4/48K3BrEF1WWngW5mP4o8/mYW7/7MrY965w7t5FUdGFafOumCdDlbntexcDMnhYLqYJmGrAi8nimJIh4AY3vFnZq/wgimLsu/DsfmJDSDCOH8XD+zCDnNr0FkXytqaluif0p0="}]}]}],"decisions":[{"id":"D1","title":"Decision 1 — Detection Method","A":"Full automatic sensing — continuous fall detection and vitals monitoring across multiple sensors, always-on cellular. The most reliable option if the wearer can't act for themselves, but it needs the largest battery and chip package on the table.","B":"A single manual SOS button plus GPS. Small, cheap, and it fits almost any casing with a battery that lasts many times longer — but it only works if the wearer is conscious and able to press it.","short":{"A":"Full automatic sensing","B":"Button and GPS"}},{"id":"D2","title":"Decision 2 — Form & Materials","A":"A compact, jewellery-styled bracelet in a premium finish, b <script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};
  if (str(s.mode)) out.mode = s.mode;
  if (str(s.role)) out.role = s.role;
  if (str(s.hlGroup)) out.hlGroup = s.hlGroup;
  if (typeof s.nbClosed === "boolean") out.nbClosed = s.nbClosed;
  out.choices = map(s.choices, str);
  out.firstLook = map(s.firstLook, str);
  out.mcq = map(s.mcq, str);
  out.decisions = map(s.decisions, v => v === "A" || v === "B");
  out.hl = map(s.hl, v => str(v) && Object.prototype.hasOwnProperty.call(HLC, v));
  out.hlLabels = map(s.hlLabels, (v, k) => str(v) && Object.prototype.hasOwnProperty.call(HLC, k));
  out.nbf = map(s.nbf, str);
  out.opened = map(s.opened, str);
  out.drawOpen = map(s.drawOpen, v => typeof v === "boolean");
  out.budget = map(s.budget, v => typeof v === "number" || (str(v) && /^\d{0,7}$/.test(v)));
  out.tags = map(s.tags, v => v && typeof v === "object" && !Array.isArray(v) && str(v.p || "") && Array.isArray(v.d) && v.d.every(str));
  Object.values(out.tags).forEach(t => { t.p = t.p || ""; });
  return out;
}
function handoverWhen(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-GB", {weekday: "short", hour: "2-digit", minute: "2-digit"});
}
function handoverBox(first){
  return `<div class="handin${first ? " first" : ""}"><b>${first ? "Open a teammate's hand-over" : "Taking over from a teammate who had to leave?"}</b>
    <p class="small">Open the hand-over file they sent you. ${first ? "This tab will show their work; your own stays in your other tab." : "Do this in a new tab, so your own work stays where it is."}</p>
    <button type="button" class="btn${first ? "" : " quiet"}" id="hoPick">Open a hand-over file</button>
    <input type="file" id="hoFile" hidden>
    <p id="hoMsg" class="small issues" aria-live="polite"></p></div>`;
}
function wireHandoverBox(){
  const pick = $("#hoPick"), file = $("#hoFile");
  if (!pick) return;
  pick.onclick = () => file.click();
  file.onchange = () => {
    const fl = file.files && file.files[0];
    if (!fl) return;
    if (fl.size > HANDOVER_MAX) { $("#hoMsg").textContent = "This file is far too big to be a SimLearn hand-over."; return; }
    const rd = new FileReader();
    rd.onload = () => { const msg = openHandover(String(rd.result || "")); if (msg) $("#hoMsg").textContent = msg; };
    rd.onerror = () => { $("#hoMsg").textContent = "That file couldn't be opened. Try again, or ask for it again."; };
    rd.readAsText(fl);
  };
}

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");
const budgetVal = id => { const v = parseInt((st.budget || {})[id], 10); return isNaN(v) ? 0 : v; };
const budgetTotal = () => B ? B.items.reduce((s, it) => s + budgetVal(it.id) * it.unit_cost, 0) : 0;
const budgetOK = () => B && Math.abs(budgetTotal() - B.target) <= (B.tolerance || 0);

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){   // no Teacher link in an exam: one less thing to click away to
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${EXAM ? "" : teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderExamStart(){
  const m = EX.minutes || {};
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start examstart">
    <h1>${esc(S.title)}</h1>
    <p class="lede">This is an exam. You work <b>on your own</b>: everything you need is on this page.</p>
    <ul class="times">
      <li><b>Reading</b>${m.reading ? ` (about ${m.reading} minutes)` : ""}: read the situation and the ${num(role0().characters.length)} documents, and answer the questions beside them.</li>
      <li><b>Listening</b>${m.listening ? ` (about ${m.listening} minutes)` : ""}: your teacher plays the recording; answer the questions as you listen.</li>
      <li><b>Writing</b>${m.writing ? ` (about ${m.writing} minutes)` : ""}: make the decisions and write your ${esc(S.writing.label)}.</li>
    </ul>
    <p>You can move between the tabs at any time and change your answers until you create your submission. You can highlight sentences as in the simulations.</p>
    ${S.ack_disclaimer ? `<div class="ack"><b>Before you start</b><p>${esc(S.disclaimer)}</p>
      <label><input type="checkbox" id="ack" ${st.ack ? "checked" : ""}> I understand</label></div>` : `<p class="muted small">${esc(S.disclaimer)}</p>`}
    <button type="button" class="btn" id="go">Start the exam</button>
  </div>`;
  const ack = $("#ack"), upd = () => { $("#go").disabled = !!(ack && !ack.checked); };
  if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; save(); upd(); });
  upd();
  $("#go").onclick = () => { st.mode = "3"; st.role = role0().id; st.tab = "context"; save(); render(); window.scrollTo(0, 0); };
}
const role0 = () => S.roles[0];
function renderStart(){

document.addEventListener("click", e => {

  const hs = e.target.closest(".hs");
  if (hs) { e.preventDefault(); openPalette(hs); return; }
  if (p && !p.hidden && !e.composedPath().includes(p)) closePalette(false);   // (the palette may have redrawn under the click)
  const g = e.target.closest("[data-grp]");
  if (g) { const box0 = g.closest("[data-nb]"), grp = g.dataset.grp; st.hlGroup = grp; save(); refreshNotebook();
           const again = box0 && box0.querySelector(`[data-grp="${grp}"]`); if (again) again.focus(); return; }
  const j = e.target.closest("[data-jump]"); if (j) { jumpTo(j.dataset.jump); return; }
  const c = e.target.closest("[data-cite]"); if (c) { insertCite(c.dataset.cite); return; }
  const box = e.target.closest("[data-nb]");
  if (e.target.closest("[data-clear]")) { box.querySelector("[data-clearask]").hidden = false; e.target.hidden = true; box.querySelector("[data-clearno]").focus(); return; }
  const head = () => { const h = document.getElementById("nbhead"); if (h) h.focus(); };
  if (e.target.closest("[data-clearno]")) { refreshNotebook(); head(); return; }
  if (e.target.closest("[data-clearyes]")) {
    st.hl = {}; save();
    document.querySelectorAll(".hs.on").forEach(sp => { sp.classList.remove("on"); sp.style.background = ""; sp.removeAttribute("aria-describedby"); });
    refreshNotebook(); head();
    const live = document.getElementById("nblive"); if (live) { live.textContent = ""; setTimeout(() => { live.textContent = "All highlights cleared."; }, 50); }
    return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const p = document.getElementById("hlpal"); if (p && !p.hidden) { closePalette(true); return; } }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.classList && (t.classList.contains("hs") || t.dataset.jump)) {
    e.preventDefault();                         // Space would scroll the page
    if (e.key === "Enter") { if (t.classList.contains("hs")) openPalette(t); else jumpTo(t.dataset.jump); }
  }
});
document.addEventListener("keyup", e => {      // Space acts on release, so the palette doesn't catch the same key
  const t = e.target;
  if (e.key === " " && t.classList && (t.classList.contains("hs") || t.dataset.jump)) { if (t.classList.contains("hs")) openPalette(t); else jumpTo(t.dataset.jump); }
});
document.addEventListener("change", e => {   // ae2 note filters
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const box = e.target.closest("[data-nb]");
  st.nbf = st.nbf || {}; st.nbf[f] = e.target.value; save(); refreshNotebook();
  const again = box && box.querySelector(`select[data-f="${f}"]`); if (again) again.focus();
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.cc;
  if (k) { st.hlLabels = st.hlLabels || {}; st.hlLabels[k] = e.target.value; save(); refreshNotebook(); hlDescs(); }
});

/* ---------- main shell ---------- */
const ALL_TABS = [["context","Context"], ...(AE2 ? [["listening","Listening"],["firstlook","First look"]] : [["firstlook","First look"],["listening","Listening"]]),["inbox", AE2 ? "Research" : "Inbox"],["decisions", B ? "Budget" : "Decisions"],["submit","Write & submit"]];
const TABS = EXAM ? [["context","Situation"],["reading","Reading"], ...(EX.listening ? [["listening","Listening"]] : []),["decisions","Decisions"],["submit","Write & submit"]]
  : ALL_TABS.filter(([k]) => k !== "listening" || (S.listening && S.listening.questions && S.listening.questions.length));
function render(){
  closePalette(false);
  $("#app").classList.toggle("wide", !!st.role && (st.tab === "submit" || st.tab === "decisions" || st.tab === "reading"));
  if (!st.role) { document.title = S.title; return renderStart(); }
  const HO = st.handover, tabs = TABS.filter(([k]) => !(HO && k === "submit"));   // no submitting from a hand-over tab
  if (!tabs.some(([k]) => k === st.tab)) st.tab = "context";
  hlDescs();
  const r = role();
  const hoName = HO ? (HO.from || "A teammate") : "";
  document.title = HO ? `${hoName}'s work · ${S.title}` : S.title;
  const pending = AE2 || EXAM ? 0 : r.characters.filter(c => !st.choices[c.id]).length;
  $("#app").innerHTML = `
  <header class="bar">${topBar(EXAM ? "Exam" : (HO ? "Hand-over: " + hoName + " · " : "") + (r.dept ? r.label + " · " + r.dept : r.label))}
    <div class="wrap"><nav class="tabs" role="tablist">${tabs.map(([k,l]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${l}${k==="inbox"&&pending?`<span class="dot" title="${pending} choice(s) still open"></span>`:""}</button>`).join("")}</nav></div></header>
  ${HO ? `<div class="wrap"><div class="handbanner"><b>Hand-over from ${esc(hoName)}</b> (${esc(roleName(r))})${handoverWhen(HO.made) ? ", saved " + esc(handoverWhen(HO.made)) : ""}.
    This tab shows their ${AE2 ? "papers" : "emails"}, what they chose and their highlights. Use it to tell your group what they found.
    Their own writing isn't included. You can't submit from this tab, and changes here don't count.${HO.older ? " The simulation has been updated since they saved this, so some highlights may be missing." : ""}</div></div>` : ""}
  <main class="wrap" id="main"></main>
  <footer class="wrap">${esc(S.disclaimer)}<br>Nothing you type here leaves this browser tab unless you copy it yourself.<br>
    ${HO || EXAM ? "" : `<button type="button" class="linkish" id="hoOut">Leaving early? Hand over your work</button>
    <a class="linkish" href="${esc(location.pathname + location.search)}#handover" target="_blank" rel="noopener">Open a teammate's hand-over (new tab)</a>`}
    <button type="button" class="linkish" id="reset">${HO ? "Close this hand-over" : EXAM ? "Clear everything and start again" : "Start again (choose a new role)"}</button>
    <span id="resetAsk" hidden> ${HO ? "This clears the hand-over from this tab." : "This clears everything you've done, including your text."} <button type="button" class="linkish" id="resetYes">Yes, clear it</button> · <button type="button" class="linkish" id="resetNo">${HO ? "Keep it" : "Keep my work"}</button></span>
    ${HO || EXAM ? "" : `<div id="hoPanel" class="handin" hidden><b>Hand over your work</b>
      <p class="small">This saves what you've done so far in a small file: the ${AE2 ? "papers you opened" : "information you chose"}, your highlights and colour codes, your answers and your group's decisions. Your own writing isn't included. Send the file to a teammate by email, a chat app or AirDrop. They open it with "Open a teammate's hand-over" at the bottom of their page.</p>
      <label class="small">Your first name, so your team knows whose work it is: <input type="text" id="hoName" maxlength="40" autocomplete="given-name"></label>
      <button type="button" class="btn" id="hoGo">Download hand-over file</button>
      <p id="hoDone" class="small ok" aria-live="polite"></p></div>`}</footer>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); });
  $("#reset").onclick = () => { $("#resetAsk").hidden = false; $("#reset").hidden = true; };
  const hoOut = $("#hoOut");
  if (hoOut) hoOut.onclick = () => { $("#hoPanel").hidden = !$("#hoPanel").hidden; if (!$("#hoPanel").hidden) $("#hoName").focus(); };
  const hoGo = $("#hoGo");
  if (hoGo) hoGo.onclick = () => {
    const name = $("#hoName").value.trim().slice(0, 40);
    const slug = (name || "teammate").normalize("NFD").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "teammate";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([handoverFile(name)], {type: "application/json"}));
    a.download = `handover-${S.id}-${slug}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#hoDone").textContent = "Look in your Downloads and send the file to a teammate. Your work is still here too. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app) and try again.";
  };
  $("#resetNo").onclick = () => { $("#resetAsk").hidden = true; $("#reset").hidden = false; };
  $("#resetYes").onclick = () => {
    try { sessionStorage.removeItem(STORE); } catch(e) {}
    st = fresh();
    pendingPick = {}; render(); window.scrollTo(0,0);
  };
  ({context:tabContext, firstlook:tabFirstLook, listening:EXAM ? tabExamListening : tabListening, inbox:tabInbox, reading:tabReading, decisions:tabDecisions, submit:tabSubmit})[st.tab]();
}

      <div class="dec"><h3>${esc(d.title)}</h3>
        ${["A","B","Unsure"].map(o => `<label class="opt"><input type="radio" name="fl_${d.id}" value="${o}" ${st.firstLook[d.id]===o?"checked":""}>

function listeningAnswers(){
  try { return S.lc ? JSON.parse(unscramble(S.lc, `${S.salt}|listening`)) : null; } catch(e) { return null; }
}
function tabListening(){
  const L = S.listening, key = listeningAnswers(), done = !!(st.mcqDone && key);
  const n = L.questions.length, right = done ? L.questions.filter((q,i) => st.mcq[i] === key[i]).length : 0;
  $("#main").innerHTML = `
    <p>Your teacher will play <b>${esc(L.name)}</b>. Answer while you listen${key ? ", then press <b>Check my answers</b>" : " — your teacher will go through the answers afterwards"}.</p>
    ${L.questions.map((q,i) => `<div class="mcq"><b>${i+1}. ${esc(q.q)}</b>
      ${Object.entries(q.options).map(([k,v]) => {
        const cls = !done ? "" : (k === key[i] ? "right" : (st.mcq[i] === k ? "wrong" : ""));
        return `<label class="${cls}"><input type="radio" name="mcq_${i}" value="${k}" ${st.mcq[i]===k?"checked":""} ${done?"disabled":""}><span>${k}: ${esc(v)}</span></label>`;
      }).join("")}
      ${done ? (st.mcq[i] === key[i] ? `<p class="res ok">✓ Correct</p>` : `<p class="res no">✗ ${st.mcq[i] ? "Not quite" : "No answer"} — the answer is ${key[i]}</p>`) : ""}</div>`).join("")}
    ${!key ? "" : done
      ? `<div class="score">You got ${right} of ${n} right.</div>`
      : `<p style="margin-top:18px"><button type="button" class="btn" id="checkL">Check my answers</button>
           <span class="muted small">You can't change your answers afterwards.</span></p><p id="checkMsg" class="small" aria-live="polite"></p>`}`;
  if (done) return;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("mcq_")) { st.mcq[e.target.name.split("_")[1]] = e.target.value; save(); } };
  const b = $("#checkL");
  if (b) b.onclick = () => {
    const missing = L.questions.map((q,i) => st.mcq[i] ? null : i+1).filter(Boolean);
    if (missing.length && !b.dataset.sure) {
      $("#checkMsg").textContent = `You haven't answered question${missing.length>1?"s":""} ${missing.join(", ")}. Press the button again to check anyway.`;
      b.dataset.sure = "1"; return;
    }
    st.mcqDone = true; save(); tabListening();
  };
}

/* ---------- exam questions (no answers in the page: the teacher tool marks them) ---------- */
const qItems = sec => ((EX && EX[sec] && EX[sec].parts) || []).flatMap(p => p.items.map(it => ({...it, part: p})));
const QN = {};   // question numbers run through each section, as on a paper (reading 1–n, listening 1–n)
["reading", "listening"].forEach(sec => qItems(sec).forEach((it, i) => { QN[it.id] = i + 1; }));
const answered = it => String((st.ans || {})[it.id] || "").trim() !== "";
function qCount(sec){ const a = qItems(sec); return `${a.filter(answered).length} of ${a.length} answered`; }
const initials = t => t.trim().split(/\s+/).map(w => w.charAt(0)).join("").toUpperCase();   // "Not given" -> "NG": no need to show the key
function qOptsHTML(it, opts){
  const v = (st.ans || {})[it.id] || "", ent = Object.entries(opts);
  const long = ent.length > 4 || ent.some(([, t]) => t.length > 60) && ent.length > 3;
  if (long) return `<select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">Choose…</option>${ent.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}. ${esc(t)}</option>`).join("")}</select>`;
  const short = ent.every(([, t]) => t.length <= 24);
  return `<div class="${short ? "row" : ""}">${ent.map(([k, t]) => `<label><input type="radio" name="q_${esc(it.id)}" data-q="${esc(it.id)}" value="${esc(k)}" ${v === k ? "checked" : ""}><span>${initials(t) === k.toUpperCase() ? "" : `<b>${esc(k)}</b> `}${esc(t)}</span></label>`).join("")}</div>`;
}
function qPartHTML(p){
  const num = it => QN[it.id];
  let body;
  if (p.type === "gap") {
    const opts = Object.entries(p.options);
    const sel = id => { const v = (st.ans || {})[id] || ""; return `<select data-q="${esc(id)}" aria-label="Question ${QN[id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`; };
    const ids = Object.fromEntries(p.items.map(it => [it.id.split(".").pop(), it.id]));   // [[2]] in the text = item R4.2
    body = `<div class="prose gaptext">${p.text.split("\n\n").map(par => `<p>${esc(par).replace(/\[\[(\d+)\]\]/g, (m, n) => ids[n] ? `<b>(${QN[ids[n]]})</b> ${sel(ids[n])}` : m)}</p>`).join("")}</div>
      <ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`;
  } else {
    body = p.items.map(it => `<div class="qitem"><span class="qq"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
      ${p.type === "short" ? `<input type="text" data-q="${esc(it.id)}" maxlength="80" autocomplete="off" spellcheck="false" value="${esc((st.ans || {})[it.id] || "")}" aria-label="Answer to question ${QN[it.id]}">`
        : qOptsHTML(it, p.type === "shared" ? p.options : (it.options || {}))}</div>`).join("");
  }
  return `<section class="qpart" id="qp_${esc(p.id)}"><h3>${esc(p.title)}</h3>${p.instructions ? `<p class="inst">${esc(p.instructions)}</p>` : ""}${body}</section>`;
}
function wireQuestions(sec){
  const upd = e => {
    const id = e.target.dataset && e.target.dataset.q;
    if (!id) return false;
    st.ans = st.ans || {}; st.ans[id] = e.target.value; save();
    const c = $("#qcount"); if (c) c.textContent = qCount(sec);
    return true;
  };
  $("#main").addEventListener("change", upd);
  $("#main").addEventListener("input", e => { if (e.target.type === "text") upd(e); });
}
function examMailHTML(c){

    <summary><span><span class="from">${esc(c.name)}</span>, <span class="muted">${esc(c.title)}</span><br><span class="subj">${esc(c.subject)}</span></span></summary>
    <div class="body"><div class="prose">${hlHTML(c.email, c.id, "email")}</div></div></details>`;
}

let pendingPick = {};   // cid -> offer id, chosen but not yet confirmed
function tabInbox(){
  const r = role();
  if (AE2) {
    $("#main").innerHTML = `
      ${colourCodeHTML()}${decStripHTML()}
      <p>Read your ${num(r.characters.length)} papers. Each one has <b>three drawers</b>: the data behind it, a counter text and another text like it. Open and close them whenever you like. As you read, <b>tap sentences</b> to highlight them and tag the part of the argument and the decision they matter for. Then tell ${pair() ? "your partner" : "your group"} what you found: they can't see your papers.</p>
      ${r.characters.map(c => sourceHTML(c)).join("")}
      <section class="nb"><h2 id="nbhead" tabindex="-1">Your highlights<span id="nbcount"></span></h2><p id="nblive" class="small muted" aria-live="polite"></p><div data-nb="inbox"></div></section>`;

    }));
    refreshNotebook();
    return;

  $("#main").innerHTML = `
    ${colourCodeHTML()}${decStripHTML()}

    ${r.characters.map(c => mailHTML(c)).join("")}
    <section class="nb"><h2 id="nbhead" tabindex="-1">Your highlights<span id="nbcount"></span></h2><p id="nblive" class="small muted" aria-live="polite"></p><div data-nb="inbox"></div></section>`;
  r.characters.forEach(c => wireMail(c));
  refreshNotebook();
}
function sourceHTML(c){   // ae2: a primary text with three drawers the student opens and closes freely
  const isOpen = o => !!(st.drawOpen || {})[c.id + "|" + o.id];
  return `<details class="mail paper" id="m_${c.id}" open>
    <summary><span><span class="ptitle">${esc(c.subject)}</span><br><span class="pauth">${esc(c.name)}</span> <span class="muted small">· ${esc(c.title)}</span></span></summary>
    <div class="body"><div class="prose">${hlHTML(c.email, c.id, "email")}</div>${c.citation ? `<p class="cite"><b>Reference:</b> ${esc(c.citation)}</p>` : ""}
      <div class="drawers">${c.offers.map(o => `<details class="drawer" data-c="${c.id}" data-o="${o.id}" ${isOpen(o) ? "open" : ""}><summary>${esc(o.title)}</summary>
        <div class="dbody"><div class="prose">${hlHTML(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`), c.id, "d" + o.id)}</div>
        <p class="cite"><b>Reference:</b> ${esc(o.citation)}</p></div></details>`).join("")}</div></div></details>`;
}
function callName(n){   // "Dr. Elena Whitfield" -> "Dr. Whitfield"; "Freja Lund" -> "Freja"
  const m = n.match(/^(Dr\.?|Prof\.?|Professor)\s+.*\s(\S+)$/);
  return m ? `${m[1]} ${m[2]}` : n.split(" ")[0];
}
function mailHTML(c){
  const chosen = st.choices[c.id];
  const open = !chosen;
  let offers;
  if (chosen) {
    const o = c.offers.find(x => x.id === chosen);
    offers = `<div class="offers done">
        <div class="opened"><p class="t">${esc(o.title)}</p><div class="prose">${hlHTML(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`), c.id, "opt")}</div></div>

  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `${EXAM ? "Your" : "Your group's"} answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${(AE2 ? (st.opened || {})[c.id] : st.choices[c.id]) || "-"}`).join(", ");   // ae2: the drawers opened, e.g. "ac"
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  // exam: every choice item in order ("-" = no answer), and the typed answers as one line of JSON
  const answers = EXAM ? [...qItems("reading"), ...qItems("listening")].filter(it => it.part.type !== "short")
                           .map(it => `${it.id}=${String((st.ans || {})[it.id] || "-").replace(/[^A-Za-z0-9]/g, "") || "-"}`).join(", ") : "";
  const shorts = EXAM ? JSON.stringify(Object.fromEntries([...qItems("reading"), ...qItems("listening")].filter(it => it.part.type === "short" && answered(it))
                           .map(it => [it.id, String(st.ans[it.id]).replace(/\s+/g, " ").trim().slice(0, 80)]))) : "";
  const parts = [S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""];
  const code = checkCode(EXAM ? [...parts, answers, shorts] : parts);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${EXAM ? "exam" : r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    ...(EXAM ? [`Answers: ${answers}`, `Short answers: ${shorts}`] : []),
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · ${EXAM ? "Exam" : "Role " + r.id + (r.dept ? " (" + r.dept + ")" : "")} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: EXAM ? (ai === "yes"
        ? "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers, your decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers and your decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.` : (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
</html>
