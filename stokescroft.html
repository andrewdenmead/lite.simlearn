<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Stokes Croft FC — The Sponsorship Decision — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examq{margin:0 0 18px}
.ptsbadge{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--pine);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.pn{display:inline-block;min-width:1.4em;color:var(--ink-2);font-family:var(--sans);font-size:.85rem}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

 each comes with its own conditions attached rather than simply being the safer or the more lucrative choice. Meanwhile, several of the club's own first-team players have strong objections to one of the two options, others see real problems with the other, and the supporters who part-own the club have their own view on what Stokes Croft FC should stand for as it edges closer to the top flight. A decision is needed within three weeks, before the new kit goes to print.","scar":{"label":"The Vantage Energy Collapse","text":"Two seasons ago, energy company Vantage signed a three-year shirt deal, then went into administration eight months in, leaving the club with unsold kit stock and a debt of nearly £950,000 that the club is still paying off. Since then, the board has been wary of any sponsor whose financial position or public reputation could change quickly."},"proof":{"label":"The 2019 Supporters' Buyout","text":"When the club's previous private owner tried to sell the ground for redevelopment while Stokes Croft were fighting relegation from League One, supporters raised £3.1 million in nine weeks through a community share scheme and became the club's largest shareholder. It's widely seen as the turning point behind the club's rise towards the Championship's top end."},"constraint":"The new shirt design must go to the printer within three weeks, in time for the run-in at the end of the season, and both interested sponsors have said they need an answer before then."},"listening":{"name":"The Croft Podcast","questions":[{"q":"Roughly how much is an average Championship shirt deal worth now?","options":{"A":"Two million pounds","B":"Half a million","C":"Ten million pounds"}},{"q":"How many Championship clubs currently have a betting sponsor on the shirt front?","options":{"A":"Twenty clubs","B":"Two clubs","C":"Seven clubs"}},{"q":"Why are betting companies competing harder for Championship deals?","options":{"A":"Championship rules changed","B":"Fewer Premier League shirts available","C":"Ticket prices fell"}},{"q":"How many current Championship shirt sponsors are Chinese-owned?","options":{"A":"None","B":"At least four","C":"Over fifteen"}},{"q":"How long ago was DragonBet's parent company founded?","options":{"A":"Eight years ago","B":"Thirty years ago","C":"Last year"}},{"q":"Roughly how many people does Meridian employ in Bristol?","options":{"A":"Four hundred","B":"Forty thousand","C":"Four thousand"}},{"q":"How much of Meridian's group revenue came from its opioid division at its peak?","options":{"A":"Under two percent","B":"About twenty percent","C":"Around fifty percent"}},{"q":"Roughly how much of matchday revenue comes from corporate hospitality?","options":{"A":"About a half","B":"Nearly a fifth","C":"Almost none"}},{"q":"Which does the podcast name as part of the Premier League's stadium standards?","options":{"A":"A retractable roof","B":"An artificial pitch","C":"Floodlights and broadcasting facilities"}},{"q":"How much extra value can player-generated content add to a shirt deal?","options":{"A":"About five percent","B":"Over eighty percent","C":"Thirty percent"}}]},"roles":[{"id":"A","label":"Role A","dept":"Commercial & Partnerships","characters":[{"id":"priya","name":"Priya Chatterjee","title":"Commercial Director","subject":"Two identical offers, two very different conditions","email":"Hi team,\n\nAhead of Thursday's board meeting, here's where the shirt sponsorship stands. DragonBet and Meridian Pharma have both come back with exactly the same headline offer: £2,000,000 a season. There is no financial reason to prefer one over the other — this is genuinely a decision about what kind of partner we want, not which one pays more.\n\nThe conditions attached are very different, though. DragonBet wants regular, ongoing content from first-team players for their Chinese social media channels — think short videos and appearances, on top of matchday football. Meridian wants extensive hospitality access instead: complimentary places at every home game for their staff and clients.\n\nI'm also aware some players have real concerns about DragonBet specifically, on religious grounds, and I understand there's a separate conversation about Meridian's history that some people feel strongly about too.\n\nWhat I can't tell you is how firm the players' objection really is. That's for the dressing room to say, not me. I can tell you one more thing before you decide. Choose carefully.\n\nPriya","offers":[{"id":"o1","title":"What I'd show the board","text":"PrkGxsAndp0HpTaYFVkjW/BLfeVGZG7p0lypVdiu9eRA1AJVYRIhsqEn+26qoRuvTJCziH5vp+29Uo66qaEdFXTT6SD8gzjOIGpKUHDqjmT2I5aTjYHfmx4vgFxvRzLpvzyq9MGKZWsjuNcE5jfY35kYrwo5/lV21cqZpkl+yZZBjdsMdebxa2iaqDMCu1dU7LU3xuADK1GA3txFdOLu263p+HCWLvbXQf9SHAqbTeCf7G/D2OpoDqOU9035qTkdR5Bl1WKlxSemERYsEUryTY7Dlt2wXbt3vYRis/mKWmZ8FWBj8e6KYkeY7qKpZ2jRuCFUTLCW4OZ5LF7QTH9+oKBNQ0TF744ivS8uUfYyTjDOcr88f6n+ORG3qAdSAT2BBE82CtIP5ZE8"},{"id":"o2","title":"Weighing the two offers side by side","text":"hLS32rz/yVolwanUakj+obotB4NaE7B+AinrKg9SdswXTea/EFPj2cKaGekrd0zmuubFhPD0by9FzGyH8885sUnRZBw5REJ/X0iiwB/xkgt0Me40LI41+CdU7c2hWzxdvELN76x4UKCxipR/1Y1MnOENf/orM0hJt09LWi8/+SdJt2FQ30jDRoNRkbzxIfHuHD8fo0T5U9D1upJPULjyjYzxmXXO3E9hbzWVzUou94m766QFX32bUaFd20g8+Sx1y0v7cP8482/O7nWEUZxvSFlQjmFOfpwM7XFMu5go+4QDJgpkxP+59AcZ0V8kFkvxxCOMxodyx/Kj2IfrlnWBQ+t7zKNOCR1waxNTEaqTWFZ0++0GI4k9xmVC4e9qKo6KNCcPSBxpox5Hv5Nul1BXJCDrqomNN9yHsI2cUyVvqL02n+tGjpOXNdBZdFspQ4+YPyk="},{"id":"o3","title":"How shirt deals are agreed","text":"yh1DMo/D3sikC90aqIWDDP7aVXnMKLhrTn1LPYFpo+yXpecbA2/Fz/481DiLXZRce6IRbcrKYeAp2lZmkGI7/x7pZpJ6ex16P39YjxOLie8xaiyYNDuLBsn/0CTZQpYG4Aj4kbuJWly7oIwk9NrLjqh7kOBuWLteGpiDSDtHLLo4EuysvDc2h71qjZpHnjlT4aAgUpfr3cxHI9MkaC7aB8RCx0k/yxoQ05yVbDelUQWbE2L9N7GHPX8hzGiBwF23BqAZ9/VqPgrII1Mi8xyAnSdutbxddtHreGZ+q6ZN97Fv2mCozwlryXR8uuJo2SamIjN75WU8t/BV6BJWrd5J5DN9csjBh4DNnxpsyH6fukI7E9IJJeZUK1Hlmd2IAG96d7iln8Sakq1ncMhUpvSGh1tjAkMWk4cWOpEIItX316sFMNQ+dA=="}]},{"id":"marcus","name":"Marcus Webb","title":"Head of European Partnerships, DragonBet","subject":"Just need a decision before the window closes","email":"Hi,\n\nGreat to be talking. I wanted to be upfront about what we're actually asking for, because I know clubs sometimes underestimate this part of the deal. Alongside the usual shirt branding, we'd need at least two new short-form videos a week featuring first-team players for our Chinese-language channels, plus four in-person appearances across the season — training ground content, matchday interviews, that kind of thing. It's a serious commitment, but it's also exactly why the number is where it is.\n\nI do need an answer within two weeks. I'll be honest — Kingswood Athletic have already asked what it would take to sign with us instead if Stokes Croft passes, and I'd rather do this deal with you than with them.\n\nWhat I can't judge from here is whether your squad can really manage that filming schedule during a promotion run-in. That's your coach's call. I can tell you one more thing before you decide. Choose carefully.\n\nMarcus","offers":[{"id":"o1","title":"A smaller package we could live with","text":"RO6E1QshfY4bEVf4IoZ7WuVsmitAVTIkBFkW85NPIzfWbvJ5AKu0jk+Cx/OF3PJk/VQXnqOqNunw8jiGdLHaH8Mvgn6HDD2biGFTa31dF7vNc/Uz43vydu8PsDGoZ013cRXXJScYHGleiayrbKDC1qZVEz8cPpGo4LU2aRhLpe/KRsRLYCQdrHWTZNn7RO/1cU2V4PPF89lB1AkWGeMCiy2R1YM2nVZQ+PY9lRHSN2KF7j5A9nZOTClfjxkjgOKQ+thgOcsDe9RzInUUar/rqsKIWPYoxvl6Uj3GF9T6I1d8s/688y+NwnM8CldBWXjeEXrRhhHEEziLN9/dzsyhVg=="},{"id":"o2","title":"Why Kingswood is interested in us","text":"SeZwesKkhOUtttIQPINkK4fMwvo/2gy5iSby6qesIlNvzdEZFd1CAns0vRwQQajic5+09QbNwUD205WLmvg/2H7ksZLfvAHPNqJ6CrG7gA0ml05agCvFGwnIXqcIiLV0XCk+XxjYV6pyGwKtfj+SbxYqkLoVn3HBvxIOQ4Y7AlRfH2lq50qMdr4O2VUyNc231IIQ62X3DCmw04j6fOj9lXCT4uN2joU0wl3+RboUTkhp0mLMzJ8pVlh7RQYq6H0299NO5NnmJpPRlrxfhsi+S0SSUinH50SqAD2f7b7D+ykOyNHH3NcDIgv6tSTmHjbqFvez4eHJ3H3B4sPRS2TKqJIfW/4h5B921sup9S4HYTUeYFQHNfT3d5/9"},{"id":"o3","title":"Who watches our channels","text":"dVNLKRq30HwDm1b8frctn4UtBh ions team. I can tell you one more thing before you decide. Choose carefully.\n\nYusuf","offers":[{"id":"o1","title":"What Idris, Malik and I told the club","text":"GQwOHgkg8hFCvqk7q1MQTvdg7YigkUDAnOE6SG0TpZ8odKuLxMmQMmTQ2XbpXsBmTr47PU7UozlWP2+Yy4dVJZfmA0tRpxc/MiBMF1yk3yzEg2i7E0nxsmIVkfxWY1J5ZzLrzjZe68YXi5lXIrN8AwcrAFsdERRP1BAvYbQ9ZLVhSLe8vOI6OoutYyPsXW8Y989SvYl+PAXQBxxJ2DurzjrlIxzRFsSD1ERV/S7hVjuLapm+BpIcs7GejygZA9gcYj9CemFuGKwX8pYDNpa9r7Jn+ZPrh7zOE5L9YoUdonSPwipUAooMAAyOUm9c+ya5NG163h7aWU8yTZReEP0MpOsQc16Un6LaCDqrSKYx2pfLGquhr9ef"},{"id":"o2","title":"Captaining a promotion push","text":"wMNhXE4/qZSf/rHZlnue0eN9ocZbIy2BYsa9lAs4NeXl2vwH3g2HlltecKeNNknjXeykpm8uV5LscIXXYQWOfQmU6IDKiN59SOI9bQPLNuZECktLL323SxAXr3hik2UamvsBvcOVivfHPqrZTxIqS7h2qUTAToOzmXzJGS0rR5hS2kNAbOimpR5YC3I0n0B//sgEc6hBRuW2ri/8U7txJ+dPDjwNgD0ApT780uyUIr2SDkTkNpRrLK1xSj1J4uWWVZ+NkLFAYzYJBMY3ZX/vnfFRDBr2jfAIDCL7O//iflsd7rcGZjoivMVEQXscJAvODjd+vR+TWj0j+YB4rxSOYvCyV6LKsBU="},{"id":"o3","title":"Players' time with sponsors","text":"FhTljjNZTlGKOK649+XD7U50ygRq0q574VO5FDbbfvZ3pPgdNL3NwZGER2P4oMcGwepYRnK1cVf8gVUzewfagrA85f1DUdJgM9ac1MGQ7mImemmTGUI+JBdj1Ii2r0FVhj35hK0+X0bvxqql1Xl63NHGY8AqUEWhaYA+3YLhBnHUM4P27AHtTYJA5xIJzgFu4aH90dF7TTfp/X+pFF9j6myaMq+EPIXdPcL8UHvSNRxA9xEJwt+cyMKqoDWYhSlXl26BBj1ori22Rer9VZhqhcBR58ADHq7J7jJ+DbBjpPaHVYEP4Z0o9lJ/ldxbeOI90mhcH9MDP5b7EMkOlJ01/MtVoL4qiRq9zrha3nVGtO6o06Wa4QmEqBVZHg=="}]},{"id":"danny","name":"Danny Reyes","title":"Head Coach","subject":"My honest concern, from a football point of view","email":"Hi,\n\nFrom a purely football point of view, here's my honest concern. We're currently sixth, right in the promotion mix, and the squad is thin enough that losing three first-team players — including the captain — at this stage would very likely end our promotion push. That's not a threat; it's just the reality of our squad depth.\n\nI'm also worried about the practical side of the DragonBet proposal. Two videos a week plus regular appearances is a real time commitment during a congested run-in, and recovery time matters more than people outside the game realise at this level.\n\nFor what it's worth, the dressing room is split. Some of the lads think this is a symbolic objection that shouldn't cost the club money it clearly needs; others fully back Yusuf and the others. I'm not going to pretend that's a comfortable atmosphere to manage right now.\n\nWhat I can't tell you is how serious the club's finances really are. That's Tom's area. I can tell you one more thing before you decide. Choose carefully.\n\nDanny","offers":[{"id":"o1","title":"The fixtures left","text":"IthQwsc3t/sx1xZat1Z6XoOLRRtVVmf02nLHUju9Xebsuo4RnZDtMVOEYcxfFB4TLrRilUeK0MvnulbNMEvgLS5WsVTO9lCNwPOPbrjNf4gDrp/Cn0j8RtHqjqhyYLvwOo5g9lHamqcd3/FipZMLib4BcSnjznbGlF5yYdbuNIy6lXaAoR/8B/tPfbsXtCsUyEZEiavt0WfufrcCFftJY9oPvs05MvopIYFg9Dza5DZayG2dqHLM49NT+J+tT5iitPGxi5QwXzKV11MhVk7sk/13FUtcbEpDFlSk2s9yGEY58P1FsFTZIZDCpR7eGXQ1dDQ2Yah8hvabNn5ytTcaL+NExBuRPZaGKh6wqgYGk3rw/K7fUHc8hqrFlTOWfi6hDORjB5r1oA9epJ9HSjTm3xubc7Q="},{"id":"o2","title":"The money we need, and the squad we keep","text":"K7TP2u2yhoRUKQ+IdIEiqwEeQwOfcMpSi+hO5k5yVtumxw9I2wYMB+3vQs4HPVX8isi9LJpraXRiWZw0ac/xZmWb1C1N7d0uQTjjbLy9FLyEl0Ayc4tgnyZhETC6NTQWGfu0L2AO8B3Uy61n1y9wY4cmPIcLol51wDHB1SG15K89gcJCEbcR9jx7Z2Z1Tz8NPwS808RpsQxbsboCIywIodB9BOAlCcRzwzXaQcJxezBPt2lKiVHAifD4x+X7ArkITauDmpbk7iMGR1uVfeYzG1JtWxZiMJZZAbKUCyhmiRSALnboRaHRHYg1AZ/uNQ2biPsACw=="},{"id":"o3","title":"How the dressing room is split","text":"5BICUaLC3taYMDOI3JBJlWOl7BnDAAoHjLn3Ai2AqcFEXSPZr3Sqt7pbgxsbhHVK7XkB9qSe2BtcUB4IojhsFEmjNWZyqPoI14pABy3HizlXb9wP+W7cBgjfZwsP124Pk2nuezqDzbe7zw5t7wSvx2VGoVFic+vdQiU+KVFbXzVtOSPiwTkpJGxSTTth+9rv0sbpwvl9b6P7clH24Q+p+Fm9j3kRjuD5oumoroVF6N40KpBl9tByfbpBE/2lIJ0WpcWsXVXIiuot7Izlz2kOsgtjaBR2t3a62MmvI3FYDpSUqTua3AFsgImZdpcPkMK0zENuo/QkGpcg2J6ayMI6/T8QMS/vh1vWP6+F"}]},{"id":"connor","name":"Connor Fitzgerald","title":"Vice-Captain","subject":"My honest two cents, for what it's worth","email":"Hi,\n\nThought I'd give you my honest take, for what it's worth. I don't share the religious objection some of the lads have to DragonBet — that's their call, and I respect it completely — but I'll admit the filming schedule worries me more than people might expect. Two videos a week is a lot on top of matches and training, especially with how tight this promotion race is looking.\n\nOn the Meridian side, I genuinely don't know enough about the pharmaceutical stuff to have a strong opinion, though a couple of the lads have said it bothers them more than they expected once they heard the details.\n\nMostly I just want whatever gets decided, decided quickly, so we can focus on football. What I don't know is whether the Supporters' Trust could really block a deal. I can tell you one more thing before you decide. Choose carefully.\n\nConnor","offers":[{"id":"o1","title":"Keeping a way out","text":"3kes45N3AMGjRQRIgSf1Lysdh7hbfCWPtYOTBZO69aYc3zXgFSDK0r6x6gvjs4vfguICq+j2ea/1ZAps3DkQBk9Zpwp1j5V9x9Gv/DdYrjCl6PJTNtdNwpmfQhZjR+VKbw3EZB9agj/muJhpx2SeT18Rjx0HM9M0FSssR5g79K5O6+Z0+DlrSQxyF5jbbfklSLudZcYBu1Yske50pv+V4jQ5oL8eZUUuiPrnrGCXvG4B4jZ+3MKb4+kkzFjXq/lCyiFUHiLrmk53+bFNm5FHuIphRbd7yoVtk5ddTjXNRhcQAwD976MFE/k8SEWsqzNTWIBEv19mDFrbLDeGuBHI9h7X8TAy4+wXRlBOc7kmBnjwkPZ/hvvL"},{"id":"o2","title":"What two videos a week would mean","text":"DfkHuODmQkl57iQHq4ehrdUepAmz9hxOzFfjqS20AF1Vesr3tO/0ZjqDLPAax/n7okL5BT8oTrKSF+jLhmmd9rzke8TGMzJ5kJVuZN+z9OwPH6FDEXGFxDyTugwW5iGYpm+JUBzPgUOVKO2EUblmQO7pNpRYxGsuOc2b48PHR5S+NdJG3LaxoYUBOX4Dhq7qOgc84ZNaWff2vGi5bS7YqCRF6cY3udGRhq9sMtFfcKpQaCe6D+v4Rz5U4yW7JIdVpOWhoYYBzfEf5LptG5TIbjhTHN9oazNR2u4rMq7ViPOTOj78EjaYjkTzA2hDe2a/YlOYxrCxIRPMph0NaJbRIEN79VKlf2s="},{"id":"o3","title":"The dressing room","text":"N4Re8iktnnHVaIM7dmT7vZJRa4XMLWNionCzrnmQfWrUEGqxv6tvCpiRcTkH9+VFLP1EOMfSVpHT6frEZGnVI2Ef3L8685439goauXg2qe/hiM2E83+GlWC1Hi3fBDccjQL+PeRN70SGTFl/M7UQSLkLFaF++iFudk6qhXdDYToune3DSzQb0Pocsclr8PdaDNEw8Lp7BtnHj3b/TVUUByiG3ewR85TnLN7aByilfVD/dLO/+xEK8tbS0V7BLMgL75D9ffzGHZFN3tw69elwBPZxuh1spnkdRDSU8knf7Q1cA5pL9moAO/Qb6J3bM1rFe4KMyG8JP9Rh0aXD4w2BDhEAbFI="}]}]},{"id":"C","label":"Role C","dept":"Communications & Board","characters":[{"id":"aisha","name":"Aisha Bello","title":"Head of Communications","subject":"What the fans are actually saying","email":"Hi,\n\nWanted to share what our supporter survey actually found, since I think it changes the picture a bit. Fifty-eight percent of respondents said they'd be uncomfortable with any betting sponsor on the shirt — that's before anyone even mentions the players' objection. Separately, when we described Meridian's history honestly, forty-four percent said they were uncomfortable with that too, and a lot of people told us they simply hadn't known about it before.\n\nSo to be blunt: neither option is a clean story for us, communications-wise. Whatever we choose, there'll be a section of our fanbase that isn't happy, and after the Vantage collapse, people are already a bit wary of big sponsor promises in general.\n\nWhat I don't know yet is exactly what DragonBet expects from the players week to week: not the headline pitch, the actual detail. I can tell you one more thing before you decide. Choose carefully.\n\nAisha","offers":[{"id":"o1","title":"How we announce a new sponsor","text":"eSMMATdAR+QoP8T+rWuOM9fnrQZBQ6jVZIheFkAluzO416zz1cjXfqL6O7f2rRFGnQObknktTlDwIY097zX/OuF22f/J7TeanjHs8/0fTkRpBpWCIx24ODVHRbaeNA4m4oaDG/A6bioj3Xvcn/1AMAz93Zc38ZYEkwevVoQuE2ho322RsJcbZDWNhSnK+oaCx/JF736wVWZYP7zFDzGsP2wEKbu/eqiCIsuRmex/FOQPuPNH+Onp27MiTXQKvu28oq55WbzG/yIkgbOcebE3QUG/hlbtKaxiYkEX2teSsiI5qkrS3A7RHNRX+E2pe7+MpAp/ru6lkZDDHeo/9ZA2jA1dp6POr3Nzow=="},{"id":"o2","title":"The full survey","text":"JWPun0tL7pkWZIn5NvcUZoMj7fG1796GbhFlLzq95qrjfSNBy5UruJVLUBInEI6oZ7PCsPvMA+40bnuIT/OQRT5ndoP8r/qTWk9RYomu8hBrLaqcabfP44sOAYKKDJyDzJQn1VAdfomEOUkcb9qASpQM+YKITZ6ym9H/sSQXeAuD2hp6tjFdBueF0w3DX5NKsEsdvmjQ/w+S1BhHlOZzHPwmhpvNt2AhBkuzeyuHLq6P6aU1Q2y/V88VfORiSA+Ra6pEpRKqnbupaqMCWrWKSXTPT6LoGV0ESjVvu4g2bzr47WOatQK5d5QXcguaf3Yv3axkUX2k+SqzV0HJ6O4O538gqwp7Xr0LNixKNKOCFWcWHs+Kg7Gm/EEgKYTsBiDug4otBBxWCqtoLCJrmRZsvZa23B5KoSPVjvL56BT5aHHSBHE7vFxf7yLvs8LtUJcNm6Q95xBAldEUHwqQjFlhZ5TYBpPYtYCDYhCVH2E/CApGiia+OS8QjBcoXCR3rxbAJjbn7RDqQw=="},{"id":"o3","title":"Public limits","text":"87cWOMqWd0C8jfoI7hvuvdgoOnmhHRgNFxIqbxprewuiqvvIUenh6j1dBjm6rTa08vdbmDmQckqNRPvUciPF0n491vR9bdamjO9EGEYXmWi7e7bJzjUl4paI3Uec+a/heJpSQ8qeTnnpMXSSN6m8z+b42LKy/yjVogtMd17WRi6L2EVKvPD2dOqmMPaIW1mdAW7xLGKkiKd03Sz6vSVWrmLYtDELr/+gHUBFXEs7hCljyXr6KHqUot73/92h+eCLfROueLNwDcWcrSLdqP1PplNdUvFee1JDnl7EOPd2olqV/B/mSmYhp4Z5e8z9L2prvYGj6yR5GH45W2+HTHSwliOFmjcKDjvj8L71KVcoopnc3z+8KSiw1MoMV+gxE1E28tHQqLmsbcd/mr4Ylg=="}]},{"id":"tom","name":"Tom Whitfield","title":"Finance Director","subject":"The numbers behind all of this","email":"Hi,\n\nSince the headline figures from DragonBet and Meridian are now identical, I want to flag something people might be missing: the real financial difference between these two deals isn't the £2,000,000 — it's the cost of what each one asks for in return.\n\nFor context, we need a minimum of £3,500,000 this season just to cover the wage bill and the stadium redevelopment work required to meet Premier League standards if we go up — and we're still paying off roughly £950,000 left over from the Vantage collapse. Every pound matters right now.\n\nMeridian's hospitality demand isn't free to us even though no cash changes hands — those are seats we could otherwise sell. DragonBet's filming requirements would likely mean additional production and staff costs on our side too, though I haven't priced that properly yet.\n\nWhat I can't put a number on yet is exactly what Meridian's hospitality demand involves. I can tell you one more thing before you decide. Choose carefully.\n\nTom","offers":[{"id":"o1","title":"What the hospitality really costs","text":"o+xhmnjzVyQObUKV7Ng4OYK5k0pwcmXRMPQ2hy5vreng8SeLDldEG2IAqFj3QKttd4XZFP8+Vk0ZyD2s8I578aFNcvCk6VKZHQ110lp2+giCH5yv8WIDR0eER0yuZuvhyPRtzFk0ZlqWxSGWnEeWWAP6HKFRJarwt0r4fg+GBaezxDrVMKWWCs7xQTAK6ujandAv1dcAY2vRhWhUQWQA3sh9sqhENlTYHNCMgC6kcL6TIvYQiQG/MQOuao2Htb62yXAJ2RYxA/V9cWrFxZi4JGwyepN8A8wpxkcgR1+EJZiHTZ5eAXOteDHuSzFHTiq8wBia3C16oCjoGqOX8ux7d3i5dC89dpsFgyhLtIfb8Gq5NFUMRpYa5VCwAzU="},{"id":"o2","title":"Where the £3.5 million goes","text":"T5K246PXuMLudFzFYVv8y6NI8h/OjdgTGFUyYNd2qGwDcoVQ4K3HXVlxzS5Q9ijgZCQTymy82/odrCs0FXPvmSSSsoAXmpdywcOO8GO5sTMvC1zXRfOngbQjaJFUcZt1tdyfdLrz4snUrI6xpUvNzFxfJHV7n26L2PujS3nwsM00oOzhSZ5Irk7ySSWOWJAy4zbLodjsE+JaJfimNG8on3iBEocmAjfdXPYOpYwnWMAIfcf8+fVtceQIHJxg74kvDM4Fk08yDkIf0sF7gxIL2pbuvEJBGxUgOmZY8WnqbvMiwSeuNEz3I+bE3LEk1D4gWkT3/JUO5UckxMPGs+SEU/hV6poLU/tmnNq/JSpOFMuw"},{"id":"o3","title":"Paying off the Vantage debt slowly","text":"b5rTXcMDlkSr+302LDHqZdxm3tumR5VWUurdNfYKIHI3YkDxcwL79DEMj7s6eZr4K4ZpQGcy87V3m86cBGn1NR9tVycPGmO5q7AAgpzMfE3stSD0Fs+dgT4tLKhdQqnFOpg9C+gATnLrPqMvBZaJXAxP8T3LFtOrSJvhKONMF1Li9XRBk1BD9MUvspwH+VjdfFCKUTVy9K6ZYCf87qG//IFTD3O5TjlSbBD9PTjp5BMcWKMU4S6MVy06le1dnVXuBDFn8cBQyzqlTFFl9Ae+xkjKh7A07gJOYARE/ZkhJ0GjdTfSR0eawaE7l5aGfGoC2DRmo1nf7iDIt9dOM6oE62VhYZV5VnLm847S55O24w=="}]},{"id":"grace","name":"Grace Adeyemi","title":"Chair, Stokes Croft Supporters' Trust","subject":"Why the Trust has a real say in this","email":"Hi,\n\nI don't think everyone outside the boardroom realises quite how much say the Trust actually has here, so let me be clear: we own twenty-seven percent of this club, and under the club's constitution, any sponsorship deal above a certain value needs our board's approval before it can go ahead. This isn't ceremonial.\n\nGiven that, I want to get this right. Our board is genuinely split. Some members feel that since the money's identical either way, we should back whichever option the players themselves are comfortable with. Others are strongly against Meridian too, once they learned about the opioid history, regardless of what the players think. It's worth remembering what our supporters achieved in 2019 — £3.1 million raised in nine weeks to save this club. People here don't just watch football — they own it, and they expect a say.\n\nWhat I can't judge yet is how firm the players' position really is, and our board will want to know. I can tell you one more thing before you decide. Choose carefully.\n\nGrace","offers":[{"id":"o1","title":"Our constitution","text":"/Jc+vTb+qJa2U8ZYSomJteQkAK0MII9fKryclkYlwYDE834lgYhI/m0W0tQbE3nQtOcKT/EoRgEb010J3p9XLvNIMGGQxmUIHLWl8ydJcSs4fIFjE4R4Sumi68xN2jERVYxyQWr25KY4FJojdi86XOr7jpz+ypZQj4elU1ekgElu+AZyh6Frnq6h5G5KbLFzy2Nc9+WF/7Vs0Fl5Go7qTes9gtL04Xq9f2Fd1XXPz7VUd/pNNIG52B0EV3pPCUUd3aq3/hjCjRa4/VMtc/I6JOoWItFb7nZ5VfuoOnLBzsvjJNqffHNcsjoDLmt0WKk+Lb7kU6wzdjAB2yO95dgch/WNpwQyxdkJdDW0sy1MZ1KvNTt9iKOUUTemGQ4aJrBjUA=="},{"id":"o2","title":"How our board would vote","text":"18oJCd95PRfc/3of8y0LiZ1EG8mJ0MYiOlz0YV+D5F9dgAr3YCvvIUGzJW09Tywjr+qX6GbofcsxXcCtDyb6MTK82Xx8x9cxQ3IhwDvCzQSRUYC6FzZyWJZ+NfME3owhYRkQFDeqwQrj2wK6JTkOrKRdohPnnV02+GAlf1pxKZdq4IKv5Q/Hw+I4qp4IgKHjZ5vSXSbQMWfAKRE5vcJfTXkOr8Mm4h3LhtM0fKH3pWKlE6zrl9G17+MXe+VFL1QiRLpl2vGqNra1wwClicLx+UcDbWkP3I1vxnhSGtO2mS9D1B5g5uB5ZoQ3KHjMuQSU8F1CwuNbvxrr4S93mlWTVNZL4llQDusjcmJFrrKjM9zt0KeGzQnBAVCqtEDv3WEc0Xe1k8VuaGgX9vUUmk4="},{"id":"o3","title":"How the 2019 buyout happened","text":"a6BRXTqbIYl1LXYn+nCVh0xnoNoBiTlIMQUTQXmWh/bhYzym6JKfIitwJBfSR/KutMaYKUC3+LvY8qvaEY6obr99eHUBu93zkNRgg9x/eDXXmjyi2YMTionXGBhqfDJvq+M4sLzW0cxe3WLTOehG523MANoNJ7542bZj5pBQceV2IFrLGdwL54h6WuhNhbs0dnTOM4788RzjuKT/mehTiwemuE8/QCfVC2Nhkc2EtPGW8bKRmYjBqw0wM+kELxlN66eI/yA3Ix7KQeZSMs2uLIXu6UBdlMxE84L7ER+qW3X+YgkZnJU8jNtNiLGcjNWW1dgLh8Wa+PF+GUqaRZc9Hr5qgFqL9RRwt1n4lIpzUSO1EECsh/YTDPmoNt6fJznJI5GseXYUBRAqgQ=="}]}]}],"decisions":[{"id":"D1","title":"Decision 1 — Shirt Sponsor","A":"Sign with DragonBet, a fast-growing Chinese sports-betting operator keen to reach fans in China, on a deal worth exactly the same as Meridian's offer — a partnership several first-team players say they cannot accept on religious grounds.","B":"Sign with Meridian Pharma, a major regional employer, on a deal worth exactly the same as DragonBet's offer — a company whose portfolio has included prescription opioid painkillers, which some see as a serious ethical problem and others as a minor part of a much bigger business.","short":{"A":"DragonBet","B":"Meridian Pharma"}},{"id":"D2","title":"Decision 2 — Contract Length","A":"Sign a three-year fixed contract, giving both sides long-term certainty and locking in the full value of the deal, regardless of how the season — or public opinion — unfolds.","B":"Sign a three-year contract with a mutual break clause after the first full season, giving both sides the chance to walk away then, in exchange for a less secure long-term commitment from the sponsor.","short":{"A":"Three years, fixed","B":"Three years, break clause"}},{"id":"D3","title":"Decision 3 — Sponsor Access & Activation","A":"Negotiate a capped activation package with clear limits on player time and hospitality access, protecting the squad's focus on the promotion push and controlling costs, in exchange for a less enthusiastic sponsor and a weaker position at renewal.","B":"Agree to the sponsor's full activation package — regular player time for promotional content, or hospitality access, whichever the chosen sponsor is asking for — maximising the value of the partnership and strengthening the club's position when the deal is renewed.","short":{"A":"Capped package","B":"Full package"}}],"newsflash":"17S1JHt3BtI1EtPYczJlxX/gySaj1E5vIoqlXPdvIggRp/NMNCe4kThJpWZd8X07tmlBa5ND8TeA6SJauEybw0AxZM2FKVO65P+DjSi+BRipwhr5/pX0T9jk24BBNITimuJ05mWHVNJnrzMy5XbuFyhfnu0odLhZEfdQnTwbo+H9vkGKIrD8KW8Dt2KuoLQH+eu0kZzUC5lpDrSbYMXool2JZaAQWay6TF+pd8oFyubRYlpgCcWHmXyEoK523MzbdvQqgMmlHsTlCY2OMPE0lZoGATskJxU9eQfIZRDrQKqGq+WfWcCz8BbkNOWlGhsCmB26Bp2ez9guMOj/Ws8F/Faw8y1kMPhH0QYatif6PwDA3npjRits7S/LP3qc6MbqBl1wSeKl0Cs9NhC/gmUIhEJg4rjS5607HinbrwwsNdNFG//1viq8OMBr30oJ9S/oyR/GjwvhiYLVnNg9nYNCQsTB6Q4dfawZx4KQgG6cbdfpivaAHpt9Q+sHq2UAgHxLAv/H8XlX7pNEM/4U3i0wo1ulAuYPi3l0US8paB1ovXP5WSUMlKFlUakQgstioq+f+na8Mnbm4NNwzysU+986IOdqDhEpTCAAr7Xbtwpziyi2WXSFqUhHm/SB0CzoAVKlt1YHcPEMhcBO6czK5AcClWMr7j6UsOKOyS90jReP+cj/nZMZu+hrinp+MBHwuNPy7mAUvcqZrdZXSIlbA9w5qC5blcV++zoErVQKAbPdk9F3LEEikO192XQdlEO686F7TO+9jZG/MklfLMySNdgOOl1FMP8fpYjOtxtafzqPXrBol1uZOBzsFOT+n/4v29aVbGFNIecUdIKLf7sM0Hct86wAZpt+WVJUoz5+d/FvjVcMq/Zf9rZ7VC0xU0SfjKKzFE/V8C0w7hsDNR3jrPhjWOqt7vIdvwIYp9VXhkko7i39PTpmXQAVEIs/WNsN7K1q0wZCoelMeJIfjeZPPf4+HXXPJnFPkxRiE/IjvfyUmGZ55UBrydT3bLSUXNXXzp+Jlg==","writing":{"type":"recommendation","label":"recommendation memo","addressee":"The Stokes Croft FC Board of Directors","words":350,"instructions":["State a clear recommendation on each decision, and explain why","Use what you learned from your contacts and your teammates, including the numbers","Acknowledge the strongest objection and answer it","Write for a board that must answer both sponsors within three weeks, and whose deal needs the Supporters' Trust's approval"]},"two_player":{"roles":[{"id":"P1","label":"Player 1","dept":"","characters":["priya","elena","danny","aisha","grace"]},{"id":"P2","label":"Player 2","dept":"","characters":["marcus","yusuf","connor","tom"]}]},"teacher_url":"https://teacher.lite.simlearn.online/","rubric":[{"name":"Task and reader","aim":"Give a clear answer to the brief, written for your reader.","look_for":["Your recommendation is clear early on, so the reader knows what you want them to decide or do","You cover every point in the instructions","You write for the named reader: what they already know, what they need from you, and a format and tone that suit them","You keep close to the word count"]},{"name":"Using the information","aim":"Choose, combine and report the information that decides the question.","look_for":["You pick the facts, figures and deadlines that matter most for the decision, not just the first ones you read","You combine what different people told you (your contacts, your teammates and any podcast or news) and show how it fits together","You report it accurately, in your own words, and say who it comes from (\"As the finance director points out, …\")","You explain what the information means for the decision, not just what it says"]},{"name":"Building the argument","aim":"Make a convincing case: reasons, evidence and consequences, with the other side answered.","look_for":["Each main point has a reason, the evidence behind it and what follows from it (point, evidence, so what)","You show your priorities: what matters most, and why","You face the strongest objection or trade-off honestly and answer it, rather than just mentioning it","You say what risk remains and how to manage it"]},{"name":"Organisation and flow","aim":"Guide your reader through the text.","look_for":["A logical order for this kind of text (for example: purpose, recommendation, reasons, risks, next steps)","One main idea per paragraph, introduced by a clear opening sentence","Linking words and signposts that show how ideas connect (however, as a result, above all, this means that)","Headings or lists only where they help the reader"]},{"name":"Language","aim":"Say exactly what you mean, accurately and professionally.","look_for":["Vocabulary and structures that let you say exactly what you mean, including the language of the topic","Accurate grammar, word choice and spelling, so mistakes don't distract your reader","Claims that are as strong as the evidence allows (will, is likely to, may)","A consistent professional style: no slang or chatty asides"]}],"salt":"db8d9abb","lc":"IsPxxpBornJJ2CuAbKDYaMJ06qjSmGm1bKxJWQBmtF/OffBXkjKqcqMMe61y093ku4Y="}</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};

function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;

}

// Harvard in-text citation from a reference: one author (Smith, 2024), two (Smith and Jones, 2024),

function citeOf(citation){
  const y = (citation || "").match(/\((\d{4}[a-z]?)\)/);
  if (!y) return "";
  const who = citation.slice(0, y.index).trim().replace(/,$/, "");
  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;
}

const initials = t => t.trim().split(/\s+/).map(w => w.charAt(0)).join("").toUpperCase();   // "Not given" -> "NG": no need to show the key
function qOptsHTML(it, opts){
  const v = (st.ans || {})[it.id] || "", ent = Object.entries(opts);
  const long = ent.length > 6;   // a long list (e.g. seven headings): a drop-down; otherwise every option stays visible
  if (long) return `<select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">Choose…</option>${ent.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}. ${esc(t)}</option>`).join("")}</select>`;
  const short = ent.every(([, t]) => t.length <= 12);   // in a row only for True / False / Not given and the like
  return `<div class="${short ? "row" : ""}">${ent.map(([k, t]) => `<label><input type="radio" name="q_${esc(it.id)}" data-q="${esc(it.id)}" value="${esc(k)}" ${v === k ? "checked" : ""}><span>${initials(t) === k.toUpperCase() ? "" : `<b>${esc(k)}</b> `}${esc(t)}</span></label>`).join("")}</div>`;
}
function qPartHTML(p){
  const num = it => QN[it.id];
  let body;
  if (p.type === "gap") {
    const opts = Object.entries(p.options);
    const sel = id => { const v = (st.ans || {})[id] || ""; return `<select data-q="${esc(id)}" aria-label="Question ${QN[id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`; };
    const ids = Object.fromEntries(p.items.map(it => [it.id.split(".").pop(), it.id]));   // [[2]] in the text = item R4.2
    body = `<div class="prose gaptext">${p.text.split("\n\n").map(par => `<p>${esc(par).replace(/\[\[(\d+)\]\]/g, (m, n) => ids[n] ? `<b>(${QN[ids[n]]})</b> ${sel(ids[n])}` : m)}</p>`).join("")}</div>
      <ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`;
  } else if (p.type === "shared" && Object.keys(p.options).length > 6) {   // e.g. headings: the list once, a letter per item
    const opts = Object.entries(p.options);   // "paragraphs": the options are paragraph numbers, so no list is needed
    body = (p.paragraphs ? "" : `<ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`) + p.items.map(it => {
      const v = (st.ans || {})[it.id] || "";
      return `<div class="qitem"><label><span class="qq" style="margin:0"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
        <select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label></div>`;
    }).join("");
  } else {
    body = p.items.map(it => `<div class="qitem"><span class="qq"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
      ${p.type === "short" ? `<input type="text" data-q="${esc(it.id)}" maxlength="80" autocomplete="off" spellcheck="false" value="${esc((st.ans || {})[it.id] || "")}" aria-label="Answer to question ${QN[it.id]}">`
        : qOptsHTML(it, p.type === "shared" ? p.options : (it.options || {}))}</div>`).join("");
  }
  return `<section class="qpart" id="qp_${esc(p.id)}"><h3>${esc(p.title)} <span class="ptsbadge">${pts(p.items.length)}</span></h3>${p.instructions ? `<p class="inst">${esc(p.instructions)}</p>` : ""}${body}</section>`;
}

    <div class="consent">
      <b>Can your teacher check your text with AI?</b>
      <p class="small">Your teacher may use the SimLearn teacher tool, which can ask an AI system (Claude, by Anthropic) to suggest feedback on your writing. Only your text and ${EXAM ? "your decisions" : "your group's choices"} would be sent — not your name. Your teacher always makes the final decision about your grade. If you say no, your teacher marks your text by hand. Saying no has no effect on your grade.</p>
      <label><input type="checkbox" id="consent" ${st.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>

    <div id="issues" class="issues"></div>
    <button type="button" class="btn" id="make">Create my submission</button>
    <div id="out"></div>`;
  const memo = $("#memo"), count = () => { const n = words(memo.value); $("#count").textContent = `${n} word${n===1?"":"s"}`; };
  memo.oninput = () => { st.memo = memo.value; save(); count(); }; count();
  const keep = () => { memoPos = memo.selectionStart; };
  ["keyup","click","select","input","blur"].forEach(ev => memo.addEventListener(ev, keep));
  memoPos = null; refreshNotebook();
  $("#nbpanel").ontoggle = e => { st.nbClosed = !e.target.open; save(); };
  const rb = $("#rubric"); if (rb) rb.ontoggle = () => { st.rubricOpen = rb.open; save(); };
  $("#consent").onchange = e => { st.consent = e.target.checked; save(); $("#out").innerHTML = ""; };
  $("#make").onclick = makeSubmission;
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = AE2 || EXAM ? [] : r.characters.filter(c => !st.choices[c.id]);
  if (EXAM) {   // unanswered questions: a reminder, not a stop
    const left = ["reading", "listening"].map(sec => [sec, qItems(sec).filter(it => !answered(it)).length]).filter(([, n]) => n);
    if (left.length) missing.push("Not answered yet: " + left.map(([sec, n]) => `${n} ${sec} question${n > 1 ? "s" : ""}`).join(" and ") + ". You can still hand in, but unanswered questions get no marks.");
  }
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `${EXAM ? "Your" : "Your group's"} answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${(AE2 ? (st.opened || {})[c.id] : st.choices[c.id]) || "-"}`).join(", ");   // ae2: the drawers opened, e.g. "ac"
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  // exam: every choice item in order ("-" = no answer), and the typed answers as one line of JSON
  const answers = EXAM ? [...qItems("reading"), ...qItems("listening")].filter(it => it.part.type !== "short")
                           .map(it => `${it.id}=${String((st.ans || {})[it.id] || "-").replace(/[^A-Za-z0-9]/g, "") || "-"}`).join(", ") : "";
  const shorts = EXAM ? JSON.stringify(Object.fromEntries([...qItems("reading"), ...qItems("listening")].filter(it => it.part.type === "short" && answered(it))
                           .map(it => [it.id, String(st.ans[it.id]).replace(/\s+/g, " ").trim().slice(0, 80)]))) : "";
  const parts = [S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""];
  const code = checkCode(EXAM ? [...parts, answers, shorts] : parts);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${EXAM ? "exam" : r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    ...(EXAM ? [`Answers: ${answers}`, `Short answers: ${shorts}`] : []),
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · ${EXAM ? "Exam" : "Role " + r.id + (r.dept ? " (" + r.dept + ")" : "")} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: EXAM ? (ai === "yes"
        ? "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers, your decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers and your decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.` : (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}
