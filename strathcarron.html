<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Strathcarron: Beyond the Bottle — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

he Elderflower Recall","text":"Two years ago, Strathcarron rushed a flavoured spring-water range — elderflower and wild bramble — onto shelves ahead of a big retail push. A dosing fault on the bottling line let an inconsistent, occasionally bitter batch reach three regions before anyone caught it, and the recall cost close to £400,000 along with a bruising few weeks of complaints. It's the reason \"flavour\" still makes people in Operations flinch."},"proof":{"label":"The Northshore Festival Trial","text":"Last summer, a trial of canned still water at the Northshore music festival sold out within two days, with festival-goers happily paying a premium once the cans were positioned as \"the plastic-free choice for site.\" It proved, for the first time, that UK consumers would pay more for water in a can when the story around it was right."},"constraint":"Kessington's, Strathcarron's largest UK retail partner, wants final packaging and marketing decisions locked in within six weeks, in time for its new sustainability-led shelf reset."},"listening":{"name":"The Shelf Life Podcast","questions":[{"q":"What recycling rate does the podcast give for UK drinks cans?","options":{"A":"About 50%","B":"About 75%","C":"About 90%"}},{"q":"How much energy does recycled aluminium use compared to new?","options":{"A":"About 50%","B":"About 25%","C":"About 5%"}},{"q":"How much lighter is a filled can than a glass bottle to transport?","options":{"A":"About a third","B":"About half","C":"About a tenth"}},{"q":"What share of shoppers would pay a premium for sustainable packaging?","options":{"A":"3 in 5","B":"1 in 5","C":"4 in 5"}},{"q":"What share of shoppers would stop buying a brand because of exaggerated claims?","options":{"A":"About a third","B":"Almost all","C":"Almost half"}},{"q":"What claim got BrightSpring in trouble with the advertising watchdog?","options":{"A":"Plastic free","B":"Carbon negative","C":"Fully recyclable"}},{"q":"How soon after launch did BrightSpring face a formal complaint?","options":{"A":"1 month","B":"12 months","C":"3 months"}},{"q":"How fast is flavoured water growing compared to plain water?","options":{"A":"About triple","B":"About double","C":"Same rate"}},{"q":"How long does the podcast say it takes to scale a new canning line?","options":{"A":"2 to 4 weeks","B":"8 to 12 weeks","C":"20 weeks"}},{"q":"What's the name of the rival canned-water brand mentioned?","options":{"A":"BrightSpring","B":"ClearWave","C":"AquaPure"}}]},"roles":[{"id":"A","label":"Role A","dept":"Operations & Supply Chain","characters":[{"id":"fiona","name":"Fiona MacRae","title":"Operations Director","subject":"Numbers you'll need before this goes to the board","email":"Hi — before anyone finalises numbers for the retailer, you should have this in writing from me directly. Our canning line, as it stands today, can produce roughly forty percent of the volume we'd need to supply the whole UK network within six weeks. Installing a second line to cover the rest is possible, but it takes about ten weeks from order to running — there's no way to compress that safely without risking downtime on the line we already rely on for the core range.\n\nI know Aisha in trade marketing has been telling the retailer we can hit full national volume on day one. I'd rather she wasn't promising that until someone's checked with me first, because right now I can't back it up.\n\nWhat I can't tell you is whether the launch campaign really needs every shop stocked on day one — that's marketing's call, not mine. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Why the second line can't be rushed","text":"vNx5BSHgqMXNJSKha+hKUh+9n89pwWQfky3yiflUx7Y9hpYYluHVn8QGdy2mFSwCZcZ+lknadVsC7oQxc9gKwFxzw8AlQ5gNzQhSl/v4UjQTSyP4fmbV2leEWj3Pib1pHWEAIJ61FxRcbuzd3q++04CTD8En/T0H0mj19LG1cgGzgJECFysMx1Qlthf56Aa/o1iayhocy3MA5OaBN76AX0dUBoEgNpaEh2PdMAnMNG7TgbGHAvcdRfSlRyN/XoFdwFuR4pKcFx7ouiQCWrfLv7pEcUyEeXpWcLbLJksl+Gz9+ma9xcYXTkAP6c43d+5DrevVH1sYF3xrRYqQOxzlsmx2uriZAQz7fkariutKdDt5f+/OMBzXzb8LbWDPDB+DfYzDbsSt41PCFu6gFzP4"},{"id":"o2","title":"The line's numbers, week by week","text":"oNGZEJGeAXDXDyDAns7GFb2R/Aqib8I01qOGx4W0tDvC+rtcM2VIB8vhldV7cawGbxLJkHXLGyQRbE/lg23bIDnT5cF73E70Gtvcz8Yf0ufX3HcpssELzc9xNkas1UToFZ2JATArb+mIMCxUw1IsWUI3o9GF7Rd3PpZvbkXPNcY+Lo0Ofc8um8dHcy7W/2HwBf+WUGa7XBaS+27a/8xKcxdBfY/W2zzBHUDlR9y7zRMBQ9KgbQmcLZwfLzS3il/10Zso/6DtQb5lDmxHbI7nOniHAhYWxFHJLgIoXtQNIsVu58hJE7wjMlVkeYObyAuXYepwJ1zBcEk="},{"id":"o3","title":"What the canning line does all day","text":"ww28oHHM1CN5JwuVCl0IiHsVtXsaLSozqIcZ8E3D/7sMMByDkjD3oKojdP2q8pl3/DOI/dDh56PpHnoyTWQqCD6mLUIT1yhmD6CBNio3AqsdaWWDpOF3WQiVQHbcmUzxohnuyygDbpjHKngPY7D8TyUqykA2ah/NDPbTfgldlO3NfISRDA6wZ4VKpdSSywU4sNYvRMieI7cqLMgYaWmwRdtEDHM/chNiU8vWIsTT4+9APvxZpTdu9fgzt1YiEKNzb3V6e8jAWNrD1O3pIianJOUhljIpbuEeVpes2pBbhbfMrH/jzWTV0aBo6ZyVrizAXCZZxdgeIGlmPSfO7YT74t0OE6163OEgOfXpsEaGAud5zs5uOCUGoRQxYcKC"}]},{"id":"callum","name":"Callum Wright","title":"Quality Assurance Manager","subject":"Before we talk flavours again","email":"Quick one, and I want it on record before flavours come up again in a meeting. Two years ago we rushed a flavoured range — elderflower and wild bramble — onto shelves ahead of a big retail push. A dosing fault on the line meant a batch reached three regions with an inconsistent, sometimes bitter aftertaste, and the recall cost us close to four hundred thousand pounds, not to mention a very bad few weeks online. I'm not against flavours. I'm against doing them at the same speed as last time.\n\nIf we're serious about flavoured cans, I'd want either a dedicated dosing line or about eight weeks of proper revalidation testing first — not a launch-week scramble.\n\nTo answer the question everyone asks me: the dosing fault was fixed on the bottling line, but the fix has never been tested on cans. What I can't tell you is how much the Kessington's deal depends on flavours — that's a question for the trade team. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"When the flavours could follow","text":"fkivbdckFgoDIMinikHM4sBNu0FCTfImN5ufOCGZIHvRkjf9oZFne+MiQqV+480+/PkbpLfr+qz0xs/BUV6IIRQZsdRcfctxebwDASc61+oyd0kELGFb0Ayc0h62aj2mB5Vzz2tg7tC8044jh5dUtCLiXyE5FXlNiO+aHZP1pEhbBSOcZex7HgOMHnlsqJGRcFOc4ZGavpNLnUlQ/rSEV7Rr6K7m87CDC6HXKKqOZjSo470Paj3zXcM8kwD05Gvkg5UR6wNufc20NHdqo3RxlJ3aOgWP2e0nC3EKWHke87G51nk7b2x9ZbVZ0a1HnlqJ/bNFP2Ep9GPw56CofQjrgqe45M2NkKTabuiU8SArpi987ofUqXMVDWuXWGx3BH3xL1Kd9o5+nWrXLSc="},{"id":"o2","title":"Why I'd never skip a validation run again","text":"6OFNGyn/ga8wubDaSFtMcHuxyt80W7rRl1DVBKuqN/9sSNBmVY5p8xzVNAcjiLyaDRcngw1UC1lP3OZdTKVg0HySat22ooExFWxLO2JCqN97BtAp6PyVr0LHKhmeB76RNAFCDzMWECLWsheMDVfh8Fh1nab2UBtIz6LS8U1ECxFwX2FfMI8vR/hOOiW2B2smQRw/TXRSce8yw756wr2xZj9Qb3w+BnLsGLs+zXQ98jo8ZOnxJeZiSyRBIRfOHkTo/lTIyLftnIRrsvwiH6lxs+G9y64Hr+W1r/K4DTxdSa0OdqpvEo24YqE0UHd9kch5Vc4TYtmpXX6dS0I1sIg1hp5ZtwLTTjpu974kCz+S1iD3zMlxgGDPK6jTrflVqftAEnk1"},{"id":"o3","title":"Dosing on a new container","text":"UxoC0Qspki8vvq/ATiOZd03S/0bOT7WXCoTujndE600xA+/X9YFyXO9mHnkgbtFZq9T0llvENu2/TFIFy4liqKII/CwhrbN3CNlqqZOsiOt766eHy+7WMBZ02t8xU1pubi/239T1mqu83yddrNg95Zfki5i1UWbwjbCP0lnxm2icPewbra3UkdCO9YuvNMyXVmYBULR7glJ6LWfXSwn+VBL0uzexk/TDHw/o0A6pS+9WT2VFthg7ZL/6nUImxtGP/Kz0Dq1UacbrmnclXmg4axDIo0Cnqugrs9x7+lKJqptRTlftaV//N2pZdTkKYTqr/xuBdnDXLl/YLxmPK31d60JNIV8="}]},{"id":"priya","name":"Priya Anand","title":"Procurement & Materials Manager","subject":"Recycled aluminium — what we can and can't promise","email":"Wanted to flag this before it ends up in a marketing headline. Our current aluminium supplier can guarantee high-recycled-content cans for our first batch — enough to cover roughly the first six to eight weeks of typical demand — but after that, without a new contract, the rest would have to be virgin aluminium. That's a very different sourcing story from \"fully recycled,\" and I don't want us caught out claiming something the supply chain can't actually back up at scale.\n\nThere is a supplier who could guarantee verified recycled content long-term, but it costs more and needs a longer lead time to lock in.\n\nTo put a number on it: the first batch is about 70% recycled aluminium. After that, without a new contract, it's mostly new metal — about a quarter recycled at best. What I can't judge is how closely the public is already watching our green claims — that's digital's area. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What 'recycled content' means in practice","text":"UIwvxEwl1yt//UOfHMVnQWDzNedFrXiRV1yMu2jb2K6e5IaINWazPe9g09pGK+jOvR3d+EDMNP6GDr0FBEeFGOjeg51MY1JTClHxIyjiBl3Rr7228GTspbX7TUeXP1p2wszqiiJsDSCTcDih7YnLtCDmzGovJijO4sozqYD4mqHmo+xVtJwW30djxk9/RDAw6voC+xulILSivOm7UPwsiBt7AW6EXSvSYbQS2YvJ8CRBp2JNXv/UwAveBEEDuKVuQqGSKDeFApU7XdPssZSAzB0m/9VdRf9t/yjtAPV0mfUk21BCcPFbR3B5B+9rpx0m3NAWTQ3YtSLG9u+EHLI/5ldxoHPbcMIiL34="},{"id":"o2","title":"Our current aluminium contract","text":"iNaS0ETLl5RKXkhXDrnH3yK3VTBBR3ccSt78wLr8/L6E3WxuRFPYSYIufmm0i03yOc1F11t6/9eaxS6AdexsqcgN2JRShaDV7fsv8OawEmwvFJadLHjN1d5gz384LtQx4nUz3GL1tb1aQZ5lkNvtVRJn2SGS2HsN4P5HfTyercpQ5lkYUNc94/p1aIXOWNKTqjiCwbEf8fdqhtPo29KXF/Q3rryAvZa/nG2qDdL/bM0sdQu/oxDUTXKLhllbupLf6mKEFGlBM6bfSw/zQ67a2JYwKoNhn4gmbgbAVBCBAGmBMKMND+7/Uf/S7n1aogqWJ+3Z1Midnqg4bwZqDeqe+PmLdN/ckc6K6WPEe/PAnTQ="},{"id":"o3","title":"The verified supplier and its contract","text":"IC6z/bwZkIiGyfMOV9ppE31A/uswd6+ohydIwSd31hpW8I9wI3AjniYq6u1vq9oVBxf3LxVXcdfBeOv/ifZfwiBL9YbOr04MZpFYkrLlgZO36SNFHSACBbwNTnTLSxYsKBkdi+RyvUrNArvPo2b7aOxhQgCq0KSUg8CL8Zh3u3Qi0OH4t3LPLEF1mBFILu7KGi11Kon2DKXzfh9By1mcbZLzSIWuejXcrPg5AyEn9ysLe2eUov+mQc/Rr2I8O3o5akPBEmOEii7yt77pGYm8+TJCzim+/wQZTLbSnuuV5XCNjJRg+GqJEcoKAisFvKVDzMsMh1ppiQND1KAVTJREIPJaJiKZqPOX/g1F/qEzzL+xFf3oMnlx/CFl6fatAulvApKWv39HcNBK"}]}]},{"id":"B","label":"Role B","dept":"Marketing & Brand","characters":[{"id":"duncan","name":"Duncan Hale","title":"Head of Brand Marketing","subject":"Life Beyond Plastic — testing went brilliantly (mostly)","email":"Good news first: we ran \"Life Beyond Plastic\" past four focus groups and it landed exactly how we hoped — genuine excitement, real emotional pull, people talking about Strathcarron as a brand actually doing something rather than just saying it.\n\nThe less good news: our own legal and compliance pre-check has already flagged the specific wording — phrases like \"zero plastic footprint\" — as a real risk under advertising standards rules unless we can independently certify the claim, which we currently can't. I don't want to water the campaign down for no reason, but I also don't want us fact-checked into a retraction in week one.\n\nOne thing I can say for sure: the campaign doesn't need every shop in the UK stocked on day one. It's built around a launch moment, and starting in Scotland and the North would tell the story just as well. What I don't have is the real finding of the footprint study — the board only saw a summary. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"The launch plan","text":"Vqz5GV45swlHc+haETgg+xOq21eoJEKTXfFn4pOJCkmcwxtRVbRy20ZVlzqfZn43iiUk7UKGTUceZUehRqJZxPdGhjOyN7lXTW9qzTmnIJsrpU1HlDb8FZcCfTCykg0Ap+rgIUZoCQh8Zv1luAZuXviH0pvs55NSSrN9R6O2l6t+VIh+FixFyp9/fY1oUcp7E+dTBpw3VKvTqvSr3BuH7ux+MUuz0Xw3G1ci9Yb3NyXZ66UjkvvM0NKK3aky4+aautGKBhUNbCHQtffkLQ69gM5e0TZrChKdH8jG0D0RJIitsIyZPKyYPyAAto972N/yukmG3KtJclOVvrfjB9HuJNWOsA4zW/kyyL5l"},{"id":"o2","title":"The wording of the campaign claim","text":"g7Ab3gfcEqRA/fkdzBdIWslbdUWm/AHxOw4vNq0m+qcJKgku07JufkJFgXgjiQWlnXt93EE00azB6xKhBiVx4X3NZbV1a4I7SnDWc49xUUpfUvZTchGlENIrPHWlakoUQSek2xpgucoy+6r5CebG1dft1A3tjBNY92dQA4t6QUQ3iAv45F+8TLrjRUXanek4KjtAv64/EAhhXXRMiz5SwvWThwny3ucz+FC/YiSyqTD9MpUe+GgK0VhGIFTXN101guCy/70x74tXhbDu5eQHwNp6l1sNAVPran/MSvj25vG+WDrH+taH50EBDretz0oSbGKB5lDZRoMx6Ue4EUzevZViQ4jwrTHQkWq676AiKcM3CPojAlPi7KPPWscqrm5bnaEdKPNdcM5BTtVjFy98IzW65xEWeSA="},{"id":"o3","title":"What the focus groups responded to","text":"s2aJIl2HLyDXx4byvyzsqiq2LQn4Fr3phzviSsRq1443Be6PHQxec8KJhtxKpKqgvUte1VveuJE5jwg3Sr+hD99vCe6IXgvjbcdToHrEp+pJTFcQMUa1sfWZtNhR+a1fU87Tr1LAZKTHL9/RsXUbitzhMkS6NzO4gPE6VeHkaci9HqEedAJSzDvCv3NEIOCjEejHWYbC+qxrEQcDMI5O4GvTauSkUQm15KW8Fffg0nrZ5NgZTKfpcySOCiiHgNOUrJXa1oLSprm5kcPEJy5wcUhKX9gUyVhdns6lTMImY1inqsUURjmqCCM9s+Q993nKwy09bbqVkBVkpO+mpwn5/O6OELGl7IF90MP1GNBbeZWog7Hty6ot1w=="}]},{"id":"aisha","name":"Aisha Bello","title":"Trade & Retail Marketing Manager","subject":"Kessington's have been clear about the deadline","email":"Wanted to make sure this is understood clearly before decisions get made. As I understand it from our account conversations, Kessington's will only guarantee the expanded shelf space for canned water if we can commit to full national supply within six weeks — otherwise, they've made clear the space could go to a rival's canned range instead. That's the deadline everyone keeps referring to, and it's the one I've been planning around.\n\nI know Operations has concerns about hitting that number, but from where I sit, the commercial risk of losing the listing altogether feels bigger than the risk of pushing the timeline hard.\n\nOne thing I'm certain of: the Kessington's listing is for canned water. The buyer has never asked for flavours at launch — including them was our idea. What I can't judge is whether the signed agreement leaves any room for a slower start — I've only seen the buyer's emails, not the contract. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What a shelf reset means for us","text":"c/eINU9hP8O+7Q460f+WqsrFJU2AKHZk9XuEd+MjMSbo0ITQQArOUruCypVVyLcoOR7p1bvgqmaxMXPBIIXsIHXtvL/tXbOo/yxYXHS6R1lCZxfo6gsNrGwGiWAp7MN6oDLwxwl7N41MI+Srbaoxz+WI6pFfQs6/4a4XabnGPYaJpIlEPjMqpTEZQaqJDPwmYLypbv3q/ZG/y3WihVlwojxG6Dds5NKYs7f2EN+RKrjtJUmRy7cdhblPxYOSWVy8ebXBH3MA0AzI0u8McM9672+scmxhXsiaYLuxUln9wE0fBK8fsjjoNowFLov6OKWZxCB2hYs9cFU1VDfT4rVn"},{"id":"o2","title":"What the buyer actually wrote","text":"l38CM9/0Q2t4FasRA5nzdoYdGI0dA4uKkmbmBfzp42+ZewHfpPjBOmNT+PxNNxMBJP4+gMLXccPnAjZN19gfUDNyXH5rW/LgOVfDryI8R5lF5bBPSE8Iw4bPRmHLfTkPchLOcJFOkVpg8yBtyw67MtDnfJmu4sFyPlSA0JOUt/6gybBqDMVEJLlrsTmKsVgP9GlMXm7IPTqUBuB+frUC/2FIf7psyCDXpa/ssNsCpkt3BkXc8Q3j7Susn3hkn6UfRqFTZ+OdtnXvnaNsvxmTfU6wHJapaAMXdvaLfwbb7AkXM084Rm3iCGRiiQQ="},{"id":"o3","title":"Talking to the Kessington's buyer","text":"Xm975R6Y7nuKb9p4Bv5rlhdUXKvGXdTq9eDBVVJKP4FRlL+40iX6lJRtph6AYiwwhogXMrNsMoZB+gyIe//ewN6QTMIxuls9A2Gf4v76oPf2fIKxHmFGzUb55R30Wvvn+BVLelr105/dDequLTmUhfY9n7fP88XajOlwYtEDey93+gUpBJKVsi2CQEWjTOsaottAjOMx08V3YrXZ4fHoCTQEc1zGjWMHZ45hA9WruKCt4JpcoVTLuy2XDTvp0SHkPvv7lS0gwYO+NMZntGWowYAN7/6N2w1NkUPTTnViMoujymIQuKbVt71d9GvoVOUgtA1h3FsDEWoEVZF7MRmSHAOI1srycvI="}]},{"id":"rory","name":"Rory Fenwick","title":"Digital & Social Media Manager","subject":"Someone's already asking questions online","email":"Heads up before this goes any further. I've been monitoring mentions of canned water generally, and there's an environmental journalist with a decent following who's already posting pointed questions online about whether aluminium cans are really greener than glass or plastic bottles, given how much energy goes into mining and producing aluminium in the first place. Nobody's mentioned Strathcarron by name yet, but this is exactly the kind of person who would pick apart a bold claim within hours of it going live.\n\nI'm not saying don't do the campaign — I'm saying whatever claim we make needs to survive that kind of scrutiny, not just a focus group.\n\nWhat I can't tell you is how much time we really have before launch — I've heard different versions of the deadline. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Getting ahead of the journalist","text":"zbW1b3+0hQpBMPHBRDm6dLJSlwaV96EzszEUoQ2aD3EVsFa39XLi2lVH5++pxZ1+5PNYBIvp9608R79XKl0FoPW+6po9YxFmgkDLbW8zbeEC/qKxpBZMUDJfvsJGDVxyKlTdRNzLNWgaE8+gwr026tfMBgFxulQXUZWzmXS5QH2oKY+u5zVREOxqzQ92EiWIjGkcFYITpi3TPI2UMVyDwLijsWt4Q8KAW8s4t17T0E057icRfJ3TKQIuVLu/DDByLB70WsO2tzqTmh6kGeP2nGiPZCiXY9uRRpU+fFSVUwY4n5f2qsz38NQ4d+8/RMdcspRRIkaDBSpdYTcxXcUttmE5fvJPzyHEZNrSa9eKaI5MS9V8ysvR3KXgp9g="},{"id":"o2","title":"What the journalist has been posting","text":"6rGI2CwVUfnJenJE0iLDtYaEY3eZEHVZM2TeQTyYyP67gKxkN6YCvpdHB9mjqq4qOEQHiLKKjV8oI6tizxT0lKI8zT50/kJJup4GwXsPXxPJ1gyFAE+D9fJaiSIHphc0TYJ44BXBqG8lrmJkvoobe/hQz31JyKMrAV322LlgewEpxvocY5uerWaRgDYRLsSxux4BNVQ6fRm2R3SyqmCQ9nXnUxJ5hEWb+nTRsV+0BULaKJSEp4mbG9Zvtoc7gBsGYva1gJangjqfhWdAGRuMyLELceWUvfHXGf5wjId3Yz2y7F9KeZvRZejjzmsiJz8qgSfKuNx9VYRAsZTJCvn4J1NP4hzjRB94NZKf9J8I"},{"id":"o3","title":"What I'm watching every morning","text":"dfyTR90t6bBekNKlvQ8bUw+WBaRuN+yRBnXRYjWOavZm70Dp4bF1qvYefZ3Ga6AlOq7mTSxZ9hohDX1nM4v6RIR/V7e6bKwr2JIlz5/3SOsStMyxuRf2zBkabvI9YkYTBpqhJ0zIVOu23RKcEyUa6xM7lghYNH7iY2NOBxL9sMvbZ3eufLIB9PxW8ZazjYWQMaykmPCBEUVaG2aauBdIp0S/cwiP/Ij8pFKu/UR+3nBIxvJ/5NcCsJwOgK8bjwSbbAJxC0rR79bHeYxJSQLyjQlxcAGiS5QvM+5bTlR2IfQFq/xuuo9foEekkboMcL4YxHp9TaRTXHydhNVIBqn8vQ=="}]}]},{"id":"C","label":"Role C","dept":"Sustainability & External Affairs","characters":[{"id":"elspeth","name":"Elspeth Cameron","title":"Head of Sustainability","subject":"What the footprint study actually says","email":"I want to make sure this doesn't get lost before anyone signs off on a headline claim. We commissioned a full life-cycle assessment last year comparing canned and bottled water across their whole footprint — production, transport, and end-of-life. The honest finding: canned water only comes out ahead of bottled water when recycling and return rates are genuinely high. In areas with weaker recycling infrastructure, cans can actually have a higher carbon footprint than bottles. It's more complicated than \"cans are simply greener,\" and I'd rather we said something true than something impressive.\n\nI'm not against the switch — I think it's the right long-term direction — but the claim needs to match the evidence.\n\nA quality failure on our sustainability flagship would undo our credibility faster than any journalist could. What I can't tell you is whether the old flavour fault has really been fixed — that's Quality's area. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What the study measured","text":"6VcdTRB1wh50j2mO07WBvHw+ZgswgcPB7Z6QG6nT0XFgiWdrLsVR9sAtjxRdnvAox+8qfIO/QeIWOAO9lkPtlT1CQSImJ0szRHEx5wquo2KKq46Dt6/gZrht11JG1i4EQHu8O234MiyMCGOPRF0mcSUbmxx+H0czIcbVNrDIiL2d8766IgZpyuvZuSX0L9wEYdnDP8w9LUtfA/KTuAXdFD2qBmo7vSo6Nno3xxZzLl2ptkjinzHEAtT5e53rri/NhqFzZDjoJ1IdVkoBjfE7SmdC1bzggFERJSi9VKSXBDOuuOITVEUfMvAcrKroGlP8Ruyzh96WeVpztGEsIVw="},{"id":"o2","title":"Where cans really are greener","text":"NPKKGub5HMCaM7AlYjHogqTVqwii0a5jHzpYs0wsWdl/88P0yEYGzfLGX4X0ggsolZ4dljWb8gM9gQC9j+qmYQkzQx0jXTkT79G6UaJUO/NJ97Ebk3Cdr09NRrQz07ZWxOaK0HLPwFV8+U649m23h0CJviv740pTZAukCTit8vmx0MCgfPNQSQsGoj/t70MIULGvqBAeuPTm0/h15/8fOCO7k9Itx9tpiARUz7R5Jpg1q0JL29uP44vGTp9PlqESyMEFA4amq4nTbaHivKWtWQ9mYrtIdL/iiBVR2qfvOqsLn55g8pbSa52dpHarYoXMTmZhNkEkH3NsNv12TPyyAWHMCxJA7g/Ucs2Yzrk="},{"id":"o3","title":"Flavours and the footprint","text":"Ak2Ml/ZSvh0jcEPeQG3rvNKJRzvC/d04AKMHvIuIeoxDgKLdJKh+ZptBYr6CTgdxQ4MWCDxaSc/VX1nZ/q0MJq3e1ZttBj6uOus/95HqkUvo9HcR9D1gXpsN7uXX9t+lnQCQaUjvyOkjmsqrusamlseCTJEYS+xP0XI7BhdedfvaegXM7S1Zpteow1KEoA3F1OLhQ39/7rgLbML5x3IpL5J23pkA2NCy9bRcM5xu2XLaF6IqHSUmxzGnwJ+UKHyUwtFBn5/LeTCnO8zxr7OVG4TI7VlWso+hqiUQSSKLG0PqAbclP3Vv+XpHSjOydcvgggYsfKIndh/gBkdlYf5P7x4Zk8jbo2yXH7wtm712eCkH4q8B83ApmtmCQdxRe5fKTbG/QZ5y"}]},{"id":"graham","name":"Graham Doyle","title":"Legal & Regulatory Affairs Manager","subject":"What we can actually say, legally","email":"Following up in writing so there's no ambiguity later. I've reviewed the Advertising Standards Authority's guidance on environmental claims, and absolute statements — things like \"the plastic-free choice\" or \"zero footprint\" — require independent certification to back them up, which Strathcarron doesn't currently hold. If we make a claim like that without certification, we're exposed to a formal complaint, and possibly a forced retraction.\n\nThe good news is that softer positioning — describing the cans as part of an ongoing sustainability journey, rather than a finished, provable superiority claim — would clear legal review without any issue at all.\n\nOn the Kessington's contract: proposing a phased ramp-up in our initial proposal carries no contractual risk. What would put us in breach is promising full volume and then failing to deliver it. What I can't check myself is how much recycled aluminium we can really guarantee — Procurement holds those numbers. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"The legal read on the campaign claim","text":"EeQ9RyG/WxjHkLhjhqEfbZLxyK1jlPbQDPCSmbZfflnN8e/Yf3cXND8AV6fwVCXKVGzsp5vtrCjRAzZ+LMgll2inJdfrw4PZGGdOYmx056BlsAsqGZ/5lyKNskhtNjJW5YlukpsmNPg9g7FcBNeZN4Bjyh1LD7sinrBm6Cl1oFJgZAKPoh6psVCQcxmlehgkFvKiIWCiQrtDyNwEiuVMFbu+1u7V1SeXH2GTL70p5+h1EJCGFr7+DXstel5VNWlcPVcpsh57jcFSfBwv6hQXsxUcIJzzbG8hiTjCCLVqdFNyXTYoVD1qIw1C+YsuXE0Oe/6ockfmygbURgXTbcU="},{"id":"o2","title":"What a complaint would mean","text":"14Vs2kTNBsPsfdfTQZ46qDGg63tHiIJchZTycWDtNwiYt5lGrBWu92OHQl1RoTtMqBi3Y37wXh4vAnbNnCiJ9Yn0osttFItfQLfdBO5XMGIM324rUpIB3zRtRqpUTM1hzfN4YICyx0yTUpu5UEuZzmF2YZSHoJyt3S62AYtbCdXf6b6XtIeu8X+d/mWrus8vwftTEgD8Gvca/6drLFApB2zb63Nl7HAGleeX2DerRJTl23Dy6Q/vJb43O2tVV9W4qdN0mctJwCabGxBDe9LQ8tJcIaQh5wrWvF8+F2eHTXI89+UBf2mqVn5XL8bYP75agreVNaVCrcKfIIJapCxbwY+T0KFxtVA="},{"id":"o3","title":"Whether certification could be ready in time","text":"OQJou9Qv1KbNkV6h//aEKYFHv2veyIjFDvuL2WKDfQ8HZ4Bd6/kXOGctbfMjArFuWvcOIai2ISOUFb/S1hUScBdksgeubK26oTXTw8OCf1Rn+ok5YLoMx6TQqsRF7B0kCXNWay73HZKReMedQRMFlgwJ/WfK1rEJRMJswk16kztL8K4X6POW+EN1H1DAi/MotxPZv6FQYZNfbuK4yfRd64BCnQW2R10/ZQApNbX1fhlKQhhYSQa6ITMrFj/RUfE8i90GKozaj/1nMS7YaxqtTc4AK0rnCG5VvdnBDqNqaxUgRdMT8u4="}]},{"id":"morag","name":"Morag Sinclair","title":"Key Account Manager (Retail Relations)","subject":"There's more flexibility in the contract than people think","email":"I've been reading back through the actual signed listing agreement with Kessington's, not just going on what's been relayed second-hand in meetings — and there's something worth knowing before anyone assumes the six-week deadline is completely fixed. The contract includes a grace clause allowing a phased supply ramp-up over up to three months. The catch: it only applies if we request it upfront, in the initial proposal — it's not something we can go back and renegotiate once the deal is already signed off as \"full volume, day one.\"\n\nI haven't raised this yet because I don't want to suggest something to the buyer that Operations can't actually deliver against with real numbers.\n\nWhat I don't have yet is a real production plan from Operations — how many cans, by when. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"How Kessington's buyers think","text":"HVHLrWxQxFrNhWqvLN8WLg79Z6WxUSBMeSPhRuwQvKe0fVUeDQG6nl0kHAsUQl9fGsjDQHWbtEXfKQg2CcBMrawB5cdlDatX0aHZdIlRswtdB//2K0eG+M4PfWWTdsnNYGOyzFigboqTP1DABwVKEBLmqUvdY6lhFMqeXcZybUL9Nxel8lLOuGvcMKmkrVrXVQAlxTvBJ4sFs2WeHtVGGi9DFppRJaufYe0bizzkqkBM/mYetAyzqLLYwmEiT/VQn5Xc6J9qeAwFje/5aFObmvjA+1Pz2sW7d4OIqonkIroAZX94p4CzjtAylwwCXAQJW7AN//q6QyrOrXivLL0xYvz/4jdfnB3dzw=="},{"id":"o2","title":"The grace clause in our proposal","text":"FEQOfnjF6xSilgVoFVDH30YnkoBsZX/yN2d21EI7JB9HzcjGsQVegwKaJwy8IdHMdDI94Ei8mOpXO4bGulGgE71J0QDy2jdkabBqXxGX2HHyBGapWI6EL6TR7E4odrz1txykNrHtGvRTTDGhs+QBPw881XFuTUVaW8HCxCG1IwhKGw88ezEGwEVstUT8CYacl96AacyBfsDkxUovisd0jGWa/skX9ZlUODHBeTNgtLH9jXMicyNT6Del8pQU5sGlL2Z03NiJdX67DLgA/PTrzMGpakbKC/MZHMahXc7q2GtViOm8"},{"id":"o3","title":"What else is in the agreement","text":"jVJMCPcfD59X7nVHwg2KAkCv3gJlY3CB7Jbj+kY57cSNNXRriqEdlgy1hEetGFFY9YiIBEUbV3EI/2RVBXnQ7lQ5Xztid3nLJKC/ZgAqruMSFV8vGSdTMHy/3SecXPEb29Zcj2DljkVr6TCRHjDYierJ6ISARhCY2LKS8LEySMCjVyDrjek0HodTt <script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};
  if (str(s.mode)) out.mode = s.mode;
  if (str(s.role)) out.role = s.role;
  if (str(s.hlGroup)) out.hlGroup = s.hlGroup;
  if (typeof s.nbClosed === "boolean") out.nbClosed = s.nbClosed;
  out.choices = map(s.choices, str);
  out.firstLook = map(s.firstLook, str);
  out.mcq = map(s.mcq, str);
  out.decisions = map(s.decisions, v => v === "A" || v === "B");
  out.hl = map(s.hl, v => str(v) && Object.prototype.hasOwnProperty.call(HLC, v));
  out.hlLabels = map(s.hlLabels, (v, k) => str(v) && Object.prototype.hasOwnProperty.call(HLC, k));
  out.nbf = map(s.nbf, str);
  out.opened = map(s.opened, str);
  out.drawOpen = map(s.drawOpen, v => typeof v === "boolean");
  out.budget = map(s.budget, v => typeof v === "number" || (str(v) && /^\d{0,7}$/.test(v)));
  out.tags = map(s.tags, v => v && typeof v === "object" && !Array.isArray(v) && str(v.p || "") && Array.isArray(v.d) && v.d.every(str));
  Object.values(out.tags).forEach(t => { t.p = t.p || ""; });
  return out;
}
function handoverWhen(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-GB", {weekday: "short", hour: "2-digit", minute: "2-digit"});
}
function handoverBox(first){
  return `<div class="handin${first ? " first" : ""}"><b>${first ? "Open a teammate's hand-over" : "Taking over from a teammate who had to leave?"}</b>
    <p class="small">Open the hand-over file they sent you. ${first ? "This tab will show their work; your own stays in your other tab." : "Do this in a new tab, so your own work stays where it is."}</p>
    <button type="button" class="btn${first ? "" : " quiet"}" id="hoPick">Open a hand-over file</button>
    <input type="file" id="hoFile" hidden>
    <p id="hoMsg" class="small issues" aria-live="polite"></p></div>`;
}
function wireHandoverBox(){
  const pick = $("#hoPick"), file = $("#hoFile");
  if (!pick) return;
  pick.onclick = () => file.click();
  file.onchange = () => {
    const fl = file.files && file.files[0];
    if (!fl) return;
    if (fl.size > HANDOVER_MAX) { $("#hoMsg").textContent = "This file is far too big to be a SimLearn hand-over."; return; }
    const rd = new FileReader();
    rd.onload = () => { const msg = openHandover(String(rd.result || "")); if (msg) $("#hoMsg").textContent = msg; };
    rd.onerror = () => { $("#hoMsg").textContent = "That file couldn't be opened. Try again, or ask for it again."; };
    rd.readAsText(fl);
  };
}

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");
const budgetVal = id => { const v = parseInt((st.budget || {})[id], 10); return isNaN(v) ? 0 : v; };
const budgetTotal = () => B ? B.items.reduce((s, it) => s + budgetVal(it.id) * it.unit_cost, 0) : 0;
const budgetOK = () => B && Math.abs(budgetTotal() - B.target) <= (B.tolerance || 0);

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){   // no Teacher link in an exam: one less thing to click away to
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${EXAM ? "" : teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderExamStart(){
  const m = EX.minutes || {};
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start examstart">
    <h1>${esc(S.title)}</h1>
    <p class="lede">This is an exam. You work <b>on your own</b>: everything you need is on this page.</p>
    <ul class="times">
      <li><b>Reading</b>${m.reading ? ` (about ${m.reading} minutes)` : ""}: read the situation and the ${num(role0().characters.length)} documents, and answer the questions beside them.</li>
      <li><b>Listening</b>${m.listening ? ` (about ${m.listening} minutes)` : ""}: your teacher plays the recording; answer the questions as you listen.</li>
      <li><b>Writing</b>${m.writing ? ` (about ${m.writing} minutes)` : ""}: make the decisions and write your ${esc(S.writing.label)}.</li>
    </ul>
    <p>You can move between the tabs at any time and change your answers until you create your submission. You can highlight sentences as in the simulations.</p>
    ${S.ack_disclaimer ? `<div class="ack"><b>Before you start</b><p>${esc(S.disclaimer)}</p>
      <label><input type="checkbox" id="ack" ${st.ack ? "checked" : ""}> I understand</label></div>` : `<p class="muted small">${esc(S.disclaimer)}</p>`}
    <button type="button" class="btn" id="go">Start the exam</button>
  </div>`;
  const ack = $("#ack"), upd = () => { $("#go").disabled = !!(ack && !ack.checked); };
  if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; save(); upd(); });
  upd();
  $("#go").onclick = () => { st.mode = "3"; st.role = role0().id; st.tab = "context"; save(); render(); window.scrollTo(0, 0); };
}
const role0 = () => S.roles[0];
function renderStart(){
  if (EXAM) return renderExamStart();
  const two = st.mode === "2" && TWO;
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start">
    <h1>${esc(S.title)}</h1>
    ${HANDOVER_OPEN ? handoverBox(true) : ""}
    <p class="lede">You work for ${esc(S.org)}. Your ${two ? "team of two" : "group"} has to ${B ? `split a ${money(B.target)} budget` : `make ${num(S.decisions.length)} decisions`} — and each of you holds information the other${two ? "" : "s"} ${two ? "doesn't" : "don't"} have.</p>
    ${S.ack_disclaimer ? `<div class="ack"><b>Before you start</b><p>${esc(S.disclaimer)}</p>
      <label><input type="checkbox" id="ack" ${st.ack ? "checked" : ""}> I understand</label></div>` : ""}
    <form id="startForm">
      <fieldset><legend>${two ? "Which player are you?" : "Your role"}</legend>
        <p class="muted small">${two ? "Decide between you who is Player 1 and who is Player 2." : "Agree in your group who takes which role. If there are more than three of you, two people can share a role."}</p>
        <div class="choices">${roles().map(r => `
          <label class="choice"><input type="radio" name="role" value="${r.id}" ${st.role===r.id?"checked":""}>
            <span><b>${esc(roleName(r))}</b><br><span class="muted small">Your ${AE2 ? "papers" : "contacts"}: ${r.characters.map(c => esc(c.name)).join(", ")}</span></span></label>`).join("")}
        </div></fieldset>
      <button type="button" class="btn" id="go" disabled>Start</button>
    </form>
    ${TWO ? `<p class="switch">${two
        ? `Three or more of you? <button type="button" class="linkish" id="mode">Switch to the group version</button>`
        : `Only two of you? <button type="button" class="linkish" id="mode">Switch to the two-player version</button>`}</p>` : ""}
    ${HANDOVER_OPEN ? "" : handoverBox(false)}
    ${S.ack_disclaimer ? "" : `<p class="muted small" style="margin-top:2rem">${esc(S.disclaimer)}</p>`}
  </div>`;
  wireHandoverBox();
  const m = $("#mode");
  if (m) m.onclick = () => { st.mode = two ? "3" : "2"; st.role = null; save(); renderStart(); };
  const f = $("#startForm");
  const ack = $("#ack");
  const upd = () => { $("#go").disabled = !f.querySelector("input[name=role]:checked") || (ack && !ack.checked); };
  f.addEventListener("change", upd);
  if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; save(); upd(); });
  upd();
  f.addEventListener("submit", e => e.preventDefault());
  $("#go").addEventListener("click", () => {
    const r = f.querySelector("input[name=role]:checked");
    if (!r) return;
    st.role = r.value; st.tab = "context"; save(); render(); window.scrollTo(0,0);
  });
}

/* ---------- highlighter: tap a sentence, give it a colour; nothing is right or wrong ---------- */
// Lives only in this tab (sessionStorage, as the rest of the state). Never part of the submission block.
const HL = [["yellow","Yellow","#FFF176"],["green","Green","#B9F6CA"],["pink","Pink","#F8BBD0"],
            ["blue","Blue","#B3E5FC"],["orange","Orange","#FFE0B2"],["purple","Purple","#E1BEE7"]];
const HLC = Object.fromEntries(HL.map(([k,,c]) => [k, c]));
const HL_HINT = S.format === "ae2" ? ["Supports A","Supports B","Weak spot","Key number","Question","Use in my writing"]
             : ({AE:["Position","Evidence","Reasoning","Counter-argument","Weak spot","Use in my brief"],
                  EFD:["Constraint","User need","Idea","Risk","Question","Use in my pitch"]})[S.course]
                || ["Number","Risk","Opportunity","Deadline","Question","Use in my memo"];
// ae2: a highlight can also be tagged with a part of the argument and the decisions it matters for
const TAG_PARTS = ["Position","Reasoning","Data","Counter","Concession","Example","Conclusion"];
const decNo = id => S.decisions.findIndex(d => d.id === id) + 1;
// what the sim itself calls a decision: "Decision 2" from "Decision 2 — …", "P1" from "P1 — …", else "Decision n"
const decLabel = id => { const d = S.decisions.find(x => x.id === id); const m = d && d.title.match(/^([^—]{1,20}?)\s*—/); return m ? m[1].trim() : "Decision " + decNo(id); };
const tagsOf = k => (st.tags || {})[k] || {p:"", d:[]};
function toggleTag(k, part, dec){
  st.tags = st.tags || {};
  const t = st.tags[k] = {p:"", d:[], ...(st.tags[k] || {})};
  if (part) t.p = t.p === part ? "" : part;
  if (dec) t.d = t.d.includes(dec) ? t.d.filter(x => x !== dec) : [...t.d, dec].sort((a, b) => decNo(a) - decNo(b));
  save();
}
function tagChips(k){
  const t = tagsOf(k), bits = [t.p, ...t.d.map(d => decLabel(d))].filter(Boolean);
  return bits.length ? `<span class="tags">${bits.map(b => `<span>${esc(b)}</span>`).join("")}</span>` : "";
}
const hlName = k => { const i = HL.findIndex(x => x[0] === k); return i < 0 ? k : HL[i][1]; };

function splitSentences(text){

  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };

    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }

      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";

}

  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));

function tabListening(){

      }).join("")}
      ${done ? (st.mcq[i] === key[i] ? `<p class="res ok">✓ Correct</p>` : `<p class="res no">✗ ${st.mcq[i] ? "Not quite" : "No answer"} — the answer is ${key[i]}</p>`) : ""}</div>`).join("")}

      ? `<div class="score">You got ${right} of ${n} right.</div>`

}

const qItems = sec => ((EX && EX[sec] && EX[sec].parts) || []).flatMap(p => p.items.map(it => ({...it, part: p})));
const QN = {};   // question numbers run through each section, as on a paper (reading 1–n, listening 1–n)
["reading", "listening"].forEach(sec => qItems(sec).forEach((it, i) => { QN[it.id] = i + 1; }));
const answered = it => String((st.ans || {})[it.id] || "").trim() !== "";
function qCount(sec){ const a = qItems(sec); return `${a.filter(answered).length} of ${a.length} answered`; }
const initials = t => t.trim().split(/\s+/).map(w => w.charAt(0)).join("").toUpperCase();   // "Not given" -> "NG": no need to show the key
function qOptsHTML(it, opts){
  const v = (st.ans || {})[it.id] || "", ent = Object.entries(opts);
  const long = ent.length > 4 || ent.some(([, t]) => t.length > 60) && ent.length > 3;
  if (long) return `<select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">Choose…</option>${ent.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}. ${esc(t)}</option>`).join("")}</select>`;
  const short = ent.every(([, t]) => t.length <= 24);
  return `<div class="${short ? "row" : ""}">${ent.map(([k, t]) => `<label><input type="radio" name="q_${esc(it.id)}" data-q="${esc(it.id)}" value="${esc(k)}" ${v === k ? "checked" : ""}><span>${initials(t) === k.toUpperCase() ? "" : `<b>${esc(k)}</b> `}${esc(t)}</span></label>`).join("")}</div>`;
}
function qPartHTML(p){
  const num = it => QN[it.id];
  let body;
  if (p.type === "gap") {
    const opts = Object.entries(p.options);
    const sel = id => { const v = (st.ans || {})[id] || ""; return `<select data-q="${esc(id)}" aria-label="Question ${QN[id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`; };
    const ids = Object.fromEntries(p.items.map(it => [it.id.split(".").pop(), it.id]));   // [[2]] in the text = item R4.2
    body = `<div class="prose gaptext">${p.text.split("\n\n").map(par => `<p>${esc(par).replace(/\[\[(\d+)\]\]/g, (m, n) => ids[n] ? `<b>(${QN[ids[n]]})</b> ${sel(ids[n])}` : m)}</p>`).join("")}</div>
      <ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`;
  } else {
    body = p.items.map(it => `<div class="qitem"><span class="qq"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
      ${p.type === "short" ? `<input type="text" data-q="${esc(it.id)}" maxlength="80" autocomplete="off" spellcheck="false" value="${esc((st.ans || {})[it.id] || "")}" aria-label="Answer to question ${QN[it.id]}">`
        : qOptsHTML(it, p.type === "shared" ? p.options : (it.options || {}))}</div>`).join("");
  }
  return `<section class="qpart" id="qp_${esc(p.id)}"><h3>${esc(p.title)}</h3>${p.instructions ? `<p class="inst">${esc(p.instructions)}</p>` : ""}${body}</section>`;
}
function wireQuestions(sec){
  const upd = e => {
    const id = e.target.dataset && e.target.dataset.q;
    if (!id) return false;
    st.ans = st.ans || {}; st.ans[id] = e.target.value; save();
    const c = $("#qcount"); if (c) c.textContent = qCount(sec);
    return true;
  };
  $("#main").addEventListener("change", upd);
  $("#main").addEventListener("input", e => { if (e.target.type === "text") upd(e); });
}

function sourceHTML(c){   // ae2: a primary text with three drawers the student opens and closes freely

function callName(n){   // "Dr. Elena Whitfield" -> "Dr. Whitfield"; "Freja Lund" -> "Freja"

function mailHTML(c){
  const chosen = st.choices[c.id];

  if (chosen) {
    const o = c.offers.find(x => x.id === chosen);
    offers = `<div class="offers done">

}
function wireMail(c){

        + ` Check code: ${code}.` : (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
</html>
