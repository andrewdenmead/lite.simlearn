<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Generational Ledger — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
}
</style>
</head>

DpMNRQ7IR6L4n/nTo/wARYK/EMNfiUtPxNgR4gv0IMz8EMvJ0h4FjggpTS3BYsmomkNf8pY7TorO/9zr06tHgUTyi+co7xfa+Z0FL9qWdov8AyRf+SX/yR/uIr/NP/aj13zO8y3VipfeLLevqf8HiMfXH/HP/AEerK/4r0Yxl+tQ9WYhK9azK/wCUlelf8E5/416kd/8AbH0zKiUGOnFaiwzJF6dvTpHiOO5cdzv/AMe8X1wZePTVCQsM2TiORr0W2xtsTFE5l5jGJ9yZeGfi9YwzAJvHUSpb1gou5VUX3ikuAhgnCQLRFTqXFVFl+BNLU5t+4U50VR2pVY2vQIemkSM59HU5h6begw1GMfTj/h9DcdwhHU5i59H036M5jv14l+h6D/wvpzOanM5leonH/R63GcxZIQYwjLl+rMmO4b9T05r0NejGENTj05jOPTR5gKeIso848ooWObTImkxPSx1/xzLi4hmM5J//2Q==","alt":"Students debate around a table in a committee room; behind them an hourglass of coins sits between a falling line over young families and a rising line over older people, and a screen shows a set of scales weighing a family against two pensioners"},"context":{"text":"The Republic of Aldermoor built its pension system in an era when every generation was larger than the one before it, and for sixty years the arithmetic worked in the state's favour without anyone having to think about it. That era is over. Aldermoor's fertility rate has fallen to 1.4 children per woman, well below the 2.1 needed to hold the population steady, and the country's own actuaries project that 1.9 million workers will retire over the next decade while only 1.2 million enter the workforce to replace them. At the same time, a small but influential body of research argues that the pension system itself may be part of why fertility fell in the first place — that guaranteeing old-age security through the state quietly removed one of the oldest economic reasons to have children. Whether or not that causal story survives scrutiny, the fiscal shortfall it sits alongside is not in serious dispute. The government has convened the Aldermoor Intergenerational Commission, drawing on demographic, actuarial, and social-policy expertise, to recommend how the country should respond — and has been explicit that whatever the Commission proposes must actually survive contact with the public, not just balance on paper. You have been seconded to the Commission as an adviser. Your recommendations will be read by every other adviser in the room, and by the Commission's chair, before any final position is agreed.","scar":{"label":"The Emergency Pensions Act","text":"Eight years ago, facing a sudden fiscal shortfall, the government raised the retirement age by three years and suspended pension indexation overnight, with no transition period for anyone already close to retiring. National rail and postal strikes shut the country down for six weeks; the Act was repealed within the year, and the fiscal hole it was meant to close is larger today than when it was passed. The Commission exists partly to make sure a reform is never rushed through that way again."},"proof":{"label":"The Eligibility Formula Reform","text":"A decade ago, facing a similar backlash risk over disability-benefit eligibility, the government replaced a politically renegotiated threshold with an automatic formula tied to a transparent, publicly audited index, adjusted annually by a fixed rule rather than a vote. It drew criticism at first for feeling impersonal, but a decade on it has never triggered a strike, and both major parties have left it untouched. It is the Commission's standing example that a well-designed automatic mechanism can outlast a change of government where a one-off political fight cannot."},"constraint":"The Commission must submit its final recommendation to Parliament before the next budget cycle closes in ten weeks, after which any pension legislation will be delayed by at least two years."},"roles":[{"id":"A","label":"Role A","dept":"Bureau of Demographic Research","characters":[{"id":"feldt","name":"Dr. Marcus Feldt","title":"Fertility Economist","subject":"Why the Ledger Shifted","email":"You'll want this before you touch the retirement-age question — it's the paper that convinced half my department the causality runs the other way. Kessler will tell you I've overclaimed. Read her rebuttal too, if you dig deeper.\n\nFrom the paper:\n“For most of human history, children were the pension system: more sons and daughters meant more hands to farm, more incomes to draw on, more certainty that someone would be there in old age. The introduction of state-run, pay-as-you-go pensions across twentieth-century welfare states did something no one fully anticipated — it made that arrangement optional. Using variation in the timing of pension-scheme rollout across thirty-one countries between 1950 and 2000, I find that each ten-percentage-point rise in pension coverage is associated with a fertility decline of roughly 0.3 children per woman, even after accounting for national income and urbanisation. The mechanism is not mysterious: once the state, not one's children, guarantees an income in old age, a household's calculus about family size shifts from an investment decision to a consumption one. This does not mean welfare states are solely responsible for falling birth rates — women's educational gains and the rising cost of urban housing plausibly explain a comparable share of the decline, and the two forces are historically entangled enough that no natural experiment cleanly separates them. What the data do support is a more modest but still uncomfortable claim: expanding the pension system without any accompanying family policy removes a demographic safety valve that used to operate automatically, and no government appears to have replaced it with anything as effective.”","citation":"Feldt, M. (2019). The vanishing insurance motive: pension expansion and fertility decline in postwar welfare states. Journal of Population Economics, 34(2), 211–238.","offers":[{"id":"a","title":"Another voice, same position","text":"v9KpiR+Sm4uIxWLhp5Mb5GwsGMnDNR0vOIir/vq0pwsIsqMS7D2Tbj3tVesZyph3o2FizxePBjVmq4v4W6mPFe4er0rZ2dFK/fcLHj0XIVcYZ6SGle5ERabDL6FdigH2lmzjyAvGKh8n3SnNeMNvZ96BMn9gKFTpVebDHSfH4/bfgaMGpIacA9Db8FdXBmpdQ6DoweM/fSvqih4CU0C+i8CK9ZJa22EKuSATWchDZCvUaEQXnZvBJSTBIozooofAkIB/4v g to have at least one child, not by persuading the childless to start. Countries that spent generously but inconsistently — cutting programmes after a change of government — saw the recovery stall or reverse, which suggests durability of the commitment matters as much as its size. None of the twenty countries in the panel fully returned to replacement-level fertility, even at the highest spending levels observed, which is the finding policymakers tend to leave out when they cite this literature: family policy can blunt the decline Feldt describes, but nothing in this dataset suggests it can fully reverse it.”","citation":"Anand, P. (2021). Family policy generosity and fertility recovery: a twenty-country panel, 1989–2018. Demography, 58(4), 1123–1149.","offers":[{"id":"a","title":"Another voice, same position","text":"EsLSafED5WQx0UMOACTbetbTQe2L64PSBdeUw/fIDT6QIAYjJp7D+a0nDqmOwS3PKFv4oP7+AkWyBIEY4AlKRaQCpfiZTpFE277068Cs44HYE34J+LUu45OaLTN+9uflvpX81u0jD+SDLruu7GCtOCRWbRwblwi41vAi3R2AOuHRGOH0N7BTi35zBsFPKoQP+wM1H+hHVeLLXBums9wE2NWBwRg/HxP94o8Gc/5C3MF3O++lUGTKc8AiXXdrnY6MNU9YjHgymrs4LJzSTtaizjCM9J115+qel6Ynjj4kw3dWugUFdgg2dPJTDXQy1QbpOnxDEbYMXlpe1JpIWoe9i2nGS4wnihrGHDwIPcJ68q49TmUlOY6TiCGv8jXOh1S/zI69p2QaZHys7zkb7gLUj2tv1pcidblM/hAArjIAUcdHpk8rFxNgwErjBZD286D/uovRmHOAjYXoWzo5XaIpps1mtBr9d48c4B/rjgIoe93X1pmMdINd6EjpeWAU/AY/pQsoKcR2ybrSKcmkFh6u9YKAgW9/KcOhVifUtUtNHt0eHzFQ49y6pr2uRQ0hwqZ/kOp71TUGochv4o9su3NpSMxDQAcAggqnNCgkvxTpKqYMjrqtgq+PQJEB4D9gHnYF7rk3ahLt/G/UFRyInabQ/f3GD56YwV4BJJxqDOvAG1MecKNpX2kakzTQ6iL0LrE3zT6Bx8xaAEsMTKK/2KWyyZkKIBrlM2aW+Nw9xEojBQYyNbvLPnO6i3UtnccikqkAAjGOLfGUzwNQ5mgRvNCjN4cExqlGvh8F7SaYmu9v1nQQDynZebJbpyuCHr4++4coW+B7Oop5m8QNcQx3XjAvnQTY7OVJzkqAD1rURSqbBs++zZgWrov7DCKXYDYeL+lAhtc="},{"id":"b","title":"A competing angle","text":"H2GDF3qBYIGi3r5+jMu65wqgtrqd6VfGX6K3Af4r2eR+18mBrNvRd9CUX7yxoVPXRNJlyEWWzfm15UQA1COCWXbzZnRr8KUvTHPK9wowutSpEV8fDlLA1FFup+61seO84MlQOZsY5sXpt9awpaDvewAOODYgL8+Ds18gcZen6w4YBBKKFec9wVJ4nBqfYcNZaY4Vyz1O7qOXU5W/kpKOeJ8MOC3O y the effect back with family spending. I asked something meaner: what happens to fertility when a government just takes the pension away again. You'd think if Feldt's mechanism is real, cutting the pension should push fertility back up. It doesn't, and that should worry everyone in this Commission.\n\nFrom the paper:\n“Feldt's mechanism implies a clean prediction: if state pensions substitute for children as old-age security, then cutting pension generosity should restore some of the original incentive to have children, and fertility should partially recover. I tested this directly across three pension-retrenchment episodes — cases where governments reduced replacement rates or eligibility by at least fifteen percent — and found no statistically significant fertility rebound in any of them, even a decade after the cuts, even in the two cases where retrenchment was sustained rather than reversed. The likeliest explanation is that Feldt's mechanism, if real, is asymmetric: the pension system didn't just change a financial calculation, it changed the surrounding institutions — women's education and career expectations, housing built for smaller households, workplaces organised around two full-time earners — and those changes don't unwind just because the original policy does. This matters directly for the choice in front of this Commission: if the causal story is right but the effect is a ratchet rather than a lever, then neither expanding nor cutting pension generosity will move the birth rate much in either direction, and family policy of the kind Anand studies, working on entirely different institutions, may be the only lever that still works at all.”","citation":"Reyk, T. (2022). Testing the reversibility of the old-age security effect: evidence from three pension retrenchment episodes. Journal of Population Economics, 37(1), 44–69.","offers":[{"id":"a","title":"Another voice, same position","text":"AMCOw8KS6LYFELPcZZRPgGh8RfbglJruk/KAB8+wA5KPFI9+9+1CXDd7gX2kyq+XT  decade or more — but building a pension system's solvency on an assumption the country has never actually achieved is a choice this Commission should make with its eyes open, not a reason to set the demographic question aside as already solved.”","citation":"Bracewell, E. (2024). Dependency ratios and the limits of productivity substitution in pay-as-you-go pensions. Actuarial Science Quarterly, 58(1), 12–39.","offers":[{"id":"a","title":"Another voice, same position","text":"d9alYJcbtxy2OmzE1et5lSkslOmFwadpBeLrLvstosBO6c6I+jueQeqdu7OLUBymRgGyEukEQjO9saZWl3m+ZpHPZGq6jqQBT4ewmAMPZwauj4dl+psAILmMUbk02KvBvCSYexueE7FvU0J/v6KYGzLfJEqmU7cd1J4tCvAJrFdIrwyMCTFHI6buGpLTzc1kk2ekF3x5/knjbOEBtkWY3rAFRlIHvfsP6G7baHlaHKDViclPOnQtwF7iUcYsufAU6SVU1AOC9qhYFzSZq50F7+snvUq0xuiYb7QAx5QEzf1h43L7Gzc+GJ9SRwLU3mfp7pcdQYWgSIFQq7t2l8Ekf1i4TDg/MfdMr65BP/+7tGDhNDr1KCSgLJzFTUZDyUfsSjYbGp/DYvKOpX/wikHIy3HudzS4bh5wkMN319QXjiXR2wv9uU1cqhNy1o6rtX2a/Tjwm4NRv1JlAyNidCbbqsy5kINYOeB4l5Cv8HNCaDTYrvyRAHddDkT+8DPHPMULQrRJKHhWxwb9jWJKGyc1Mmrsl2glbNOXXBC1Jzaj8ZNk0HX1j7zGcwxmzslpV9qdnXgNXrLkdBvsRIwBb6s2iIx6GiVSIm9H6wS9UZ12xbZG7UXUKqzKnOWKdi13kTxTtSB0BK4/Vj6WYE4f5AKUYLtYz4lm/UhEkpXyvkmZ5QJhiCInbJNgQDIc3Xhsd/DE0G6QarRLVc5ZvOoRmP5w9Cc47fV9YccGKgdQUUvcdAC5bJpZUH1gpTZVlTVHjLhicz3R54BGv8ew84y9PvttuKJzpokoXh3FvmaVMHbAXqmkX1vd/cWd42PmY9yfWtt/5TZ83Oq2DC1pxPyxEaP6f8KDpYRB+8IzpIdX8lU9w8WuQiWZgbg/1Yj1YSQd6i0obgs2ELFCtyzznekVMpFl4db15u3yIyAzyDY+bc0b79qKPueOJo0IeOJwzlYRqBZtN0w="},{"id":"b","title":"A competing angle","text":"hcK+g1H9jskNcKD+cGIl2B91Od6gZhOs2c7Adgx9FS61I5Ri/APNFt85YKVuu0OHglsqXNb5xtot+iACuV02VvPrGnkO4ANlhKiP+YCEsSWN6InCFwOeK3rvhPU6TywEFVUOwgfsCVewFo8DIgBFlooUC24tCxHl3oBndGvBVviv/7iTd1VfilE+bEk3Cda4Lfa4TyI/GcKoqQvxLQFzF5cgqdcpBN4jr8KO1cDC/oiobhhYx2U0So8242Gw1wj2CSyJnOT8ca/hCUdPUBfvR0Z0vT1DOA2MF8sXN3Iz0ZByUvSBOwhTeTm+5vDOnMrNpH9MZ58JSaM+GO3NojXU6G5l3uWf0QOI46tJANRc0o/joaUlW4f+3kh9qIbagj6yS1OVUuOfFof/ANGp2OpatGSC5z0HTMWkgF0mcCUhjCeBpEBkjf4uFTectk73+L89nKVi6j1HzUrIP8FdHmKzD8erOd4eX5D6B3GEFopJSIv46k9YDJmqJeeM1 al-funded pension system, where contributions are invested and pensions are paid from accumulated returns rather than directly from current workers' contributions, has a real advantage over pay-as-you-go: it is not mechanically hostage to the dependency ratio Bracewell describes, since returns can in principle keep growing even as the workforce shrinks. But the transition from one system to the other has a cost that is easy to describe and hard to make politically bearable: the generation that switches over must fund two systems at once. They pay into their own new, invested pension pot for their own future retirement, while simultaneously continuing to fund the pensions of everyone who has already retired or is close to it under the old system, since that promise cannot simply be cancelled. Across the twelve countries that have attempted this transition, the double-payment period in the nine that completed it averaged twenty-two years, and in nine of the twelve cases, the transition triggered a contribution-rate increase, a delayed transition for near-retirees, or both, in order to make the double burden politically survivable. The three cases that tried to compress the transition into under a decade all saw the reform partially reversed within the following parliamentary term. A fund is not an alternative to hard trade-offs — it relocates them onto whichever generation happens to be alive when the switch is made.”","citation":"Lindqvist, A. (2025). Transition costs in the shift from pay-as-you-go to funded pensions: a twelve-country retrospective. Journal of Public Economics, 241, 104–131.","offers":[{"id":"a","title":"Another voice, same position","text":"DKdCfaAGWCu21MVyclETf+K8ZfJmfdA6OwOtOTwnHFab6PanIKG82QI2ue3MggQidv1tRDFc6EO+QAoBMrAH3awbKZscRKhypj1J90h1GB+C6Q8LFvkx7OWaTrbAclQGHw1NvxQgXDNmC4xfHxSF54u6jxfKGyV9J/bFrBAkDZSukaYb/weJUIBb921Z8jW1fNMjXq/UOFohIcsR2utB2gasyPREZ+FGvDlJL5zbnRxmEeCEiHqbe0kLIh5HeXutqrGY10o4shv34Cbx7PnUR9mxgOZ/Nux5da4MQhEGBQ6U8vR8t+WXF9JKv , shows the same pattern. The honest limitation is that life expectancy has not risen evenly across the population — it has risen fastest among workers in professional, desk-based occupations, and considerably more slowly among workers in physically demanding manual trades, so a single national formula, however well designed politically, still asks the most, relative to their gains in longevity, of exactly the workers with the least capacity to absorb it.”","citation":"Strand, N. (2021). Automatic indexation and the political durability of retirement-age reform: a comparative study. Social Policy & Administration, 55(6), 812–835.","offers":[{"id":"a","title":"Another voice, same position","text":"FZU6uclQA2/VICk+5eT20UFuPpKSKOIZTRRaRSSrKBg+kh1bQBr/WhQTLy/vHXfqNd1Nuq/q8/Od50GaNZlaqEwGB9h/RMHWQ5hnyh6ULNochJYjEFXVaG15WpNWrIJVWCP8Jkb2H4eOVsMg+GzYVxD1aAT82+KWCB+qUogyatUDqpAlEkTD1fum9u/h4eK4b1TRYugDV+JG+xDl6UKqOxMv4ZXf7r6GI+Pi5x+qCLEXWLej6jGBU5wLwirLttWMR9umIsm00QEJSaDfJWVz35ZAO5ZOePWiHR6+lZCcyzHYYnxzp030sTDZ4CSyFHTHJIet/P2NAK9n6OpnBxF1GcuN1fP8629nIemV2UwYI4cNDAZxaMvvBRk6FY+lkwPJUOU5fUX3x2cWvtcMgJF+QTvAeVNsghYpVSubOI0owR0ni28a00JidNFV4yS+VWQSzqFUaBP8EtZOlrqlEaLhhmIhgwrKtk+i3LjUPudCcZTH9V1/n1T7+PSwsMNpgY48HnWJoFPWD7QZHcol4ka5FoQX/VDNrUHbz20Hnd8bwN0ZI+2/nd5dBGdYjzN08r8ksnIYNkxB7pYgmZw/3s1h9/HVXtgyVLAO3i9pFZpJRFtFBlLQ/fEWOJF96jSYQ2d6wAUO/8M3DnW+k4sXBYlrn08Iayv2Kb0JPInp/WhUvtNJLpRtlxqWzbO5zro7YYxRYbVGIsI4EbxKasb81UEgxO/gTDyC64gOl+dSjevusg=="},{"id":"b","title":"A competing angle","text":"AtqXTRnKplb1lKrcrrK4vSXDfBCvooPL2DXgS0pfaWeeNTxoHGFC0yT3WclFliZspki5zk6aZgiEg7ecwcizY/qFMyQpp+qW6gcHokTUXC2hLSFIY06/BZL2tRPrHTsHIEAEFHhzUQakhG0h96CA4ebT7Z2kaxP1R7aVLBZSzHzO6CsRlVpcGiZmUHN/wcT5x90He39w5wOn7oUb00YHKUk/xf+LoGakCRIzaPtyP9bsa+E6jtn8DbpjX2iOqld1XNzP9YULy1jw7zvImRl8GRBdLEb3AEx7WAHje6f2DkTlDkJajuI8UFldPFAGTj+hQk6AjUuA1rUzdKY0jvEM47ynSiMh908womsx2ug3Q9pmjnL1RFYC+ItRQ63oxAHccvf8Ef+SlZF2Skn73gtJZLXrj2SyA3Npcdssjm75CV1csscWxVmMABX5D+qh+Rg+2lzvxvEY9v4Tpk2zYn0XgP5U/BLbXAqbcly49LD4/uwSmY+5/ who has spent thirty years paying into one under an explicit set of terms, the pension is not merely an expectation, it functions as an accrued right, structurally similar to a debt the state owes rather than a benefit it may freely revise. I argue that the ethical weight of a reform depends heavily on where in a person's working life it lands: a change affecting someone with thirty years left to adjust their savings and plans is a policy choice; the same change imposed on someone five years from retirement, who structured decades of decisions around a specific promised outcome, is closer to a breach. This does not mean pension systems must be treated as permanently frozen — the Eligibility Formula Reform in this country's own disability system shows that even substantial redesign is possible without breaching accrued rights, precisely because it applied prospectively to new claims rather than retroactively to people already relying on the old terms. The genuinely hard cases, and the ones this Commission will actually face, are the workers in the middle: fifteen years from retirement, too far along to treat the promise as fully revisable, too far from the finish line to be fully protected by grandfathering either.”","citation":"Marsh, H. (2019). Accrued rights and the ethics of pension reform: when does a promise become a debt? Journal of Social Policy, 48(3), 455–478.","offers":[{"id":"a","title":"Another voice, same position","text":"zJSzax/i09eSPuQQVWGnoxhtEWs9bDWj2bqV959ltOpvOItNBAevBfiK9vRgurIfS8nhxodwWReXOTf2vpDmSpInANjd/GI+f4qMh94WBRh1wb8UwGtxzSjdqc6RVrMyw+ZjvaxxfTFItqMSo91h2dNbIWQDLgqKOTvWq7pTeVX+Ikx6UEHnuSg3UPZPN5x99Al2kdKp0x6iiAXyGGO+cCYubl/jugXzSdx5EuMYX0pGHvjKcmjRh7rbMQfGSE2+uzfbDY0oH+pem49zSBbpLovktgjsJOoaJyqOkFgQ4yoCGZivRhjchej0MDg2V3HAgMbEOn7oLc5ljK59HyFJXRyTcwcS02zR480X6RmhIfsxGAOn8T6Zo/2OKhx2KW7+dxd9s0lSmLYkAUV0tVRCoAFzcEBPhsCsC3zHYJ5NtPPUQJ+f2dkJnkTUuKg2bg3V2WLD0C6Hy1rP9iP+7d/n/Ag9WA4UZMMC1y5qKDIhs7XBY0yzsqM+lIFbm30klXYCQpgxIlU7jEOE2hnGZR7IgF382S47 ket loss in another, and that loss does not show up in any of the fiscal projections this Commission has been given so far.”","citation":"Osei, F. (2022). The gendered incidence of family-policy design: care credits, leave structures, and women's labour-market participation. Feminist Economics, 28(2), 88–114.","offers":[{"id":"a","title":"Another voice, same position","text":"LRZPxV1JqWWiT/+fT8EjbRC8zwOVSXdxpQcDcVFiImh3/Wb9eL/cLBd8NtthS67L6W8jh3IKHMdLYQMqpFzTRHN2KzhlveMf1yMTx8Laz0aGznmB4NQhYoL20jiNDWRFUH6t94pO09E70ZkD4UHWsftf7/2++KZKAnZoz1rbpJIIrFW7Agxt0GMyoHIoek5FIlrxm2wKHWolsd/ytahayG2DxlhkkpXv7JnErgg3mfee1TCMNjgZmzZRD/T0/t2iH1a6v4vDDTvxrFxNAhmucM6SSitOakbARR8J6GSmEniB5/FJPe8UZUkQgZUHMn9oS+0YiqN4zj3Pn1x1dBtPIBHGRDa5qVLhVG+cfaPSKxz7rk/RaH8iLTTSVKwaV4T+VovWUJ2Q/+mHKeMI5o2gPVohZbK/5HihhbhCtNeXPfmUbkeuU8Ehi+27bHUOZ2qOZNNPTZhuImmeUvjIWxjTgruEtIvFEulASFR8BRYhLV9CX+cvyMt8eA4rrZzy2Ju+2nikEI1ls1RmOMf2OhF3bD4ypGyyV5HcEk+O9ic288R+Nt8D7N/E0n2UJpSF6WGzc9IRmJ0auWj1eRN7O/JFZUGSMBifE8tQ6Wa4bpdrq6KAmy7sdSBLu4x9ZfnGmjvbzaeREYgQFA68QQfEbd1x9oEmnmXN5d2IGr/NUUf22n7d5HSGhxMxdBJrJrmX6xpeu+aOpABH1dDWGVyMOs9HxDOTCq+P4xOl96Z7KAQ0l/WLMjkQCFuEoV0JkasTwQOP2P89WfiNVpXuQC43DvE="},{"id":"b","title":"A competing angle","text":"vzy9kiJwyE24FbVsT6lSeIBzrkEC4FsPmMw0giVqEZpzGFkQHlLfPIzMRWQVmIRh6wFYspTr3pZ2tmOorvDm7zqcvrcgD3ukAhFUJleCuEFEWVBM59UFc047jBM0zJZbuXbv2lebsVX2ujrV7ypOFhJuHiXYZ28Ss2rJA57Sd7N3yiCo0e7HwDePN0nUyHrg3XfkUH/MXrXYck7T6IL2wKh4zJMvwr73IpzzuGCz8Uwl23qVsG79CTDqPtI3f5u8tehhoe7RGMDGnRTg9RMZu3h5vJ4Z20VhJBu8HO+lteJvNgavcydPNhi+pWKjVAf0kbFnVnembmk2ip3spEDMxF8y4eOUJVhg1Aq0K0iFeyiKDZnIRcfwLItBPYiI7CogolRqgQP1isfEh+O/1F1q0gBhczOhakqnzcnpuOpY+t/EBUkWRYuWKX5i1iBZ8fEuCE+HbAMiXbbX1kJc1caMt0Yk1ch46lIRj1yqvViw4pNz+ArhjEEAe6YaIx/iVOxPpRddDnFVsscALq9iFtA+T5ardnzcA4D+adBG6ZfJyScbne8arBzxrL+IlAPXD4rDzu+qaPpEpU2qOg5vuj8xJjtLd19PsFIdbah/qbaJAVHhBtY9/c/xarHASx6/OTLkcMz/tlgA+abfebjXikIu5uo4Q8pRerSt+hqJihlDmWnAu/fC2SjQBKNnIC8TqJ5Ct4vdIr9g0Xy0K3kbvz9b23WyeFWCZa+S7vNCS5jig/jbfEZ6oef1HtE5MGHhsW5iN6+PSd0wXNf9jBLR ty and which country enacted it. Grandfathering existing pensioners and near-retirees under the old terms, specifically, appears in the data not as a compromise that weakens a reform but as one of its strongest predictors of durability — reforms that grandfathered anyone within five years of retirement survived at more than double the rate of otherwise-identical reforms that did not. The uncomfortable implication for this Commission is a direct trade-off with the fiscal timeline: the reforms most likely to actually stick, and therefore most likely to deliver their projected savings at all, are also the slowest to reach full effect — meaning a Commission under pressure to show results quickly faces a real tension between choosing a reform that looks decisive now and choosing one that is still standing in ten years.”","citation":"Achterberg, S. (2023). Pace of implementation and the survival of pension reform: a 24-reform event history analysis. Comparative Political Studies, 56(9), 1401–1429.","offers":[{"id":"a","title":"Another voice, same position","text":"AmbkKUfOo+Mv3zqfX8Z2c459POXZT53FYiDBLv8DyJ9X9+YsBL0PR26RoAlOTgKQ3bQ93+r/fUgeu+vJ2ofzAzugai5E0nE+XslLoXHAT761ueCUtlMTcOrbv3HNcNu/Oy/hkM+ZqAca2JFabVHQP3FaO8bcZl1U6I8pWsa/5ZOQ3J0+kW0ppzLuJtT7hiDuLzKitbNtTNBXngB/vYQnu0Riq9g+4a1TQTebG0PbqmradSwMCbYbmqtU1CTu7BOBl6AEEvuK2Wbjqlf4LIDfVvOmPRAXtuRhYLKzOfUbM+o8NAkjk24B0LzsVC7VB71v9xcelgrviPyQQvKsuZCTzEzpTG82HVwXZXJcxD3GC4jgo/6oeOtr4IuwQagYRPsv6Eg8252DL053EnqgjoDE/z9yq0dm75/v/O21L7F/Hz/Sfividi7ZhiwhoaOAS/WluecQDCPJ7htbE4LvwUurjVBqh9nDDgeOG/5/LUoq0hfsAzxf/eV53L5MRbQkwjMiIELOIHYz+IJFoUxtql7IPUb0a/NE01ngrEH/U4aPDtcfgeVYyg7fu0o5v5dX7azFLipOGqH7PMBrmqyaTGPxtyssvqGM5Zgb2tn6W4zQK266SdQBdKFt+WPjBYvm300SQBrnIfbdI2sYfgbOyUw3NrVEEfux7AvWeillGZgYCWWXZoYPQ6cG60EphmPpRKqpkBK70wXMV73+4n3N4NAzpWijrti1GKqTDfqRSI5tVQK6HzZyY3p6e7Y4os4/z293VB4OENMMg7rF"},{"id":"b","title":"A competing angle","text":"homo5Yuv6EPegZpeKV5C8I5k1/3Q8+p/Px2nsfYYVZt16KwQUaEqfrdzYSBkxtl9ZVJBcMTMsRlv/VIZgdSXZd8dvq1JtN/M are the real drivers; welfare design is incidental.","short":{"A":"Welfare substitution","B":"Structural and cultural forces"}},{"id":"P2","title":"Is this a headcount problem or a productivity problem?","A":"Headcount: the shrinking ratio of workers to retirees is the binding constraint, and higher output per worker cannot substantially close the shortfall.","B":"Productivity: sustained productivity growth can substantially close the shortfall without needing more workers.","short":{"A":"Headcount","B":"Productivity"}},{"id":"P3","title":"Is the pension promise a legitimate debt, or a flawed design?","A":"Legitimate accrued entitlement: today's pensioners paid in under an explicit promise; changing the terms now is close to a breach.","B":"Structural flaw: the pay-as-you-go design always depended on each generation being larger than the last, so it was unsustainable from the start.","short":{"A":"Accrued entitlement","B":"Structural design flaw"}},{"id":"F1","title":"How should pensions be financed going forward?","A":"Shift to a capital-funded system, accepting that one generation effectively funds two pension systems during the transition.","B":"Keep pay-as-you-go and close the gap through higher contributions or general taxation, accepting that the system stays tied to the ratio of workers to retirees.","short":{"A":"Capital-funded system","B":"Keep pay-as-you-go"}},{"id":"F2","title":"Where should the main policy effort go?","A":"Raise the retirement age and index it automatically to life expectancy, planning around low fertility as the baseline.","B":"Invest heavily in family policy, treating the birth rate itself as something sustained policy can raise.","short":{"A":"Indexed retirement age","B":"Family policy"}},{"id":"F3","title":"How fast should any reform be applied?","A":"Grandfather current pensioners and near-retirees under the old terms, so the savings arrive more slowly.","B":"Apply the changes immediately to all cohorts, including those close to retirement, so the savings arrive sooner.","short":{"A":"Grandfather near-retirees","B":"Immediate change, all cohorts"}}],"writing":{"type":"policy_brief","label":"policy brief","addressee":"Dr. Rosalind Kemp, Chair of the Aldermoor Intergenerational Commission","words":420,"instructions":["State a clear position on each decision — not just what you chose, but why","Cite specific sources in Harvard style (Author, Year) every time you use a claim, e.g. (Achterberg, 2023) — including anything a teammate told you. The full reference is under each paper in the Inbox","Acknowledge the strongest objection to your recommendations and answer it directly (your 'However…' notes are a good start)","Write for a mixed audience: some readers wanted a different outcome — bring them along, don't just announce a verdict"]},"two_player":{"roles":[{"id":"P1","label":"Player 1","dept":"","characters":["feldt","bracewell","lindqvist","strand","osei"]},{"id":"P2","label":"Player 2","dept":"","characters":["anand","reyk","marsh","achterberg"]}]},"teacher_url":"https://teacher.lite.simlearn.online/","salt":"c526f9d1"}</script>

function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));

const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){

const OPEN_Q = "\u201C\u2018\"", CLOSE_Q = "\u201D\u2019\"'", OPEN_B = "([", CLOSE_B = ")]";
// Split text into sentences: returns [{s, gap}] where gap is the whitespace before the sentence (text = all joined).
function splitSentences(text){
  const out = [], n = text.length;
  let start = 0, i = 0, quoteEnd = -1, depth = 0;
  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };
  while (i < n) {
    const ch = text[i];
    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }
    else if (CLOSE_B.includes(ch) && depth > 0) depth--;
    if (i > quoteEnd && (ch === "\u201C" || (ch === '"' && (i === 0 || /[\s(\[]/.test(text[i-1]))))) {
      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";
        const initial = /^[a-z]$/i.test(word) && !/['\u2019\w]/.test(pre);   // "Oduya, B." but not "don't."
        const isAbbr = ch === "." && (ABBR.has(word) || initial || /^([a-z]\.)+[a-z]$/i.test(word));
        if (!isAbbr && (next === "\n" || /[A-Z0-9\u00C0-\u024F\u201C\u2018"(\[\u2014\u2013\u20AC\u00A3$-]/.test(next))) { push(j); let m = j; while (m < n && /[ \t]/.test(text[m])) m++; push(m); i = m; continue; }
      }
      i = j; continue;
    }
    i++;
  }
  push(n);
  return out;
}

function citeOf(citation){
  const y = (citation || "").match(/\((\d{4}[a-z]?)\)/);
  if (!y) return "";
  const who = citation.slice(0, y.index).trim().replace(/,$/, "");
  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;
}

  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
  const para = (s, font, size, lead, grey) => pdfWrap(s, font, size, TW).forEach(l => {
    if (y - lead < M + 20) newPage();
    y -= lead; if (l) text(l, font, size, M, y, grey);
  });
  para(title, "B", 16, 21);
  para(subtitle, "R", 9.5, 13, true);
  y -= 14;
  para(body, "R", 11, 15.5);
  y -= 18;
  para(note, "R", 8, 11, true);
  newPage();
  // objects: 1 catalog, 2 pages, 3 font R, 4 font B, 5 embedded file, 6 filespec, 7 info, then page/content pairs
  const objs = [];
  const enc = new TextEncoder(), blockBytes = enc.encode(block);
  const kids = pages.map((_, i) => `${8 + i * 2} 0 R`).join(" ");
  objs[1] = `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [${pdfStr(fileName)} 6 0 R] >> >> /PageMode /UseNone >>`;
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;
  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;
    const content = enc.encode([...p, foot].join("\n").split("").map(c => c.charCodeAt(0) < 256 ? c : "?").join(""));
    objs[8 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${9 + i * 2} 0 R >>`;
    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });
  // assemble with byte offsets (all strings here are ASCII)
  const parts = [], offs = []; let len = 0;
  const add = b => { parts.push(b); len += b.length; };
  add(enc.encode("%PDF-1.7\n")); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));   // marks the file as binary
  for (let n = 1; n < objs.length; n++) {
    offs[n] = len;
    const o = objs[n];
    if (typeof o === "string") add(enc.encode(`${n} 0 obj\n${o}\nendobj\n`));
    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }
  const xref = len;
  let x = `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${st.choices[c.id] || "-"}`).join(", ");
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · Role ${r.id}${r.dept ? " (" + r.dept + ")" : ""} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
