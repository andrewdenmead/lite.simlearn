<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Kindest Lie (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i,.pin i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.pins{display:flex;flex-direction:column;gap:6px}
.pin{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.pin[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.pin span{font-family:var(--serif);font-size:15px}
.pin small{display:block;font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>
  <h1>The Kindest Lie</h1>
  <p class="whoami" id="who"></p>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main><div class="wrap" id="main"></div></main>
<div id="hlpal" hidden role="dialog" aria-label="Highlight colour"><button data-hlc="yellow" style="background:#FFF176" aria-label="Yellow"></button><button data-hlc="green" style="background:#B9F6CA" aria-label="Green"></button><button data-hlc="pink" style="background:#F8BBD0" aria-label="Pink"></button><button data-hlc="blue" style="background:#B3E5FC" aria-label="Blue"></button><button data-hlc="orange" style="background:#FFE0B2" aria-label="Orange"></button><button data-hlc="purple" style="background:#E1BEE7" aria-label="Purple"></button><button data-hlc="none" class="none" aria-label="Remove highlight">✕</button></div>
<button id="fab" data-act="nbopen" hidden>Notes (0)</button>
<aside id="nb" hidden aria-label="Your highlights and notes"></aside>

<script>
const ROLES={
 A:{name:"Evidence Analyst",line:"The campaigns",detail:"You weigh the evidence on what the campaigns achieved and why. Your inbox holds the independent evaluation and research on how messages change behaviour."},
 B:{name:"Ethics Adviser",line:"The ethics",detail:"You advise the commission on the moral question. Your inbox holds the two most cited papers on whether deceiving the public can ever be justified."},
 C:{name:"Policy Adviser",line:"The unit's future",detail:"You draft the commission's recommendation on the unit. Your inbox holds the research on trust in the news and on how such a unit could be governed."}
};
const REL={high:"Peer-reviewed or independent",medium:"Survey, estimate or personal view",low:"Weak evidence"};
const fmt=n=>"£"+n.toLocaleString("en-GB");

function hbar(rows,o){
  const W=500,left=110,right=48,rowH=32,top=8,H=top+rows.length*rowH+24,min=o.min,max=o.max;
  const x=v=>left+(v-min)/(max-min)*(W-left-right);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">`;
  o.ticks.forEach(t=>s+=`<line class="${t?'axis':'zero'}" x1="${x(t)}" x2="${x(t)}" y1="${top-4}" y2="${H-20}"/><text x="${x(t)}" y="${H-5}" text-anchor="middle">${t}${o.unit}</text>`);
  rows.forEach((r,i)=>{const y=top+i*rowH,a=x(0),b=x(r.v);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="${r.hi?'neg':'pos'}" x="${a}" y="${y+6}" width="${Math.max(2,b-a)}" height="${rowH-13}" rx="2"/><text class="val" x="${b+6}" y="${y+18}">${r.v}${o.unit}</text>`;});
  return s+"</svg>";
}
function donut(l,p){const c=2*Math.PI*38;return `<figure><svg viewBox="0 0 100 100" width="84" height="84" role="img" aria-label="${l} ${p}%"><circle class="ring-bg" cx="50" cy="50" r="38" stroke-width="12"/><circle class="ring" cx="50" cy="50" r="38" stroke-width="12" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text class="val" x="50" y="55" text-anchor="middle" style="font-size:15px">${p}%</text></svg><figcaption class="muted">${l}</figcaption></figure>`;}
const PRO_COVER="";   // the cover picture (build.py fills this in)
const PRO_AUDIO=[];   // the recordings published next to the page (build.py fills this in)
function audio(t,voice,script,file){if(file&&PRO_AUDIO.includes(file))return `<div class="audio rec"><div style="flex:1;min-width:0"><div class="t">${t}</div><audio controls preload="none" data-f="${file}" src="audio/${file}.mp3" style="width:100%;margin-top:6px"></audio></div><details data-tf="${file}" ${(S.heard||{})[file]?"":"hidden"} ${(S.tOpen||{})[file]?"open":""}><summary>Show the text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;
 return `<div class="audio"><button class="play" disabled aria-label="Play (recording to come)">▶</button><div><div class="t">${t}</div><div class="s">Recording to come: read the text</div></div><details open><summary>The text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;}
function mail(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k];
 return `<details class="mail ${r?"read":"unread"}" data-mail="${encodeURIComponent(k)}"${o?" open":""}><summary><span class="from">${r?"":`<span class="udot" aria-label="Unread"></span>`}<span class="lbl">From:</span> ${m.from}</span><span class="subj">${m.subj}</span><span class="tag"><span class="rel rel-${m.rel}">${REL[m.rel]}</span></span></summary><div class="body" data-src="${m.from.split(",")[0]}" data-q="${m.rel}">${m.body}</div></details>`;}
function att(name,html){return `<div class="attach"><div class="an">📎 ${name}</div>${html}</div>`;}
const ref=t=>`<p class="fine">Reference: ${t}</p>`;

/* ---------- inboxes: briefing notes from the commission's sources (each role owns one question) ---------- */

const INBOX={

   <p>Our evaluation compares 2032–2034 with 2028–2030, allowing for trends already under way. Road deaths fell by 14 per cent, fly-tipping by 22 per cent and household electricity use by 7 per cent, while blood pressure checks rose by 31 per cent. Children injured at substations and on railway lines fell from 38 a year to 17. The effects appeared in the weeks after each campaign and were strongest where the stories were most widely shared.</p>
   ${att("Campaign costs and reach (technical appendix)",`<div class="tw"><table><thead><tr><th>Campaigns</th><th class="num">Budget a year</th><th class="num">Adults reached</th><th class="num">Change in behaviour</th></tr></thead><tbody>
    <tr><td>Factual, 2028–2030</td><td class="num">£39m</td><td class="num">71%</td><td class="num">0–2%</td></tr>
    <tr><td>Invented stories, 2032–2034</td><td class="num">£41m</td><td class="num">74%</td><td class="num">7–31%</td></tr></tbody></table></div><p class="small">Both used the same online targeting platform from 2029.</p>`)}
   <p>Two caveats. The figure of about 1,900 lives saved comes from a statistical model rather than a count, and its plausible range is wide: 1,100 to 2,700. Moreover, Pryor (2035) estimates that safer cars explain between a quarter and a half of the fall in road deaths, although no comparable explanation exists for the other measures.</p>

  {from:"Kwaku Appiah, Thameside University, London",subj:"Briefing note: why statistics are about nobody",rel:"high",body:`
   <p>Why did invented stories succeed where factual campaigns had failed? The difference, I argue, lay in the message rather than the money. Where the factual campaigns spoke of “one in ten” or “a 30 per cent higher risk”, the stories offered a named father, a nurse, a boy in a hospital bed. We respond far more strongly to one person we can picture than to numbers we cannot; a statistic, being about nobody, moves nobody.</p>
   <p>Controlled tests with 6,000 adults bear this out: a message built around one named person raised stated intention to act by 23 per cent, against 4 per cent for the same risk given as a statistic (Communications Evaluation Unit, 2035).</p>
   <p>The most serious rival account is Laird's (2035): the later campaigns were better timed and placed through trusted local outlets, and delivery multiplies almost any message. Timing surely helped. It cannot, however, explain a gap that persists when delivery is held constant. The uncomfortable corollary is that true stories might work as well, but they are harder to find and to control.</p>
   ${ref("Appiah, K. (2035) 'Why statistics are about nobody', <i>Journal of Communication Research</i>, 61(1), pp. 1–20.")}`}
 ],
 B:[
  {from:"Eva Rosendahl, Winchester Institute of Philosophy",subj:"Briefing note: the right not to be deceived",rel:"high",body:`
   <p>My argument is that the unit acted wrongly even though its campaigns saved lives. Persuasion offers reasons and leaves the decision to the citizen; deception plants a false belief and decides for her. Nor can anyone consent to being deceived, since a lie works only if its target is unaware of it.</p>
   <p>The second problem is trust. Public safety depends on people believing what they are told in an emergency, such as a flood warning, and every invented story spends some of that trust. Sissela Bok's test of publicity asks whether a deceiver could defend the lie openly to those deceived; practices that fail it tend to expand quietly.</p>
   <p>It may be objected that the unit told only kind lies. Yet a government that lies kindly has still decided that its citizens cannot handle the truth. Good results cannot make deception right.</p>
   ${ref("Rosendahl, E. (2035) 'The right not to be deceived', <i>Philosophy and Public Affairs Review</i>, 44(2), pp. 101–118.")}`},
  {from:"Simon Carver, University of the West Midlands",subj:"Briefing note: fiction has always kept us safe",rel:"high",body:`
   <p>Britain has used fiction to keep people safe for decades. The public information films of the last century were invented stories performed by actors, many deliberately frightening, yet nobody thought the children who watched them had been wronged.</p>
   <p>Admittedly, the unit went further, since its stories looked real. Its aims, however, were narrow and the harm close to zero: nobody was sold anything or told how to vote. The stories asked people to drive more slowly, to see a doctor and to keep children away from danger, and most people, asked in advance, would surely agree to be frightened into a health check.</p>
   <p>Set against this is the evaluation's estimate of 1,900 lives, at about £65,000 per life saved (Health Economics Unit, 2035), roughly a quarter of the cost per life of speed cameras. Critics such as Adebisi (2035) reply that the films were openly government films, and that the wrong lies in the disguise. That objection deserves an answer; it does not, in my view, outweigh the lives.</p>
   ${ref("Carver, S. (2035) 'Fiction has always kept us safe', <i>Public Health Ethics Today</i>, 19(2), pp. 66–82.")}`}
 ],
 C:[
  {from:"Matthew Brook, Northern School of Media, Newcastle",subj:"Briefing note: the cost to local news",rel:"high",body:`
   <p>The local papers and radio stations that ran the unit's reports did so in good faith; even experienced editors could not tell them from real ones. When the leak came, readers did not simply stop believing the invented stories: they began to doubt the real ones. Trust in local news fell from 54 to 41 per cent and has not recovered, and families who had suffered real accidents were accused online of being actors.</p>
   <p>Supporters argue that the unit could continue under strict rules. A lie that is later disclosed, however, still damages the truth around it, and remits grow: a 2034 internal memo proposed extending the unit's work to “public order” (Achterberg, 2035). I conclude that the unit should be closed and invented content banned from government communication.</p>
   <p class="small">A note for the record: the reports reached local outlets through Castlegate Media, which also ran the targeting platform for both the factual campaigns and the stories from 2029. Castlegate's chair sits on the board of the Campaign Effectiveness Forum.</p>
   ${ref("Brook, M. (2035) 'The cost to local news', <i>Journalism Studies Today</i>, 26(2), pp. 55–74.")}`},
  {from:"Henrietta Quirke, School of Government, Birmingham Midlands University",subj:"Briefing note: rules, not bans",rel:"high",body:`
   <p>A ban would forbid the government from doing what advertisers and foreign states will go on doing, while removing the one actor whose aims are public and accountable. I propose instead that invented safety content be permitted only with prior approval from an independent board, restricted to a published list of safety goals, and disclosed in full within two years. Lies certain to be revealed on a known timetable are a different instrument from secret ones.</p>
   <p>Public opinion is more divided than the headlines suggest. The National Opinion Panel (2035) found that 63 per cent thought the unit wrong to deceive the public, yet 55 per cent wanted the campaigns to continue in some form. Trust in public health information, which fell from 61 to 52 per cent after the leak, had recovered to 57 per cent by June.</p>
   <p>The obvious objection is that rules can be bent. My answer is that a ban can be broken too, and in secret; disclosure at least makes a breach visible.</p>
   ${ref("Quirke, H. (2035) 'Rules, not bans', <i>Public Policy Review</i>, 40(3), pp. 210–228.")}`}
 ]
};

      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)
        const chars = [...word]; let n = 0, w = 0;
        while (n < chars.length) { const cw = pdfWidth(chars[n], font, size); if (n > 0 && w + cw > width) break; w += cw; n++; }
        lines.push(chars.slice(0, n).join("")); word = chars.slice(n).join("");
      }
      line = word;
    });
    lines.push(line);
  });
  return lines;
}
function utf16Hex(text){
  let h = "FEFF";
  for (let i = 0; i < text.length; i++) h += text.charCodeAt(i).toString(16).padStart(4, "0").toUpperCase();
  return "<" + h + ">";
}
function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
  const para = (s, font, size, lead, grey) => pdfWrap(s, font, size, TW).forEach(l => {
    if (y - lead < M + 20) newPage();
    y -= lead; if (l) text(l, font, size, M, y, grey);
  });
  para(title, "B", 16, 21);
  para(subtitle, "R", 9.5, 13, true);
  y -= 14;
  para(body, "R", 11, 15.5);
  y -= 18;
  para(note, "R", 8, 11, true);
  newPage();
  // objects: 1 catalog, 2 pages, 3 font R, 4 font B, 5 embedded file, 6 filespec, 7 info, then page/content pairs
  const objs = [];
  const enc = new TextEncoder(), blockBytes = enc.encode(block);
  const kids = pages.map((_, i) => `${8 + i * 2} 0 R`).join(" ");
  objs[1] = `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [${pdfStr(fileName)} 6 0 R] >> >> /PageMode /UseNone >>`;
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;
  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;
    const content = enc.encode([...p, foot].join("\n").split("").map(c => c.charCodeAt(0) < 256 ? c : "?").join(""));
    objs[8 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${9 + i * 2} 0 R >>`;
    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });
  // assemble with byte offsets (all strings here are ASCII)
  const parts = [], offs = []; let len = 0;
  const add = b => { parts.push(b); len += b.length; };
  add(enc.encode("%PDF-1.7\n")); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));   // marks the file as binary
  for (let n = 1; n < objs.length; n++) {
    offs[n] = len;
    const o = objs[n];
    if (typeof o === "string") add(enc.encode(`${n} 0 obj\n${o}\nendobj\n`));
    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }
  const xref = len;
  let x = `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

/* ---------- Pro hand-in ---------- */
function proChoices(r){
 const c=LITE.roles[r].chars, sl=SHORTLIST[r]||[], out=[];
 out.push(`${c.expert}=${S.expert&&sl.includes(S.expert)?"o"+(sl.indexOf(S.expert)+1):"-"}`);
 Object.keys(WIT).forEach(w=>{const p=S.picks[w]; out.push(`${c[w]}=${p===null||p===undefined?"-":"o"+(p+1)}`);});
 return out.join(", ");
}
// The Pro line: the team's fork, interim briefing (Morven/Moira acts on the first), evidence verdict and puzzle tiers.
// Not part of the check code (blocks.py reads it into sub["pro"]).
function proLine(){
 return `Pro: fork=${S.fork||"none"}, briefing=${S.ranked?S.rank.join(">"):"none"}, evidence=${S.ranked&&S.ev?S.ev:"none"}, puzzles=${[1,2,3].map(n=>`${n}:${S.pz[n].tier||"none"}`).join(",")}`;
}
// writing.by_role (GUIDE 3c): the student's role writes its own section of the group's report
function roleW(r){const W=LITE.writing, t=W.by_role&&W.by_role[r];
 return t?Object.assign({},W,{label:t.label||W.label,words:t.words,section:t}):W;}
function makeSub(){
 const r=S.role, W=roleW(r), missing=[];
 S.sub=null;
 if(!r||!LITE.roles[r]){S.issues=["Choose your role first (Context)."];return;}
 const memoText=(S.text||"").trim();
 const open=Object.entries(WIT).filter(([k])=>S.picks[k]===null||S.picks[k]===undefined).map(([,w])=>w.name);
 if(open.length) missing.push(`You haven't chosen what to ask ${open.join(", ")} yet (Investigate).`);
 const openDec=LITE.budget?(S.decided?[]:["budget"]):Object.keys(LITE.decisions).filter(k=>!S[k]);
 if(openDec.length) missing.push(LITE.budget?"Your group's budget isn't confirmed yet (Decide).":`Your group's answer is missing for ${openDec.map(k=>LITE.decisions[k]).join(", ")} (Decide).`);
 if(words(memoText)<50) missing.push("Your text is very short — write your "+W.label+" first.");
 S.issues=missing;
 if(openDec.length||words(memoText)<50) return;
 const ai=S.consent?"yes":"no";
 const choices=proChoices(r);
 const decisions=LITE.budget?LITE.budget.map(id=>`${id}=${+((S.budget||{})[id])||0}`).join(", ")   // Lite's budget format
                           :Object.entries(LITE.decisions).map(([k,id])=>`${id}=${S[k]}`).join(", ");
 const parts=[LITE.id, LITE.version, r, choices, decisions, ai, ai==="yes"?norm(memoText):""];
 const code=checkCode(parts);
 const head=[
  "=== SIMLEARN SUBMISSION ===",
  ai==="yes"?"AI check: ALLOWED":"AI check: NOT ALLOWED - grade by hand",
  `Scenario: ${LITE.id} v${LITE.version} (${LITE.title})`,
  `Role: ${r} (${LITE.roles[r].dept})`,
  `Info choices: ${choices}`,
  `Group decisions: ${decisions}`,
  proLine(),
  `Check: ${code}`,
 ];
 const block=ai==="yes"?[...head,`--- ${taskName(W)} (${words(memoText)} words) ---`,memoText,"=== END ==="].join("\n")
                       :[...head,"=== END ===","",`My ${taskName(W)} (${words(memoText)} words):`,"",memoText].join("\n");
 S.sub={block, blockOnly: ai==="yes"?block:[...head,"=== END ==="].join("\n"), code, ai, r, n:words(memoText), memo:memoText};
 S.handed=true;
}
function subHTML(){const x=S.sub; if(!x) return "";
 return `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf" data-act="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${x.ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(x.block)}</textarea>
    <p><button type="button" class="btn" id="copy" data-act="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;}
function handinHTML(){
 return `<div class="consent">
      <b>Can your teacher check your text with AI?</b>
      <p class="small">Your teacher may use the SimLearn teacher tool, which can ask an AI system (Claude, by Anthropic) to suggest feedback on your writing. Only your text and your group's choices would be sent — not your name. Your teacher always makes the final decision about your grade. If you say no, your teacher marks your text by hand. Saying no has no effect on your grade.</p>
      <label><input type="checkbox" id="consent" ${S.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>
    <div id="issues" class="issues">${(S.issues||[]).map(m=>`<p>${esc(m)}</p>`).join("")}</div>
    <button type="button" class="btn" data-act="hand">Create my submission</button>
    <div id="out">${subHTML()}</div>`;
}
function downloadPdf(){
 const x=S.sub; if(!x) return;
 const W=roleW(x.r), rr=LITE.roles[x.r];
 const cap=taskName(W).charAt(0).toUpperCase()+taskName(W).slice(1);
 const today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
 const blob=makePdf({
  title: cap,
  subtitle: `${LITE.title} · Role ${x.r}${rr.dept?" ("+rr.dept+")":""} · ${x.n} words · ${today}`,
  body: x.memo,
  note: (x.ai==="yes"
   ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
   : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
   + ` Check code: ${x.code}.`,
  footer: `SimLearn · ${LITE.title}`,
  block: x.blockOnly, fileName: "simlearn-submission.txt"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob); a.download=`simlearn-${LITE.id}-role-${x.r}.pdf`;
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),120000);
 const m=document.getElementById("pdfmsg"); if(m) m.textContent="Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
}
async function copyBlock(){
 const ta=document.getElementById("block"), msg=document.getElementById("copied"); if(!ta) return;
 const done=()=>{msg.textContent="Copied — now paste it into Moodle.";};
 try{await navigator.clipboard.writeText(ta.value); return done();}catch(e){}
 // older method: still works in many embedded frames where the modern one is blocked
 ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
 let ok=false; try{ok=document.execCommand("copy");}catch(e){}
 if(ok) return done();
 msg.textContent="Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
}

// a recorded clip's text appears once the student has listened to the end (GUIDE 2h); media events don't bubble
document.addEventListener("ended",e=>{const a=e.target; if(!a||a.tagName!=="AUDIO"||!a.dataset.f)return;
 S.heard=Object.assign({},S.heard,{[a.dataset.f]:1}); const box=a.closest(".audio"), dt=box&&box.querySelector("details"); if(dt)dt.hidden=false; save();},true);

document.addEventListener("change",e=>{if(e.target.id==="consent"){S.consent=e.target.checked;S.sub=null;S.issues=[];render();}});
document.addEventListener("input",e=>{if(e.target.id!=="cf")return; if(S.sub){S.sub=null;const o=document.getElementById("out");if(o)o.innerHTML="";} save();});

render();
</script>
