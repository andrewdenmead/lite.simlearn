<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Long Afternoon (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
/* AE sources: research extracts with a full reference, not emails (Andrew, 10 Nov 2026) */
.sech{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:4px 0 -2px}
.src summary{display:flex;flex-direction:column;gap:2px}
.src .stitle{font-family:var(--serif);font-size:1.08rem;line-height:1.35;color:var(--ink);font-weight:600}
.src.unread .stitle{font-weight:700}
.src .sauth{font-size:14.5px;color:var(--ink)}
.src .saff{font-size:13px;color:var(--muted)}
.card>.cite,.mail .body .cite{font-family:var(--ui);font-size:14px;line-height:1.5;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 10px}
.cite .ref{color:var(--ink);user-select:all;-webkit-user-select:all}
.cite .lnk{margin-left:8px}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.news{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:6px 0 4px}
.news .paper{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0}
.news .headline{font-family:var(--serif);font-size:1.25rem;margin:10px 0 4px}
.news .stand{font-weight:600;margin:4px 0}
.news .byline{font-size:13px;color:var(--muted);margin:0 0 6px}
.news>p:not(.paper):not(.byline){font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.news>p{margin:0 0 10px}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}

<aside id="nb" hidden aria-label="Your highlights and notes"></aside>

<script>
// The background as a citable news article (Andrew, 10 Nov 2026): students cite it like any source (make_longevitypro reads it)
const NEWS={paper:"The National Chronicle",date:"15 February 2036",author:"Nadia Shah",headline:"The pill that changed old age, and the pension bill that came with it",
 standfirst:"Six years after the NHS began offering Seneva, the state pension is drawn for longer, and the bill is rising.",
 paras:["In 2030 the NHS began offering everyone over 55 a daily pill called Seneva. It does not stop people from growing old, but it slows the damage that ageing does to the body. Six years later, the results are visible everywhere, at least among those who take it: people in their late seventies running marathons, teaching, managing teams and looking after their grandchildren full-time.",
  "Most people see this as one of the great medical achievements of the century. It has also created a problem that nobody planned for. The state pension age is 67, and Parliament has brought forward the rise to 68 to 2038. For most people, that now means drawing a pension for a quarter of their lives.",
  "The cost is rising fast. Fewer workers are paying for each pensioner, and the gap will keep growing unless something changes. However, not everyone takes the pill, and not everyone who takes it benefits equally.",
  "The government has asked a Commission on Pensions and Longevity to recommend what should happen to the state pension."],
 cite:"Shah, N. (2036) 'The pill that changed old age, and the pension bill that came with it', The National Chronicle, 15 February, p. 3."};
const ROLES={
 A:{name:"Health Analyst",line:"Health and work",detail:"You weigh the evidence on whether people who take Seneva are really fit enough to keep working into their seventies. Your sources are the largest study of users and a study of former manual workers."},
 B:{name:"Fairness Adviser",line:"Fairness",detail:"You advise the commission on whether it would be fair to raise the pension age for everyone. Your sources are the two most cited papers, one on each side of that question."},
 C:{name:"Policy Adviser",line:"What next",detail:"You draft the commission's recommendation. Your sources make the case for each of the two proposals the government has asked the commission to compare."}
};
const REL={high:"Peer-reviewed or independent",medium:"Survey, estimate or personal view",low:"Weak evidence"};
const fmt=n=>"£"+n.toLocaleString("en-GB");

function hbar(rows,o){
  const W=500,left=110,right=48,rowH=32,top=8,H=top+rows.length*rowH+24,min=o.min,max=o.max;
  const x=v=>left+(v-min)/(max-min)*(W-left-right);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.label}">`;
  o.ticks.forEach(t=>s+=`<line class="${t?'axis':'zero'}" x1="${x(t)}" x2="${x(t)}" y1="${top-4}" y2="${H-20}"/><text x="${x(t)}" y="${H-5}" text-anchor="middle">${t}${o.unit}</text>`);
  rows.forEach((r,i)=>{const y=top+i*rowH,a=x(0),b=x(r.v);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="${r.hi?'neg':'pos'}" x="${a}" y="${y+6}" width="${Math.max(2,b-a)}" height="${rowH-13}" rx="2"/><text class="val" x="${b+6}" y="${y+18}">${r.v}${o.unit}</text>`;});
  return s+"</svg>";
}
function donut(l,p){const c=2*Math.PI*38;return `<figure><svg viewBox="0 0 100 100" width="84" height="84" role="img" aria-label="${l} ${p}%"><circle class="ring-bg" cx="50" cy="50" r="38" stroke-width="12"/><circle class="ring" cx="50" cy="50" r="38" stroke-width="12" stroke-dasharray="${(c*p/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text class="val" x="50" y="55" text-anchor="middle" style="font-size:15px">${p}%</text></svg><figcaption class="muted">${l}</figcaption></figure>`;}
const PRO_COVER="";   // the cover picture (build.py fills this in)
const PRO_AUDIO=[];   // the recordings published next to the page (build.py fills this in)
function audio(t,voice,script,file){if(file&&PRO_AUDIO.includes(file))return `<div class="audio rec"><div style="flex:1;min-width:0"><div class="t">${t}</div><audio controls preload="none" data-f="${file}" src="audio/${file}.mp3" style="width:100%;margin-top:6px"></audio></div><details data-tf="${file}" ${(S.heard||{})[file]?"":"hidden"} ${(S.tOpen||{})[file]?"open":""}><summary>Show the text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;
 return `<div class="audio"><button class="play" disabled aria-label="Play (recording to come)">▶</button><div><div class="t">${t}</div><div class="s">Recording to come: read the text</div></div><details open><summary>The text</summary><div class="script" data-src="${esc(t)}" data-q="medium">${script}</div></details></div>`;}
function mail(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k];
 return `<details class="mail ${r?"read":"unread"}" data-mail="${encodeURIComponent(k)}"${o?" open":""}><summary><span class="from">${whoMailAv(m.from)}${r?"":`<span class="udot" aria-label="Unread"></span>`}<span class="lbl">From:</span> ${m.from}</span><span class="subj">${m.subj}</span></summary><div class="body" data-src="${m.from.split(",")[0]}" data-q="${m.rel}">${m.body}</div></details>`;}
/* a research source (AE, 10 Nov 2026): title, author (year), affiliation, the extract and its full reference. `from`
   and `subj` stay as the author and title, so read state and the cartridge (make_longevitypro.py) work as for emails. */
const yearOf=m=>((m.cite||"").match(/\((\d{4}[a-z]?)\)/)||[])[1]||"";
const srcName=m=>{const c=(m.cite||"").replace(/<[^>]+>/g,""),i=c.indexOf(" ("),a=i>0?c.slice(0,i):"";return `${a?(a.includes(",")?a.split(",")[0]:a):m.from.split(", ")[0].split(" ").pop()} (${yearOf(m)})`;};
function source(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k], [name,...aff]=m.from.split(", ");
 return `<details class="mail src ${r?"read":"unread"}" data-mail="${encodeURIComponent(k)}"${o?" open":""}><summary><span class="stitle">${r?"":`<span class="udot" aria-label="Unread"></span>`}${m.subj}</span><span class="sauth">${name} (${yearOf(m)})</span><span class="saff">${aff.join(", ")} · ${m.kind}</span></summary><div class="body" data-src="${srcName(m)}" data-q="${m.rel}">${m.body}<p class="cite"><b>Reference:</b> <span class="ref">${m.cite}</span><button class="lnk" data-act="copyref" data-v="${encodeURIComponent(k)}">Copy reference</button></p></div></details>`;}
function tableA(name,html){return `<div class="attach"><div class="an">${name}</div>${html}</div>`;}

/* ---------- sources: research extracts for each role (each role owns one question) ---------- */
const FWD={from:"Ruth Bannister, Chair of the Commission",subj:"Fwd: “Give us a chance”",rel:"low",body:`
 <p>This is going round. I doubt it helps us, but you should know what people are reading.</p>
 <p class="muted"><em>“Every seventy-year-old who stays in work is a job a young person never gets. Let them retire and give my generation a chance.”</em> (post by a lifestyle influencer with 900,000 followers, 2 June 2036)</p>
 <p class="fine">The post gives no figures and names no source.</p>`};

const INBOX={
 A:[
  {from:"Fiona Lennox, Professor of Gerontology, Edinburgh",subj:"Seventy-five is the new sixty-two: function and health after six years of Seneva",kind:"Journal article",rel:"high",
   cite:"Lennox, F. (2035) 'Seventy-five is the new sixty-two: function and health after six years of Seneva', <i>Ageing and Function</i>, 31(2), pp. 101–123.",body:`
   <p>Are people who take Seneva really fit enough to keep working into their seventies, or does the pill simply keep them alive for longer? This study followed 6,200 users and 6,200 non-users for five years and tested their fitness, memory and reaction times every year. The results were striking. At 75, users scored on average like non-users aged about 62, and the gap widened rather than narrowed with time.</p>
   ${tableA("Table 1 · Users against non-users after five years (Commission on Pensions and Longevity, 2035)",`<div class="tw"><table><thead><tr><th>Measure</th><th class="num">Users</th></tr></thead><tbody>
    <tr><td>Test scores at 75 match non-users aged</td><td class="num">about 62</td></tr>
    <tr><td>Days of illness</td><td class="num">41% fewer</td></tr>
    <tr><td>Need for regular care</td><td class="num">63% less likely</td></tr>
    <tr><td>Users with a long-term condition before starting: test scores at 75 match non-users aged</td><td class="num">about 70</td></tr></tbody></table></div><p class="small">Walking speed, grip strength, memory and reaction time were tested every year.</p>`)}
   <p>It is true that the pill does not repair damage that has already been done, so people who reach 60 with worn joints or heart disease still have them, and they gain much less. Nevertheless, for the majority, the study shows a genuine extension of healthy, active life, not merely of life itself. The article concludes that most users are able to work well into their seventies, and that public policy should stop treating 68 as the beginning of old age.</p>`},
  {from:"Joanne Hargreaves, Social policy researcher, Liverpool",subj:"Longer, not stronger: Seneva and the bodies of manual workers",kind:"Journal article",rel:"high",
   cite:"Hargreaves, J. (2035a) 'Longer, not stronger: Seneva and the bodies of manual workers', <i>Occupational Health Review</i>, 22(3), pp. 144–160.",body:`
   <p>Claims about healthy working lives rest largely on samples dominated by office workers. This article reports a study of 400 former manual workers, including builders, nurses and warehouse staff. Joint and back conditions were as common among those who took Seneva as among those who did not.</p>
   <p>For people whose bodies have already done forty years of physical work, the article argues, the pill extends life far more than it extends the capacity to work. Its benefits are real, but they are greatest for those whose work was kindest to their bodies.</p>
   <p>The study is small, and it covers only workers who were already over sixty when they began the pill. Even so, it suggests that a policy built on average results would ask most of the people least able to give it.</p>`}
 ],
 B:[
  {from:"Joanne Hargreaves, Social policy researcher, Liverpool",subj:"One pension age, two nations: Seneva and health inequality",kind:"Journal article",rel:"high",
   cite:"Hargreaves, J. (2036a) 'One pension age, two nations: Seneva and health inequality', <i>Public Health and Society</i>, 28(1), pp. 15–34.",body:`
   <p>This paper argues that a single, higher pension age would be unfair, because the benefits of Seneva are not shared equally. Even before the pill, healthy life expectancy in the most deprived parts of England was almost nineteen years shorter than in the least deprived (Office for National Statistics, 2022). Seneva has not closed that gap. People in poorer areas take it less often and start later, and many of them start with conditions the pill cannot reverse, often the result of decades of physical work. In interviews in deprived towns, people often called it a pill “for people who can afford to retire anyway”, and some said its television adverts, fronted since 2035 by a school crossing patrol from Sunderland, were “not about people like us” (Hargreaves, 2035b).</p>
   <p>As a result, the healthy seventies that commentators celebrate belong mainly to the comfortable. Raising the pension age for everyone would therefore ask people who have the fewest healthy years to give up the largest share of them. It might be objected that exemptions could solve this. In practice, however, proving that one is too unwell to work is slow and humiliating. A single pension age, the paper concludes, would turn a medical success into a tax on the poor.</p>`},
  {from:"Peter Whitaker, Professor of Public Policy, Institute for Social Policy, Bristol",subj:"The generational contract in an age of long lives",kind:"Journal article",rel:"high",
   cite:"Whitaker, P. (2036a) 'The generational contract in an age of long lives', <i>Public Policy and Society</i>, 107(2), pp. 188–205.",body:`
   <p>The state pension has always rested on a contract between generations: today's workers pay for today's pensioners, expecting the next generation to do the same for them. This paper argues that, now that most people stay healthy well into their seventies, working longer is the fairest way to keep that contract. When the pension was designed, a man who retired at 65 could expect about twelve more years of life; a Seneva user who retires at 68 can now expect about twenty-four. Every extra year is paid for by younger workers, many of whom earn less, own less and will retire later than the people they are supporting.</p>
   ${tableA("Table 2 · If the pension age stays at 68 (Institute for Social Policy, 2036b)",`<div class="tw"><table><thead><tr><th>Forecast</th><th class="num">Now</th><th class="num">2050</th></tr></thead><tbody>
    <tr><td>State pension spending, share of national income</td><td class="num">about 5%</td><td class="num">9.4%</td></tr>
    <tr><td>Workers for each pensioner (2030, then 2050)</td><td class="num">3.2</td><td class="num">2.1</td></tr></tbody></table></div>`)}
   <p>Nor would longer working lives take jobs from those younger workers. Since 2030, the employment rate of people aged 70 to 74 has more than doubled, from 11 to 24 per cent, while unemployment among 18- to 24-year-olds has fallen from 12.4 to 10.9 per cent (Commission on Pensions and Longevity, 2036b).</p>
   <p>It is true that the benefits of the pill are unequal. That, however, is an argument for helping those who cannot work, not for paying everyone else to stop. The paper concludes that refusing to raise the pension age would ask the young to fund the longest retirements in history.</p>`}
 ],
 C:[
  {from:"Peter Whitaker, Professor of Public Policy, Institute for Social Policy, Bristol",subj:"Seventy-Five, with an Exit: A Pension Age for Long Lives",kind:"Policy paper",rel:"high",
   cite:"Whitaker, P. (2036b) <i>Seventy-Five, with an Exit: A Pension Age for Long Lives</i>. Bristol: Institute for Social Policy.",body:`
   <p>This paper proposes that the state pension age should rise to 75, phased in between 2040 and 2050, with an earlier pension at 68 for anyone who has done forty years of mostly physical work or has a condition certified by a doctor. The case rests on three points. First, most people are now able to work far longer, and many want to. Second, without a change, pension spending will almost double as a share of national income by 2050, and younger workers will pay for it. Third, a long phase-in gives everyone more than ten years' notice.</p>
   ${tableA("Table 3 · Costing a pension age of 75 (Institute for Social Policy, 2036c)",`<div class="tw"><table><thead><tr><th>Estimate</th><th class="num">Figure</th></tr></thead><tbody>
    <tr><td>Saving on pension spending by 2050</td><td class="num">about 2.6% of national income</td></tr>
    <tr><td>People reaching 68 who would qualify early through physical work</td><td class="num">about 22%</td></tr>
    <tr><td>… and through certified ill health</td><td class="num">about 9%</td></tr></tbody></table></div><p class="small">The estimate assumes that Seneva uptake in deprived areas rises to 70 per cent by 2040.</p>`)}
   <p>The earlier pension is designed to answer the obvious objection that a single age would be unfair to people with the fewest healthy years. Admittedly, any early route will be imperfect at the edges. Nevertheless, the paper concludes that the reform would save serious money while protecting those who genuinely cannot work.</p>`},
  {from:"Joanne Hargreaves, Social policy researcher, Liverpool",subj:"Keep sixty-eight: paying for long lives together",kind:"Journal article",rel:"high",
   cite:"Hargreaves, J. (2036b) 'Keep sixty-eight: paying for long lives together', <i>Journal of Welfare Policy</i>, 33(2), pp. 145–163.",body:`
   <p>This paper argues that the state pension age should stay at 68, and that the cost of longer retirements should be shared through a gradual rise in National Insurance, paid by both workers and employers. A pension age is not only an economic number but a promise about when people may stop working, and it matters most to those whose working lives are hardest. Any age high enough to save serious money would fall heaviest on people in poorer areas, who have fewer healthy years and take Seneva less often: 84 per cent of over-55s in the least deprived fifth of areas take it, against 52 per cent in the most deprived fifth (Hargreaves, 2035b).</p>
   ${tableA("Table 4 · Paying for a pension age of 68 (Commission on Pensions and Longevity, 2036d)",`<div class="tw"><table><thead><tr><th>Estimate, by 2050</th><th class="num">Figure</th></tr></thead><tbody>
    <tr><td>Rise in National Insurance, for workers and employers alike</td><td class="num">about 6 percentage points</td></tr>
    <tr><td>Cost to a worker earning £45,000, at today's earnings</td><td class="num">about £2,000 a year</td></tr></tbody></table></div><p class="small">The rise would be smaller if more older people chose to keep working, and larger if growth were slower than forecast.</p>`)}
   <p>Moreover, early-pension exemptions are difficult to run fairly. A rise in National Insurance, by contrast, spreads the cost across everyone in work, including older workers who choose to stay on. It is true that this asks more of the young. However, they too will one day benefit from a pension age that leaves them time to enjoy their long lives. The paper concludes that a society that has gained a dozen or more healthy years should share some of them as rest.</p>`}
 ]
};
/* the first decision's message from the chair (the recorded REMIT clip on the Context tab): it brings no extra source,
   so each role has exactly two */
const BRANCH={
 young:{from:"Ruth Bannister, Chair of the Commission",subj:"Younger workers first",rel:"medium",body:`<p>Younger workers first, then: apprentices, young parents and others paying in now. That puts the people who pay at the start of our public sessions. Keep the older people in view too. The committee will just hear from the young first.</p>`},
 older:{from:"Ruth Bannister, Chair of the Commission",subj:"Older people first",rel:"medium",body:`<p>Older people first, then: people in their sixties and seventies, in work or retired. That puts the people who would work longer at the start of our public sessions. Keep the younger workers in view too. The committee will just hear from older people first.</p>`}
};

/* ---------- experts: one per role, from a shortlist ---------- */
const EXPERTS={
 health:{name:"Health economist",who:"A university health economics unit",q:"high",what:"Studies how Seneva has changed illness and the need for care. Can tell you who gains from the pill, and how much.",
  rep:`<p>Because the NHS pays for care, it tracks who needs it. Among Seneva users, days off sick from work have fallen by about a third since 2030, and spending on home care for people in their seventies has fallen for the first time on record.</p>
   <p>The gain depends on how people start. Those who begin at 55 to 59 gain most; those who start after 65 gain less, and those who start with a long-term condition least: at 75 they test like non-users of about 70. Most of the gap between groups of users was there before they started.</p>`},
 employers:{name:"Workforce researcher",who:"A business school (ran the commission's survey of employers)",q:"medium",what:"Surveyed older workers and their employers. Can tell you how many older people want to work, and how employers rate them.",
  rep:`<p>Of Seneva users aged 70 to 74, 61 per cent said they would like to do some paid work, mostly part-time, and most gave company and purpose, rather than money, as their main reason. Among employers, 72 per cent rated their over-70 staff as at least as productive as younger colleagues.</p>
   <p>There is one caveat: 38 per cent of employers said they found it harder to persuade older staff to learn new systems.</p>
   <p class="fine">A survey of what workers and employers say.</p>`},
 maker:{name:"Pill maker's review",who:"The pharmaceutical company that makes Seneva",q:"low",what:"Makes Seneva and follows its customers. Can tell you what the pill does for people's health and working lives.",
  rep:`<p>Our review of 40,000 customers shows that Seneva users in their seventies have the energy of people twenty years younger. With Seneva, there is no medical reason for anyone to stop work before 80.</p>
   <p>A higher pension age would simply catch up with what our customers already know.</p>
   <p class="fine">The company is paid by the NHS for every user. The review covers customers who chose to answer the company's survey.</p>`},
 uptake:{name:"Health inequalities researcher",who:"A university public health department",q:"high",what:"Has studied why fewer people take Seneva in poorer towns. Can tell you whether the gap in uptake could close.",
  rep:`<p>Interviews in four deprived towns found three main barriers: the need to collect the pill monthly from a pharmacy during working hours, distrust of a medicine promoted heavily on television, and a belief that it was for people who can afford to retire anyway. Men in manual jobs were the least likely of any group to have started.</p>
   <p>Where pharmacies offered home delivery, uptake rose by 18 percentage points within a year.</p>`},
 actuary:{name:"Pensions actuary",who:"A firm of consulting actuaries",q:"high",what:"Models who gains and who pays under the state pension. Can tell you how pensioners and workers have fared.",
  rep:`<p>Since 2011 the state pension has risen in almost every year by the highest of inflation, average earnings or 2.5 per cent, a rule known as the triple lock. Over that period, pensioner incomes have grown faster than those of working-age households, and today's pensioners, as a group, hold far more wealth than today's workers.</p>
   <p>Opinion splits by age: in a recent poll, 58 per cent of people over 65 opposed raising the pension age, while 61 per cent of those under 35 supported it.</p>`},
 care:{name:"Sociologist of care",who:"A university sociology department",q:"medium",what:"Studies the unpaid work that older people do. Can tell you what the extra healthy years are used for.",
  rep:`<p>Grandparents already provide a large share of the childcare that allows parents to work, and much of the caring and volunteering in any town is done by people in their sixties and seventies. This work is unpaid and therefore invisible in the accounts.</p>
   <p>If users stay healthy until about 76, a pension age of 75 would leave most of them a single healthy year of rest.</p>`},
 assess:{name:"Social security researcher",who:"A university social policy department",q:"high",what:"Studies systems that ask people to prove they can't work. Can tell you how an early pension route would work in practice.",
  rep:`<p>Every system that asks people to prove they are too ill to work has produced long delays, wrongful refusals and appeals. Delays of a year or more are common, and a large share of appeals have succeeded, a sign of how often first decisions are wrong.</p>
   <p>A route based on forty years of physical work is easier to check than one based on illness, but records of working lives are patchy, especially for women and for people who moved between jobs. An early pension that depends on proof reaches first the people best able to prove things.</p>`},
 denmark:{name:"Comparative pensions researcher",who:"A European university",q:"high",what:"Has studied Denmark, which links its pension age to life expectancy. Can tell you how such a system has worked.",
  rep:`<p>Denmark linked its pension age to life expectancy in 2006, and the age is set to reach 70 by 2040. The reform passed with broad political support because it was introduced long in advance.</p>
   <p>In 2022 Denmark added an early pension for people with long working lives in physically demanding jobs. Even so, Danish unions have continued to argue that the early route is too narrow, and the debate over who qualifies has never really ended.</p>`}
};
const SHORTLIST={A:["maker","employers","health"],B:["care","uptake","actuary"],C:["assess","maker","denmark"]};

const WIT={
 doreen:{name:"Doreen Clarke",role:"School crossing patrol, Sunderland",voice:"female, late 70s, Sunderland accent, brisk, cheerful and energetic",
  account:`<p class="sd">[Commission session in Sunderland. Brisk, cheerful.]</p><p>I'm seventy-nine and I've never felt better. Crossing patrol in the mornings, the books at my nephew's garage in the afternoons. Everybody I know on the pill could work if they wanted to.</p><p>The ones who say they're worn out haven't given it a proper chance. Honestly, that pill's a miracle.</p>`,
  qs:[["Should the pension age go up?","Ask us first, I always say. Some of us want to work, and some of us have earned a rest. I wouldn't make anybody do it, and I wouldn't stop anybody either. It should be up to us."],
      ["Have you ever been paid to talk about Seneva?","Er… I've done a bit of filming, like. Lots of people have. It's not about that. It's about what the pill's done for me."],
      ["Could all your old workmates keep working?","No. My brother did forty years in the shipyard; his knees went before the pill came, and it's done nothing for them. I couldn't go back to the care home either: thirty years of lifting."]]},
 afolabi:{name:"Dr Tunde Afolabi",role:"GP, Sunderland",voice:"male, 40s–50s, calm and thoughtful, British (Nigerian heritage, northern English accent)",
  account:`<p class="sd">[Commission session in Sunderland. Calm, thoughtful.]</p><p>I see both sides of this every day. Most of my patients on Seneva in their seventies are fitter than I am. But on some of the estates I cover, barely half take it, and plenty start with bad backs, bad knees, or lungs damaged by forty years of hard work.</p><p>The pill gives them longer lives. It can't give them new bodies.</p>`,

const WHO_AVC=["#2C5282","#2F6B47","#9B2C2C","#7A5A0E","#5B3F8C","#1F6F78","#8C3F63","#4A5562"];
const WHO_SRC=TABS.some(t=>t[0]==="inbox"&&t[1]==="Sources");
function whoAvatar(p){
 const n=p.name.replace(/^(Dr|Prof|Professor|Sir|Dame)\.?\s+/,"").split(/\s+/), ini=(n[0][0]+(n.length>1?n[n.length-1][0]:"")).toUpperCase();
 let h=7; for(const ch of p.id) h=(h*31+ch.charCodeAt(0))>>>0;
 return `<span class="av" style="background:${WHO_AVC[h%WHO_AVC.length]}" aria-hidden="true">${esc(ini)}${PRO_PHOTOS[p.id]?`<img src="${PRO_PHOTOS[p.id]}" alt="" onerror="this.remove()">`:""}</span>`;}
function whoPerson(p,r){
 const roles=p.roles||"", mine=roles.includes(r), other=roles&&!mine&&!p.tag, t=[];
 if(p.tag==="boss") t.push(`<span class="wtag boss">${esc(p.badge||"Your boss")}</span>`);
 if(p.tag==="witness") t.push(`<span class="wtag wit">Everyone hears from them (Investigate)</span>`);
 if(mine) t.push(`<span class="wtag mine">${WHO_SRC?"In your sources":"In your inbox"}</span>`);
 else if(roles) t.push(`<span class="wtag">${WHO_SRC?"Sources of":"Inbox of"}: ${roles.split("").map(x=>esc(ROLES[x].name)).join(", ")}</span>`);
 return `<div class="wp${other?" dim":""}" data-person="${esc(p.id)}">${whoAvatar(p)}<div class="wpt"><b>${esc(p.name)}</b><span class="wjob">${esc(p.title)}</span><span class="wline">${esc(p.line)}</span>${t.length?`<span class="wtags">${t.join("")}</span>`:""}</div></div>`;}
function whoHTML(){
 // an organisation with no people and no name of its own ("A small lab in Bristol") is a line under "Also mentioned",
 // not a card (Andrew, 11 Nov 2026: "either it should have a name, or it's not relevant enough")
 const minor=(o,i)=>i>0&&!o.people.length&&/^(An? |The [a-z])/.test(o.name);
 const orgs=WHO.orgs.filter((o,i)=>!minor(o,i)), extra=WHO.orgs.filter(minor).map(o=>[o.name,o.rel.charAt(0).toLowerCase()+o.rel.slice(1)+"."]);
 const r=R(), team=orgs[0], out=orgs.slice(1);
 const rank=p=>p.tag==="boss"?0:(p.roles||"").includes(r)?1:p.tag==="witness"?2:!p.roles?3:4;
 const ov=`<section class="card"><h2>How it fits together</h2><div class="ov">
   <div class="ovteam"><b>${esc(team.name)}</b><small>${esc(team.rel)}</small>
    <div class="ovdepts">${Object.entries(ROLES).map(([k,v])=>`<div class="ovdept${k===r?" you":""}"><b>${esc(v.name)}</b><small>${k===r?"You":"A teammate"}</small></div>`).join("")}</div></div>
   <div class="ovstem" aria-hidden="true"></div>
   <div class="ovout"><b>${esc(WHO.outside||"Outside")}</b><div class="ovorgs">${out.map(o=>`<div class="ovorg"><b>${esc(o.short||o.name)}</b><small>${esc(o.rel)}</small></div>`).join("")}</div></div>
  </div></section>`;
 const cards=orgs.map((o,i)=>`<section class="card worg${i?"":" wteam"}"><div class="worghead"><h2>${esc(o.name)}</h2><span class="wrel">${esc(o.rel)}</span></div>
   <p class="muted" style="margin:0">${esc(o.what)}</p>${o.people.length?`<div class="wppl">${[...o.people].sort((a,b)=>rank(a)-rank(b)).map(p=>whoPerson(p,r)).join("")}</div>`:""}</section>`).join("");
 const alsoAll=[...extra,...(WHO.also||[])];
 const also=alsoAll.length?`<section class="card"><h2>Also mentioned</h2><ul class="walso">${alsoAll.map(([n,l])=>`<li><b>${esc(n)}</b>: ${esc(l)}</li>`).join("")}</ul></section>`:"";
 return task(`Who's who in this case: the organisations, and the people in each. ${WHO_SRC?"The authors of your sources":"The people who write to you"} are marked; greyed-out people write to a teammate.`)+ov+cards+also;
}
V.who=whoHTML;
function whoMailAv(from){const n=String(from).split(",")[0].trim();
 const p=WHO.orgs.flatMap(o=>o.people).find(x=>x.name===n);
 return p&&PRO_PHOTOS[p.id]?`<img class="mav" src="${PRO_PHOTOS[p.id]}" alt="">`:"";}


function rankList(){const n=S.pick3||0;
 return S.rank.map((id,i)=>{const t=RANK.find(x=>x[0]===id), on=i<n;
  if(S.ranked&&!on)return "";

const SIMPLE={"This is a thought experiment set in the near future.": ["c.1", "This is an imagined story set in the near future."], "The United Kingdom, its institutions, its pension rules and the history and statistics named in the sources are real.": ["c.2", "Some things in it are real: the United Kingdom, its institutions, its pension rules, and the history and statistics named in the sources."], "Seneva, the commission, every person quoted, and every study and figure dated after 2026 are invented for this classroom exercise.": ["c.3", "Other things are made up for this class: Seneva, the commission, every person quoted, and every study and figure dated after 2026."], "Practise citing these sources as if they were real, but never cite them, or any 'fact' from this scenario, in real academic work.": ["c.4", "Practise citing these sources as if they were real. But never cite them, or any 'fact' from this story, in real academic work."], "Britain's state pension age has risen slowly for decades: to 66 in 2020 and to 67 by 2028, with a rise to 68 once planned for the 2040s.": ["c.5", "For decades, the age at which people in Britain get the state pension has gone up slowly. It went up to 66 in 2020 and to 67 by 2028, and there was once a plan to raise it to 68 in the 2040s."], "Each rise was argued over in the same terms: people live longer, so they can work longer.": ["c.6", "Every time, people argued about it in the same way: people live longer, so they can work longer."], "Since 2011, the pension itself has risen every year by the highest of inflation, average earnings or 2.5 per cent.": ["c.7", "Since 2011, the pension itself has gone up every year by inflation, by average earnings or by 2.5 per cent, whichever is highest."], "Then, in 2029, a pill was approved that changed what “longer” means.": ["c.8", "Then, in 2029, a new pill was approved, and it changed what “longer” means."], "In March 2035, the week the government announced the commission, this report went out on national radio:": ["c.9", "In March 2035, in the same week that the government announced the commission, this report was on national radio:"], "Doreen Clarke, 78, is back at work: a school crossing patrol in the mornings, and the books for her nephew's garage three afternoons a week.": ["c.11", "Doreen Clarke, 78, has gone back to work. In the mornings she helps children cross the road outside a school. Three afternoons a week she does the accounts for her nephew's garage."], "Her grandson Liam, 24, an apprentice electrician, is proud of her, but expects to be “working till I'm eighty”.": ["c.13", "Her grandson Liam, 24, is training to be an electrician. He is proud of her, but he expects to be “working till I'm eighty”."], "Dr Tunde Afolabi, a GP in the city, says that almost everyone over 55 takes the pill in the better-off parts of town, but on some of the estates he covers, “it's barely half”.": ["c.14", "Dr Tunde Afolabi is a family doctor in the city. He says that in the richer parts of town almost everyone over 55 takes the pill, but on some of the poorer housing estates he works on, “it's barely half”."], "You are three researchers on the commission's evidence team.": ["c.15", "You three are researchers in the commission's evidence team."], "Each of you holds different sources.": ["c.16", "Each of you has different sources."], "You weigh the evidence on whether people who take Seneva are really fit enough to keep working into their seventies.": ["c.19", "You judge the evidence on one question: are people who take Seneva really healthy enough to keep working into their seventies?"], "Your sources are the largest study of users and a study of former manual workers.": ["c.20", "Your sources are the biggest study of people who take the pill, and a study of people who used to do physical work."], "Six years after the NHS began offering Seneva, the state pension is drawn for longer, and the bill is rising.": ["c.22", "The NHS began offering Seneva six years ago. Now people get the state pension for more years, and it costs more and more."], "In 2030 the NHS began offering everyone over 55 a daily pill called Seneva.": ["c.24", "In 2030 the NHS began to offer a daily pill called Seneva to everyone over 55."], "It does not stop people from growing old, but it slows the damage that ageing does to the body.": ["c.25", "It does not stop people getting old, but it slows down the harm that age does to the body."], "Six years later, the results are visible everywhere, at least among those who take it: people in their late seventies running marathons, teaching, managing teams and looking after their grandchildren full-time.": ["c.26", "Six years later, you can see the results everywhere, at least among people who take it. People in their late seventies run marathons, teach, manage teams and look after their grandchildren full-time."], "Most people see this as one of the great medical achievements of the century.": ["c.27", "Most people think this is one of the greatest medical successes of the century."], "It has also created a problem that nobody planned for.": ["c.28", "But it has also caused a problem that nobody planned for."], "The state pension age is 67, and Parliament has brought forward the rise to 68 to 2038.": ["c.29", "The state pension age is 67. Parliament has moved the rise to 68 earlier, to 2038."], "For most people, that now means drawing a pension for a quarter of their lives.": ["c.30", "For most people, this now means they will get a pension for a quarter of their lives."], "The cost is rising fast.": ["c.31", "The cost is going up quickly."], "Fewer workers are paying for each pensioner, and the gap will keep growing unless something changes.": ["c.32", "There are fewer workers paying for each pensioner, and the gap will keep getting bigger unless something changes."], "However, not everyone takes the pill, and not everyone who takes it benefits equally.": ["c.33", "But not everyone takes the pill, and the pill does not help everyone who takes it equally."], "The government has asked a Commission on Pensions and Longevity to recommend what should happen to the state pension.": ["c.34", "The government has asked a Commission on Pensions and Longevity to say what should happen to the state pension."], "Everyone I met today had already decided.": ["c.37", "Everyone I met today had already made up their mind."], "Half said you can't make old people work.": ["c.38", "Half of them said you can't make old people work."], "The other half said older workers are taking young people's jobs anyway.": ["c.39", "The other half said that older workers are taking young people's jobs anyway."], "I don't want either speech.": ["c.40", "I don't want to hear either of those speeches."], "If we lean on a weak one, the committee will take us apart, whichever way we go.": ["c.43", "If we rely on a weak source, the committee will tear our work to pieces, whatever we decide."], "The commission's public sessions open next week, and the government wants to know by Friday who will speak first.": ["c.44", "The commission's public meetings start next week. By Friday, the government wants to know who will speak first."], "Some of the commission's advisers want to open with younger workers, the people who pay in.": ["c.45", "Some of the commission's advisers want younger workers to speak first: the people who pay in."], "Others want to open with older people, the people who would be asked to work longer.": ["c.46", "Others want older people to speak first: the people who would be asked to work longer."], "Agree as a team, then everyone enters the same choice.": ["c.48", "Agree as a team. Then everyone enters the same choice."], "You advise the commission on whether it would be fair to raise the pension age for everyone.": ["c.50", "You advise the commission on one question: would it be fair to raise the pension age for everyone?"], "Your sources are the two most cited papers, one on each side of that question.": ["c.51", "Your sources are the two papers that people cite most often, one on each side of that question."], "You draft the commission's recommendation.": ["c.53", "You write the first version of the commission's recommendation."], "Your sources make the case for each of the two proposals the government has asked the commission to compare.": ["c.54", "The government has asked the commission to compare two proposals. Each of your sources argues for one of them."], "This is going round.": ["e1.1", "People are sharing this a lot."], "I doubt it helps us, but you should know what people are reading.": ["e1.2", "I don't think it helps us, but you should know what people are reading."], "(post by a lifestyle influencer with 900,000 followers, 2 June 2036)": ["e1.5", "(a post by an influencer with 900,000 followers, 2 June 2036)"], "The post gives no figures and names no source.": ["e1.6", "The post gives no numbers and names no source."], "Are people who take Seneva really fit enough to keep working into their seventies, or does the pill simply keep them alive for longer?": ["e2.1", "This is the question: are people who take Seneva really healthy enough to keep working into their seventies, or does the pill just keep them alive for longer?"], "This study followed 6,200 users and 6,200 non-users for five years and tested their fitness, memory and reaction times every year.": ["e2.2", "This study followed 6,200 people who took the pill and 6,200 who did not, for five years. Every year it tested how fit they were, their memory and how fast they reacted."], "The results were striking.": ["e2.3", "The results were surprising."], "At 75, users scored on average like non-users aged about 62, and the gap widened rather than narrowed with time.": ["e2.4", "At 75, people who took the pill got the same scores, on average, as people aged about 62 who did not take it. And the difference got bigger over time, not smaller."], "Walking speed, grip strength, memory and reaction time were tested every year.": ["e2.5", "Every year, the study tested how fast people walked, how strongly they could hold things, their memory and how fast they reacted."], "It is true that the pill does not repair damage that has already been done, so people who reach 60 with worn joints or heart disease still have them, and they gain much less.": ["e2.6", "It is true that the pill does not repair damage that has already happened. So people who are 60 and already have worn joints or heart disease still have them, and the pill helps them much less."], "Nevertheless, for the majority, the study shows a genuine extension of healthy, active life, not merely of life itself.": ["e2.7", "But for most people, the study shows that the pill really gives them more years of healthy, active life, not only more years of life."], "The article concludes that most users are able to work well into their seventies, and that public policy should stop treating 68 as the beginning of old age.": ["e2.8", "The article's conclusion is that most people who take the pill can work until well into their seventies. It says that government policy should stop treating 68 as the start of old age."], "Claims about healthy working lives rest largely on samples dominated by office workers.": ["e3.1", "Claims that people can work for longer in good health are based mainly on groups made up mostly of office workers."], "This article reports a study of 400 former manual workers, including builders, nurses and warehouse staff.": ["e3.2", "This article is about a study of 400 people who used to do physical work, for example builders, nurses and warehouse staff."], "Joint and back conditions were as common among those who took Seneva as among those who did not.": ["e3.3", "Problems with joints and backs were just as common among those who took Seneva as among those who did not."], "For people whose bodies have already done forty years of physical work, the article argues, the pill extends life far more than it extends the capacity to work.": ["e3.4", "The article says that, for people whose bodies have already done forty years of physical work, the pill gives them a longer life much more than it makes them able to work."], "Its benefits are real, but they are greatest for those whose work was kindest to their bodies.": ["e3.5", "The pill really does help, but it helps most the people whose work was easiest on their bodies."], "The study is small, and it covers only workers who were already over sixty when they began the pill.": ["e3.6", "The study is small. And it only includes workers who were already over sixty when they started the pill."], "Even so, it suggests that a policy built on average results would ask most of the people least able to give it.": ["e3.7", "But it suggests that a policy based on average results would ask the most from the people who can give the least."], "This paper argues that a single, higher pension age would be unfair, because the benefits of Seneva are not shared equally.": ["e4.1", "This paper says that one higher pension age for everyone would be unfair, because Seneva does not help everyone equally."], "Even before the pill, healthy life expectancy in the most deprived parts of England was almost nineteen years shorter than in the least deprived (Office for National Statistics, 2022).": ["e4.2", "Even before the pill, people in the poorest parts of England could expect almost nineteen fewer years of good health than people in the richest parts (Office for National Statistics, 2022)."], "Seneva has not closed that gap.": ["e4.3", "Seneva has not made that gap smaller."], "People in poorer areas take it less often and start later, and many of them start with conditions the pill cannot reverse, often the result of decades of physical work.": ["e4.4", "People in poorer areas take it less often and start it later. Many of them already have health problems that the pill cannot undo, often because of many years of physical work."], "In interviews in deprived towns, people often called it a pill “for people who can afford to retire anyway”, and some said its television adverts, fronted since 2035 by a school crossing patrol from Sunderland, were “not about people like us” (Hargreaves, 2035b).": ["e4.5", "In interviews in poor towns, people often said it was a pill “for people who can afford to retire anyway”. Some said its TV adverts were “not about people like us”. Since 2035, the face of those adverts has been someone from Sunderland who helps children cross the road outside a school (Hargreaves, 2035b)."], "As a result, the healthy seventies that commentators celebrate belong mainly to the comfortable.": ["e4.6", "So the healthy seventies that commentators praise belong mostly to people who are well off."], "Raising the pension age for everyone would therefore ask people who have the fewest healthy years to give up the largest share of them.": ["e4.7", "So if the pension age goes up for everyone, the people with the fewest healthy years would have to give up the biggest share of them."], "It might be objected that exemptions could solve this.": ["e4.8", "Some people might say that exceptions to the rule could solve this."], "In practice, however, proving that one is too unwell to work is slow and humiliating.": ["e4.9", "But in real life, proving that you are too ill to work is slow, and it makes people feel ashamed."], "A single pension age, the paper concludes, would turn a medical success into a tax on the poor.": ["e4.10", "The paper's conclusion is that one pension age for everyone would turn a medical success into a tax on poor people."], "The state pension has always rested on a contract between generations: today's workers pay for today's pensioners, expecting the next generation to do the same for them.": ["e5.1", "The state pension has always been based on an agreement between generations. Today's workers pay for today's pensioners, and they expect the next generation to do the same for them."], "This paper argues that, now that most people stay healthy well into their seventies, working longer is the fairest way to keep that contract.": ["e5.2", "This paper says that, now that most people stay healthy until well into their seventies, working longer is the fairest way to keep that agreement."], "When the pension was designed, a man who retired at 65 could expect about twelve more years of life; a Seneva user who retires at 68 can now expect about twenty-four.": ["e5.3", "When the pension was created, a man who stopped work at 65 could expect to live about twelve more years. Now a person who takes Seneva and stops work at 68 can expect about twenty-four."], "Every extra year is paid for by younger workers, many of whom earn less, own less and will retire later than the people they are supporting.": ["e5.4", "Younger workers pay for every extra year. Many of them earn less and own less than the people they are paying for, and they will stop work later."], "Nor would longer working lives take jobs from those younger workers.": ["e5.5", "And if older people work for longer, this would not take jobs away from younger workers."], "Since 2030, the employment rate of people aged 70 to 74 has more than doubled, from 11 to 24 per cent, while unemployment among 18- to 24-year-olds has fallen from 12.4 to 10.9 per cent (Commission on Pensions and Longevity, 2036b).": ["e5.6", "Since 2030, the share of people aged 70 to 74 who have a job has more than doubled, from 11 to 24 per cent. Over the same time, unemployment among people aged 18 to 24 has fallen from 12.4 to 10.9 per cent (Commission on Pensions and Longevity, 2036b)."], "It is true that the benefits of the pill are unequal.": ["e5.7", "It is true that the pill does not help everyone equally."], "That, however, is an argument for helping those who cannot work, not for paying everyone else to stop.": ["e5.8", "But that is a reason to help the people who cannot work, not a reason to pay everyone else to stop working."], "The paper concludes that refusing to raise the pension age would ask the young to fund the longest retirements in history.": ["e5.9", "The paper's conclusion is that, if the pension age does not go up, young people will have to pay for the longest retirements in history."], "This paper proposes that the state pension age should rise to 75, phased in between 2040 and 2050, with an earlier pension at 68 for anyone who has done forty years of mostly physical work or has a condition certified by a doctor.": ["e6.1", "This paper suggests raising the state pension age to 75, step by step between 2040 and 2050. People who have done forty years of mostly physical work, or who have an illness that a doctor confirms, would get a pension earlier, at 68."], "The case rests on three points.": ["e6.2", "There are three reasons for this."], "First, most people are now able to work far longer, and many want to.": ["e6.3", "First, most people can now work much longer, and many of them want to."], "Second, without a change, pension spending will almost double as a share of national income by 2050, and younger workers will pay for it.": ["e6.4", "Second, if nothing changes, pension spending will be almost twice as big a part of the country's income by 2050, and younger workers will pay for it."], "Third, a long phase-in gives everyone more than ten years' notice.": ["e6.5", "Third, because the change would happen slowly, everyone would know about it more than ten years before."], "The estimate assumes that Seneva uptake in deprived areas rises to 70 per cent by 2040.": ["e6.6", "The estimate expects that, by 2040, 70 per cent of people in poor areas will take Seneva."], "The earlier pension is designed to answer the obvious objection that a single age would be unfair to people with the fewest healthy years.": ["e6.7", "The earlier pension is there to answer an obvious criticism: that one age for everyone would be unfair to people with the fewest healthy years."], "Admittedly, any early route will be imperfect at the edges.": ["e6.8", "It is true that no early route will be perfect for everyone."], "Nevertheless, the paper concludes that the reform would save serious money while protecting those who genuinely cannot work.": ["e6.9", "But the paper's conclusion is that the change would save a lot of money and still protect the people who really cannot work."], "This paper argues that the state pension age should stay at 68, and that the cost of longer retirements should be shared through a gradual rise in National Insurance, paid by both workers and employers.": ["e7.1", "This paper says that the state pension age should stay at 68. It says that the cost of longer retirements should be shared through a slow rise in National Insurance, which both workers and employers would pay."], "A pension age is not only an economic number but a promise about when people may stop working, and it matters most to those whose working lives are hardest.": ["e7.2", "A pension age is not just a number for the economy. It is also a promise about when people may stop working, and it matters most to people who have the hardest jobs."], "Any age high enough to save serious money would fall heaviest on people in poorer areas, who have fewer healthy years and take Seneva less often: 84 per cent of over-55s in the least deprived fifth of areas take it, against 52 per cent in the most deprived fifth (Hargreaves, 2035b).": ["e7.3", "Any pension age high enough to save a lot of money would hurt people in poorer areas most. They have fewer healthy years and take Seneva less often: in the richest fifth of areas, 84 per cent of people over 55 take it, but in the poorest fifth only 52 per cent do (Hargreaves, 2035b)."], "The rise would be smaller if more older people chose to keep working, and larger if growth were slower than forecast.": ["e7.4", "The rise would be smaller if more older people decided to keep working. It would be bigger if the economy grew uctive as younger colleagues.": ["x2.2", "Of the employers, 72 per cent said their staff over 70 did at least as much work as younger colleagues."], "There is one caveat: 38 per cent of employers said they found it harder to persuade older staff to learn new systems.": ["x2.3", "But there is one problem: 38 per cent of employers said it was harder to get older staff to learn new systems."], "A survey of what workers and employers say.": ["x2.4", "This is a survey of what workers and employers say."], "Our review of 40,000 customers shows that Seneva users in their seventies have the energy of people twenty years younger.": ["x3.1", "We looked at 40,000 of our customers. Our results show that people in their seventies who take Seneva have as much energy as people twenty years younger."], "With Seneva, there is no medical reason for anyone to stop work before 80.": ["x3.2", "With Seneva, there is no medical reason for anyone to stop working before 80."], "A higher pension age would simply catch up with what our customers already know.": ["x3.3", "A higher pension age would simply match what our customers already know."], "The company is paid by the NHS for every user.": ["x3.4", "The NHS pays the company for every person who takes the pill."], "The review covers customers who chose to answer the company's survey.": ["x3.5", "The review only includes customers who decided to answer the company's survey."], "Interviews in four deprived towns found three main barriers: the need to collect the pill monthly from a pharmacy during working hours, distrust of a medicine promoted heavily on television, and a belief that it was for people who can afford to retire anyway.": ["x4.1", "Interviews in four poor towns found three main reasons why people do not take the pill. They have to collect it every month from a pharmacy during working hours. They do not trust a medicine that is advertised so much on TV. And they believe it is for people who can afford to retire anyway."], "Men
