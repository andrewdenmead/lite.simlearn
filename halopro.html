<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Halo Cosmetics: The Market Entry Decision (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i,.pin i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.pins{display:flex;flex-direction:column;gap:6px}
.pin{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px 10px}
.pin[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.pin span{font-family:var(--serif);font-size:15px}
.pin small{display:block;font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>
  <h1>Halo Cosmetics: The Market Entry Decision</h1>
  <p class="whoami" id="who"></p>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main><div class="wrap" id="main"></div></main>
<div id="hlpal" hidden role="dialog" aria-label="Highlight colour"><button data-hlc="yellow" style="background:#FFF176" aria-label="Yellow"></button><button data-hlc="green" style="background:#B9F6CA" aria-label="Green"></button><button data-hlc="pink" style="background:#F8BBD0" aria-label="Pink"></button><button data-hlc="blue" style="background:#B3E5FC" aria-label="Blue"></button><button data-hlc="orange" style="background:#FFE0B2" aria-label="Orange"></button><button data-hlc="purple" style="background:#E1BEE7" aria-label="Purple"></button><button data-hlc="none" class="none" aria-label="Remove highlight">✕</button></div>
<button id="fab" data-act="nbopen" hidden>Notes (0)</button>
<aside id="nb" hidden aria-label="Your highlights and notes"></aside>

<script>
const ROLES={
 A:{name:"Supplier & Manufacturing Relations",line:"Who makes Halo's products, and how safe they are",detail:"You find and manage the partners who would make Halo's products, and you make sure every product is safe before it's sold. Your inbox holds messages from manufacturing, quality and one of the two manufacturers."},
 B:{name:"Commercial Partnerships",line:"How Halo gets onto shelves, and what it costs",detail:"You negotiate the deals that would put Halo in the shops, and you keep an eye on the money. Your inbox holds messages from corporate development, retail and finance."},
 C:{name:"Brand & Talent Relations",line:"Marisol, her image and how the world hears about Halo",detail:"You look after Marisol, her image and how the world hears about Halo. Your inbox holds messages from her management, PR and creative teams."}
};
const REL={high:"Reliable",medium:"Personal view",low:"Weak evidence"};
const fmt=n=>(n<0?"−":"")+"£"+Math.abs(n).toLocaleString("en-GB");

/* charts: horizontal budget bars and a simple line chart */
function hbars(rows,label){
  const W=500,left=200,right=70,rowH=30,top=4,H=top+rows.length*rowH+4,w=W-left-right,max=Math.max(...rows.map(r=>r.v));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  rows.forEach((r,i)=>{const y=top+i*rowH,bw=Math.max(2,w*r.v/max);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="sa" x="${left}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="2"/><text class="val" x="${left+bw+6}" y="${y+18}">${r.t}</text>`;});
  return s+"</svg>";
}
function lineChart(pts,label,ylo,yhi,marks){
  const W=500,H=190,l=40,r=12,t=12,b=34,w=W-l-r,h=H-t-b,x0=pts[0][0],x1=pts[pts.length-1][0];
  const X=x=>l+w*(x-x0)/(x1-x0), Y=y=>t+h*(yhi-y)/(yhi-ylo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  [ylo,(ylo+yhi)/2,yhi].forEach(v=>{s+=`<line class="axis" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  pts.forEach(([x])=>{if(x%2===0)s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle">${x}</text>`;});
  s+=`<text x="${l+w/2}" y="${H-2}" text-anchor="middle">Months after Lumen's launch</text>`;
  (marks||[]).forEach(([x,txt])=>{s+=`<line class="zero" stroke-dasharray="3 3" x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${t+h}"/><text class="lab" x="${X(x)+4}" y="${t+12}">${txt}</text>`;});
  s+=`<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts.map(([x,y])=>X(x)+","+Y(y)).join(" ")}"/>`;

function mail(m){const k=m.from+"|"+m.subj, o=!!S.mailOpen[k], r=!!S.mailRead[k];

   ${att("Solenne licence, draft: Section 14",`<p>“14.2 From the thirteenth month of the Term, the Licensee may replace any ingredient with one of equivalent regulatory status where this reduces cost, giving the Licensor thirty days' written notice. The Licensor's approval is not required.”</p><p class="fine">“Equivalent regulatory status” means equally legal to sell. It doesn't mean it feels or wears the same.</p>`)}
   <p class="sig">Shreya</p>`},
  {from:"Dae-Hyun Cho, Quality & Regulatory Lead",subj:"Testing: what we can and can't compress",rel:"high",body:`
   <p>The floor for full independent safety and stability testing is nine weeks, properly resourced. We can compress it to five by running tests side by side, with smaller volunteer panels for the rarer allergy checks.</p>
   <p>The date that matters: testing can only start on final production samples, and neither manufacturer can deliver those for five weeks. My timeline is attached. The compressed path ends in week 10, which leaves four weeks to build stock for Solstice. The full path ends in week 14, the week of the Awards, with nothing to sell.</p>
   <p>Why I'm cautious: Emberly's mascara went through a four-week compressed test last year to hit a red-carpet date. I heard their quality lead's post-mortem at a conference. They pulled it from the shelves nine days after launch, after a spike in allergic reactions traced to an under-tested emulsifier.</p>
   <p>What a longer timeline would cost us is Felix's area, not mine.</p>
   ${att("Testing timeline, from today",`<div class="tw"><table><thead><tr><th>Path</th><th>Final samples</th><th>Testing</th><th>Stock for Solstice (week 14)?</th></tr></thead><tbody>
    <tr><td>Compressed (5 weeks)</td><td>Weeks 1–5</td><td>Weeks 6–10</td><td>Yes: four weeks to build it</td></tr>
    <tr><td>Full (9 weeks)</td><td>Weeks 1–5</td><td>Weeks 6–14</td><td>No: testing ends in Awards week</td></tr></tbody></table></div>`)}
   <p class="sig">Dae-Hyun</p>`},
  {from:"Sofia Marchetti, Account Director, Thistle & Vine Labs",subj:"Thistle & Vine: the real numbers",rel:"medium",body:`
   <p>Here are the real numbers, not the pitch-deck version. Thistle & Vine guarantees that every product is made exactly to Halo's formula, and we can deliver final samples of any product in five weeks. We charge per unit, with no licence fee. But our ceiling, across all products together, is about 15,000 units a month for at least the first two quarters.</p>
   <p>You saw Nightshade: every palette gone in eleven minutes, then six weeks of angry messages. That's the honest trade-off with us: quality and control, but a real ceiling. A couple of hundred stores is within reach if we build stock first. Hundreds of stores at once is not. A second certified factory, run under our supervision, would raise the ceiling.</p>
   <p>Something you should know: Bijou Laurent's team rang us last week. They asked whether we could start making a make-up line for them about four months from now. They haven't signed with anyone yet, they said. I said no. Halo comes first.</p>
   <p class="sig">Sofia</p>`}
 ],
 B:[
  {from:"Tomás Alencar, Corporate Development Lead",subj:"Petalwick Beauty: better than people think",rel:"medium",body:`
   <p>I've been through Petalwick's books. Its factory in Harrogate passed its last two audits, most of its lines are certified for the EU and the US, and it runs at only 40% capacity. It still holds shelf space in over 200 stores, and at about £3 million it's a bargain. The money would come from Vega Management's investment fund, not the launch budget. Owning it means no retailer sign-off and no cost clause. On paper, an easy yes.</p>
   <p>What I can't judge: Petalwick has about 30,000 loyal customers who love its founder's “quiet, no-glitter” clean beauty, almost the opposite of Marisol's look. Most of its sales come from one product, the Quiet Balm, which runs every day on the factory's balm line. Do we keep it running? That changes what we're buying.</p>
   ${att("Petalwick at a glance",`<div class="tw"><table><tbody>
    <tr><td>Stores stocking Petalwick</td><td class="num">340 three years ago · 210 today</td></tr>
    <tr><td>Factory capacity in use</td><td class="num">40%</td></tr>
    <tr><td>Last two factory audits</td><td class="num">Passed, no findings</td></tr>
    <tr><td>Loyal repeat customers</td><td class="num">About 30,000</td></tr>
    <tr><td>Asking price</td><td class="num">About £3 million</td></tr></tbody></table></div>`)}
   <p>The table says it: the shelves shrank, not the product. Sofia from Thistle & Vine is walking round the factory this week.</p>
   <p class="sig">Tomás</p>`},
  {from:"Naledi Khumalo, Retail Partnerships Director",subj:"Larkspur: read before you get excited",rel:"high",body:`
   <p>Larkspur & Co. is offering guaranteed shop-in-shop placement in 450 stores, and it would pay half of the in-store launch campaign, about £150,000. In return it wants 18% of Halo's revenue and, the part people skim past, final sign-off on packaging and displays. In practice, our products could sit in style-matched fixtures beside rival lines instead of our own gold counters. Larkspur also locks partners out of every other national chain for three years.</p>
   <p>Its shop-in-shop rule is strict: a fixture that stands empty for more than two weeks is cut back to a small counter. Larkspur plans to launch all three Halo products in every store on the same day.</p>
   <p>One more thing. Their buyer let slip that they're holding a launch slot for another celebrity make-up line about six months from now. She wouldn't say whose.</p>
   ${att("Larkspur term sheet, summary",`<div class="tw"><table><tbody>
    <tr><td>Stores</td><td>450, shop-in-shop, from launch day</td></tr>
    <tr><td>Launch support</td><td>Half of the in-store launch campaign (about £150,000)</td></tr>
    <tr><td>Revenue share</td><td>18% of Halo's revenue</td></tr>
    <tr><td>Packaging and displays</td><td>Final approval by Larkspur</td></tr>
    <tr><td>Exclusivity</td><td>3 years: no other national chain</td></tr></tbody></table></div>`)}
   <p class="sig">Naledi</p>`},
  {from:"Felix Brandt, Finance Analyst, Office of the CFO",subj:"What four extra months would cost",rel:"high",body:`
   <p>Short answer: the committed launch budget of £2.4 million can carry a launch four months after the Awards without new money. The catch is that we'd have to cut paid social by about 60% during those four months, so Marisol's own reach would have to carry most of the campaign.</p>
   <p>For reference, my plan assumes Halo sells online and in about 200 stores, and that we pay for all our own marketing. It covers the three launch products: the lipstick, the eye palette and Stage Dust. About half of the forecast sales are in the US, so every product has to be on sale there from day one.</p>
   ${att("The £2.4 million launch budget",hbars([{l:"Paid social",v:1200,t:"£1.2m"},{l:"Launch event, content, in-store campaign",v:600,t:"£600k"},{l:"Samples, influencers, retailer fees",v:600,t:"£600k"}],"How the launch budget is split"))}
   <p>As the chart shows, paid social is half the budget, and it's the easiest line to pause. Whether waiting is smart depends on how real the threat of a rival launch is, and Finance can't see that.</p>
   <p class="sig">Felix</p>`}
 ],
 C:[
  {from:"Imogen Hale, Talent Manager",subj:"The Solstice date, and Bijou Laurent",rel:"medium",body:`
   <p>To say it plainly: the Solstice Music Awards date is fixed. Marisol headlines in fourteen weeks. It's in her contract, and it isn't moving.</p>
   <p>What I'm hearing: Bijou Laurent's company filed a trademark for a make-up line last month. People I trust read that as a sign of an early launch. If she beats us, she gets the “first celebrity beauty launch of the year” story our whole campaign is built around.</p>
   <p>Dae-Hyun tells me full testing wouldn't finish until the week of the Awards, with nothing in the shops. If that's right, I won't risk Marisol's face on a recall. Launching at Solstice would also need rush air freight to get stock into the shops: about £35,000, and I've pencilled in a booking. Another idea: Marisol announces Halo on stage, we open a waiting list, and we ship when the products are ready. Marisol herself has said she'd rather launch late than launch something she wouldn't wear.</p>
   <p>Remember that half of Marisol's fans are in the US. They'll expect every product there on day one.</p>
   <p class="sig">Imogen</p>`},
  {from:"Yusuf Demir, PR & Communications Lead",subj:"What really happened at Lumen",rel:"high",body:`
   <p>People keep citing Lumen without knowing what happened, so here it is. Fourteen months after launch, Lumen's manufacturer used a cost clause like Solenne's to swap an ingredient. Our sentiment tracking shows brand trust fell eleven points and took about ten months to recover. The trigger wasn't the swap itself but one dermatologist's video that went viral. Lumen's first statement came four days later: far too slow. Recovery only began once Lumen got the clause reversed and publicly brought back the original formula.</p>
   ${att("Lumen: brand trust index (our sentiment tracking)",lineChart([[12,72],[13,72],[14,71],[15,60],[16,60],[17,61],[18,63],[19,64],[20,66],[21,67],[22,68],[23,69],[24,70],[25,71],[26,72]],"Lumen's brand trust fell eleven points at month 15 and took about ten months to recover",55,75,[[14,"swap"],[17,"reversed"]]))}
   <p>The chart shows the drop after the video and the slow climb back.</p>
   <p>Separately: Petalwick's founder has a small but vocal following that hates what they call “corporate buyouts of indie brands”. Worth knowing before anyone gets attached to that deal.</p>
   <p>On Bijou Laurent: a trademark filing is real, but in my experience a launch is still months away at that point.</p>
   <p class="sig">Yusuf</p>`},
  {from:"Elodie Fontaine, Creative Director",subj:"Creative control: the part nobody adds up",rel:"medium",body:`
   <p>What I care about most is creative sign-off. As things stand, neither Solenne's licensing term sheet nor Larkspur's joint-venture term sheet gives Halo any right to approve creative decisions. Solenne's Section 14 covers the formulas. Larkspur wants the final say on packaging and displays.</p>
   <p>I won't pretend to be neutral. Losing control on one of these deals worries me. Losing it on both at once would hollow out what makes Halo feel like Halo, however good the spreadsheet looks.</p>
   <p>Our launch line is three products: a long-wear lipstick in Marisol's signature red, a pressed eye palette in metallic golds, and Stage Dust, a loose shimmer powder. All three have to photograph well, because most people will first see them on a phone.</p>
   <p>What I can't see yet is what a retail deal would mean on the shop floor.</p>
   <p class="sig">Elodie</p>`}
 ]
};

 safety:{name:"Cosmetics safety assessor",who:"Dr Helen Okafor, independent safety assessor",what:"Signs safety reports for beauty brands in the UK and the EU. Can tell you what a shorter test really leaves out.",
  rep:`<p>Compressed testing is legal, and plenty of brands do it. What gets cut is usually the rarer allergy checks: smaller volunteer panels and fewer skin types. Those are exactly the reactions you only find with numbers.</p>
   <p>Eye products and new emulsifiers carry the most risk, because the skin around the eye is thin and reacts fast. A recall in the first month usually costs far more than the delay would have.</p>
   <p>Many brands now announce a product on a big night and ship it later, once testing is done. Fans accept a wait more easily than a recall.</p>`},
 lawyer:{name:"Licensing lawyer",who:"Hannah Osei, Osei & Clarke LLP",what:"Negotiates manufacturing and retail contracts for beauty brands. Can tell you which terms move, and which never do.",
  rep:`<p>Cost clauses like Section 14 are standard in big manufacturers' licences. Removing one means a bespoke contract, and large groups rarely offer that to a first-time brand.</p>
   <p>Once the contract is signed, a brand can only reverse a cost change with the manufacturer's agreement, usually at a price, and usually after the damage is done.</p>
   <p>In retail joint ventures, approval rights over packaging and displays are almost universal. Exclusivity is the term retailers defend hardest.</p>`},
 supply:{name:"Contract-manufacturing consultant",who:"Raj Malhotra, Malhotra Supply Advisory",what:"Helps brands plan production with small labs and big factories. Can tell you how far a small lab's capacity can stretch.",
  rep:`<p>Small labs rarely raise their ceiling by working faster. They raise it by supervising a second certified factory, which usually takes six to eight weeks to bring up to the lab's standard, if suitable lines are free.</p>
   <p>Launching a capped product in hundreds of stores at once is the classic mistake. Empty fixtures cost more than a smaller launch would have.</p>
   <p>A smaller footprint with restocks every two weeks keeps shelves full and fans coming back.</p>`},

  rep:`<p>Small beauty brands are often cheap to buy, because their shelves are shrinking. The factory and the store contracts are usually worth more than the price suggests.</p>
   <p>Acquisitions fail when the buyer changes the brand. Buyers who keep it separate, with its own look, products and team, usually keep most of its loyal customers.</p>

 else p.push(`The Larkspur joint venture put Halo in 450 stores, with half the in-store campaign paid for. But Larkspur's merchandising team placed it in style-matched fixtures next to rival lines${r1First()?", except in its 40 biggest stores, where Halo's own gold fixtures stood out":""}, and the three-year exclusivity closed every other national chain.${S.d1==="A"?" With Solenne in charge of the formulas and Larkspur signing off the packaging, Halo's look was redesigned to Larkspur's rules. Elodie Fontaine resigned in the spring, and fans said Halo looked like everyone else's.":""}`);
 if(S.d3==="A") p.push(`Halo launched on the night of the Solstice Awards after a five-week compressed test. It trended for two days. Three weeks later, a cluster of allergic reactions to one product forced a pause while extra screening was done, and the story followed Marisol into her next interviews.${S.d2==="B"?" Larkspur charged Halo for clearing the product from 450 fixtures.":""} Bijou Laurent's line arrived about three months later.`);
 else p.push(`Marisol announced Halo on stage at the Solstice Awards and opened a waiting list. The products followed four months later, after full testing. Bijou Laurent's line got there first, about six months after the trademark story, but Halo's waiting list was the bigger story.${failed(1)?" Imogen's £35,000 air-freight payment was lost.":""}`);
 const extra=[];

 if(extra.length) p.push(extra.join(" "));
 p.push(`A year after launch, Halo's first year is ${netWords()}.`);

const LIST_ID={rank:"rk"};
function flip(key,mutate){
 const sel=`#${LIST_ID[key]} .tc`, before={};
 document.querySelectorAll(sel).forEach(c=>before[c.dataset.id]=c.getBoundingClientRect().top);
 mutate();render();
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 document.querySelectorAll(sel).forEach(c=>{const dy=before[c.dataset.id]-c.getBoundingClientRect().top;
  if(dy){c.style.transition="none";c.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>{c.style.transition="transform .22s ease";c.style.transform="";});}});
}
let drag=null;
function bindDrag(key){
 const L=S[key];
 document.querySelectorAll(`#${LIST_ID[key]} .tc[draggable="true"]`).forEach(c=>{
  c.addEventListener("dragstart",e=>{drag=c.dataset.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",drag);}catch(_){}});
  c.addEventListener("dragend",()=>{c.classList.remove("dragging");drag=null;});
  c.addEventListener("dragover",e=>{e.preventDefault();if(c.dataset.id!==drag)c.classList.add("over");});
  c.addEventListener("dragleave",()=>c.classList.remove("over"));
  c.addEventListener("drop",e=>{e.preventDefault();const to=c.dataset.id;if(!drag||to===drag||!L.includes(drag))return;
   flip(key,()=>{const from=L.indexOf(drag);L.splice(from,1);const ti=L.indexOf(to);L.splice(from<=ti?ti+1:ti,0,drag);});});

const LITE={"id": "halopro", "version": 1, "title": "Halo Cosmetics: The Market Entry Decision (Pro)", "writing": {"label": "market entry recommendation", "addressee": "Imogen Hale and the launch committee"}, "roles": {"A": {"dept": "Supplier & Manufacturing Relations", "chars": {"expert": "expert_a", "adrian": "adrian_a", "wren": "wren_a"}}, "B": {"dept": "Commercial Partnerships", "chars": {"expert": "expert_b", "adrian": "adrian_b", "wren": "wren_b"}}, "C": {"dept": "Brand & Talent Relations", "chars": {"expert": "expert_c", "adrian": "adrian_c", "wren": "wren_c"}}}, "decisions": {"d1": "D1", "d2": "D2", "d3": "D3"}};
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }

  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
function taskName(W){ return W.addressee ? `${W.label} to ${W.addressee}` : W.label; }
const PDFW = {"R":[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584,761,556,0,222,556,333,1000,556,556,333,1000,667,333,1000,0,611,0,0,222,222,333,333,350,556,1000,333,1000,500,333,944,0,500,667,278,333,556,556,556,556,260,556,333,737,370,556,584,333,737,333,400,584,333,333,333,556,537,278,333,333,365,556,834,834,834,611,667,667,667,667,667,667,1000,722,667,667,667,667,278,278,278,278,722,722,778,778,778,778,778,584,778,722,722,722,722,667,667,611,556,556,556,556,556,556,889,500,556,556,556,556,278,278,278,278,556,556,556,556,556,556,556,584,611,556,556,556,556,500,556,500],"B":[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584,761,556,0,278,556,500,1000,556,556,333,1000,667,333,1000,0,611,0,0,278,278,500,500,350,556,1000,333,1000,556,333,944,0,500,667,278,333,556,556,556,556,280,556,333,737,370,556,584,333,737,333,400,584,333,333,333,611,556,278,333,333,365,556,834,834,834,611,722,722,722,722,722,722,1000,722,667,667,667,667,278,278,278,278,722,722,778,778,778,778,778,584,778,722,722,722,722,667,667,611,556,556,556,556,556,556,889,556,556,556,556,556,278,278,278,278,611,611,611,611,611,611,611,584,611,611,611,611,611,556,611,556]};
const PDF_WIN = {"8364":128,"8218":130,"402":131,"8222":132,"8230":133,"8224":134,"8225":135,"710":136,"8240":137,"352":138,"8249":139,"338":140,"381":142,"8216":145,"8217":146,"8220":147,"8221":148,"8226":149,"8211":150,"8212":151,"732":152,"8482":153,"353":154,"8250":155,"339":156,"382":158,"376":159};   // Unicode -> WinAnsi byte, for 0x80-0x9F
const PDF_ALT = {"Ł":"L","ł":"l","Đ":"D","đ":"d","ı":"i","ħ":"h","‐":"-","‑":"-","−":"-","′":"'","″":"\"","\u2009":" ","\u202f":" ","→":"->","←":"<-","≈":"~","≤":"<=","≥":">="};
function pdfByte(ch){
  const u = ch.codePointAt(0);
  if (u >= 32 && u <= 126) return u;
  if (u >= 160 && u <= 255) return u;
  if (PDF_WIN[u] !== undefined) return PDF_WIN[u];
  if (u === 9) return 32;
  const base = ch.normalize("NFKD").replace(/[̀-ͯ]/g, "");   // ł, ő, ş… fall back to the plain letter
  if (base && base !== ch && base.length === 1) return pdfByte(base);
  return 63;   // ?
}
// Letters the PDF font can't show: a few by hand, then compatibility forms (ﬁ -> fi, ² -> 2), else "?".
const pdfClean = s => [...String(s).replace(/[ŁłĐđıħ‐‑−′″\u2009\u202f→←≈≤≥]/g, c => PDF_ALT[c])].map(c => {
  if (c === "\n" || pdfByte(c) !== 63 || c === "?") return c;
  const k = c.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  return k && [...k].every(x => pdfByte(x) !== 63) ? k : c;
}).join("");
function pdfWidth(text, font, size){
  let w = 0; for (const ch of text) { const b = pdfByte(ch); w += PDFW[font][b - 32] || 556; } return w * size / 1000;
}
function pdfStr(text){   // a PDF literal string in WinAnsi, with octal escapes
  let out = "(";
  for (const ch of text) {
    const b = pdfByte(ch);
    if (b === 40 || b === 41 || b === 92) out += "\\" + String.fromCharCode(b);
    else if (b > 126) out += "\\" + b.toString(8).padStart(3, "0");
    else out += String.fromCharCode(b);
  }
  return out + ")";
}
function pdfWrap(text, font, size, width){
  const lines = [];
  text.split("\n").forEach(par => {
    if (!par.trim()) { lines.push(""); return; }
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const tryLine = line ? line + " " + word : word;
      if (pdfWidth(tryLine, font, size) <= width) { line = tryLine; return; }
      if (line) lines.push(line);
      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)
        const chars = [...word]; let n = 0, w = 0;
        while (n < chars.length) { const cw = pdfWidth(chars[n], font, size); if (n > 0 && w + cw > width) break; w += cw; n++; }
        lines.push(chars.slice(0, n).join("")); word = chars.slice(n).join("");
      }
      line = word;
    });
    lines.push(line);
  });

}
function utf16Hex(text){
  let h = "FEFF";
  for (let i = 0; i < text.length; i++) h += text.charCodeAt(i).toString(16).padStart(4, "0").toUpperCase();

function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
  const para = (s, font, size, lead, grey) => pdfWrap(s, font, size, TW).forEach(l => {
    if (y - lead < M + 20) newPage();
    y -= lead; if (l) text(l, font, size, M, y, grey);
  });
  para(title, "B", 16, 21);
  para(subtitle, "R", 9.5, 13, true);
  y -= 14;
  para(body, "R", 11, 15.5);
  y -= 18;
  para(note, "R", 8, 11, true);
  newPage();
  // objects: 1 catalog, 2 pages, 3 font R, 4 font B, 5 embedded file, 6 filespec, 7 info, then page/content pairs
  const objs = [];
  const enc = new TextEncoder(), blockBytes = enc.encode(block);
  const kids = pages.map((_, i) => `${8 + i * 2} 0 R`).join(" ");
  objs[1] = `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [${pdfStr(fileName)} 6 0 R] >> >> /PageMode /UseNone >>`;
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;
  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;
    const content = enc.encode([...p, foot].join("\n").split("").map(c => c.charCodeAt(0) < 256 ? c : "?").join(""));
    objs[8 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${9 + i * 2} 0 R >>`;
    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });

  const parts = [], offs = []; let len = 0;

    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }

  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

function proChoices(r){
 const c=LITE.roles[r].chars, sl=SHORTLIST[r]||[], out=[];

 if(open.length) missing.push(`You haven't chosen what to ask ${open.join(", ")} yet (Investigate).`);
 const openDec=LITE.budget?(S.decided?[]:["budget"]):Object.keys(LITE.decisions).filter(k=>!S[k]);
 if(openDec.length) missing.push(LITE.budget?"Your group's budget isn't confirmed yet (Decide).":`Your group's answer is missing for ${openDec.map(k=>LITE.decisions[k]).join(", ")} (Decide).`);
 if(words(memoText)<50) missing.push("Your text is very short — write your "+W.label+" first.");

 if(openDec.length||words(memoText)<50) return;
 const ai=S.consent?"yes":"no";

                           :Object.entries(LITE.decisions).map(([k,id])=>`${id}=${S[k]}`).join(", ");

 ];
