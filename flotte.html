<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Flotte: Who Decides? — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
}
</style>
</head>

f scooters and bikes spread on a table, with a row of teal e-scooters, a workbench with a battery pack, and the TV tower visible through the windows"},"context":{"text":"Flotte launched in Berlin three years ago with a simple pitch: e-scooters and e-bikes for the last mile, priced fairly, parked responsibly. It grew fast — first across Berlin, then into Amsterdam and Warsaw — and for the last eighteen months, growth was led by one person: the Director of City Operations, who pushed the expansion hard and got results, but ran every decision the same way: announced, not discussed. Three senior ops staff left within four months of each other. A week ago, after a serious incident at the Amsterdam depot, the board asked him to step down, effective immediately, with no permanent replacement lined up.\n\nYou are the interim leadership committee — three people, three departments, one shared responsibility — asked to keep Flotte running until a new hire is found. Nobody wants to repeat the last eighteen months. But the board has also made clear that Flotte's next few days include real decisions that can't wait: a safety review with a genuine deadline, an underperforming team that needs handling, and, underneath both, the bigger question of how this company makes decisions from here. Whatever the committee decides now will likely outlast the interim period — the next permanent director will inherit whatever structure you put in place.","scar":{"label":"The Exodus","text":"Three senior ops staff quit within four months of each other last year, all citing the same thing in exit interviews: decisions were announced, never discussed, and by the time problems reached the director, it was too late to fix them cheaply. HR still hasn't rebuilt the trust."},"proof":{"label":"The Warsaw Vote","text":"Four months ago, the Warsaw city team was trusted with its own scheduling problem — the whole team voted on a new shift system instead of having one handed down. It worked: fewer no-shows, better morale, and it's still running unchanged today."},"constraint":"The Amsterdam regulator has given Flotte until Friday at 5pm — 48 hours from now — to submit a signed-off battery-safety review. If it misses the deadline, Flotte's Amsterdam licence is suspended and the fleet there is grounded for at least 30 days."},"listening":{"name":"Scale Up, Slow Down","questions":[{"q":"About how many executives did the study Goleman reported cover?","options":{"A":"About 4,000","B":"About 1,000","C":"About 10,000"}},{"q":"How many leadership styles did Goleman identify?","options":{"A":"Four","B":"Five","C":"Six"}},{"q":"Which style is described as \"come with me\"?","options":{"A":"Coaching","B":"Authoritative","C":"Affiliative"}},{"q":"Which style had the most strongly positive effect on team climate?","options":{"A":"Democratic","B":"Authoritative","C":"Pacesetting"}},{"q":"How long does the podcast say Coercive works well for, in a genuine crisis?","options":{"A":"Ten minutes","B":"One week","C":"One month"}},{"q":"Which style is \"people come first\"?","options":{"A":"Coaching","B":"Democratic","C":"Affiliative"}},{"q":"According to the podcast, Democratic style struggles most in which situation?","options":{"A":"Team conflict","B":"New hires","C":"A crisis"}},{"q":"The podcast says Pacesetting tends to overwhelm a team within...?","options":{"A":"Weeks","B":"Years","C":"Days"}},{"q":"Which two styles had a negative effect on team climate?","options":{"A":"Democratic & Pacesetting","B":"Coercive & Pacesetting","C":"Coercive & Coaching"}},{"q":"Why does the podcast call Pacesetting the sneakier of the two?","options":{"A":"It works only in a crisis","B":"Its effects take years","C":"It looks reasonable on paper"}}]},"roles":[{"id":"A","label":"Role A","dept":"People & Culture","characters":[{"id":"petra","name":"Petra Zielinski","title":"Senior Warehouse Coordinator","subject":"Before you decide anything, you should know this","email":"Hi — I run the Berlin warehouse floor, so I'm usually the first to hear when something's wrong on the ground. I think you should know why three of our most experienced ops staff left over the last year, because it's the same reason the fire could have been prevented: six weeks before the Amsterdam incident, someone flagged the battery-swap risk in writing and was told, in so many words, to stick to their lane. That's the pattern. It's not that people didn't see problems coming — it's that raising them stopped feeling worth it.\n\nI don't say this to pile blame on anyone who's already gone. I say it because whatever the committee decides next, the real test isn't whether it sounds fair on paper — it's whether someone on the floor would feel safe raising a concern six weeks before the next fire.\n\nWhat I can't tell you is exactly what happened that night in Amsterdam, or how the team there is coping — I only hear it second-hand in Berlin. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What the three who left told me","text":"oyCk/W9PfXunqUebGdwx9C9+Avjidh8mfiUwXbLDtyzymefLLIU0HsndSHdfvMiQsCIpbe0lOL5VF/Jbpd9ZBNks3yAF+FcmR2LTzalbwBWdmRnfu6kEq7bvpEp1OiQFAuYeTz27nMfM2+WWSHM6umCKlPXLTXmo/+u2SYG4x2qBhzEXIXfCwqzF1b4EiAYWlKUBtNd0fR/1QUPEa5ATHFtUDGYXGTjrbi9LQQLBLhLqn6BWjiuHmrRIttzLAcv9mavUQsaCt1kB+iC71/7RBFzCMSNZhsjDJg6zzqaHmLYn2SsH8XgUPC6Cu8F0qy/t87a2wZ8sl5gid4QBzjll43892GStF2yK0y/sJK9H4OqHfv8tpEqBU5Ltlw9Lz1Z/Ga/qoAETBFMeiPQ="},{"id":"o2","title":"What that Amsterdam warning said","text":"WpVhfkO1KkjQzMjgFIzUTfzlRv7aw8ylHoYe7kS7peJ+ursQ6iDVYXyqaOx+Vv1oYgQ3SeER75+D+JLy7XUyumnd3YmfK9QNnk/SOhpib6edkWjdGyIGfg/FQnlsxumODtKAWH9qrmVy6tjSLvoK9xx+LPkIKWLksXpa+YdGCfEFfAOs1CzgTek2QsRn3wQ23tuBnK72j2oSVVBbyjEwbA83A3t1Q6/PG0KHMXNrb9kcQ+9RoFNeQMhioC/t3v1+KcW44c/Q+Hjf3dQ1MoQFLwwj/ZKrgfgYHu4+g+Y9sJM5wJfKuydSruS1o1PREzNYMT5oWHC/Rgc81EIdxlo3Nk4umStcn4F1hi7Wdg0CA1WPmBRpd1h/K3waxSYG51xQXgZMq+M6LykxD/LVeRBuqvFeG+zaienGRREBVwCINZMmpao="},{"id":"o3","title":"What a week on my floor looks like","text":"sEdZWsgbG8BxQe8nWLE0F37yJLramVI6SOaD4jx+luqsoSmLIhv/fV+rQpXN1uKX/lP1bcg/jJHiUodI9EgYBpZ8qXjQhocQn7HriVHtRYC78CtB/JImVROkuV7tv/tnvrvwatTxUCAddAvbSDcldckcKHbus2AqhfSclvqUp5KzdeufQxJJ5MZlJZ6FMN+lSoPx+fAZ3KC+RTRFDnO/o7wdbgbo35Gwy6hvd/j9+YyrvtByLEakyqppz5sI4L8TrPaZ/l5V4uAa+JXdG+3vfjuhKUChldeugHmkIVxDWSGoI6BxNJ0OMJ5WDYqVJ50bjjKV0qc9CgqQjjzuiMwipOt8fG0K+frbXMsP+FOaIux+Mf5nKA8fPzT3pACL8is65eLXPZdXTflnVZFGgdGnGHdo6xgy/wp37tDMDJt+k5R/tSYXtA=="}]},{"id":"aurelio","name":"Dr. Aurelio Santini","title":"Organisational Consultant","subject":"What the Warsaw pilot actually proved (and didn't)","email":"I facilitated the shift-scheduling vote in Warsaw four months ago, and I still think it's one of the better outcomes I've seen from a client this size — but I want to be precise about what it actually proved, because I suspect it's being quoted as bigger evidence than it is. That pilot took two full weeks of structured, facilitated sessions, and it covered exactly one contained decision: how shifts got assigned. Nobody's job, safety, or the company's regulatory standing was on the line while people voted. It worked because the stakes matched the format.\n\nI'm not against extending participation more broadly — quite the opposite. But scaling \"it worked once, for something low-risk\" into \"therefore it works for everything\" is exactly the kind of leap that gets organisations into trouble, in either direction.\n\nWhat I don't have is an honest picture of how the Amsterdam team is doing now — the human side, not the incident report. I can give you one more piece of my thinking before you decide. Choose carefully.","offers":[{"id":"o1","title":"What my first year at Flotte showed","text":"nrKi0y5ltoXEWFLiSedjHH1+C6jUei0nTIXYwQMYwWxwBrpm4K6UtmDODqfD+GCblbad4ZZD28HbCzWC67sL0qO2VyHSkcXvNQLA6bMHkXFtoPORgdslRqcHNUZwk2ePWf7NcAEA4uf9uejaC3FrwNltsV3rGlU5/Q9l3ocXTLqn9p854vjF2f4WVZbNTBEBI2yOLQ6UzSljbmleXgp1NEKK2m5d6LqtX+p+mFOfTtc41Y6LhneMTjR9GxsXk0t98d8aimvkkIWUPRzgF6rI ine sitting in front of you right now, and I haven't decided yet whether I think that specific decision should wait for a vote or not — I genuinely don't know enough about what's actually at stake if Flotte misses that deadline.\n\nThat's a question for Compliance, not the staff council. I can tell you one more thing from the council's side before you decide. Choose carefully.","offers":[{"id":"o1","title":"What else the staff survey showed","text":"pn7/jOLMGqBz+ELtnnr7/2pPFdCf1AKEzXbo13x5F+OQ8DDQzG1B9z0dAeDvybOoZiCQVDWuXVgyYzKBf1AZBcGdajEzI110SrP6PEVAkS2f+kSnw3E248pIlGkV4J7aXriQ5D0TJeOGRvhA77d8dWJZMI3rgzaN/8+WRd/0z8yGeQUxvymN0QxnYnKhFUkuOASlG52iZLXiQohGjCePyehWySjKDsqz40cBdrCkFh5GwFp+CXiiyQRfsOU3mzcD3i7GOjrq+IefaXA15ohE8vyKv+HCMwy2HMsdyFe8OD2WM8m08avktjnX5KTY8xh9GzAIkTOmA8KV8wcg6v+565xyiyVFOUkAS3Ai+VvOfzlkaVooTUL1UkWc1/V6Rk4rzubJ+dQO7LtXIzx6BTBWiE0="},{"id":"o2","title":"Why 'consultation' sounds empty here","text":"u5J6sMaSxRAm/S4PDS8unhPydMw+Jubf5O+d/vCxmNc3Rz08Tp/WQyzvaPedKk087ShVuPB+OOVRMU1uM6VR5QKG7R0X/zfDKvYtB3gXL/T0bIjOXhhVffCEQVwjDb31Ineg8Sg6uWPOvWqI5mfvhTgYfM3lpVXcCt+kcU5iCYzeXfw2C7hm66EPswm7WgkobxGsS0lX6C+hmkpS0V/cfV9kljSbeZq1Cyy/0OtHdXT3qaxJruRgBqcJVFU3Cu0WwlERQpGCyGSn/wK7qApPoQ2EA0LmDOW8W/xdTVLY6HYI6wpuanErIjPZ5lt5ogd2a3PHGO+EkDzuh0Afc2jpgDEmjXSDdXzHEyP5e1jFz99c6DYP75ScuoH1pp9OoHOTjF5CIx3HBCUSdVXMdfU5ll5hE0k2OSjzzUaqu0KDSPME8EIhvp7yIGEgYw=="},{"id":"o3","title":"How the staff council works","text":"nv9rIjsvasm0giZlwSbuMkzibPxXpXwt+uMTizf2OvpkSWDLOGP06XpAPjnkqxJlhW/fWDbWVde7huoebHmCaYkilnx0JP6SkIxOVV9l7+53vcivWUPGu6uXXadvxDX4W/skLQArH8VFrU5uvvuIeVS41ED060kXRwUmZpzBxQ0W/thnoDevY0+jz7EY6BpeNmwbxNlekeiLI7OY/8Z9xE6cdbrGxjxdHYXiIOvb7tIYamy1e+OOBUm9lZVyioTPmBjluYxMCgIjJPFNVQVSQpMYblhHXHnWQWKEdMy0nGu3RIZUykZXoBeT5qxZJdyeX6+OZvXZBTqFrlDU/go6RXF1nUFMi10+pUyT0onzBRCX2kP9D1TM2/+2DKd/NqUHZl5yxezI0i0CDMhD7g=="}]}]},{"id":"B","label":"Role B","dept":"Operations & Safety","characters":[{"id":"marek","name":"Marek Nowak","title":"Amsterdam City Operations Manager","subject":"What actually happened at the depot","email":"I want to give you the facts directly, because I'd rather you hear them from me than whatever version is circulating. Ten days ago, a battery pack overheated during a routine swap at our Amsterdam depot and caught fire. Nobody was hurt — the team followed the evacuation procedure correctly, which is the one thing that went right that night. Because of the fire, the city regulator has given us until Friday, 48 hours from now, to complete and sign off a full safety review of our battery-handling process. If we miss it, our licence is suspended and the entire Amsterdam fleet is grounded for at least a month.\n\nMy team here is stretched thin and honestly still a bit rattled. Whatever gets decided about how Flotte makes decisions going forward, I need you to understand that this particular one has a real clock on it — it isn't a symbol, it's an operational fact.\n\nWhat I can't judge is what a slower, company-wide process would cost the rest of the business — that's Finance, not Operations. I can give you one more piece of the picture before you decide. Choose carefully.","offers":[{"id":"o1","title":"What happened at the depot that night","text":"sRO5fJUGAQxIQITZoJfRhXHrkgV84+vSUqwZV23izDBG82A5EYbwRg/0UuRYVRiZk0VRBzFiRGm6Ms0yGr6oU7WBGmmxWBLoLy80i7v094EB2a6op5XpHYChygzYw8sLOGw37RRdijn4t15ELebqIFtVS+CxNmppk1Z//rR4m8GdRZxbhHRJRyCMJLxeWgrfJgBpJ8V9r6o0011ZTTyZSgjt0hYLphA0tCERMXkIX2Y0uECCWRyo2TnwyZLRuNE+YK97sDVAE/mTfQxi51vuRbgid0rDgzMRdcbj+cqxOw2a0xgbMlAgpO0IzB2yBUdl4Dwpq8ygaKMFoBzm6rFPJ1HeRDfGTV8aEDTOF+Rf5z1SMNifHXz/NqJzB1L1N0+d1p0uKBQeOY/Hpu3ziFKjprhD"},{"id":"o2","title":"How my team is coping right now","text":"XY0c8eNj0vwDigHjHNfCnVmUwlqB8Vuqs0FPD5jFFHkyN4Q/Nb5X05/h+Iq63Ef3Xn8nxceC0TeflQ30vlucpIKmpS275K0nvzc4zJsZaQcjJbvp2mK2bwUzZEkCBqlhiv8vECmTiv83Yx8hhrGn7j/nPZdqopQaIiaK3c3Ppb7QFAQ6L9wGsb0fV6AqGO3iZq9G4PWvy4/AlRWfVJOy07A5DVwLnso5YkmHP3w5KRnkUo99c/pHOGis3b/UEI1RRwMzDCrLkyVIjSNX2LevaEqfPh0HhMg9o3nDvooGDR3IevheCaAc12eTpF+DMXxtuZ7BUpPHCbv1fzbGV2nIzC08bSeabEGLnjQoSx6t4jZiYcT6xhkRCBCJwUUoTBbhMFT8T9yf3lBQTtZ/4i0OC5ksWAvW8hsbi8d5ahTOzFqIFTlE5DwsYg=="},{"id":"o3","title":"What my team can finish by Friday","text":"0sdhBJQVnGQl1wWDrbbRgia6ukLz1kpBpUnvGyIthOv1r1ad2J29IplS3cYXhi1jAAh/4FngGhDihmAXDd5krkBkfJa8twos/gs3VO3RvJr6TmGfBiB3Z7NtKmHfOCWwmoHjpQMnuRqSjJztIYWge8nF7R2u1Xs9lZC7MAK3OXwbcpehQUQbXRuIx0FdaanEZwegLAByaZyjG5xbAZ1WKzazQ7YNDRMxT5bcPwelg6JHgkzTKYtkIa+jUUaSl1tTD4PnghdtRJ/ViGYP4t8e0TbKNNlZmw43S3cNh+reFU6F29aUs8EbkYLDfnhpkyUAzjvzXaflLf4YTtR/3FryaLMYKl6mQAVBXjmwgehNHWHIWMciCTxKsj60X3deY81vIu7/mdrq"}]},{"id":"chidi","name":"Chidi Okafor","title":"Compliance & Regulatory Liaison","subject":"The deadline, precisely","email":"I want to make sure the committee has the exact regulatory picture, because I've seen \"48 hours\" get rounded down to \"sometime soon\" in people's heads once other things compete for attention. It is not soon — it is Friday, 5pm, full stop. If a signed-off safety review isn't submitted by then, Amsterdam's operating licence is suspended for a minimum of 30 days, and reinstating it early has never happened for any operator in this city, regardless of how good their excuse was.\n\nI'm not telling you how to decide who signs off on the review — that's not my call. I'm telling you what the actual cost of missing the deadline is, because I don't think everyone in this conversation has that number yet, and a decision made without it isn't really an informed one.\n\nWhat I don't know is whether Flotte could survive a 30-day Amsterdam suspension financially — that's not something Compliance tracks. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Who can legally sign the review","text":"UA2pkZcPpCdy+6z0AE/W3ava6pwLipqZJ4r/x1Jn3wRxsmGGU5ibbILIaudYyC+OzhlMG3vniWFXAbJV5pUVZDic3F/CDTNv89nGJGOJNC3KkFqmj6kHd2BiHk9izbQ5s2WTf8UkDc2ejbP/N6oQTSRaytl//F82GDKUEXv8dA3RhZfdE4YaGeksoXU+laRfF9upkT0T19Kcpgwrf98a6eTTAjhFu+tWlSND/4tocia4SD5hAz6 ntradicting what other people are pushing for, and maybe I am.\n\nThere's also something going on with the Warsaw team lead that I've heard bits about — a possible performance issue — and I have an honest opinion on how it should be handled. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What the swap station actually needs","text":"RUsMielqxbJBKbdd9lNCFojQ/3WS7vk2c6bLr0NU0tCX/KTaDS319KVLGtDDxQ4hHeTVM8nW4+7oePFcOEZ2Iz8OPuUPUOZv0TC6WnpQta8vsAsq7v20Lc7SzaMGnkNiC6+sJ5EERF8G79CEjy6DnO4fEVzr7InpEQFcxEF1MPSUt5AKwqBEHj9maidNcs52mFqpR4KfI9LumhLFW8+kWYvP2OdbenDEny1pl9CDNUVqWN2+AUDqDsHzFXj0yUMu7u6pgiWRzUCaRdTy7MUOWWGFplh+cAxbi+8KXvb2YvJummik9gwnDftfCBrMLayb2jaQyfvoUqqB5tpdaJA1vSjrcsWZv02zOVY1xdnZ4ML+N+hSRF6wjWDZgekVetocqnIO/Gj5MJE2OFHBSKtDbXc="},{"id":"o2","title":"What I know about the Warsaw lead","text":"yo5FcOOB+xgwNq5VtsNRxoACBabB4zkbnpUsvvin4/cUsD4anNlenSo8UFa979+T29EznwDEnvhcBVsVwVXspL6kDusMzD1X+jfrlWhR0nbhWhaG47iiT370py0YQeel8MPNT4pLXpHIfhTjC4ZOHVmfAtuQ5C2EosXorm5RAB+H5wagxLj0nUl2PTatwup1rSa+xAltzLwZsUDqAQPJBZo9V5rBWJNvzADmm84/ShpZqHjIxPKx7aC21iuL5eILU/B5MHR9SwZlLbYoL+acqy7oUmfU/MHuq00Yn3dUK1C/S5xkUvM5yvBqu/nrmd/s7O+KA+CGLdleN5LSkImdHsfCaCOKTc/FbHMKFqgX4r0Lc/yU0xDQ8PHQiGC+Y/Qv8PU6Q9tBUEYLzuNzIEM9BeIKjJK8WvV5"},{"id":"o3","title":"A normal day at our depot","text":"EZOjev9mvx53JbZkzcZa9y2f0dnzX+4NkZMYXPdmqEJahvktTvcZhiTYA4cg80aaIoK6uviUIfXYvGQNmge8BMrC0fKyjEINR7Lp47eg1cGl9ZDS7hUUnzGaYK8KSLEkC9Gtu7mrXkeARyfjxU1hBRBDCY/Bxh/FbIt5LJnHOFaBRL750APS3Z7nfk8WTcNnSUeVFXrF9jqluby0wrqTmEZuaDga5lBVfDboEdzKNRednVLXuDfTcc/PhpkuC0C86KaH2U28KqyjjMB4ZXIQyxu/+M18Vr3l5WMXkZ4nxl4wmCuuH7Y5/DdSb/5mM2Ki1Az38KNMr9+mAq4Jj6NwjRYLbDewI/EQhOYaVA5XlAxlqyrXdElquenUQtvjdtiFmah+IJaL5CQ="}]}]},{"id":"C","label":"Role C","dept":"Finance & Strategy","characters":[{"id":"julia","name":"Julia Hoffmann","title":"Chief Financial Officer","subject":"What the Warsaw pilot actually cost","email":"I keep hearing the Warsaw vote held up as proof that democratic decision-making is basically free and just a matter of will. It wasn't free. Finance quietly absorbed roughly two weeks of lost productivity across that team while the facilitated sessions ran — we didn't publicise it because the decision itself was low-stakes enough that it was worth it. I'm not saying that to undercut the result, which was genuinely good. I'm saying it because scaling that approach to something time-critical, like the safety review, would cost far more than two weeks we don't have, and this quarter's runway doesn't have room to absorb it quietly a second time.\n\nNone of this means the answer is \"never ask anyone anything.\" It means the cost has to be weighed honestly, not waved away because the last example felt good.\n\nWhat I can't tell you is exactly what the regulator would do if Amsterdam missed its deadline — that's Compliance, not Finance. I can give you one more number before you decide. Choose carefully.","offers":[{"id":"o1","title":"What an Amsterdam suspension costs","text":"5INxKPwpJVSJxNwr4naB9iuVRMEzfitfF/xNHIASLU06RfzUGY2oVeuiS9P1gVPZXJYnA6EIzFPkc+En35uq/YlmF+qhfLirbLBHyjg4rYzhyCWpWOcZTOXpHqUsQ0wznoHgi+THPm8Ye5dLLbyuYJI0gBi4voyacooS0mhNPg6MpCFrI17qRNnaSa650uurFtGESm+aQpEueFbZkr2qrmtZh2RPiSBuwGzZD/hbNKcv5JNhNZy6IMa+ni5ogNPEUuOyUXCyLpx0Cn0/dL817/uh2qTW13ASuf/tQGTFWhZLLBKlHTcx3UH86pVcEb6p9sIH+k66TT+S3VySYIXMfDdkt+Gq9Jdu4B0xzx9XaEfWU03xG9Jf2Ec1ptAGuVwJnvvJzHuUoE/IO3IFB+IUWcbFQEX2sA=="},{"id":"o2","title":"What the Warsaw vote really cost us","text":"VjxZxk/m6noojgwQA33ZItufq39OinIKux75hI06P9rJRQRQmU1+uzFp/tdyag8rsaJuon2xQK1/CP0g0JHNRz24B+GfCoWb1dFCfZEcxHXIWvjtzF7bGkMfHAy9vYUmce77eSUrwFu4q/RFnCRZXeEjolc0mt01YgONuRaOQPAPF6CcWTqt5LrbgoPaLClFjcSNcHtZh6F6r0qzojbqiHXEjI6sBvAgiHeeczH1I5aI5yK8ULobXuFoc+Sb1uEeqnA2aRVyxwLUdxuuq0mERzioE1SD3d0N+GPwxF9M1QpA/HZA9hOz90s1uo0uTfyIPRZRbxn4/eKlZn8HOCU/0QQXKmEx0YUqhZGmEHIUsYLFTKP6RvkGUS5fB5+5qlXWtENI6SfbLzLIb4YBdg=="},{"id":"o3","title":"Where our money goes each month","text":"dAoya0JspTfNgBp525+r8/wU/OXgKciOlAQtHIgr6LeLXDO5GjJC/sqJBKT2oPWt+E/+e9Oyt3SXk4ZAHuWxk5fORjtx56ccON5jHZl7beL7kVkZFQNaYmj9xeZzIopaxdkZxuLVJToGrFCFehzkKtFKFh4u3T4WWcIrJl1RqPBB5fb5y0BHixNSIhV8ZbIESnASnOyxkybMnFK0BG99RSt+0fY1GZVMRjUzCEtJXkAjwl9nBRiAgylDx68vwaHLKMtBLiuUAeo62gCnXs5hyfjBOc/vcQuCYzKeIzKF3MKGR0tH4lgdQRV9wSXa9Z2yNH8ZJOyDku17zWIZKy+ZB4PuLdS7sVpCXsfJd5Tad/eF6a5pWRfndVdKcSsAbgfQiAPzJZ9FIMRMt8OsL+iQco+yK4jwMY1SwrGAFI5ubOUUdeqlkzFMVzUf1e44eUhk"}]},{"id":"tomasz","name":"Tomasz Kowalski","title":"Head of Growth & Product","subject":"Vienna is riding on Warsaw, and Warsaw has a problem","email":"I need to flag something that's been building quietly: the Warsaw team lead has missed two expansion targets in a row and stopped showing up to the weekly growth sync altogether. I don't know the full story, but I know the Vienna launch — our next city — is scheduled assuming Warsaw hits its numbers first, and right now that assumption is shaky.\n\nI have a view on how this should be handled — I lean towards someone sitting down with the team lead directly rather than making it a group conversation, mostly because I think a target miss discussed in front of the whole team turns into a pile-on fast, and that doesn't fix performance, it just adds humiliation on top of whatever's already going wrong. But I'll admit that's partly a growth-side instinct — I want this solved quickly and quietly, and I know that's not automatically the fairest way to see it.\n\nWhat I don't know is why he went quiet — from where I sit, I only see the numbers. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What the Vienna launch depends on","text":"jh/Lg1HLH5NyLAk53ELs+SvM6ZPPQHXjwlPhkGiY8juRs9y+Ac7NMSpcrE8RMXImoBkq5K/ENQuJHsZWMn7GYrEPsDRDjp8fucWXfiB0svB9mjj5mTEKT61JPXdoG0l2LGXGXdyDcrONo8wJaxHGCO5qFx0u02g8doym3ctr9SOLXRhQGUhmklG0A+2VFqjE/VSjx8eVOFbchP8XgC2U5D+HzF+8s+LGPrqMkYgFfphXWtDyoqd+NKrjlgYX5JSV/jHEWuvEQpak8IhpIri6IUJgcfF9oJNDMlhjh8NTghHN7rnZZXtmIulW7OON/n5otPtPo9A36JAU  trust the interim committee right now, or whether the committee keeping real authority would just look like more of the same. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Why I backed the last director","text":"yM+MaenjQ11gzzdgZVuCg3LPmnFk6NfFTzOD5OgUYNyn17R5g5yEyqSCmO3P+IgdT5xZB6MBAZEEhk5yOeXk02YCfqffLujHJ3GooT6oZQahBVkYuEjs3Qsc/BEz2Ko9DfSjGI/sLNsBP032Xoa1wcqAXsMv1+k3kP/oExwAAzb6wN0jyCGeCo/IK59JDzW3QySP9KyrxMf2AWxQuQFSZVGEWoK8DUxldzHJss9c+X4i+s8EDhGOEtYKaZDtFEqIq06rEvF+mE/IH8Ga/B/sACYsLLmYysYL8Ii64esM4uoI7/ivph1i1ZfmDNK9eIiVNpNtH8B9cxm6fRrmOEl6/aAjpBUGA6rZeSOG1jdDwjcZu5fcDRR0D9FqyJ2u8BjdEyRw/TH+PvhyYsg+xSrXrsXhJAOrZe52f6mgBsbFuCgR"},{"id":"o2","title":"What our lead investor asked me","text":"8BB9M2jT75wwsdHSthZ/p04JpPt+4vEnPGwt8WuhOvm+rgKt2kaKdMKK3353JJ+L5oj2y81YWkU/KHYcvl4teOj2tv9uouUGP2sCZKqS1vqDempjpi9LOBZxcwWlM02XhSapq+GRPKZARuINvOvWiwQX4OnaJCVXL7F9Xfvds9Q/GLBxSMMgZ2eT4kLiEmopiq0qxbXAlpBuhQRhSmqNJ7oQFtIaX+9XJ5/Lo20aHH6f1JG7ZV1CbPegUcInHdEjDkYFseF8QF+u7IQj4ZiNdpqZ7WzN+GNAB2AcfJl8lNhJ2bu763/PdQgPv7YJZIR5/D/m9E4n+uX1qr6iMxfm4wclJbMvYhJ4BDcYwpnSHIleG0hqCLaHiIi/IjbeeXsPGahJNCnkKg86FJv+/S2bKCVG7gyjWvO0tcucRdJvWHm54HRPdbVvqWraJRa4Zk7MHVwsnJdCyOjDxfsa7TdZgp88B0XKWLk="},{"id":"o3","title":"Where the board stands this week","text":"waE+sSwrF1aEtXQ3m0Z8njlVTtVJm6krEOs04bBNELPPnmGFJPD6l+gNrQ4TusDyMomhQIXI+sTDsHUq2yzcfkJQMXl878i6qAKhsZBJKVNsd7o7nyOqhNwgyREOF3ws0cW3FM+pJBRSKCMeo0Te1pJZEkA0j8FQl9WhU4kIOsVX4mdSyRkkk+V8k3OeBSO/TdIzKdyqyZmeehXte7PlJhiRUYstQPLOQmHLGgQF5cNwPjuDqbXsRE3U0MfnogiwGUdHK7lTkf6VlaoG8oL9LDFxd5bPY1gpJ1MN8wcNvGKgBZrkI8Jqvf7OVqFOZ8pVYEX5+qU22oVjxF+6RU9TFiPpoVGxOkRiYkXkl8HjuvzHrCucCLAbMZXnyp8RJfWpp3Maf9p1sK+riAvn1RSPEu4eR2+oOB9dkN38O9CKsbbbqX9Mohg="}]}]}],"decisions":[{"id":"D1","title":"Decision 1 — How We Decide","A":"Staff vote — major decisions at Flotte go to a company-wide vote of all staff, one person, one vote, after the committee has set out the options.","B":"Committee decides — the interim committee keeps final authority on major decisions, after structured input from staff (surveys and listening sessions).","short":{"A":"Staff vote","B":"Committee decides"}},{"id":"D2","title":"Decision 2 — The Amsterdam Safety Review","A":"Expert call — the Operations and Safety specialists complete the safety review, including whether to pause the Amsterdam fleet, and sign it off.","B":"Company-wide vote — all Flotte staff vote on the review's recommendations, including whether to pause the Amsterdam fleet, before it is signed off.","short":{"A":"Expert call","B":"Company-wide vote"}},{"id":"D3","title":"Decision 3 — The Warsaw Performance Issue","A":"One-on-one coaching — the committee member for that region meets privately with the Warsaw team lead to work through it together.","B":"Open forum — raise it at the next all-hands meeting and let the team discuss it and decide together what happens next.","short":{"A":"Private coaching","B":"Open forum"}}],"newsflash":"G07wLGbF6OdDOy2H2sXuiFOCzdj1MvBo5odx1uor3XqaN1BqbB/M1DgwN9fNlhlMtaUykYJ9HB+l5iwA0Ynsyu5fmjVo1LkCMCZe0ZXrL7RIOH44qWgqFTNo2fw46hAeVSa0F/1iXIrrOnIbRZOmAXiSsSZoKJJTPd8cRB5PyfmA2QSv48jLDoocwpeXNa/ocbjgJy1d8fp7j/4GRDpeJza4rgZdnxXb9j9UczWLbOWUoTp4/CwHlMD9LxdOhcMGnvsQOyr9tuaVoO1QFT23QcSpP3+8I+J93/EJ/4XIX0M/AKjxHAf/kWassLZhaH4kpmGBmeceUvs5vZA9uTcRaMs5V5jFaOi2Jdm4TcHagOYRV3AbMRnzbBB+Ufa5wZFa5Qm/LWddaNuGQKgiz8aTwahe7moq1ure5+01iYo6zqi5y1dFWum4gfyfQ7QNL2FfwdAYhrTkWe+h5RhAwQzsv+VJGzPYhBo88qmiYSqz/KZuZGFPBlepGvNfWwwNYGeHfT72P51qHpPN4NOBJEZl8drO1SVRZ0pMAK/bSdVsb8ZpO3ECEuDns5H9+CLwTxXVBvgYFzn+xnfyY9F5mlNdBeqDfl9NSFV+kOOaE6EorsNf2fDZnhDv6Ldm6g7Ox44eO8pDMC3uTnQY3WlRfc1wpFltWXD4flQZrZVwFVwa9YnQu+euhGZhtttvcewZZEkLhLdtdb+ChY+SHAvrNQv1tj1wy4bgs8punAeokFG4lW9vE0TsSAGseCvQoc5TKw18w+KHe0i2AdxhSxECS5Udg5FG9WgJcfd5+X1ZhY6TpBWYQZjuFanx8SntKTzd1qzgFqUz/Lxv31SW9+Nkp4H/UFjXoajWL9GkiLMu04rXzw2lYTqX2LfOD9MufNQMuopKGcoruS5sEpnizGdmfluTT+z14Fc91BWg0voB8bVO1e6UrYKyjReI9Lq74WuK9n5jUjCCGwo124nweR+JQFhvZwHTfK7B8P2LZa63L3JUrBXo69yRiuIbjkXXzZKNPT <script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
let st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:""};

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;

function callName(n){   // "Dr. Elena Whitfield" -> "Dr. Whitfield"; "Freja Lund" -> "Freja"

}
function mailHTML(c){
  const chosen = st.choices[c.id];

  let offers;
  if (chosen) {
    const o = c.offers.find(x => x.id === chosen);
    offers = `<div class="offers done">
        <div class="opened"><p class="t">${esc(o.title)}</p><div class="prose">${hlHTML(unscramble(o.text, `${S.salt}|${c.id}|${o.id}`), c.id, "opt")}</div></div>

function wireMail(c){

  const lines = [];
  text.split("\n").forEach(par => {
    if (!par.trim()) { lines.push(""); return; }
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const tryLine = line ? line + " " + word : word;
      if (pdfWidth(tryLine, font, size) <= width) { line = tryLine; return; }
      if (line) lines.push(line);
      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)
        const chars = [...word]; let n = 0, w = 0;
        while (n < chars.length) { const cw = pdfWidth(chars[n], font, size); if (n > 0 && w + cw > width) break; w += cw; n++; }
        lines.push(chars.slice(0, n).join("")); word = chars.slice(n).join("");
      }
      line = word;
    });
    lines.push(line);
  });
  return lines;
}
function utf16Hex(text){
  let h = "FEFF";
  for (let i = 0; i < text.length; i++) h += text.charCodeAt(i).toString(16).padStart(4, "0").toUpperCase();
  return "<" + h + ">";
}
function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
  const para = (s, font, size, lead, grey) => pdfWrap(s, font, size, TW).forEach(l => {
    if (y - lead < M + 20) newPage();
    y -= lead; if (l) text(l, font, size, M, y, grey);
  });
  para(title, "B", 16, 21);
  para(subtitle, "R", 9.5, 13, true);
  y -= 14;
  para(body, "R", 11, 15.5);
  y -= 18;
  para(note, "R", 8, 11, true);
  newPage();
  // objects: 1 catalog, 2 pages, 3 font R, 4 font B, 5 embedded file, 6 filespec, 7 info, then page/content pairs
  const objs = [];
  const enc = new TextEncoder(), blockBytes = enc.encode(block);
  const kids = pages.map((_, i) => `${8 + i * 2} 0 R`).join(" ");
  objs[1] = `<< /Type /Catalog /Pages 2 0 R /Names << /EmbeddedFiles << /Names [${pdfStr(fileName)} 6 0 R] >> >> /PageMode /UseNone >>`;
  objs[2] = `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`;
  objs[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`;
  objs[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`;
  objs[5] = {dict: `<< /Type /EmbeddedFile /Subtype /text#2Fplain /Length ${blockBytes.length} >>`, data: blockBytes};
  objs[6] = `<< /Type /Filespec /F ${pdfStr(fileName)} /UF ${utf16Hex(fileName)} /EF << /F 5 0 R >> /Desc ${pdfStr("SimLearn answers for the teacher tool")} >>`;
  objs[7] = `<< /Title ${utf16Hex(title)} /Creator (SimLearn) /Producer (SimLearn) /SimLearnSubmission ${utf16Hex(block)} >>`;
  pages.forEach((p, i) => {
    const foot = `BT /R 7.5 Tf 0.4 0.45 0.5 rg ${M} 36 Td ${pdfStr(footer + (pages.length > 1 ? ` · page ${i + 1} of ${pages.length}` : ""))} Tj ET`;
    const content = enc.encode([...p, foot].join("\n").split("").map(c => c.charCodeAt(0) < 256 ? c : "?").join(""));
    objs[8 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${9 + i * 2} 0 R >>`;
    objs[9 + i * 2] = {dict: `<< /Length ${content.length} >>`, data: content};
  });
  // assemble with byte offsets (all strings here are ASCII)
  const parts = [], offs = []; let len = 0;
  const add = b => { parts.push(b); len += b.length; };
  add(enc.encode("%PDF-1.7\n")); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));   // marks the file as binary
  for (let n = 1; n < objs.length; n++) {
    offs[n] = len;
    const o = objs[n];
    if (typeof o === "string") add(enc.encode(`${n} 0 obj\n${o}\nendobj\n`));
    else { add(enc.encode(`${n} 0 obj\n${o.dict}\nstream\n`)); add(o.data); add(enc.encode(`\nendstream\nendobj\n`)); }
  }
  const xref = len;
  let x = `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
  for (let n = 1; n < objs.length; n++) x += String(offs[n]).padStart(10, "0") + " 00000 n \n";
  add(enc.encode(x + `trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 7 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts, {type: "application/pdf"});
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${st.choices[c.id] || "-"}`).join(", ");
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · Role ${r.id}${r.dept ? " (" + r.dept + ")" : ""} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
