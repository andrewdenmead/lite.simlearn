<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Heartland Reckoning — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examq{margin:0 0 18px}
.ptsbadge{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--pine);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.pn{display:inline-block;min-width:1.4em;color:var(--ink-2);font-family:var(--sans);font-size:.85rem}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
.choices.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.clip{margin:10px 0 12px;padding:10px 12px;border-radius:10px;background:var(--panel, #ECEFF3)}
.clip .btn{margin-right:10px}
.steps li{margin:.35rem 0}
.spmore{margin:12px 0}.dec.settled{opacity:.6}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

 elections, overtaking both the NDP and the Greens in the five former industrial provinces and posting unexpected gains in comparatively affluent suburban seats as well. National polling has kept Heartland in second place ever since. In response, the SDU, NDP and Green leaderships jointly convened the Thornevik Democratic Renewal Commission, an independent inquiry chaired by the respected former ombudsperson Ingrid Halvorsen, and each party seconded a strategist to work alongside her. The Commission's mandate is narrow and urgent: establish, from the best available research, why Heartland is winning support from voters who have historically backed one of the three established parties, and recommend what the parties should do about it before voters go to the polls again. Each seconded strategist has been circulated the three research excerpts most relevant to their own party's traditional territory, but no single strategist has been given the complete picture — that is by design, and the Commission's final report will only be as good as what the three of you piece together and share with each other.","scar":{"label":"The Unity Accord","text":"Nine years ago, SDU and NDP leaders signed a hastily arranged pact to jointly campaign against Heartland's predecessor movement ahead of a regional election. The pact was negotiated behind closed doors and announced without warning. Heartland's predecessor used the Accord as proof that the establishment always closes ranks against outsiders regardless of what voters actually think, and its vote share nearly doubled at the following election. The Commission is acutely aware that any recommendation resembling a repeat of the Accord will be read the same way."},"proof":{"label":"The Ashford Renewal","text":"In Ashford, one of the five industrial provinces, the SDU rebuilt its vote share over two elections not through a national messaging campaign but by running candidates who had lived and worked locally for at least a decade, and by letting the province's own council — not national party headquarters — decide how a new regional investment fund was spent. Heartland's support in Ashford fell at the last two national elections and fell again in the local elections eighteen months ago, when it surged almost everywhere else — the only one of the five provinces where this is true."},"constraint":"National elections are eleven weeks away, and the Commission must submit its recommendations to all three party leaderships before campaign strategy is locked in."},"roles":[{"id":"A","label":"Role A","dept":"Social Democratic Union","characters":[{"id":"lindqvist","name":"Dr. Petra Lindqvist","title":"Labour Economist, Thornevik Institute for Regional Studies","subject":"Regional Wage Divergence and the Hollowing of the Industrial Middle","email":"The Commission secretariat is circulating this ahead of Thursday's session — Lindqvist's regional wage data was central to the leadership's initial brief on why the industrial belt swung to Heartland.\n\nFrom the paper:\n“Between 2005 and 2022, real median wages in Thornevik's five former industrial provinces fell 4 per cent even as the national figure rose by 19 per cent, a divergence this study identifies as the clearest predictor of Heartland's vote share at constituency level, outperforming both net migration and self-reported cultural-threat indices in a multivariate model; on its own it explains 38 per cent of the variance (R² = 0.38), rising to 61 per cent (R² = 0.61) once job-quality indicators are added. The mechanism is not simply job loss — unemployment in these provinces has largely recovered since 2015 — but a shift from stable, unionised manufacturing contracts towards lower-wage, precarious service and logistics work, which the data associate with a measurable decline in household confidence about the future even where headline income held steady. Voters in these constituencies did not, on the whole, report worsening material conditions in the years immediately preceding Heartland's breakthrough; they reported the conviction that the recovery, when it came, would not be shared with them again. That anticipatory pessimism, rather than present hardship, appears to be doing much of the explanatory work, which complicates any simple story of immediate material collapse. It also means that policies aimed at restoring headline growth in these provinces, without addressing job quality and contract security specifically, are unlikely on this evidence to move the underlying sentiment. The wage data cannot, on its own, account for Heartland's simultaneous gains in comparatively prosperous suburban constituencies — a pattern this study does not attempt to explain.”","citation":"Lindqvist, P. (2023). Regional wage divergence and the erosion of the industrial middle in Thornevik, 2005–2022. Journal of Comparative Political Economy, 41(3), 288–311.","offers":[{"id":"a","title":"Another voice, same position","text":"JfUbjNzcLY3BABZhieaZJdio5rj1Sl34URwKdfoHsxO6EnRHks63E9VCPut+m+GhbTO3ORQthlUcVE9xN//MjbWksW0iHU55UUS030TtSnSBmMYqPXclHaLz5C9Rw4fbzXJT07ki0643/9xJJlQzAw+S5ARiqrvoFRYY/zzGpplGqwbdRgxdCaswhlK01M+BwUoFSpVSabjidV8r2gG/AcStBJklJ9Y3EYPjcSChoHRwE/HGOYWlzOKZ1oJSKXZ04zkq1KeysZ1IG+bwgsYZrq203xvSpzijoGXKk9xpSHHY91tI0m3xDdvgqgy4nuUGuECx8K7rzsyu0pn67vZrgksB8iQQAbvGql21f/zbvXX1xpmOsQk/M2ru7SbepeO5ZxJdL53smmnglShoGcGfuFolKOnI8ViCTb0+jZ9k/PDjbopxdk7tt0wCMX6wRMSPEeJ7FRf9riJJd0JJm4aOwl46ThhzNQ8m6HMyw/0oKAKXdRx8c/SHOvgP3QanXqab5PGpBMImRWsuIOpxk6j3+PzQCjQyLfCLc0AeXiuj+dRXi+VFssyxj5QqSaYsYxEMA5HBy0IO/otAe2RAVuXMS2sWKeEoA5kq5RtyqwW4+J/LEr7TbE2ogWd0HmWdCCsY4IZSDJWsonTBYMalrlqOWbLGTqiNEfhS5pKYf+5Bn58tfpD0TKckKd4zDD86b3MxXCekLRKB4ik0AecPlDlHY3HiAin9+jhUZsi/JEy0B4Zkk2It+F9e/TUUdgMCKFwgXzzlDBCIke0lkr1Hfxb4YWXxlUcoCWnsbnVr0691xUHM68l04423w8ZZYWegSwjkpK01SZ520nq4P0coK8vx39IrXpDKLKd/AUiXFag8wYhGQYttSZ4J9ohi6Pq4kO/5FhJaUSBLbqthlP/gRWqLpXn0eEUjUEmMeJWa/1zkY48foJb/14SUV60t7VbFOOQ+77lKpM0q2LAqoabuLKS/bqojKWgWZoX9lNG2ynSNit1680Kc5qp2FtSKEVURMQhNu OWYrDBqENmHQBPc/CFyvORhFt8J9CTNNEm+JKvsLUxyE6drgx6zpLHsXkY2mB3bmPXkxtkjkN0hdauCUA0XwP7IZAA/gyNWeyArtAa+64/EfsCY1LsAdrNXEgY5vJ8/ovGxRrV+bjYux92tQ2YliI/1z2amMPWRPskBaAcQWeE6dDaMKfov7KI2dHX0me+PioMnIx9TTVOH1RLFPy8T57DCwVehQfRnt/jXKNI4wF8xaQ=="}]},{"id":"ahren","name":"Prof. Tobias Ahren","title":"Economic Geographer, Centre for Economic Geography, University of Kessler","subject":"Investment Deserts and the Political Geography of Capital Flight","email":"Ahren shared this directly with the Commission after reading Lindqvist's wage study — he thinks the investment data tells a sharper version of the same story.\n\nFrom the paper:\n“Capital investment per worker in Thornevik's five former industrial provinces fell to roughly a third of the national average after the 2008 financial crisis and, unlike employment, never recovered. This study argues that the resulting 'investment desert' — a persistent, visible absence of new plant, infrastructure or retail investment — is a better predictor of Heartland's rate of growth between the 2019 and 2023 elections than either wage levels or unemployment on their own: provinces with the steepest post-2008 investment decline saw Heartland's support roughly double in that period, against a 40 per cent rise nationally. The mechanism proposed here is not household income but visible abandonment — residents in these provinces can observe, in the physical fabric of their towns, that private capital stopped believing in their future years before politics caught up with that judgement. This account converges with Lindqvist's wage-divergence findings but reframes the causal story: voters are not simply feeling poorer, they are reading an unmistakable signal about how their region is regarded. The emerging counter-example is Ashford, the one industrial province where a new regional investment fund was placed under local council control rather than administered from the capital; Heartland's support there has since fallen for two consecutive elections. Ashford remains a single case, and this study cannot yet establish whether local control or investment volume itself is doing the work.”","citation":"Ahren, T. (2023). Investment deserts and the political geography of capital flight in Thornevik. Regional Studies Quarterly, 58(2), 142–167.","offers":[{"id":"a","title":"Another voice, same position","text":"AHcgCJWFfDFF1Yewey6p+lJeW3YCZAvu2vlbiyCCvWnMYgP2pT//gvDYSYYkoKf9UL+w52xtwJ3eI2xpoQ84DyWnSfD6NialEWne0X/Uu4ZkAl7wQGgNjzL/oB4ySffiuZqfWRIsbEh7ANkv/5oku5nZO30uOUgmiHfLHQpjTAm0SrjZyAsMbFzo3IyR0vZvgMcUZAsVJvVhM1EA1nHaHeK/wWtVtV9Y+1m8amlpFnJhMpCKn8VKvQBtUmoSvMWC32V24qtjno1f7bt0eD912N4N8YVXEpJ0UVAk5+ww/n1LwYBFxgX+sqFqZ2YChdPzcKs2YWkNywPzgRdLLgtOEBsea4ynPX2wyAVEP0QVD2U1inhEklYDz3DMPM+kE8iYSjlDI9yyIR0bEJNQgzcZJqXo/QMQQIJHonieovBkRbIgd9ekpUsfb/WoEiny9iAXKRCuOIjoDPQc/3W4xYpIgi/0tvMU+jzVaVCordg1JIBniRNIcaVnEcrXUKvJG3f02vJcvWMXMxAjZVAzEaDTHQgm0fDHt2qg4i0THtuunEBH5Q1HLehTXz0qrn/Z8UTG1nxzZOXbyZovkbFbEX7FHJTPjZFpJdoBaUMq0AB2JIHmYTcywUcsexOl4p41lKEtZ1RofPYeCnUlxNxIWzMeWkUrAARCjffA1ilVAsrUNw8u0smVYOjhCXvYQjz/YkdMp+LR8CtDTRXqQdIlxamTiLFUeGzgUjIsbtyekuDHEvd76RGm2j9SX7eo0gp8hZGzYh5o3hpXJD/7+ABE+RUnlSVFNhV71lyTFyl0s1gas6QNxW8J1eDgRBEiKV92d6rt+cClJD2L9464UWcokjtSNwkS32Fx18vkmcvIayfMSVVR9bYXUmLWEzDw6ZNo8QmOVF1baI9sQC2Bj+7wnRIGZx1qjaZZ9MJ/P3XsqSddcgVpyJzNcV5PcGFNixVL3pNqSN81mKccWNiscTPF+7e7lTodqNju604rQgFBSEaoTEJQyOus6xNyzPykCO76PWHQNpvocIpp59GToAGnVr0uOf8Lxa4XB9vr6odUbfRNEF0kGs/gOn1SnObwjZSk1laJqZt9Qe7KmTKBbJoEVWwmibTBL2u/pCs="},{"id":"b","title":"A competing angle","text":"q7DqBjiRf4S8/QYZFdYEtdckQQOSPbzCmwsEK9CAJWAUJki4Uck3WKB4AIPVk4BDXryjyvYP+AN1o1avT+2QCJ4uZEL/pScF3HnU/18CblSxR+LpIJwBDtU8hFoSD7OtN8/H23nzgCtQcXJfT6kCNrVsRcSAXioOn8D44nTkAFegVV/ePR9RHSskU4hwQwB02r9ZTHhtzMN3ey5fzKlpQXVJ/mEvp9K/ybu2Gb/cSQE5mrQK7IzFN3EbUwxw2eN8ewZtiIC/aSdsPKBYzNC79NUjKjBerwRRPX3W508HfgOYdAbMLc6lw5z+fPdlv7Jmr44rTqcYxc0YZXSdDEWwmyXpdtkF8dqkXUivS8hAUsyhOF4PkUrA2Gd2Orjopf8RpPRV8JekBRRk9nilAFZhsv9UweIlT81KNJFz+mZrdTCQOBM4wpGaWbtxGuWPS7/F0H1LJqMZiUqerhMk inisters flagged this study to the strategist team — she says it explains something the party has been reluctant to admit about its own reforms.\n\nFrom the paper:\n“Over three successive governments, Thornevik shifted its welfare system away from contributory, insurance-style benefits — where entitlement tracked years of paid work and contribution — towards broader means-tested and universal schemes intended to reach more people with less bureaucracy. This study argues the reform, though it modestly reduced measured poverty, broke a sense of reciprocity that mattered more politically than the poverty figures suggest: in survey data collected across the five industrial provinces, respondents with a long contributory work history who experienced a benefit cut consistently rated the system as 'unfair' at higher rates than respondents with no work history who received an equivalent benefit increase, even when both groups' household income moved in the same direction. The pattern held after controlling for political affiliation prior to the reform. What appears to be driving resentment, on this evidence, is not the level of support but whether support still tracks what a person is understood to have earned. Heartland's messaging, this study notes without endorsing it, consistently uses the language of contribution and entitlement rather than the language of poverty or need — 'what you paid in' rather than 'what you're owed' — which this data suggests is a more resonant register in these provinces than either SDU's or NDP's traditional framing. The account says nothing about whether the reciprocity norm itself is fair to those who could not build a long work history.”","citation":"Vestergaard, S. (2024). Reciprocity, not just poverty: welfare retrenchment and the politics of deservingness in Thornevik. Journal of Social Policy and Welfare, 52(1), 44–69.","offers":[{"id":"a","title":"Another voice, same position","text":"58eO2v2+o6RFZ5MSu9+XJfzDcOcyVB1W0fka35Gys4Tg+15ld+P f employment, a pattern that held even among respondents living in the five industrial provinces most affected by wage divergence and investment decline, and equally among respondents in the comparatively affluent suburban constituencies where Heartland also gained ground — places a wage-based account struggles to explain. Respondents who switched to Heartland were, on average, no more likely to have experienced a personal income fall than respondents who stayed with their original party; what distinguished switchers was a consistent rise, across the panel waves, in agreement with statements like 'people like me are not listened to by the people in charge' and 'my community's way of life is changing faster than I'm comfortable with.' This suggests status and identity concerns operate with real independent force, not merely as a proxy for economic anxiety, contrary to accounts that treat cultural attitudes as economics in disguise. The clearest limitation of this design is temporal: because the panel's attitude measures were collected across the same years Heartland was rising, and most sharply in the waves closest to each respondent's actual switch, this study cannot fully separate attitudes that caused someone to switch from attitudes people adopt afterwards to make sense of, or justify, a switch already underway — a gap that place-based accounts such as Lindqvist's (2023) wage analysis are quick to press.”","citation":"Reventlow, M. (2024). Attitudes before income: a panel study of vote-switching to Heartland, 2016–2023. European Journal of Political Behaviour, 39(4), 501–528.","offers":[{"id":"a","title":"Another voice, same position","text":"za01yMQiEkUd2Q0u/KQJE2pzCcYWa+tRy/Z2MiGB/WyarjjtfwOfLvF39EuOLx10ifDxrxfTqV5rQ2sD7Zh1xXbhQ2PWPr4oz6N3JDGrHCPVelULDv5aAHDP4OGYqLlas8jHbiMglbJpSVlpmqKOZb8ygiz50V5PAmiIV7klIIQMVW4Sv8DaBYPxtxSt23oIRp4TwS0j/nzknImTucLJMTWzDZ+2HQXgfuZobAiAQBl6TRFA9jHYK3mIOMkFCWIEWT0ZZBKO1Y3gDDhcobf4EbJgGPeyUSkhKhNn4EwZ+5A5YBNIb0d/bdcN/ZgoiJHBjKSNAy artland gains. This does not establish that the coverage increase was unwarranted or manufactured — it may reflect a genuine rise in low-level disorder that official statistics, which capture reported and recorded crime rather than everyday experience, are poorly designed to detect. What the study can say with more confidence is that correcting the record does not appear to work as a countermeasure: a controlled trial run by a Thornevik civic-information charity, providing accurate crime statistics to a randomly assigned subset of residents in one industrial province, produced no statistically significant change in perceived-crime ratings four weeks later, even though recall of the correct statistics was high in the treated group. Whatever is driving the perception gap, being told the true number does not appear to close it.”","citation":"Corvin, L. (2024). Perceived crime, recorded crime, and the limits of fact-checking as political strategy. Journal of Criminology and Public Perception, 12(3), 201–225.","offers":[{"id":"a","title":"Another voice, same position","text":"pBpEU7Vb8AqwQrQZ5ZiGqxaa/ApFM8SXdRIRwfhAZJs2enPhHo6VOvXFJ4NtmM9wJkiRLt6PzmUBoEZcm79DgAVekkyqXiS8N0BYK2aQKx6b3J2vYPCjoiKlrIzsArM0Chjfr1be84OWDSGFg4pzeNefDXGuk3NKL/d9GvYqGTU0WNSq0gahGmTU36wI9zYp5/6f27ZT1jK76QOojWJvBltL4cx9f4rClbLh/FF2BKr0F2yvmIGQ7H9H885Lg0EPIh6MOY8gvHpxa6sbGh5esBiumkyR644vBRNrSTCtHsRhOIH77WZja8GF3E4dwNlF+MTMj2tFKiPQAc8bQXhmM+h1j6tyW0NLTxlAy9R7ET/UlTlEgNyTjMH2pHIxpNKXWEt8Mu/g+EwNrmxxbvBx1Yq9dzkW9vaZ9cgIjfe/KuuXHPctvLLxWJOrzXD2zHzUmVU6tnO0WbRsi1QslthRJQ2nNGPhDVmImoIq3yUdWfcZC/ziHodGxHd6WiHOZ9DfnV/sJerT39aREGW+7RfdfuTTDy6BNoyl8IKufNxtEaLLEy9Eos3aySlmiDxkNmfsKgFJMo5X26AQQv7+PjX9pjnHusksmVVTEKNRGZUwWbCGcUy6YHBrdxiRkwQCRu9Hx0LP+X95YtweLjlYfj/LgoJt7XlGhZGwZ0Hj0inLygsp+YTVQFTaPDSju8RREKeJZc2OaDKwhv34u+C7I2oMHhbhJUz4lBVup4s6E4/E2/aZq1ejKqLBreXM1ZEIi9u1EgrBgDRzABKFXSRF56If68NKlhW/jf91eHAVyHIjcjw6PBJUUHHwn4izAo0zmpsgfIAO2JhdlR2pyqtYNQojR2tBEsuGCcxnY6egtazK+OBir1EYs5ag99d5dvoRtvhO5vUBo/dVE/0Al6c8 ins at all — trust decline on its own is therefore closer to a necessary background condition than a sufficient explanation, and something else must determine why distrust converts into a Heartland vote in some places and into abstention, protest voting for smaller parties, or no behavioural change at all in others. This study does not identify what that further, geography-specific ingredient is.”","citation":"Thane, O. (2023). The broken promises index: institutional trust and the geography of Heartland's rise. Institutional Trust Review, 9(1), 1–27.","offers":[{"id":"a","title":"Another voice, same position","text":"RQKVJYpyEXcEDpi+ECUWIm79n6kLc7NzXWRfvuExp6bLeZ7R//nB7gR3MQ++Odyirg1awqJOJmgSqq4Rfi/GHV/DNcepJy1O7LYfDE2lRe0589iI8/ipJB7wGIGdVZlztJgz5/RZ51BSV5sAVkrh7gKpuyO57ErDUehgWKA6wHAZHwJRFQk3/6ffRsGaEl6GeSUJKSDxrMyw+OrX2v83qIxtzA2MdnYJbCEdj+0AZ8rXQGFunZrCpeGJl+jmySXsVpjeDySFyh6fweWcyswJpsEWtc9wPGfnxgRQ6sr5UPrl1CKEvyCwFxOzKf/9EAwCk1cy42Ch3IZBhKlB4RQ2yZDZGFMdGwgFpkG2CA9Z+e2eXxiWBaCAOCOe4NP6peSky4SBWuio281+RrzcWNKCc7bF/MgevwxI6iPbotLwZ1WI/h4TpAvKNzVr1E/uTOIRyIz8ya+Er/HimmjhzPhdXzwYoADU/XmZEgUqj4ndDKE7xnrW6BswtIIZEb+by8+WRTwBtrt2AoXK+JjH1xx1YmHh5tIhO26J9VbgjEAn0rRGVoL4GLDUX4KoecoD5AJbiUN/zvs9yiQ8ziBI3h51wDpk0wA2ScbpLizDq/J0I/6O7H8yAqMBOOXv3ESBc5Hib6usV31ttN5l6pTlS/QGNm/0TSv1FDFs9rRgIwfoO2FRewR4XVs+D6TvNb2/3XduxqeDFwZa5vi93fMOSHD685zgQcExdvxbCQSPrf04zauo2heq510PZYo71n9EYkJ06ETQysZ5S6u3tjH11p2aBTpl4M6ghJW5Nf67p1TPagWIQ3ZmWUio9WwVJmjgiKGlR3u9UcwCbvdJp17QsGviLUlLYDxfTJj5rjIjRUpXBVIsV1rEavjKmfG1w4H8i4ck10zXEy1P9S1TxOc5aPyLTyyeLpLdFH11F52X0FlcdLWrjib6NtHYcrfI4XzLIhqEzrEULKAn0M3XmJeVig=="},{"id":"b","title":"A competing angle","text":"4M3uTJakc6MldIF6lZ5GMO+zl/x94mY9VVbaR0Fij9WAmf57ZPv8kSrZ+aRBtVCqZ5BZJ10aYll+Cwis0iSHGK1CrksgHuxK6ux/5rJP7BJ8GfhEGrUoBuvuDUpez+P6FlNh/VdI3c5rprz+EX8og1LUkoe09PLg5vo0uwuLfYNlNoCCXfgIUFv7lCTksAAWTTyHSTuquiiWL3mLfUWwJcZi44ZF2XyvfIJobiVMvG7nZc2Q7Q4XvBfbLiVgX6ooP5Wigw4f5PWRZWvuwy8VGX0P4e9syL7sRWEXWyixuuktTZoPzi5lrBF8enUNknuI6EyKeqpPe2Cmfy12JBPk5O/g/ nd the Cost of Contempt","email":"The Green Party's own internal comms team commissioned this study after an MP's remarks about Heartland voters went viral for the wrong reasons — they want the Commission to see it before anyone else says something similar.\n\nFrom the paper:\n“Thornevik's party system has re-sorted over the past two decades along educational and value lines at least as strongly as along income lines: SDU and Green voters increasingly share a graduate-heavy, professional-occupation profile that cuts across traditional income brackets, and this graduate cluster has grown steadily more culturally distant, on measures of trust in experts, comfort with rapid social change, and attitudes to national identity, from non-graduate voters regardless of the latter's income. This study's central and more uncomfortable finding concerns tone rather than sorting alone: in a survey experiment, undecided respondents were shown one of two otherwise-identical statements of the same immigration policy, one phrased in neutral technical language and one phrased using language that framed opposition to the policy as rooted in prejudice or a failure to understand the evidence. Respondents shown the second, moralising version reported measurably higher sympathy for Heartland's general platform afterwards than respondents shown the neutral version, even though neither version mentioned Heartland by name. The effect was real but modest, and concentrated entirely among undecided respondents; committed Heartland supporters and committed SDU or Green supporters showed no measurable movement either way, meaning tone reform alone is unlikely to reclaim voters who have already switched. The study is also careful to note what it cannot show: correcting factual claims or naming actual prejudice where it exists is not the same act as moralising, and this experiment's short, single-exchange design cannot distinguish real-world contempt from ordinary, necessary disagreement stated firmly — a distinction Vance's work, held by the same strategist, tries to take further.”","citation":"Solberg, F. (2024). The graduate divide: value re-sorting and the cost of contempt in Thornevik politics. Journal of Political Sociology, 33(2), 88–114.","offers":[{"id":"a","title":"Another voice, same position","text":"+D/TTO0qkPbr0FPj251isb+NZazD19boO+5U+GgMFdg1oBXX6AIbuichs+S5UtWbo5zX2pc3Bw6D9dBbP1so70hVqglruF2dEVBiWiyuT6SFqn7T5KWCnfLg0p0d8xLt05l/Los4dviINJ+e25xIr1tgYQvxHOuo9WiAuTkg40ehXsf8SGLPdJlHe4WLE6lpSk6bpQqGyVH67uOyjiEpC3BzR3xh7YGDnf6KFbkNSWT9zFzVEsmDWBCpO9TXBczu30xQwrxYtcp9FF5NA9ASrq5uZGCTmcIxBEsd0VkXJX6HNR8bfiHNT0Y+fhejNwjuOh357zj6iNF0suq7m39wUjjqbb9y+XVaaz925VDGLTDxDo63kZc0ptf6MiKWTgBUdTJPKPHu8BuTT898fN7JjQ4M3rEFrve5dMsD62RpyFhIHvtX4FAWy1CP3Cc/QdbGgZ8IptWN/rtFhOaVDhnOncp3WBH70v7ujmfLuRtHovKWVVuxFxQFmqCIC0oN3WMr4++5eEGrsXHfaGM35zp4G7fiyrntcHDKJSqWxmodgLxl9r/wk752qdic0ouQayL1IkDWrG4hEomYo47Sh5eUgU1QkQ6hjMwNv0zfp4UxqRROh0I2cFyObmJK/MWUalSDyTSYyIeWOgaTqFMgmQ5fQQsMj9dR7v/MA0VeJMCJcvXXCAfNP2eR2O+OTV1+pgMYg4GCjXZBChAZe87xbRNp2A4VMn+dVa6lbUQj7AtF9t+j2a10okpZON9OZK7spBk3R/JNfeVkgs2EacP6Ldb8o/ahqRLueWG+9y+Udl4H5pAZ3Vr8RngsrfRNhFGGCCSO5crDyeaKN3N8u5PIU2Zcigf+l7MLR5cA6A1wj6QyhSKI4YktH8goWA4YvzZh/v1khUjuFILGYJqWY45z5fNrcecZ8P9NO8xFtzqQ1IJlHXvZXpwUupsiQobXZvHMkthOssJiOKtn+2aoNUvNSMbyxsbGlX1RW3qNDKU6uJUO1n1BSeo="},{"id":"b","title":"A competing angle","text":"smT/rW+RrBqHsykoF1VeaJCDPSgZoAqUs7gPTGxqwzm5PXJYOASzN0E+R3XnbDEbnXCtF8/TK3cYbWxDj3BKstAX3CoRkCPciluEIfA2sM9Ofi2P4TVc2NOj92k96y4zsrHiPfITkW5U+eq36SCPqAINjDkTOkNnv3Hx5PzPUxUddlxkMDI8P8NMsWOTU+65AvChM9mWv1PzVsa7lVA3gXxSpJG5ovEtvB+Z7CWvXiMUOOhHiK8u/ZZp+VhjdvBFYkIGKNthRVmr1+9iSAsAYFnu/zsSCi5HAmKq8zMlU57dFla/wu08UzEr/2m44MyddowSOIUxEznquM/3OOq/BKL9e+uYcNCEY1Ab7Ju4R2nDUjbICFXy6RXQb3HsC/2pnfSIYE2iFQMoxzlFm9IcAyW94FWlWf3KkadjPrz8tTi1aYtvTWfx6Gir7NaSSVmNPcGokUHjZRYtUc9Qct40PrRHoqQahsCxgF/NOtAuGlOMovhXQ7q6W5IzWt7G6ktDQCNbj4DAvZcqeYlXqZ7vh9DhVbM7hYoT6+rdATDrVki/Ykrer3GeBGytsxeganSY+ymYCdJ9ZBisqjM22tmV5lXFBjLMq2l+y6V0dhN+0QHt/bok nded from the levy's own proceeds. This study finds the design was sound in aggregate but badly timed in delivery. Households in the five industrial provinces, where commute distances are longer and the vehicle stock older and less fuel-efficient, paid a materially larger share of the levy than the national average household, while the offsetting tax credit was not paid out until the following year's tax return — creating a real, felt cost in year one that, for households in the bottom income quintile of those provinces, was substantially larger than the average annual wage loss implied by Lindqvist's (2023) wage-divergence figures, before the rebate arrived to close the gap. The levy's emissions effect, measured separately, was genuine and in line with projections; this is not a study arguing the policy failed on its own terms. It is a study arguing that a policy can be well-designed on aggregate and still land as a real, disproportionate cost on the provinces least able to absorb a delay, and that this was not well communicated at the time. Reversing the levy now would remove one of the few emissions measures shown to work, and, in this study's judgement, a reversal framed as 'listening to Heartland' risks reading as capitulation rather than as a considered correction. Redesigning the rebate timing, this study argues, is a narrower, better-supported fix than defending the levy unchanged or abandoning it.”","citation":"Halvard, I. (2023). Who actually paid for the fuel levy? A distributional analysis of Thornevik's carbon pricing reform. Energy and Distributional Policy, 15(4), 310–338.","offers":[{"id":"a","title":"Another voice, same position","text":"WXXAKCIUWiX2ZXTDwtZS3q1ft6qaaj4uEqK3L6NWs0058D2VPqabvyOY0AbUoRRgOxYekZZysPI4lNPtMajlbVolbUco9YRidwhM9rewngALapcJoJ3vacnHwxswWH/krjhTISIPlzcL0JlRW1QIj752VD4AOEd2T+5gDMGcYDQunpr7Wfaz3+EUgvdGsu70dy69FMaAKHh5fCbiBbg9J3W99yE7M4BdFX6N8PI96sg7W3+Wew9igdnBaiq2RelAQV9HqfM/K7FDqGNFBZw3lm2MRMSOpQ5+348kbkf//UUrtlx7fHqNwpTgyOtOY olds Heartland's voters in contempt. Engagement-per-impression on these clips exceeded Heartland's own original content by a measurable margin over the same period, making establishment condescension, by this metric, more effective recruitment material than anything Heartland's communications team produced itself. The study's clearest limitation concerns causation rather than correlation: the same audiences already inclined towards Heartland may simply be more likely to seek out, watch and share this content in the first place, meaning the clips could be reinforcing existing sympathy rather than creating new sympathy where none existed — a version of the same causal-direction problem Reventlow's panel study flags for individual-level attitude data. Vance's dataset, being purely observational social-media activity, cannot on its own distinguish audience self-selection from genuine persuasion, though the sheer scale of the engagement gap is, in the study's own assessment, difficult to explain by audience self-selection alone.”","citation":"Vance, C. (2024). Contempt as content: how elite condescension circulates on Thornevik social media. Media, Communication & Society Quarterly, 27(1), 55–79.","offers":[{"id":"a","title":"Another voice, same position","text":"G2FCHlkZSkVr6zrJY/7KyJiT6ga4eCZwaxuBSjixrNxNcgk9XXTSwAlXRbC21WK0iAvKGqPVt0QYjMh2GOnEh4Ttw6/Zhrq4PdThSeKD3qVXcROkuWb1lBhpdQFRaYwi//v+bQ4f1IL9QoKaGfEd120uQVP40IMboheCAr66Be7G3Bh49agmrqKfk8oiAgvsx/XpiHNQIZEgumsQq92Kf5EPIC0sri16exhSTeXBolISMAeFypwAv6dZTs4VzTbGlNYri4djJD4yHe407n5NzAmYYcyZgcrSfcN/QJ/q4So4mRKe56hpYlWichn/3U2ilOVEI+/EvomjuILWaEiui9osN/fi/rZTOo9tjtUxi4g19r8EPqIg7WHEQRONAyyGRdUip/aVT9mx5/SInuJu6jYKPpC/jt2lkAKtzHgCYUOqIKUqRQQa+dZeO3fSZAa7SQsDZOhytWWqA77nfxmIWJQ7QXECTUT1AKHHYPYpGh9ODw2nUMJeMhO+ah/bhSjlYglUuTRL+ifQ9zQhTcs/5snSDYvFzyB+pmjcTbAY8+qVtV9dKT1WGVN6NdkKjZwTVTL60mV0wyrPWZnpLvB0nhkNvK7dXLOHhIuCDp4744qOSuYSR1DdCEzNzUfhTwyWwg8NoaVI3zku6tCWyTWTbDpjtWs40I5mgkKOzQNMuc4maqb6WI8VxUpM0CC9rzPlHpwoz5Uql/1FSp7ZR <script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const SPEAK = S.format === "speaking", SP = S.speaking || null;   // speaking exam: roles prepared alone, listening marked by the tool
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, group:null, pick:null, plays:{}, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};
  if (str(s.mode)) out.mode = s.mode;
  if (str(s.role)) out.role = s.role;
  if (str(s.hlGroup)) out.hlGroup = s.hlGroup;
  if (typeof s.nbClosed === "boolean") out.nbClosed = s.nbClosed;
  out.choices = map(s.choices, str);
  out.firstLook = map(s.firstLook, str);
  out.mcq = map(s.mcq, str);
  out.decisions = map(s.decisions, v => v === "A" || v === "B");
  out.hl = map(s.hl, v => str(v) && Object.prototype.hasOwnProperty.call(HLC, v));
  out.hlLabels = map(s.hlLabels, (v, k) => str(v) && Object.prototype.hasOwnProperty.call(HLC, k));
  out.nbf = map(s.nbf, str);
  out.opened = map(s.opened, str);
  out.drawOpen = map(s.drawOpen, v => typeof v === "boolean");
  out.budget = map(s.budget, v => typeof v === "number" || (str(v) && /^\d{0,7}$/.test(v)));
  out.tags = map(s.tags, v => v && typeof v === "object" && !Array.isArray(v) && str(v.p || "") && Array.isArray(v.d) && v.d.every(str));
  Object.values(out.tags).forEach(t => { t.p = t.p || ""; });
  return out;
}
function handoverWhen(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-GB", {weekday: "short", hour: "2-digit", minute: "2-digit"});
}
function handoverBox(first){
  return `<div class="handin${first ? " first" : ""}"><b>${first ? "Open a teammate's hand-over" : "Taking over from a teammate who had to leave?"}</b>
    <p class="small">Open the hand-over file they sent you. ${first ? "This tab will show their work; your own stays in your other tab." : "Do this in a new tab, so your own work stays where it is."}</p>
    <button type="button" class="btn${first ? "" : " quiet"}" id="hoPick">Open a hand-over file</button>
    <input type="file" id="hoFile" hidden>
    <p id="hoMsg" class="small issues" aria-live="polite"></p></div>`;
}
function wireHandoverBox(){
  const pick = $("#hoPick"), file = $("#hoFile");
  if (!pick) return;
  pick.onclick = () => file.click();
  file.onchange = () => {
    const fl = file.files && file.files[0];
    if (!fl) return;
    if (fl.size > HANDOVER_MAX) { $("#hoMsg").textContent = "This file is far too big to be a SimLearn hand-over."; return; }
    const rd = new FileReader();
    rd.onload = () => { const msg = openHandover(String(rd.result || "")); if (msg) $("#hoMsg").textContent = msg; };
    rd.onerror = () => { $("#hoMsg").textContent = "That file couldn't be opened. Try again, or ask for it again."; };
    rd.readAsText(fl);
  };
}

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");
const budgetVal = id => { const v = parseInt((st.budget || {})[id], 10); return isNaN(v) ? 0 : v; };
const budgetTotal = () => B ? B.items.reduce((s, it) => s + budgetVal(it.id) * it.unit_cost, 0) : 0;
const budgetOK = () => B && Math.abs(budgetTotal() - B.target) <= (B.tolerance || 0);

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){   // no Teacher link in an exam: one less thing to click away to
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${EXAM || SPEAK ? "" : teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderExamStart(){
  const m = EX.minutes || {};
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start examstart">
    <h1>${esc(S.title)}</h1>
    <p class="lede">This is an exam. You work <b>on your own</b>: everything you need is on this page.</p>
    <ul class="times">${EX.article ? `
      <li><b>Situation</b>: a short introduction. Read it first.</li>
      ${EX.listening ? `<li><b>Listening</b>${m.listening ? ` (about ${m.listening} minutes)` : ""}: your teacher plays the recording at the start; answer the questions as you listen.</li>` : ""}
      <li><b>Reading</b>${m.reading ? ` (about ${m.reading} minutes)` : ""}: an article and ${num(role0().characters.length)} emails${readingParts("decisions").length ? ", and a few questions on the Decisions tab" : ""}.</li>
      <li><b>Writing</b>${m.writing ? ` (about ${m.writing} minutes)` : ""}: make the decisions and write your ${esc(S.writing.label)}.</li>` : `
      <li><b>Reading</b>${m.reading ? ` (about ${m.reading} minutes)` : ""}: read the situation and the ${num(role0().characters.length)} documents, and answer the questions beside them.</li>
      <li><b>Listening</b>${m.listening ? ` (about ${m.listening} minutes)` : ""}: your teacher plays the recording; answer the questions as you listen.</li>
      <li><b>Writing</b>${m.writing ? ` (about ${m.writing} minutes)` : ""}: make the decisions and write your ${esc(S.writing.label)}.</li>`}

    ${EX.points ? `<p><b>Points:</b> listening ${pts(EX.points.listening)} · reading ${pts(EX.points.reading)} · writing ${pts(EX.points.writing)} · <b>${pts(EX.points.listening + EX.points.reading + EX.points.writing)} in all</b>. Every listening and reading question is worth one point.</p>` : ""}

    ${S.ack_disclaimer ? `<div class="ack"><b>Before you start</b><p>${esc(S.disclaimer)}</p>

  const ack = $("#ack"), upd = () => { $("#go").disabled = !!(ack && !ack.checked); };
  if (ack) ack.addEventListener("change", () => { st.ack = ack.checked; save(); upd(); });
  upd();
  $("#go").onclick = () => { st.mode = "3"; st.role = role0().id; st.tab = "context"; save(); render(); window.scrollTo(0, 0); };
}
const role0 = () => S.roles[0];
function renderStart(){
  if (EXAM) return renderExamStart();
  if (SPEAK) return renderSpeakStart();
  const two = st.mode === "2" && TWO;
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start">
    <h1>${esc(S.title)}</h1>
    ${HANDOVER_OPEN ? handoverBox(true) : ""}
    <p class="lede">You work for ${esc(S.org)}. Your ${two ? "team of two" : "group"} has to ${B ? `split a ${money(B.target)} budget` : `make ${num(S.decisions.length)} decisions`} — and each of you holds information the other${two ? "" : "s"} ${two ? "doesn't" : "don't"} have.</p>
    ${S.ack_disclaimer ? `<div class="ack"><b>Before you start</b><p>${esc(S.disclaimer)}</p>

document.addEventListener("keydown", e => {

const PLAYS = () => SP.listening.plays || 2;
const timesWord = n => n === 1 ? "once" : n === 2 ? "twice" : num(n) + " times";
// where a paused (or interrupted) recording stopped: kept in the page only, so a student can check an email and
// carry on without losing a play. Leaving the tab removes the player, so the position is kept here.
const clipPos = {};
function clipState(id){
  const used = (st.plays || {})[id] || 0, left = PLAYS() - used, pos = clipPos[id] || 0;
  if (pos > 0) return {label: "▶ Continue", off: false, msg: left > 0 ? `Paused. You can still start it ${left === 1 ? "once more" : timesWord(left)} after this.` : "Paused. This is your last play."};
  if (left <= 0) return {label: `Played ${timesWord(PLAYS())}`, off: true, msg: `You've heard this recording ${timesWord(PLAYS())}.`};
  return {label: used ? "▶ Play again" : "▶ Play", off: false, msg: `You can play it ${left === PLAYS() ? timesWord(left) : left === 1 ? "once more" : timesWord(left) + " more"}.`};
}
function clipHTML(p){
  if (!p.src) return `<p class="clip muted small">The recording isn't on this page yet. Tell your teacher.</p>`;
  const s = clipState(p.audio);   // counted per recording, not per part
  return `<div class="clip" data-clip="${esc(p.audio)}"><audio preload="none" src="${esc(p.src)}"></audio>
    <button type="button" class="btn" data-play="${esc(p.audio)}" ${s.off ? "disabled" : ""}>${s.label}</button>
    <span class="small muted" data-left="${esc(p.audio)}">${s.msg}</span>
    <progress max="1" value="0" data-prog="${esc(p.audio)}" style="width:100%;margin-top:6px"></progress></div>`;
}
function tabSpeakListening(){
  const L = SP.listening;
  $("#main").innerHTML = `

    <p>${esc(L.intro || "Listen with headphones.")} Read the questions before you press play. You can pause and continue (also after looking at another tab); each new start from the beginning counts as one play.</p>
    <p class="qcount" id="qcount" aria-live="polite">${qCount("listening")}</p>
    ${(seen => qParts("listening").map(p => { const first = !seen.has(p.audio); seen.add(p.audio); return first ? qPartHTML(p).replace("</h3>", "</h3>" + clipHTML(p)) : qPartHTML(p); }).join(""))(new Set())}`;
  wireQuestions("listening");
  document.querySelectorAll(".clip[data-clip]").forEach(box => {
    const id = box.dataset.clip, a = box.querySelector("audio"), b = box.querySelector("[data-play]"),
          prog = box.querySelector("progress"), msg = box.querySelector("[data-left]");
    let starting = false;   // a new play asked for, counted only once the sound really starts
    const show = () => { const s = clipState(id); b.textContent = s.label; b.disabled = s.off; msg.textContent = s.msg; };
    a.addEventListener("timeupdate", () => { if (a.duration) prog.value = a.currentTime / a.duration; if (!a.ended && a.currentTime > 0) clipPos[id] = a.currentTime; });
    a.addEventListener("playing", () => {
      if (starting) { starting = false; st.plays = st.plays || {}; st.plays[id] = (st.plays[id] || 0) + 1; save(); }
      b.textContent = "❚❚ Pause"; b.disabled = false;
      msg.textContent = PLAYS() - st.plays[id] > 0 ? "Playing. You can play it once more afterwards." : "Playing: this is your last play.";
    });
    a.addEventListener("pause", () => { if (!a.ended) { clipPos[id] = a.currentTime; show(); } });
    a.addEventListener("ended", () => { delete clipPos[id]; prog.value = 1; show(); });
    a.addEventListener("error", () => { starting = false; show(); msg.textContent = "The recording didn't load (this didn't use up a play). Check your internet connection and try again, or tell your teacher."; });
    b.onclick = () => {
      if (!a.paused) { a.pause(); return; }
      const pos = clipPos[id] || 0;
      const go = t => { const run = () => { try { a.currentTime = t; } catch(e) {} a.play().catch(() => { starting = false; show(); }); };
        if (t > 0 && a.readyState < 1) { a.addEventListener("loadedmetadata", run, {once: true}); a.load(); } else run(); };
      if (pos > 0) return go(pos);   // continuing: not a new play
      if (((st.plays || {})[id] || 0) >= PLAYS()) return;
      starting = true; b.disabled = true; msg.textContent = "Loading…";
      go(0);
    };
  });
}

  const memoText = st.memo.trim();
  // exam: every choice item in order ("-" = no answer), and the typed answers as one line of JSON
  const answers = EXAM ? [...qItems("reading"), ...qItems("listening")].filter(it => !isShort(it))
                           .map(it => `${it.id}=${String((st.ans || {})[it.id] || "-").replace(/[^A-Za-z0-9]/g, "") || "-"}`).join(", ") : "";
  const shorts = EXAM ? JSON.stringify(Object.fromEntries([...qItems("reading"), ...qItems("listening")].filter(it => isShort(it) && answered(it))
                           .map(it => [it.id, String(st.ans[it.id]).replace(/\s+/g, " ").trim().slice(0, 80)]))) : "";
  const parts = [S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""];
  const code = checkCode(EXAM ? [...parts, answers, shorts] : parts);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${EXAM ? "exam" : r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    ...(EXAM ? [`Answers: ${answers}`, `Short answers: ${shorts}`] : []),
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · ${EXAM ? "Exam" : "Role " + r.id + (r.dept ? " (" + r.dept + ")" : "")} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: EXAM ? (ai === "yes"
        ? "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers, your decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers and your decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.` : (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}

render();
</script>
</body>
</html>
