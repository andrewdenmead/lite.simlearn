<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Nexa: The Aurion Inquiry — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
}
</style>
</head>

responsible for reviewing flagged content, sponsored posts, and reported accounts — cutting headcount by roughly a third and expanding an AI classifier to handle the bulk of the caseload. Leadership presented the change as a natural next step: routine review work, they argued, was exactly the kind of repetitive task AI was built to absorb, freeing the remaining team to focus on complex judgment calls. Internally, and to the board, it was framed as both a cost saving and a productivity win.\n\nThree weeks ago, a coordinated fraud operation came to light. A fake decentralised-finance project called Aurion Finance had spent twenty-three days running paid promotions and creator partnerships on Nexa's platform, drawing in tens of thousands of users across more than a dozen countries before its developers disappeared with an estimated forty million euros. Nexa's own review systems had cleared the campaign repeatedly. The story broke in the financial press within days, and regulators in several jurisdictions have since opened formal inquiries into how the promotion was allowed to run.\n\nThe Board has now commissioned an internal investigation into what actually went wrong — not to assign blame for its own sake, but because it has to decide, quickly, what to do about Trust & Safety staffing and AI tooling going forward.","scar":{"label":"The Helios Delay","text":"Two years ago, a pilot flag on a much smaller automation project — spam detection for direct messages — triggered nearly five months of caution and re-review before the rollout was allowed to proceed. The concern turned out to be unfounded; competitors shipped equivalent tools in a fraction of the time, and Nexa's own board later cited the delay as a costly, overcautious mistake."},"proof":{"label":"The Sentinel Rollout","text":"A year ago, Nexa automated bot-account detection with a much smaller review team than before. Early in the pilot, a junior analyst flagged an edge case the classifier was missing; the flag was acted on within a week, the model was retrained, and the rollout proceeded on schedule without incident. It's still cited internally as proof that automation and lean staffing can work, provided the right flag gets heard."},"constraint":"The Board has given the inquiry three weeks to report — before the next investor earnings call and before Nexa's formal response to regulators is due."},"listening":{"name":"Signal & Noise","questions":[{"q":"How deep have some platforms' Trust & Safety cuts been, according to the podcast?","options":{"A":"Around 5%","B":"A third or more","C":"Only temporary staff"}},{"q":"What often absorbs the 'freed-up' review time, according to the podcast?","options":{"A":"Complex judgment work","B":"Shorter working hours","C":"Cleaning up AI mistakes"}},{"q":"What happened when one video platform leaned on automated review in 2020?","options":{"A":"Removals and appeals rose","B":"Appeals fell sharply","C":"Nothing measurable"}},{"q":"Roughly how much did rug-pulls take from investors in 2021, according to blockchain analysts?","options":{"A":"About $2.8 billion","B":"About $280 million","C":"About $28 billion"}},{"q":"How quickly do many rug-pulls collapse?","options":{"A":"After about a year","B":"Only after an audit","C":"Within days"}},{"q":"Why do filters struggle to catch well-run rug-pulls?","options":{"A":"Target new accounts","B":"Mimic normal promotion","C":"One viral post"}},{"q":"What has detection relied on most, historically?","options":{"A":"Automated keyword and image matching","B":"Humans cross-referencing small signals","C":"Users reporting posts themselves"}},{"q":"What must the biggest EU platforms now report, according to the podcast?","options":{"A":"Their moderator numbers","B":"Their AI training data","C":"Their advertising income"}},{"q":"What does Britain now require of crypto adverts?","options":{"A":"A ban on all adverts","B":"A government licence fee","C":"Approval and risk warnings"}},{"q":"What are regulators responding to, according to the podcast?","options":{"A":"A repeating pattern","B":"One isolated incident","C":"A new treaty"}}]},"roles":[{"id":"A","label":"Role A","dept":"Technical & Data","characters":[{"id":"priya","name":"Priya Raman","title":"Trust & Safety Data Scientist","subject":"The pilot data, for the record","email":"Hi — glad to help you make sense of the timeline. I ran the pre-restructuring pilot on the AI classifier, comparing its call accuracy against the old fully-staffed review process. My report flagged an elevated false-negative rate specifically on complex financial-promotion content — but I want to be precise about what I actually wrote, because it's being characterised very differently by different people right now: I said the risk was \"elevated, based on a limited sample,\" not that a specific fraud scheme was coming. Rug-pulls like Aurion Finance are rare enough that I genuinely didn't have enough examples to be confident about how bad the gap actually was.\n\nWhat I can't tell you is how complex cases have actually been escalated on the frontline since the reorg — I see the numbers, not the day-to-day process. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What the pilot actually measured","text":"LH9Q6vPNORwAJST+L5xjtrS43RBo0VQV22OBFgglPkYhRimAzz9T8SF8d+bb4+CR8wuYWocTlEr5l6AYjfutu15WfDFeyydUJMSiBTO5ghQIjJzG9IICUPuvCQYCLoo6+uJAOaEHXR/ZI9yKzq5/KkupxoN20FyR8TX023cZ7YSylWofIMQqsq4HTgzj7E6yZT7k3GvwaPUnrH7p7fKdMIpANHw6fS9gWb9TlsstDYhzGqmWAFCAQAOQrwq51JoH2Q36EFSzb3/bwJfMLzAYktwr9DIYJ/fIL+lfceisIEQQkU5uz96yNCBphVi+rxhHcROid7jqhRnfHAfQWjRGeWo/zD2paCKnM8+6uwYbcGThI7fDCgcf08AvfeNKwOLH7eqjFmQfzQGswFuruoU3Pv6I"},{"id":"o2","title":"What my report recommended","text":"sqvRpfN0KvrjzawGiiMkzVzqOSwpWgYBXrw1n15VoT8ibLMg8OJsrxNVEMqgh9R87FAy8YJCI/HbhggKeGjmRMsdTFMFfPi0/76Jl7I1T82k1m+8pVHmWWQ+cL2pVZjIgvOFtb8bwJyks6TkWaDjpH3N/CXWrpwgLSpsGFa2va3oBaqsVVt4Y67+YoFSbJur/5mwJj6rmoaCi8RFTGXaDrb5PXBTvyg+tuc1Ag0FQHkl/6dOeH9Ch1Igfww5b9dkJ2mhWTsxrSaqauszUhUYQU52C5/XCAYl+IaQuyr3F/S6iFQvKKgnefB76X425qJLLWap4oGvSPloYKO5IsmkE3xr1mBvZvsfc3OpGmfCqXRsRbbN5euXKw9foyx5CRC4Y1uAAmqePwXyHcWIE+Y5bQVnTGa+gzI2sSlsH5P8xZEbtbw="},{"id":"o3","title":"Inside a classifier pilot","text":"vvnJdDF/I/nOKPwG0389DZrHxk0TW7iCuLEWPAIS6fyFawcnMV476f59aci8Z+2BwnFbvEyYyMCXvmgyZtMH5MY/y/ZNpBcnWDhij8bvhPCTWAx/AQk6H1WR2aDV4jKg0nukV2yb7ilFg3WbGjl8b7okXLw2+NFUuyMBq4wuawbZJH49CNhQG4BTqJrLq2rC/lR1MS9GUGCR0X9Rs3MsJgCJxSAEHnnyxY+I5hwcw2V3w+9oczM6IXaeJCx0BaJNcmgcmOGY6i8KqvllHvRXl8Sa7ytQb1UrspUiHldGiKflbiDMGo9VfD/ZK+1yBJqSTYzJUO68TjpwERjQjyZ4C1dcPAlyaFHNA+10ZL9l7nZ1ud5OkEiZGZH/72jbRV8Q7kGn3XVbyxRd/udCdiAPNzRJgA5EOhgqL4h4KZI="}]},{"id":"jonas","name":"Jonas Berger","title":"ML Engineer","subject":"Why the classifier missed this","email":"You'll want the technical picture, so here it is plainly: our classifier is trained mostly on individual-account spam and policy-violation patterns — single bad actors posting repeatedly. Aurion Finance ran through dozens of coordinated, individually clean-looking accounts, each posting within normal limits, timed to build hype together. That's a structurally different pattern, and it's not something the current model is built to catch — no amount of manual review workload alone fixes a detection gap like that.\n\nHere's the part that should worry people more than it seems to: this isn't the first time. About a year before the cuts, under the old fully-staffed process, a smaller coordinated promotion for a different token nearly got through the same way — it was caught, barely, by a reviewer who happened to recognise the pattern from experience, not because our process was built to catch it systematically.\n\nI don't have the user-facing side of this — what users reported, and when, is Support's territory, not engineering's. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Three years of reviewer decisions","text":"fT5uXWq5VfVFeBK+oH0jUIgl55HHskoplLtBBfim65BFZc/3/kfnQ/r4bel07nKm38Tb4Nioe3+b73Sqs1xsJTdw+8kvCC+Zi2tEPLzxxj3sFDHsqbm0s6pJwLG9KOZnJDZusn364o7TR3pInHbeM8HvCQfhzOTj7nqiZcsHm1HQlY1xWp6+/vecK0AlSI1aGtBPpHVwRTkgJdrSr/lGwC/dLTjmJ9JLyaao4Pj0xsfd5wYruBzjrPzzcVUIG16ZQj+T/PyS/pRUcfDXCUF99URtBxYNyai4tyi0wtsb+EeIqM6vU2zkm/G2s75Vo3hY626LTra8pMu6eJQ0Tq+u2Dh8S0rpFDLHlJtcXnEoHJSydjfrDVcoOWbGE3wL+GhZ2kPI7pY0WYmJuGSOUMkHeYlxFisihrHXJx1AKXJwbfLUBrrrptJz4ZcdMPryia3St/6yvqvHyVpQ"},{"id":"o2","title":"The near-miss nobody followed up","text":"fp1FE/4vSVuCLzV2WhDnYWnrgzyqITU2fXygKU13bxUJwuffIeh1nmhvYtrNVtDeEc+REmxhp4gKskIjDaunA3rC2TRLY0DnW6jFiK9NlbP7hOR8YXarVJCMhviZd5tW08PBFP07GEaXTv+gzYah8+C4KAqetlaptQMF/dRGxBEWWhwcJdTENiwdPvxEUntkqhl6jeBqznsv0O06R7K/efNwsz7Z41Rsa5fEmGv9HtSLnczaLjE/M63lOGBHcyZDXJTsHaSApi0xVOftE1UdnUaSDPL1uGQQ82xCF0YpKlBqbQo61vrIX/pEquvS1IwRehlXklGBn2kRZL7S62sshRpHp/ZXG4lrdLSlfYXM1qxbq7BdpRnZX6093vu4/dI2tNIZXLiukFn4+QCpGK0Nn+tCMkzDMICs992Z"},{"id":"o3","title":"What the Aurion data shows","text":"AXqrrXb0ia3TX8goLJULWbcgfpqv/S/0D56vu0i88nkCMOB+FXqxjmmnj4rQoV8gdi7znJKKGKFC++W8KtYwSlwABhC8byZ4xXPMkV6fhqNp75NWDOoWus8mVXYQOaDf01So4PhWa4gT4lDir5s1V+f0OK8eS8ri2Aca9YfGB9tqQPPvILcosSd6xpp/8QptG3D8iI1b29/dUIv3S2gGUvIFAE+TGf1aIcVwXkfR58FhkSitHm//S3lCRW0IVdkMo73LtGf3KyOtiAOJhZzpJDLDQb/1LvYkHnoArz/cuOJIE9gNrRqRplwG1Vu4oZM19ZgFle4AjTt029/ibx1G9+5yGSxjRi31Tx8Sc8JmBu1UPKaColnfKiJsVI3apfwE4grjag=="}]},{"id":"farid","name":"Farid Khoury","title":"Threat Intelligence Analyst","subject":"This wasn't random","email":"Something you should know before anyone settles on \"the AI just missed it\": my team monitors closed forums where fraud operators plan campaigns, and Aurion Finance's organisers were discussing Nexa specifically, by name, in the days after our restructuring made the trade press. The exact phrase used was that Nexa's review team was \"thinner than it looks.\" We only found that thread after Aurion Finance collapsed, in a closed group we hadn't been watching. This wasn't an accident that fell into a gap — someone read our own announcement and treated it as a target list.\n\nI want to be careful about how this gets used, though. It doesn't mean the restructuring was fine, and it doesn't mean it was the whole cause either — sophisticated operators go looking for weak points regardless of what a company announces; ours just happened to be visible.\n\nI don't know what regulators or the press currently know about this angle — that's for Comms, not my team. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"The forum's list of platforms","text":"BnkeYFLgZxnKsVjG96heOROkbPtjr74bC+mKgktYhOBFzkbj+lzmdhgTzGvt4d+illqX+76KCo4HcAHHz9xLjJxN9EqYROKgxHTw0u3EcDV3J1bEM/ThBRtCioX/OZ4EAo5B+QsMhYn+ZPQyWOyTckH0ym2XGbjdLPTn9PDP+C77bscEZXdelxqMM3Aoia0yHOMzMCd3F0V6ob1Yl+0NiiXRDSYP6nykEUIPEms1y3ASDP+wIdY5a3E+ZUSNjcOMEvEzSdOml/GlO+U/Xei9mrsmBgDSm5f4dnc3pK7vUqnDNDtvX9BDpM3XMNLDYOkRLmVGFxDgeEsPVSJ3CAwoDgci3vC8gUsAFt405BSSwkElZPm+dCBb3IYL7gyDeHfIUlIUmBnX2BQdKQUR0W/rDPRryk4tR8Jgnq03"},{"id":"o2","title":"What the organisers were planning","text":"VAK9bxWsixO4G3Te0StRJJMilGLTWC4AWLbyj+d8ULqk8NbIEowdjNEqu9KSB4g97D/3v4rh2nfdh6sHwlrORVPOBZiMljIPA9KAIUuB1npGZyAmp1ACgnEEwEzLVrs0gZsSE3n9l5gR4+Pbfos1k+/+nfEx/zypOUkZIgIwRUYvXRbtVUkoZz9d7TYKPj2WWMlh9f3c01Gi/jp0o6D+4PJG6Hk/wP3b1JsaQ4v0a9dmTd4rfhbDyuPcWx2K3R34l0NgRHGnCkcSiPqtjrn1UBNjGujWNtNTebFJ5htNvy3zCA9S26twHTGBg+sBfsK67IgFEsqULI9OHcf4lveywM+QdJImTgv5uSna2lRZucGIIJJ6BccuP/YR2AsridPu4+QqX3kQc+Vvf1AjSwzD3FaK83PSwGlscrRsh5aFtKONQ+MC76/0r2F3cHWrGMCgYdX41FVB2e9xAXehIOgJRvDGgdPNi9G3eZSv0ixGpqkOGc/Dsbn/aCuDMw=="},{"id":"o3","title":"Thirty forums, four analysts","text":"wSpsn6ypvaZiT4KXm/bZW4RaHZRMQARuIcMJS/U2cAd9CLxQ1PPKiZDW8KvBO4RN+m5S1ExrSONfINEKtOap9xcYeoFYZx4MWXreUuseH6NmV9dq4JajRMjxU7XZ5V/ZdkCcsQ1GlX2vLoroI+AyeL8+5P15Bxzqi4tLADoFKWq3fUoZ74p0b47lw4tIjhrXWHarvKNKQp/Lgwfo9/qeU1W+mqQo1Bi9c78UcuGBq/A1SfHEqK8rwIUfTIFFK/NUqIvtQW499uyrhUba+epMkuATuD8O6g6/jVqx+vdPqi1EEm5OpSg6XMii/TUcSEOJjLdi5bvvwnIKMGYi7dAbuliMj8KZlpxGqD022l54+tlsrqV7vo3V9J+70zr6ehvMrhA7S67XeFJyNhcgvX9e5P+wxF6vS5VkBOpMWoeNJRS4wBzSMHxq"}]}]},{"id":"B","label":"Role B","dept":"Frontline Trust & Safety","characters":[{"id":"sana","name":"Sana Ahmed","title":"Trust & Safety Reviewer","subject":"What my week actually looks like","email":"Since you're looking into this, I'll tell you plainly what changed for me after the cuts: I was told the AI would handle routine cases so I could focus on the complex, judgment-heavy ones — the work I actually trained for. What's happened instead is that most of my week goes to appeals and escalations that the AI got wrong in the first place, which is a different kind of workload than \"complex review.\" I'm not spending less time on repetitive work; I'm spending it on cleanup.\n\nNobody sat us down and explained exactly which categories of content we're still supposed to eyeball ourselves versus trust the tool on — financial promotions included. We've mostly worked it out case by case, which means everyone on the team is doing it slightly differently.\n\nI keep hearing that the AI \"structurally can't\" catch coordinated fraud rings like Aurion Finance, but I don't know if that's true or just something people say to explain it away. That's a question for engineering. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What the new workflow guide says","text":"uEdpX7T1BuPYsqaPLtlpBdXMuXkbDfxldgFq2fCcD1h8keo/gYSjRRqk6lZuCHwqQKZJL8OoI+wePtrHtLl81fMc7ZN4Xz05RiitqhS9bc7a7r9Y0RtTjZaXE4ITpPZ979wYDnPsLrjF+e60WbS4evMeipt7QAZ0Iukzmxcem0qVUmIw6/Jqvb18trmF4y6v9GVnSl2z+JK0AT2AWKxyrIgQEt/UrFPdo5Yn/9AJ28sIMpl5ZPvveny50RFb7cQWYMf+3CzkZlk+UJA+Ms2R9cIaGgyodNGkZNTbVcSeQ57BUb0FusWdTIbxM4k7I3jBvw57mB0mKSSfyGlJMKUM8/aExnMSrySk+GRRngXYiDcKTOPA7iXJithAo+TDGVRSzxKazTPH9OHJHADtI8KeXw6dTYo8"},{"id":"o2","title":"My caseload last week, in numbers","text":"GRvaqa0u9KHH8XGqtbR+SBheJEF6ccDR61fGFDsIpNw6cfRpvuTrhDOf/2A18v9xPua+0gBKrpTpX2DpZBv0kWbl6HM2cXCIxhx7v9lU0WLpMp hree weeks.\n\nI'm now the person fielding angry, frightened messages from users who lost real money, and I genuinely don't know what to tell them about whether this is likely to happen again — because I don't know what leadership actually believes went wrong.\n\nWhat I don't have is the technical side — why our systems kept clearing a campaign that users could see was wrong. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"Nine thousand tickets a week","text":"p7YySMbstGwkZKQCVcRRDmXlzNKtZiAS5CyELS2wCt0UkNVzRN9y+dUYz9vc1asgdsfadJTGSjrF1lXr5zC/RrcqD2FuRyXlB6E0+VSlWQwdS47snbIgjH9jQeCtKoRgWOvzjepLAqiLGXcZh+oJaOcfU5PFymGkkLRpGWGOz8rTPuJ86f8+KAgsuENwCEXP6hBdzG1XYOefeGZhgaXfCtpfAWnTZszVrEPAe+x/fTfWNohHaE+88hM8/xbskSL/upNlMtjnb9RlmffRy8x7ICx/TpiGasAm0DZhGvil1PEtbXv7V1qsxeLXqUAiHcgAcLZ/4afYrYJkpx+4BJ0DRqdsg8JvXTHLWV3uuGugr5B7vHNnpOhphCayUY7pCw9COpMfyMGYf0wUXG+89gl/lY2Rv+CvWn8blpo="},{"id":"o2","title":"What the Aurion tickets said","text":"sovIHz//II9odm8UHPNnfPCNYHBQ/SFtL2z/T3IkLnjvLlRYK1YnoySQh7zzI6Emhq9X5OspCJOkyX7j64Dz1CD4ZR78who7g/lgehx/pu2G0fWNxJ0u7H0cT+BQJKnfA7/8W8CQ+cnadIdBUmRdI7bOgFFxJnjz7/HF6Pw/KVXc96IoNJwqpuksCpyGn9cXsluF9b3fsEEkPN0aiLxTNXk6aIbJ13jOLQ4kn+8v+U2vZbiQUkwjaKN2wzXm0j6stC2WfiAs8vc4sAM6C8wFH5OujKsbxzVf/zQkgtaNHAq/vNqGkhJft1loCgREsXtx3tMtfwrpxDEIzvSNgxHX/IO81nTn2FXVLBZAkPrpjVTsmAvaD7jTIipneN0f9h69uUzDFZ6/21aUAufWOdfov16btH8egCv7VoYZbDKZ8kLmi5OpkuXQ3qivS8Hm"},{"id":"o3","title":"What affected users are telling me","text":"Vmd6NMUTqELqNjIx2U/9WrWUyfblKFJ1q73xu5Vq2hxcOqz14D3kaMcyyhXRsUsy01B9tQmAcEMjchgDXOdKMvMeTscJPqWkYR3cXAccXYxwCbE0uEoNAYPzEdhnx+gJkdj0dkXnViCXdmzQFOCb/raXNYWh7LDZ3y1LVhFAOCiArnw7aHzuuMfknTOWuZ7Y6Huij4YdxbZaLfVZ8Un7zxXFQH55DnQwGM477jiRFMuFvnGcpXfXxaHd4II4IHlFxw3lABpiu8RueclGvh93CxxAoYrjUqT5mfqIlSGLVZaSEZIunL8TQWJw5EaydgjlTrkmgcjbzjr5xSyloVLt1WMbQUbMOv5cttxdH/FKiIjSWAQXbI50buW5+NBv6sVTh7KqXFIATw4="}]}]},{"id":"C","label":"Role C","dept":"Leadership & External Affairs","characters":[{"id":"alistair","name":"Dr. Alistair Chen","title":"Chief Product & AI Officer","subject":"My side of the restructuring decision","email":"I built the business case for the Trust & Safety restructuring, so I should be the one to explain it plainly rather than let it get reconstructed second-hand. Six months earlier, we'd automated bot-account detection with a much leaner team — the Sentinel rollout — and it worked: an early pilot flag got acted on fast, the model improved, and we scaled on schedule without incident. That gave me real confidence that automation plus a leaner, more senior review team was the right direction, not just a cost story.\n\nI was aware a pilot report existed on the financial-promotion classifier before we scaled. I read it as flagging elevated risk on a small, inconclusive sample — not as a specific warning about a coordinated scheme — and I made the call to proceed. I still think that was a defensible read of thin data at the time, and I won't pretend otherwise just because it looks worse in hindsight.\n\nWhat I don't have is the pilot report itself — I only ever saw a summary, and I'm working from memory of that. I can tell you one more thing before you decide. Choose carefully.","offers":[{"id":"o1","title":"What Sentinel showed me","text":"cS0tJ/N+cqJiuIZeB0+NjYDrqedevFqNapBgEo9AaYPi6cr3jy46jonIU/r3bEPv4r1fYLJj9lfX1YsBdRIbuJUYxr9xCxIJ2Xor2DpVsvURL+KfiRxguiwE7AQQl/BqBjUKE7NSJ5GLBeL5BTNyRFHulFDrqcy/Egn/CZc95BQSLJE/UItZnE3jk38DXzSTHLmhTgygOzd2r5uCWbfZic3xxztz6v7t9YBQ9rVqjP4++r3QafgyCcx3Sn9sDKqW6CReXSbz7dfVuBKgK0/0rI79RaqPLnVld6AJVSR3YDMv32jTDWZQ11tezn+tFlzDaxuUD8DyQ3ckBdZ1MA4/eFTsdt6LMt7T59TnH6e8hca2SXXH2lWXjeR4XPKzDcxYHSFckdZUvLs3oIyC20PNp6VyJrbuEdYdQO0eBDGT5hhBx8K23Rznc3NbBA=="},{"id":"o2","title":"Why I still defend the call","text":"XB87f8nL8SQUYQBaxy6Tkm2JKM7QbDg/2s7BjCMjhj1c3YZ/VLEfYa6Q88qp+FfJlX92JACbgCY7+LsPhkKpSIFob3iFpteF392KfJSDPMcytpfJKiojhrx3p1NvloUVtsZDd7q3XQH8T7DF1ZJWjG18Do4fWPV65purAMBZSSz4m1+L54nTLIcYraNcQwAkCRDDRr7iwm62I+/jWXohau1S <script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
let st = {mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:""};
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}
const norm = t => t.replace(/\s+/g, " ").trim();

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");
const budgetVal = id => { const v = parseInt((st.budget || {})[id], 10); return isNaN(v) ? 0 : v; };
const budgetTotal = () => B ? B.items.reduce((s, it) => s + budgetVal(it.id) * it.unit_cost, 0) : 0;
const budgetOK = () => B && Math.abs(budgetTotal() - B.target) <= (B.tolerance || 0);

/* ---------- the top bar: same place on every screen ---------- */
function teacherLink(){
  return S.teacher_url ? `<a class="teacher" href="${esc(S.teacher_url.replace(/\/?$/, "/") + "?sim=" + encodeURIComponent(S.id))}" target="_blank" rel="noopener" title="Opens the teacher tool (password needed)">Teacher</a>` : "";
}
function topBar(who){
  return `<div class="wrap"><span class="title">${esc(S.title)}</span><span class="right">${who ? `<span class="who">${esc(who)}</span>` : ""}${teacherLink()}</span></div>`;
}

/* ---------- start screen ---------- */
function renderStart(){
  const two = st.mode === "2" && TWO;
  $("#app").innerHTML = `
  <header class="bar">${topBar("")}</header>
  <div class="wrap start">
    <h1>${esc(S.title)}</h1>
    <p class="lede">You work for ${esc(S.org)}. Your ${two ? "team of two" : "group"} has to ${B ? `split a ${money(B.target)} budget` : `make ${num(S.decisions.length)} decisions`} — and each of you holds information the other${two ? "" : "s"} ${two ? "doesn't" : "don't"} have.</p>
    <form id="startForm">
      <fieldset><legend>${two ? "Which player are you?" : "Your role"}</legend>
        <p class="muted small">${two ? "Decide between you who is Player 1 and who is Player 2." : "Agree in your group who takes which role. If there are more than three of you, two people can share a role."}</p>
        <div class="choices">${roles().map(r => `
          <label class="choice"><input type="radio" name="role" value="${r.id}" ${st.role===r.id?"checked":""}>
            <span><b>${esc(roleName(r))}</b><br><span class="muted small">Your contacts: ${r.characters.map(c => esc(c.name)).join(", ")}</span></span></label>`).join("")}
        </div></fieldset>
      <button type="button" class="btn" id="go" disabled>Start</button>
    </form>
    ${TWO ? `<p class="switch">${two
        ? `Three or more of you? <button type="button" class="linkish" id="mode">Switch to the group version</button>`
        : `Only two of you? <button type="button" class="linkish" id="mode">Switch to the two-player version</button>`}</p>` : ""}
    <p class="muted small" style="margin-top:2rem">${esc(S.disclaimer)}</p>
  </div>`;
  const m = $("#mode");
  if (m) m.onclick = () => { st.mode = two ? "3" : "2"; st.role = null; save(); renderStart(); };
  const f = $("#startForm");
  const upd = () => { $("#go").disabled = !f.querySelector("input[name=role]:checked"); };
  f.addEventListener("change", upd); upd();
  f.addEventListener("submit", e => e.preventDefault());
  $("#go").addEventListener("click", () => {
    const r = f.querySelector("input[name=role]:checked");
    if (!r) return;
    st.role = r.value; st.tab = "context"; save(); render(); window.scrollTo(0,0);
  });
}

/* ---------- highlighter: tap a sentence, give it a colour; nothing is right or wrong ---------- */
// Lives only in this tab (sessionStorage, as the rest of the state). Never part of the submission block.
const HL = [["yellow","Yellow","#FFF176"],["green","Green","#B9F6CA"],["pink","Pink","#F8BBD0"],
            ["blue","Blue","#B3E5FC"],["orange","Orange","#FFE0B2"],["purple","Purple","#E1BEE7"]];
const HLC = Object.fromEntries(HL.map(([k,,c]) => [k, c]));
const HL_HINT = ({AE:["Position","Evidence","Reasoning","Counter-argument","Weak spot","Use in my brief"],
                  EFD:["Constraint","User need","Idea","Risk","Question","Use in my pitch"]})[S.course]
                || ["Number","Risk","Opportunity","Deadline","Question","Use in my memo"];
const hlName = k => { const i = HL.findIndex(x => x[0] === k); return i < 0 ? k : HL[i][1]; };
const hlLabel = k => ((st.hlLabels || {})[k] || "").trim();
const ABBR = new Set("e.g i.e dr prof mr mrs ms st etc vs cf approx no nos fig figs p pp jr sr inc ltd co corp dept est al ca vol vols ed eds op mt ft gen col lt sgt rev govt univ assn bros nr tel ref".split(" "));
const OPEN_Q = "\u201C\u2018\"", CLOSE_Q = "\u201D\u2019\"'", OPEN_B = "([", CLOSE_B = ")]";
// Split text into sentences: returns [{s, gap}] where gap is the whitespace before the sentence (text = all joined).
function splitSentences(text){
  const out = [], n = text.length;
  let start = 0, i = 0, quoteEnd = -1, depth = 0;
  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };
  while (i < n) {
    const ch = text[i];
    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }
    else if (CLOSE_B.includes(ch) && depth > 0) depth--;
    if (i > quoteEnd && (ch === "\u201C" || (ch === '"' && (i === 0 || /[\s(\[]/.test(text[i-1]))))) {
      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";
        const initial = /^[a-z]$/i.test(word) && !/['\u2019\w]/.test(pre);   // "Oduya, B." but not "don't."
        const isAbbr = ch === "." && (ABBR.has(word) || initial || /^([a-z]\.)+[a-z]$/i.test(word));
        if (!isAbbr && (next === "\n" || /[A-Z0-9\u00C0-\u024F\u201C\u2018"(\[\u2014\u2013\u20AC\u00A3$-]/.test(next))) { push(j); let m = j; while (m < n && /[ \t]/.test(text[m])) m++; push(m); i = m; continue; }
      }
      i = j; continue;
    }
    i++;
  }
  push(n);
  return out;
}
const isSentence = s => words(s) >= 3 && (/[.!?\u201D"')\]]\s*$/.test(s.trim()) || words(s) >= 5);
// Sentence registry for everything this student can highlight: context + own contacts' emails + the opened option.
function hlSources(){
  const parts = [], c = S.context;
  c.text.split("\n\n").forEach((p, i) => parts.push({cid:"ctx", part:"p" + i, text:p, src:{name:"Context"}}));
  parts.push({cid:"ctx", part:"scar", text:c.scar.text, src:{name:c.scar.label}});
  parts.push({cid:"ctx", part:"proof", text:c.proof.text, src:{name:c.proof.label}});
  parts.push({cid:"ctx", part:"clock", text:c.constraint, src:{name:"The clock"}});
  const r = st.role && role();
  (r ? r.characters : []).forEach(ch => {
    const src = {name:ch.name, title:ch.title, citation:ch.citation, cid:ch.id};
    parts.push({cid:ch.id, part:"email", text:ch.email, src});
    const o = st.choices[ch.id] && ch.offers.find(x => x.id === st.choices[ch.id]);
    if (o) parts.push({cid:ch.id, part:"opt", text:unscramble(o.text, `${S.salt}|${ch.id}|${o.id}`), src:{...src, option:o.title}});
  });
  return parts;
}
function hlKey(cid, part, idx, s){ return `${cid}|${part}|${idx}|${fnv(s.trim()).toString(36)}`; }
function hlRegistry(){
  const reg = {}; let order = 0;
  hlSources().forEach(p => {
    let idx = 0;
    splitSentences(p.text).forEach(s => { if (isSentence(s)) { reg[hlKey(p.cid, p.part, idx, s)] = {t:s.trim(), src:p.src, cid:p.cid, n:order++}; idx++; } });
  });
  return reg;
}
// Text -> HTML with each sentence wrapped in a tappable span (the text itself is unchanged).
function hlHTML(text, cid, part){
  let idx = 0;
  return splitSentences(text).map(s => {
    if (!isSentence(s)) return esc(s);
    const k = hlKey(cid, part, idx++, s), col = (st.hl || {})[k];
    const on = col && HLC[col];
    return `<span class="hs${on ? " on" : ""}" role="button" tabindex="0" data-k="${esc(k)}"${on ? ` style="background:${HLC[col]}" aria-describedby="hld-${col}"` : ""}>${esc(s)}</span>`;
  }).join("");
}
// Hidden descriptions read out after a highlighted sentence ("Highlighted yellow: Evidence").
function hlDescs(){
  let d = document.getElementById("hldesc");
  if (!d) { d = document.createElement("div"); d.id = "hldesc"; d.hidden = true; document.body.appendChild(d); }
  d.innerHTML = HL.map(([k, name]) => `<span id="hld-${k}">Highlighted ${name.toLowerCase()}${hlLabel(k) ? ": " + esc(hlLabel(k)) : ""}</span>`).join("");
}
function paletteEl(){
  let p = document.getElementById("hlpal");
  if (!p) { p = document.createElement("div"); p.id = "hlpal"; p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "Highlight this sentence"); p.hidden = true; document.body.appendChild(p); }
  return p;
}
let hlOpenFor = null, hlPressing = false;
document.addEventListener("pointerup", () => setTimeout(() => { hlPressing = false; }, 0), true);
function openPalette(span){
  const p = paletteEl(), k = span.dataset.k, cur = (st.hl || {})[k];
  if (hlOpenFor) hlOpenFor.classList.remove("sel");
  hlOpenFor = span; span.classList.add("sel");
  p.innerHTML = HL.map(([key, name, c]) => `<button type="button" class="sw" data-col="${key}" aria-pressed="${cur===key}" aria-label="${esc(name + (hlLabel(key) ? ": " + hlLabel(key) : ""))}"><i style="background:${c}"></i>${esc(hlLabel(key) || name)}</button>`).join("")
    + (cur ? `<button type="button" class="rm" data-col="">Remove</button>` : "")
    + `<button type="button" class="x" aria-label="Close">×</button>`;
  p.hidden = false;
  if (!matchMedia("(max-width:600px)").matches) {
    const r = span.getBoundingClientRect(), w = p.offsetWidth;
    p.style.top = (window.scrollY + r.bottom + 6) + "px";
    p.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - w - 8)) + "px";
  } else { p.style.left = ""; p.style.top = ""; }
  (p.querySelector('.sw[aria-pressed="true"]') || p.querySelector(".sw")).focus();
  // Safari (macOS and iOS) doesn't focus a button when it is clicked: focus leaves the palette on mousedown, before
  // the click arrives. So a press inside the palette keeps focus where it is, and focusout ignores it.
  p.onpointerdown = () => { hlPressing = true; };
  p.onmousedown = e => { hlPressing = true; if (e.target.closest("button")) e.preventDefault(); };
  p.onfocusout = e => { if (hlPressing) return; if (!e.relatedTarget || !p.contains(e.relatedTarget)) setTimeout(() => { if (!hlPressing && !p.contains(document.activeElement)) closePalette(false); }, 0); };

// Harvard in-text citation from a reference: one author (Smith, 2024), two (Smith and Jones, 2024),
// three or more (Smith et al., 2024), or a body with no comma (World Bank, 2023).
function citeOf(citation){
  const y = (citation || "").match(/\((\d{4}[a-z]?)\)/);
  if (!y) return "";
  const who = citation.slice(0, y.index).trim().replace(/,$/, "");
  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;
}
function notebookHTML(inSubmit){

  const byColour = st.hlGroup !== "source";
  const tools = `<div class="tools"><span>Show by</span><button type="button" data-grp="colour" aria-pressed="${byColour}">colour</button><button type="button" data-grp="source" aria-pressed="${!byColour}">source</button>
    ${items.length ? `<button type="button" class="linkish" data-clear="1" style="margin-left:auto">Clear all highlights</button><span data-clearask hidden>Remove all ${items.length}? <button type="button" class="linkish" data-clearyes="1">Yes, clear them</button> · <button type="button" class="linkish" data-clearno="1">Keep them</button></span>` : ""}</div>`;
  if (!items.length) return tools + `<p class="nb-empty">Tap any sentence in the Context or Inbox to highlight it. Your highlights collect here${inSubmit ? "" : " and next to your writing"}.</p>`;
  const groups = [];
  if (byColour) HL.forEach(([key, name, c]) => { const g = items.filter(x => x.col === key); if (g.length) groups.push({head:`<i style="background:${c}"></i>${esc(hlLabel(key) || name)}`, g}); });
  else { const seen = []; items.forEach(x => { if (!seen.includes(x.src.name)) seen.push(x.src.name); }); seen.forEach(nm => groups.push({head:esc(nm), g:items.filter(x => x.src.name === nm)})); }
  const card = x => {

        ${cite ? `<button type="button" class="citebtn" data-cite="${esc(cite)}" aria-label="Insert ${esc(cite)} into your text">Cite ${esc(cite)}</button>` : ""}</div>
      ${S.course === "AE" && x.src.citation ? `<div class="src">${esc(x.src.citation)}</div>` : ""}</div>`;
  };
  return tools + groups.map(G => `<div class="nb-group">${G.head}</div>` + G.g.map(card).join("")).join("");
}

let memoPos = null;   // where Cite inserts: the last cursor position in the memo
function insertCite(cite){
  const m = document.getElementById("memo"); if (!m) return;
  const v = m.value, pos = memoPos == null ? v.length : Math.min(memoPos, v.length);
  const before = v.slice(0, pos), after = v.slice(pos);
  const ins = (before && !/[\s(]$/.test(before) ? " " : "") + cite;
  m.value = before + ins + after; st.memo = m.value; save();
  memoPos = pos + ins.length; m.focus(); m.setSelectionRange(memoPos, memoPos);

      let v = parseInt(e.target.value, 10); if (isNaN(v) || v < 0) v = 0; if (v > it.max) { v = it.max; e.target.value = v; }
      st.budget = st.budget || {}; st.budget[id] = v; save();
      $("#bs_" + id).textContent = v ? money(v * it.unit_cost) : "";
      $("#btotal").innerHTML = totalHTML();
      if (budgetOK() !== wasOK) { wasOK = budgetOK(); $("#bflash").innerHTML = flash(); }
    } else if (e.target.id === "rationale") { st.rationale = e.target.value; save(); }
  };
}

  $("#main").innerHTML = `

    ${S.decisions.map(d => `
      <div class="dec"><h3>${esc(d.title)}</h3>

function tabSubmit(){
  const W = S.writing;
  $("#main").innerHTML = `

    ${S.rubric ? `<details class="rubric" id="rubric" ${st.rubricOpen ? "open" : ""}><summary>What makes a strong ${esc(W.label)}</summary>
      ${S.rubric.map(c => `<h3>${esc(c.name)}</h3><p class="aim small">${esc(c.aim)}</p><ul class="small">${c.look_for.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}

      <label><input type="checkbox" id="consent" ${st.consent?"checked":""}> Yes, my teacher may check my text with AI.</label>
    </div>

    <div id="issues" class="issues"></div>
    <button type="button" class="btn" id="make">Create my submission</button>
    <div id="out"></div>`;
  const memo = $("#memo"), count = () => { const n = words(memo.value); $("#count").textContent = `${n} word${n===1?"":"s"}`; };
  memo.oninput = () => { st.memo = memo.value; save(); count(); }; count();
  const keep = () => { memoPos = memo.selectionStart; };
  ["keyup","click","select","input","blur"].forEach(ev => memo.addEventListener(ev, keep));
  memoPos = null; refreshNotebook();
  $("#nbpanel").ontoggle = e => { st.nbClosed = !e.target.open; save(); };
  const rb = $("#rubric"); if (rb) rb.ontoggle = () => { st.rubricOpen = rb.open; save(); };
  $("#consent").onchange = e => { st.consent = e.target.checked; save(); $("#out").innerHTML = ""; };
  $("#make").onclick = makeSubmission;
}

function pdfByte(ch){

  if (u >= 32 && u <= 126) return u;
  if (u >= 160 && u <= 255) return u;
  if (PDF_WIN[u] !== undefined) return PDF_WIN[u];

const pdfClean = s => [...String(s).replace(/[ŁłĐđıħ‐‑−′″\u2009\u202f→←≈≤≥]/g, c => PDF_ALT[c])].map(c => {

function pdfWidth(text, font, size){
  let w = 0; for (const ch of text) { const b = pdfByte(ch); w += PDFW[font][b - 32] || 556; } return w * size / 1000;
}
function pdfStr(text){   // a PDF literal string in WinAnsi, with octal escapes

    const b = pdfByte(ch);
    if (b === 40 || b === 41 || b === 92) out += "\\" + String.fromCharCode(b);
    else if (b > 126) out += "\\" + b.toString(8).padStart(3, "0");

function pdfWrap(text, font, size, width){
  const lines = [];
  text.split("\n").forEach(par => {
    if (!par.trim()) { lines.push(""); return; }
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const tryLine = line ? line + " " + word : word;
      if (pdfWidth(tryLine, font, size) <= width) { line = tryLine; return; }
      if (line) lines.push(line);
      while (pdfWidth(word, font, size) > width) {          // a very long word: break it (one pass per line)
        const chars = [...word]; let n = 0, w = 0;
        while (n < chars.length) { const cw = pdfWidth(chars[n], font, size); if (n > 0 && w + cw > width) break; w += cw; n++; }

function utf16Hex(text){

function makePdf({title, subtitle, body, note, footer, block, fileName}){
  [title, subtitle, body, note, footer] = [title, subtitle, body, note, footer].map(pdfClean);
  const W = 595.28, H = 841.89, M = 64, TW = W - 2 * M;
  const pages = []; let ops = [], y = H - M;
  const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = H - M; };
  const text = (s, font, size, x, yy, grey) => ops.push(`BT /${font} ${size} Tf ${grey ? "0.4 0.45 0.5 rg" : "0.11 0.15 0.2 rg"} ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);

  const objs = [];

  return new Blob(parts, {type: "application/pdf"});
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = r.characters.filter(c => !st.choices[c.id]);
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `Your group's answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${st.choices[c.id] || "-"}`).join(", ");
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  const code = checkCode([S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""]);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · Role ${r.id}${r.dept ? " (" + r.dept + ")" : ""} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}
