<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Dee-Lish! Group: The Bianco&#x27;s Decision (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--blue);background:var(--blue-soft)}
.stopc h2{margin:0 0 6px;font-size:1.15rem}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}
.mail>summary .mav{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin:0 8px 0 0}
.t3{cursor:pointer}.t3:not(.on){opacity:.75}.t3:not(.on) .n{background:transparent;border:2px dashed var(--line)}.t3.on{border-color:var(--blue);background:var(--blue-soft)}.t3h{margin-left:auto;color:var(--muted);white-space:nowrap}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}
#hlpal .simpb{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--blue);border-color:var(--blue);color:#fff;font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap}
#hlpal .simpb[hidden]{display:none}
.sn.sopen{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.simp{position:relative;margin:6px 0 10px;padding:8px 36px 8px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:8px;font-size:15px;line-height:1.45}
.simp .simpl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:var(--surface)}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>

/* charts: horizontal budget bars and a simple line chart */
function hbars(rows,label){
  const W=500,left=200,right=70,rowH=30,top=4,H=top+rows.length*rowH+4,w=W-left-right,max=Math.max(...rows.map(r=>r.v));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  rows.forEach((r,i)=>{const y=top+i*rowH,bw=Math.max(2,w*r.v/max);
    s+=`<text class="lab" x="${left-10}" y="${y+18}" text-anchor="end">${r.l}</text><rect class="sa" x="${left}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="2"/><text class="val" x="${left+bw+6}" y="${y+18}">${r.t}</text>`;});
  return s+"</svg>";
}
function lineChart(pts,label,ylo,yhi,marks){
  const W=500,H=190,l=40,r=12,t=12,b=34,w=W-l-r,h=H-t-b,x0=pts[0][0],x1=pts[pts.length-1][0];
  const X=x=>l+w*(x-x0)/(x1-x0), Y=y=>t+h*(yhi-y)/(yhi-ylo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  [ylo,(ylo+yhi)/2,yhi].forEach(v=>{s+=`<line class="axis" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  pts.forEach(([x])=>{if(x%2===0)s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle">${x}</text>`;});
  s+=`<text x="${l+w/2}" y="${H-2}" text-anchor="middle">Months after that line's launch</text>`;
  (marks||[]).forEach(([x,txt])=>{s+=`<line class="zero" stroke-dasharray="3 3" x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${t+h}"/><text class="lab" x="${X(x)+4}" y="${t+12}">${txt}</text>`;});
  s+=`<polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts.map(([x,y])=>X(x)+","+Y(y)).join(" ")}"/>`;
  return s+"</svg>";
}

const INBOX={

   <p>Everyone is talking about the A$1.1 billion. It would cut our debt by almost three-quarters and pay for Cluck's expansion several times over. That's the strongest case for selling, and it's a fair one.</p>
   <p>Now the other side of the sheet. Our bank loans have a covenant: net debt must stay below three times our annual earnings. We're at 2.5 today, on debt of A$1.5 billion. As a rule of thumb, every A$60 million we borrow adds about 0.1.</p>
   ${att("The covenant, plan by plan",`<div class="tw"><table><thead><tr><th>If we borrow for…</th><th class="num">Net debt ÷ earnings</th></tr></thead><tbody>

   <p>A breach means renegotiating our loans at a much higher interest rate, or worse. As the plans stand, we can fund that turnaround or Cluck's expansion, not both. Which matters more is a question about the brands, not the spreadsheet.</p>
   <p class="sig">Fiona</p>`},
  {from:"Daniel Okafor, General Counsel",subj:"What the FoodCorp contract says",rel:"high",body:`
   <p>Two clauses in FoodCorp's draft contract matter more than the price. First, a non-compete: after a sale, Dee-Lish! may run no pizza brand in Australia or New Zealand for five years. Second, Schedule 4: for two years, we would keep running the Bianco's app, the delivery technology and the supply contracts for FoodCorp, for a fee, while it builds its own.</p>
   <p>Every Bianco's franchise agreement would transfer to FoodCorp automatically, on its current terms. That includes clause 14, attached. Inside Dee-Lish!, it simply stops franchisees working for our competitors.</p>
   ${att("Bianco's franchise agreement: clause 14",`<p>“14.1 While this Agreement is in force, the Franchisee shall not own, operate or take part in any restaurant business of any other restaurant group, except with the Franchisor's written consent.”</p>`)}

  {from:"Maggie O'Rourke, Chief Marketing Officer",subj:"You don't sell your grandmother's recipe",rel:"medium",body:`
   <p>I've worked for Bianco's for thirty-four years. In the 1990s I ran the “Tuesday Family Night” campaign that made Bianco's the place where Australian families went to celebrate. Ninety-two per cent of Australians over forty still know the name, and it's still the country's most trusted family restaurant brand.</p>
   <p>And it isn't only the over-forties. The research agency found that under-30s who have ordered Bianco's on a delivery app rate the pizza as highly as any rival's. The ones who only know the restaurants call it “your parents' place”.</p>
   <p>As for one group brand: four brands mean four marketing budgets, and a single Dee-Lish! Kitchen campaign would cost about a third less. Whether customers would follow is another matter.</p>
   <p>Famous names have come back before. Selling Bianco's to a competitor after fifty years feels like giving up on the thing this company was built on. I know I sound sentimental. I'd rather be honest than pretend to be neutral.</p>
   <p class="sig">Maggie</p>`},
  {from:"Tane Wiremu, Founder and Managing Director, Cluck & Company",subj:"Before you decide what Cluck & Company becomes",rel:"medium",body:`
   <p>A US restaurant group has asked me to run the chicken brand it is launching in Australia. I haven't said yes. I'll stay on two conditions. First, the plan to open 150 new Cluck restaurants in three years goes ahead: if it's frozen, our competitors will take the sites. Second, Cluck keeps its own name, its own look and its own app. I won't run a chicken counter inside something called Dee-Lish! Kitchen.</p>
   <p>Most of the 150 will be opened by franchisees who already run restaurants for Dee-Lish!. We don't have the people or the money to open them ourselves.</p>
   <p>The board's research agency found that under-30s call Cluck “fresh”, “fun” and “local”. When they're told it's “part of Dee-Lish!, the Bianco's group”, its appeal drops by fifteen points. The agency also ran a blind test on the burgers, with the logos removed: seven in ten customers couldn't tell Burger Boiz and Pattie's apart.</p>
   <p class="sig">Tane</p>`}

 C:[
  {from:"Ben Tuilagi, Head of Digital and Delivery",subj:"Follow the orders, not the logos",rel:"high",body:`
   <p>Bianco's delivery sales, on our own app and on the delivery apps, have grown by about twelve per cent a year for three years. The fall is in people sitting down in the restaurants, and our data shows where.</p>
   ${att("Bianco's 520 restaurants, last year",`<div class="tw"><table><tbody>
    <tr><td>Big sit-down restaurants from the 1980s</td><td class="num">about 180</td><td>Losing money</td></tr>
    <tr><td>Smaller restaurants</td><td class="num">about 340</td><td>Profitable</td></tr></tbody></table></div>`)}
   <p>The A$240 million plan refits all 520 as they are. Closing the big rooms or turning them into small takeaway-and-delivery shops would cost about A$60 million over two years.</p>
   <p>Thirty-five per cent of Cluck's delivery orders come through the Bianco's app, from customers who add a “Cluck box” to a pizza order. If Bianco's left the group and the apps were separated, most of those orders would go with it, at least at first.</p>
   <p>One app and one loyalty programme for every brand except Bianco's would save about A$14 million a year. But when Dee-Lish! Eats made customers use one app for everything, Cluck's customers simply left.</p>

   <p>Burger Boiz and Pattie's members trade side by side in 140 food courts and highway service centres, with almost the same menu. Last year Burger Boiz lost about A$8 million and Pattie's about A$11 million. Converting Pattie's into Burger Boiz would take about nine months, with some closures.</p>
   <p>Our agreements give franchisees the right to be consulted first, and the group pays the refits: about A$150,000 a restaurant. A proper consultation takes three to four months; a formality takes much longer and can end in court. Pattie's highway leases are in Pattie's name, so those landlords must agree to a new brand too.</p>

function act(a,d){
 switch(a){

  case "expert":if(!S.expert)S.expert=d.v;break;

  case "mv":{const L=S[d.l],i=+d.v,j=i+(+d.d);if(j<0||j>=L.length)return;flip(d.l,()=>{[L[i],L[j]]=[L[j],L[i]];});return;}
  case "pick3":if(!S.ranked){const n=S.pick3||0,i=S.rank.indexOf(d.v);if(i<n){S.rank.splice(i,1);const rest=RANK_START.filter(x=>!S.rank.slice(0,n-1).includes(x));S.rank=[...S.rank.slice(0,n-1),...rest];S.pick3=n-1;}else if(n<3){S.rank.splice(i,1);S.rank.splice(n,0,d.v);S.pick3=n+1;}}break;
  case "sendrank":if((S.pick3||0)<3)break;S.ranked=true;break;

  case "nbclose":S.nbOpen=false;break;

    else{const a=Z.sel[i]; if(!a)return; right=a===q.ans;}

    if(Z.ok.slice(0,PZ[n].qs.length).every(Boolean)) Z.tier=Z.failq?"fail":(Z.hint||Z.tries.some(t=>t>0))?"help":"first";

  case "gate":{const n=+d.v,c=((document.getElementById("gatecode")||{}).value||"").replace(/[\uFF10-\uFF19]/g,x=>String.fromCharCode(x.charCodeAt(0)-0xFEE0)).replace(/\D/g,""),t=Object.keys(CODES[n]).find(k=>CODES[n][k]===c);
    if(t){S.pz[n].tier=t;S.gate[R()][n]=t;S.gateMsg="";} else {const m=[1,2,3].find(x=>x!==n&&Object.values(CODES[x]).includes(c));if(m&&PZ[m].owner!==R()){const tm=Object.keys(CODES[m]).find(k=>CODES[m][k]===c);S.pz[m].tier=tm;S.gate[R()][m]=tm;}S.gateMsg=m?`That's the code for puzzle ${m}${m>n?" (saved)":""}. This box needs the code for puzzle ${n} (“${PZ[n].title}”).`:"That code doesn't work. Check it with your teammate.";} break;}
  case "chk":if(S.checks[d.q]===undefined)S.checks[d.q]=+d.v;break;

  case "pdf":downloadPdf();return;

 }

const LIST_ID={rank:"rk"};
function flip(key,mutate){
 const sel=`#${LIST_ID[key]} .tc`, before={};
 document.querySelectorAll(sel).forEach(c=>before[c.dataset.id]=c.getBoundingClientRect().top);
 mutate();render();
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 document.querySelectorAll(sel).forEach(c=>{const dy=before[c.dataset.id]-c.getBoundingClientRect().top;
  if(dy){c.style.transition="none";c.style.transform=`translateY(${dy}px)`;requestAnimationFrame(()=>{c.style.transition="transform .22s ease";c.style.transform="";});}});
}
let drag=null;
function bindDrag(key){
 const L=S[key];
 document.querySelectorAll(`#${LIST_ID[key]} .tc[draggable="true"]`).forEach(c=>{
  c.addEventListener("dragstart",e=>{drag=c.dataset.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",drag);}catch(_){}});
  c.addEventListener("dragend",()=>{c.classList.remove("dragging");drag=null;});
  c.addEventListener("dragover",e=>{e.preventDefault();if(c.dataset.id!==drag)c.classList.add("over");});
  c.addEventListener("dragleave",()=>c.classList.remove("over"));
  c.addEventListener("drop",e=>{e.preventDefault();const to=c.dataset.id;if(!drag||to===drag||!L.includes(drag))return;
   flip(key,()=>{const from=L.indexOf(drag);L.splice(from,1);const ti=L.indexOf(to);L.splice(from<=ti?ti+1:ti,0,drag);});});
 });
}

 ["c.21", "Some board members want to take the money and spend it on Cluck & Company. Others say a famous name can be made successful again."], "The board also wants two more answers.": ["c.22", "The board also wants answers to two more questions."], "Should Cluck & Company and the burger restaurants move under one Dee-Lish! brand, with one app and one loyalty programme?": ["c.23", "Should Cluck & Company and the burger restaurants all use one Dee-Lish! brand, with one app and one loyalty programme?"], "And does the group need two burger chains that keep turning up in the same places?": ["c.24", "And does the group need two burger chains that are often in the same places?"], "The board presents its half-year results in three weeks, and FoodCorp's offer stands for six.": ["c.25", "The board will report its results for the half year in three weeks. FoodCorp's offer is open for six weeks."], "I've just come off the board call.": ["c.27", "I have just finished a phone call with the board."], "Since the story broke, my phone hasn't stopped: four directors want the money, and four would rather resign than sell.": ["c.28", "Since the news came out, my phone has rung all the time. Four directors want the money. Four others would leave the board before they sold."], "I've got three, and I'm not standing up at the half-year results without an answer.": ["c.30", "I have three weeks. I won't present the half-year results without an answer."], "Properly.": ["c.32", "Really talk."], "Kerry Walsh has rung Daniel twice this morning: the franchisees want to know where they stand.": ["c.34", "Kerry Walsh has phoned Daniel twice this morning. The franchisees want to know what will happen to them."], "Do I brief every franchisee tonight, or say nothing until the board has decided?": ["c.36", "Should I talk to all the franchisees tonight, or say nothing until the board has decided?"], "Let me know by six.": ["c.37", "Tell me by six o'clock."], "The story of FoodCorp's offer is in today's papers, and franchisees are ringing head office.": ["c.38", "The news about FoodCorp's offer is in today's newspapers, and franchisees are phoning head office."], "Claire could brief every franchisee on a video call tonight: they'd hear it from her, not from the papers, but anything she says will be quoted, and because Dee-Lish! is listed, the lawyers must clear every word.": ["c.39", "Claire could talk to every franchisee on a video call tonight. Then they would hear the news from her, not from the newspapers. But people will repeat everything she says. Dee-Lish! is on the stock exchange, so the lawyers must check every word first."], "Or she says nothing until the board has decided: there's nothing to quote, but the rumours keep growing.": ["c.40", "Or she says nothing until the board has decided. Then there is nothing to repeat, but the rumours get bigger."], "You haven't seen the evidence yet.": ["c.41", "You have not seen the evidence yet."], "Agree as a team, then everyone enters the same choice.": ["c.42", "Agree as a team. Then everyone chooses the same answer."], "You look after the group's brands and its customers.": ["c.44", "You are responsible for the group's brands and its customers."], "Your inbox holds messages from the chief marketing officer and from Cluck & Company's founder.": ["c.45", "You get emails from the head of marketing (the chief marketing officer) and from the man who started Cluck & Company."], "You look after how the restaurants and the apps run from day to day.": ["c.47", "You are responsible for how the restaurants and the apps work every day."], "Your inbox holds messages from the head of digital and delivery and from the chair of the Franchisee Council.": ["c.48", "You get emails from the head of apps and delivery and from the leader of the Franchisee Council."], "It would cut our debt by almost three-quarters and pay for Cluck's expansion several times over.": ["e1.2", "It would reduce our debt by almost three-quarters. It would also pay for Cluck's growth several times."], "That's the strongest case for selling, and it's a fair one.": ["e1.3", "That is the best reason for selling, and it is a fair reason."], "Now the other side of the sheet.": ["e1.4", "Now let's look at the other side of the numbers."], "Our bank loans have a covenant: net debt must stay below three times our annual earnings.": ["e1.5", "Our bank loans have a rule (a covenant): our net debt must be less than three times what we earn in a year."], "We're at 2.5 today, on debt of A$1.5 billion.": ["e1.6", "Today it is 2.5 times, and our debt is A$1.5 billion."], "As a rule of thumb, every A$60 million we borrow adds about 0.1.": ["e1.7", "Roughly, every A$60 million we borrow adds about 0.1."], "A breach means renegotiating our loans at a much higher interest rate, or worse.": ["e1.8", "If we break the rule, we must agree new loans with a much higher interest rate, or something worse happens."], "As the plans stand, we can fund that turnaround or Cluck's expansion, not both.": ["e1.9", "With the plans as they are now, we can pay for that turnaround or for Cluck's growth, but not for both."], "Which matters more is a question about the brands, not the spreadsheet.": ["e1.10", "Which one is more important is a question about the brands, not about the numbers."], "Two clauses in FoodCorp's draft contract matter more than the price.": ["e2.1", "Two parts of FoodCorp's draft contract are more important than the price."], "First, a non-compete: after a sale, Dee-Lish! may run no pizza brand in Australia or New Zealand for five years.": ["e2.2", "First, there is a non-compete rule. After a sale, Dee-Lish! cannot run any pizza brand in Australia or New Zealand for five years."], "Second, Schedule 4: for two years, we would keep running the Bianco's app, the delivery technology and the supply contracts for FoodCorp, for a fee, while it builds its own.": ["e2.3", "Second, Schedule 4: for two years, we would keep running the Bianco's app, the delivery technology and the supply contracts for FoodCorp. FoodCorp would pay us, and it would build its own systems in that time."], "Every Bianco's franchise agreement would transfer to FoodCorp automatically, on its current terms.": ["e2.4", "Every Bianco's franchise agreement would move to FoodCorp automatically, with the same terms."], "That includes clause 14, attached.": ["e2.5", "That includes clause 14, which I have attached."], "Inside Dee-Lish!, it simply stops franchisees working for our competitors.": ["e2.6", "Inside Dee-Lish!, this rule only stops franchisees from working for our competitors."], "“14.1 While this Agreement is in force, the Franchisee shall not own, operate or take part in any restaurant business of any other restaurant group, except with the Franchisor's written consent.”": ["e2.7", "“14.1 While the agreement lasts, the franchisee may not own, run or be part of any restaurant business of any other restaurant group, unless the franchisor agrees in writing.”"], "FoodCorp won't accept any changes to the franchise agreements.": ["e2.8", "FoodCorp will not accept any changes to the franchise agreements."], "Its offer letter promises franchisees a three-year fee freeze and a delivery-first relaunch, with smaller restaurants and a shorter menu.": ["e2.9", "Its offer letter promises franchisees that their fees will not go up for three years. It also describes a new start for the brand that puts delivery first, with smaller restaurants and a shorter menu."], "This is going round today.": ["e3.1", "People are sharing this today."], "Is there anything in it?": ["e3.2", "Is any of it true?"], "“Insiders say FoodCorp will shut EVERY Bianco's dining room within a year and turn the lot into dark kitchens.": ["e3.3", "“People inside the company say FoodCorp will close EVERY Bianco's dining room within a year and use all of them only as kitchens for delivery."], "Thousands of jobs gone!”": ["e3.4", "Thousands of people will lose their jobs!”"], "(food-industry gossip account, 40,000 followers)": ["e3.5", "(a gossip account about the food industry, with 40,000 followers)"], "The post names no source, no restaurants and no dates.": ["e3.6", "The post gives no source, no restaurants and no dates."], "In the 1990s I ran the “Tuesday Family Night” campaign that made Bianco's the place where Australian families went to celebrate.": ["e4.2", "In the 1990s I ran the “Tuesday Family Night” campaign. It made Bianco's the place where Australian families went to celebrate."], "Ninety-two per cent of Australians over forty still know the name, and it's still the country's most trusted family restaurant brand.": ["e4.3", "Ninety-two per cent of Australians over forty still know the name. It is still the family restaurant brand that people in the country trust most."], "And it isn't only the over-forties.": ["e4.4", "And it is not only people over forty."], "The research agency found that under-30s who have ordered Bianco's on a delivery app rate the pizza as highly as any rival's.": ["e4.5", "The research agency found something about people under 30 who have ordered Bianco's on a delivery app: they think the pizza is as good as any other company's."], "The ones who only know the restaurants call it “your parents' place”.": ["e4.6", "People who only know the restaurants call it “your parents' place”."], "As for one group brand: four brands mean four marketing budgets, and a single Dee-Lish! Kitchen campaign would cost about a third less.": ["e4.7", "About one group brand: four brands need four advertising budgets. With a single Dee-Lish! Kitchen campaign, the cost would go down by about a third."], "Whether customers would follow is another matter.": ["e4.8", "Whether customers would come too is a different question."], "Famous names have come back before.": ["e4.9", "Famous names have become successful again before."], "Selling Bianco's to a competitor after fifty years feels like giving up on the thing this company was built on.": ["e4.10", "Selling Bianco's to a competitor after fifty years feels like giving up the thing that this company was built on."], "I know I sound sentimental.": ["e4.11", "I know my feelings play a part here."], "I'd rather be honest than pretend to be neutral.": ["e4.12", "I prefer to be honest instead of pretending I have no opinion."], "A US restaurant group has asked me to run the chicken brand it is launching in Australia.": ["e5.1", "A US restaurant group has asked me to run the chicken brand it is starting in Australia."], "I'll stay on two conditions.": ["e5.3", "I will stay if two things happen."], "First, the plan to open 150 new Cluck restaurants in three years goes ahead: if it's frozen, our competitors will take the sites.": ["e5.4", "First, the plan to open 150 new Cluck restaurants in three years goes ahead. If it stops, our competitors will take the places."], "I won't run a chicken counter inside something called Dee-Lish! Kitchen.": ["e5.6", "I will not run a chicken counter in a place called Dee-Lish! Kitchen."], "We don't have the people or the money to open them ourselves.": ["e5.8", "We do not have the people or the money to open them ourselves."], "The board's research agency found that under-30s call Cluck “fresh”, “fun” and “local”.": ["e5.9", "The research agency that the board used found that people under 30 call Cluck “fresh”, “fun” and “local”."], "When they're told it's “part of Dee-Lish!, the Bianco's group”, its appeal drops by fifteen points.": ["e5.10", "When people hear that it is “part of Dee-Lish!, the Bianco's group”, they like it fifteen points less."], "The agency also ran a blind test on the burgers, with the logos removed: seven in ten customers couldn't tell Burger Boiz and Pattie's apart.": ["e5.11", "The agency also tested the burgers without the logos. Seven in ten customers could not say which was Burger Boiz and which was Pattie's."], "Bianco's delivery sales, on our own app and on the delivery apps, have grown by about twelve per cent a year for three years.": ["e6.1", "Bianco's delivery sales, on our own app and on the delivery apps, have grown by about twelve per cent every year for three years."], "The fall is in people sitting down in the restaurants, and our data shows where.": ["e6.2", "Fewer people are eating inside the restaurants, and our data shows where that happens."], "The A$240 million plan refits all 520 as they are.": ["e6.3", "The A$240 million plan would rebuild the inside of all 520 restaurants, without changing what they are."], "Closing the big rooms or turning them into small takeaway-and-delivery shops would cost about A$60 million over two years.": ["e6.4", "Closing the big dining rooms, or changing them into small shops for takeaway and delivery, would cost about A$60 million over two years."], "Thirty-five per cent of Cluck's delivery orders come through the Bianco's app, from customers who add a “Cluck box” to a pizza order.": ["e6.5", "Thirty-five per cent of Cluck's delivery orders come through the Bianco's app. Customers add a “Cluck box” to their pizza order."], "If Bianco's left the group and the apps were separated, most of those orders would go with it, at least at first.": ["e6.6", "If Bianco's left the group and the apps were separated, most of those orders would go with Bianco's, at least at the start."], "One app and one loyalty programme for every brand except Bianco's would save about A$14 million a year.": ["e6.7", "One app and one loyalty scheme for every brand except Bianco's would save about A$14 million a year."], "But when Dee-Lish! Eats made customers use one app for everything, Cluck's customers simply left.": ["e6.8", "But Dee-Lish! Eats made customers use one app for everything, and Cluck's customers just left."], "Sixty per cent of Bianco's restaurants and almost half of the burger restaurants are run by franchisees: families who have put their savings into them.": ["e7.1", "Franchisees run sixty per cent of Bianco's restaurants and almost half of the burger restaurants. These are families who have put their savings into them."], "Burger Boiz and Pattie's members trade side by side in 140 food courts and highway service centres, with almost the same menu.": ["e7.2", "Burger Boiz and Pattie's members have restaurants next to each other in 140 food courts and motorway service centres. Their menus are almost the same."], "Last year Burger Boiz lost about A$8 million and Pattie's about A$11 million.": ["e7.3", "Last year Burger Boiz lost about A$8 million, and Pattie's lost about A$11 million."], "Converting Pattie's into Burger Boiz would take about nine months, with some closures.": ["e7.4", "Changing Pattie's restaurants into Burger Boiz restaurants would take about nine months, and some would close."], "Our agreements give franchisees the right to be consulted first, and the group pays the refits: about A$150,000 a restaurant.": ["e7.5", "Our agreements say that the group must ask franchisees first, and the group pays for the new fittings: about A$150,000 for each restaurant."], "A proper consultation takes three to four months; a formality takes much longer and can end in court.": ["e7.6", "A real consultation takes three to four months. If it is only for show, it takes much longer and can end in court."], "Pattie's highway leases are in Pattie's name, so those landlords must agree to a new brand too.": ["e7.7", "The leases for Pattie's restaurants at motorway service centres are in Pattie's name, so those landlords must also agree to a new brand."], "And 110 of our Bianco's members have signed letters of intent to open Cluck restaurants over the next three years, often next door to their Bianco's.": ["e7.8", "And 110 of our Bianco's members have signed letters saying they plan to open Cluck restaurants in the next three years, often next to their Bianco's."], "What they fear most about a sale is a new owner who raises fees.": ["e7.9", "What they are most afraid of in a sale is a new owner who makes the fees higher."], "Most of our franchise owners joined Claire's call.": ["e8.1", "Most of our franchise owners were on Claire's call."], "The question asked most was whether a new owner would raise fees.": ["e8.2", "The question people asked most was whether a new owner would make the fees higher."], "The second was whether they could still open a Cluck restaurant if Bianco's were sold: we said we'd come back to them.": ["e8.3", "The second question was whether they could still open a Cluck restaurant if Bianco's was sold. We said we would answer later."], "Several Pattie's owners on highway sites asked whether their leases allow a new name.": ["e8.4", "Several Pattie's owners at motorway service centres asked whether their leases allow a new name."], "A business reporter quoted Claire's “nothing is decided” by ten o'clock.": ["e8.5", "By ten o'clock, a business journalist had written Claire's words “nothing is decided”."], "In a quick poll after the call, eight in ten owners said they'd take part in a consultation on any change if it started soon.": ["e8.6", "In a short vote after the call, eight in ten owners said they would take part in a consultation about any change if it started soon."], "Since the story broke, dozens of franchise owners have rung us, and we've told them nothing is decided.": ["e9.1", "Since the news came out, dozens of franchise owners have phoned us. We have told them nothing is decided."], "Two rumours are going round their group chat: that FoodCorp would close every Bianco's dining room, and that the burger chains are being sold too.": ["e9.2", "Two rumours are going round their group chat. One says FoodCorp would close every Bianco's dining room. The other says the burger chains are being sold too."], "Neither is in any paper we've seen.": ["e9.3", "We have not seen either of them in any newspaper."], "Kerry says her members would rather hear it from Claire than from the papers, and that the longer they wait, the harder any consultation will be.": ["e9.4", "Kerry says her members want to hear the news from Claire, not from the newspapers. She also says the longer they wait, the harder any consultation will be."], "When a well-known chain's sales fall, the cause is usually its format, not its name: big dining rooms built for another age, high rents and empty tables on weeknights.": ["x1.1", "When a well-known chain sells less, the reason is usually the kind of restaurant, not the name: big dining rooms from an earlier time, high rents and empty tables on weekday evenings."], "Refitting every restaurant as it is rarely pays back.": ["x1.2", "Rebuilding the inside of every restaurant without changing it rarely earns back its cost."], "Chains that close or shrink their big rooms and follow their delivery customers usually recover faster, for a fraction of the cost.": ["x1.3", "Chains that close their big dining rooms or make them smaller, and follow their delivery customers, usually get better faster, and for much less money."], "In a sale, franchise agreements transfer to the buyer with every clause in them, exclusivity clauses included.": ["x2.1", "In a sale, franchise agreements move to the buyer with every part in them, including rules about working for only one group."], "Buyers rarely waive exclusivity: it protects what they are paying for.": ["x2.2", "Buyers rarely give up these rules, because the rules protect what they are paying for."], "Under Australia's Franchising Code, a franchisor that converts restaurants must consult first, pay for the work it requires and compensate franchisees whose agreements end early.": ["x2.3", "Under Australia's Franchising Code, a franchisor that changes restaurants into another brand must ask franchisees first, pay for the work it asks for and pay franchisees whose agreements end early."], "A sale is cleanest when the brand stands alone, with its own suppliers, systems and franchisees: the buyer pays for it, and nothing else changes.": ["x3.1", "A sale is simplest when the brand is independent, with its own suppliers, systems and franchisees. Then the buyer pays for it, and nothing else changes."], "On the other side, the cash from a sale is certain; a turnaround's results are not.": ["x3.3", "On the other hand, the money from a sale is certain, but the results of a turnaround are not."], "In fast food, a parent's name helps a brand only if customers like the parent.": ["x4.1", "In fast food, a parent company's name only helps a brand if customers like the parent company."], "When a young brand is linked to an older one, it usually starts to look older too.": ["x4.2", "When a young brand is connected to an older one, the young brand usually starts to look older too."], "A master brand saves money on apps, loyalty and marketing, but the saving is rarely worth the appeal it costs.": ["x4.3", "One name for everything saves money on apps, loyalty schemes and marketing. But the money saved is rarely worth what the brand loses in popularity."], "Customers build an order around a meal, not around an owner: pizza for one child, chicken for another.": ["x5.1", "Customers plan an order around a meal, not around who owns the brand: pizza for one child, chicken for another."], "Add-ons from a second brand are common, and they follow the app the customer already uses.": ["x5.2", "Customers often add food from a second brand, and they do it in the app they already use."], "Two similar chains from the same owner, side by side, mostly take customers from each other.": ["x6.1", "Two similar chains from the same owner, next to each other, mostly take customers from each other."], "Landlords accept a change of brand if the rent keeps coming and the new brand trades well, and highway service-centre operators usually want to approve the new name first.": ["x6.2", "Landlords accept a new brand if they keep getting the rent and the new brand sells well. Operators of motorway service centres usually want to agree to the new name first."], "Ask early: a landlord who hears it from the press drives a harder bargain.": ["x6.3", "Ask early. A landlord who hears about it from the newspapers will ask for more."], "FoodCorp runs pizza and noodle chains in eleven countries, and we're good at tired brands that people still love.": ["w1.1", "FoodCorp runs pizza and noodle chains in eleven countries. We are good at old brands that people still love."], "For Bianco's, that means a delivery-first relaunch: smaller restaurants, a shorter menu.": ["w1.2", "For Bianco's, that means a new start that puts delivery first: smaller restaurants and a shorter menu."], "We'd keep every franchise agreement exactly as it is and freeze fees for three years.": ["w1.3", "We would keep every franchise agreement exactly as it is, and fees would not go up for three years."], "Franchisees are the business; we don't want a fight with them.": ["w1.4", "The franchisees are the business, and we don't want to fight with them."], "Our offer is one point one billion dollars, and it stands for six weeks.": ["w1.5", "Our offer is one point one billion dollars, and it is open for six weeks."], "We're buying a brand that has lost sales four years in a row, and our price reflects that risk.": ["w1.6", "We are buying a brand that has sold less every year for four years, and our price shows that risk."], "Six weeks, one price.": ["w1.8", "Six weeks, and one price only."], "Our board approved this money for one deal this year, and if Bianco's has another bad Christmas while you wait, the price comes down, not up.": ["w1.9", "Our board agreed this money for one deal this year. If Bianco's has another bad Christmas while you wait, the price will go down, not up."], "That's simply how we work.": ["w1.10", "That's just how we work."], "People still order the pizza; they've stopped sitting in those big old dining rooms.": ["w1.12", "People still order the pizza, but they have stopped eating in those big old dining rooms."], "The old restaurants are.": ["w1.14", "The old restaurants are the problem."], "Their agreements stay exactly as they are, clause 14 included.": ["w1.15", "Their agreements stay exactly as they are, and that includes clause 14."], "A franchisee runs one group's restaurants, not two.": ["w1.16", "A franchisee runs restaurants for one group, not for two."], "That's standard, and we won't change it.": ["w1.17", "That is normal, and we won't change it."], "Free-range chicken, a short menu, loud music.": ["w2.2", "Free-range chicken, a short menu and loud music."], "We grew through franchisees who loved the food first and the business second.": ["w2.3", "We grew with franchisees who loved the food first and the business second."], "A US group has asked me to run the chicken brand it's launching here.": ["w2.4", "A US group has asked me to run the chicken brand it is starting here."], "I'll stay on two conditions: the 150 new restaurants go ahead, and Cluck keeps its own name, look and app.": ["w2.5", "I will stay if two things happen: the 150 new restaurants go ahead, and Cluck keeps its own name, look and app."], "I'm not trying to be difficult.": ["w2.6", "I am not trying to make things hard for you."], "I just know what this brand is, and what it isn't.": ["w2.7", "I just know what this brand is, and what it is not."], "Franchisees who already run Bianco's, mostly.": ["w2.8", "Mostly franchisees who already run Bianco's restaurants."], "We've found sixty of the sites, many next door to a Bianco's.": ["w2.9", "We have found sixty of the places, and many are next to a Bianco's."], "We couldn't open 150 ourselves.": ["w2.10", "We could not open 150 restaurants ourselves."], "Both conditions, or I go.": ["w2.11", "I need both things, or I leave."], "A chicken counter inside Dee-Lish! Kitchen isn't Cluck, and our young customers would know it within a week.": ["w2.12", "A chicken counter in Dee-Lish! Kitchen is not Cluck. Our young customers would see that in less than a week."], "End of the month.": ["w2.13", "By the end of the month."], "They've offered me my own team and a launch budget to match.": ["w2.15", "They have offered me my own team and a big enough budget for the launch."], "You've put what goes with a sale first, and I think you're right to.": ["b1.1", "You have put what goes with a sale first, and I think that is right."], "I asked Daniel and Kerry to get the positions in writing.": ["b1.2", "I asked Daniel and Kerry to get everyone's position in writing."], "FoodCorp has answered in writing: no changes to the standard franchise agreements, clause 14 included, and Schedule 4 ends after two years, with no extension.": ["b1.4", "FoodCorp has answered in writing. There will be no changes to the standard franchise agreements, including clause 14. Schedule 4 ends after two years and cannot be made longer."], "Kerry has written too: the 110 franchisees with letters of intent are ready to sign their Cluck agreements as soon as the board decides.": ["b1.5", "Kerry has also written. The 110 franchisees with letters of intent are ready to sign their Cluck agreements as soon as the board decides."], "The share price worries me too.": ["b2.1", "I am worried about the share price too."], "I've hired investor-relations advisers to sound out our biggest shareholders: A$300,000 from the strategy budget.": ["b2.2", "I have paid advisers to ask our biggest shareholders what they think: A$300,000 from the strategy budget."], "Our biggest shareholders are split, much as the papers said.": ["b2.4", "Our biggest shareholders do not agree with each other, as the newspapers said."], "Most of them want one clear plan with the numbers behind it, whichever way it goes.": ["b2.5", "Most of them want one clear plan with numbers, whatever the plan is."], "That's A$300,000 to hear what we already knew.": ["b2.6", "We paid A$300,000 to hear what we already knew."], "You've put what goes with a sale second, so I've asked Daniel to check the contract terms as well.": ["b3.1", "You have put what goes with a sale second, so I have also asked Daniel to check the terms of the contract."], "Fair point.": ["b4.1", "That is a good point."], "I've asked Maggie to run a survey of Bianco's family customers: A$200,000 from the strategy budget.": ["b4.2", "I have asked Maggie to do a survey of families who eat at Bianco's: A$200,000 from the strategy budget."], "Families over forty still love Bianco's, and most of them would keep ordering whoever owned it, as long as the pizza stayed the same.": ["b4.4", "Families over forty still love Bianco's. Most of them would keep ordering it, whoever owned it, if the pizza stayed the same."], "It tells us how people feel about the name, not who should own it.": ["b4.5", "It tells us what people feel about the name, not who should own it."], "I've asked an outside law firm to get ready for a court case with the burger franchisees: A$250,000 from the strategy budget.": ["b5.2", "I have asked a law firm from outside the company to prepare for a court case with the burger franchisees: A$250,000 from the strategy budget."], "I hear the group has hired lawyers for a court case.": ["b5.4", "I hear that the group has paid lawyers for a court case."], "Nobody was planning one.": ["b5.5", "Nobody was planning a court case."], "My members go to court when they're told instead of asked.": ["b5.6", "My members go to court when they are told what will happen instead of being asked."], "Consult us properly and pay the refits, and they'll negotiate.": ["b5.7", "Ask us properly and pay for the new fittings, and they will discuss it."], "Now they're nervous.": ["b5.8", "Now they are worried."], "Agreed: first impressions matter.": ["b6.1", "I agree: the first thing people see is important."], "I've asked a design agency for three Dee-Lish! Kitchen logos: A$400,000 from the strategy budget.": ["b6.2", "I have asked a design agency for three Dee-Lish! Kitchen logos. They cost A$400,000 from the strategy budget
