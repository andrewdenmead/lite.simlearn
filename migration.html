<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>The Reception Capacity Review — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examq{margin:0 0 18px}
.pn{display:inline-block;min-width:1.4em;color:var(--ink-2);font-family:var(--sans);font-size:.85rem}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

nforcement policy, drawing on economic, social and legal expertise rather than the emergency improvisation that characterised the response three years ago. Arrivals reach Solmere through several channels at once: seasonal sea crossings that dominate news coverage, a growing points-based labour pathway recruiting into care, construction and agriculture, and a long-standing international study route that has become financially important to the university sector. Each channel has its own rhythm, its own legal basis and its own political visibility, and the Commission's brief is to recommend a coherent framework across all three rather than legislating for whichever channel is loudest in the press that month. Public opinion on migration is sharply divided, though polling suggests most Solmerians hold both a genuine instinct towards welcome and a genuine anxiety about whether the country's housing, schools and services can keep pace — instincts many voters experience as contradictory; how far they can be reconciled is the real question.","scar":{"label":"The Portside Intake","text":"Three years ago, following a conflict in a neighbouring region, Solmere opened an emergency land corridor and waved arrivals through processing within days to relieve pressure at the border. Reception centres, schools and clinics in the three nearest port cities were overwhelmed within months; the asylum backlog that resulted has never fully cleared, and the visible disorder helped fuel a populist surge in the following election. The Commission was created, in large part, so this would not happen again."},"proof":{"label":"The Bracken Valley Pilot","text":"A decade earlier, a smaller resettlement corridor pre-matched arrivals to specific towns with pre-booked housing, language instruction and employer partnerships before anyone was dispersed. Integration outcomes — employment, language proficiency, school performance — were strong, and public support in the receiving towns stayed high even as numbers grew year on year. It remains the Commission's clearest evidence that generous admissions and public confidence are not actually in tension, provided capacity is built ahead of arrival rather than assumed afterwards."},"constraint":"Parliament votes on the Migration Framework Act in three weeks — the Commission's recommendation is the last formal input before that vote, and it lands just as the reopening sea route is expected to push arrival numbers up again."},"roles":[{"id":"A","label":"Role A","dept":"Labour Market & Public Finance","characters":[{"id":"kowalik","name":"Dr. Renata Kowalik","title":"Labour Economist","subject":"Shock Absorber or Structural Fix?","email":"Flagging this before the Commission finalises the framework — it's not an argument against the labour pathway, but it does complicate how we sell it.\n\nFrom the paper:\n“Solmere's care homes, farms and building sites report shortages that are real and immediate: vacancy data collected by the Commission itself shows a shortfall equivalent to roughly four percent of the workforce in each sector, and the points-based labour pathway has filled a meaningful share of it quickly. Migrants of working age are, on the Commission's own fiscal modelling, net contributors — they pay more in tax than they draw in services, which is unsurprising given the pathway selects for employment before entry. What that modelling does not capture is a parallel and inconvenient fact: Solmere also has close to sixty thousand young people who are neither working, studying nor training, concentrated in the same regions where shortages are worst. A fast, reliable supply of motivated foreign labour reduces the political and commercial pressure to close that gap through training, wage increases or automation — not because employers prefer migrants, but because recruiting internationally is quicker than rebuilding a domestic pipeline, and the incentive to do the slower thing weakens every year the faster one remains available. This is not an argument against the pathway, which is solving a genuine and urgent problem; it is an argument that the current framework treats a structural mismatch as a temporary shortage, and that reliance built this way is also fragile — two seasons ago, a currency shift briefly made a neighbouring country's wages more attractive, and several employers lost most of their recruited staff within a single quarter.”","citation":"Kowalik, R. (2025). Shock Absorber or Structural Fix? Migration and the Politics of Deferred Reform. Solmere Economic Review, 38(1), 22–47.","offers":[{"id":"a","title":"Another voice, same position","text":"fGC5aSGVf1vROkOvNN5jqV9w5w/EXD9XQGO7Uot4BEGxs25qZUvZhKdaqPgmez+TrPKeyN1qyavCILlCFBsYD6flFgkl3gHCrKZck01AIjc91xmoGKECfLjP7yKVFqwu/E+QfgRZMAaAz624PY3D9u88FK4RuY+8LbZ1BRNI+vcmGjpv4yxlgqdEHESngZkxPutziC38sOc2gyw/0MSIBR98aZuz/lghdG6TlSj9oOghspjzzLxjjC7mzM0SzrnN41UNOFIihMTZvNWkcAwA9/99v5bSbTkQTAM68wNML3v3htKLjOML1C01fuZ+zKpsWpZwPaxuRY5ZvPi3Qw0UljftnBgJlI31Xc2uXhv0YHv3os45iOu2ui9KxENsLK3JeST4iRuH7hts5xfSk/qbZYiJjB6Wna4+K0bDsml4z/omxJoEev1RQG9l6G51vZRN7wDiBTlQxX2mdz4WH/AR8Sf3WEd2yUT+17zhnOyaZtrOKfcgiWQLoWOrGuQscVavJa2S5f7TL/tjyepJrfQ7lAR73WcfKTidS7TjQc0yZje58VeDSk3Hsk1T/RDmScBGn+pVolNv7v6dgcPdsVXXTeJswE9DzIkseH4RFfuMsUZsgpVMVLHZz/6wnlsVj9fKbfXNsJfV+VDWc4xkdDzoXOyOx8PStyVcwBxWs2jlSsScufxdQN6nZMl5pM2WMdF7oTm7R0WvnG405dNMVrLuL+sQDWeOCerjPVvDefHn"},{"id":"b","title":"A competing angle","text":"xvHnxs/55tcndSss2hV/OaKTjpPUpqCD2rId+8uNI2KveDPWbp9cSNt0pUI0wQGA8692ouinxmeFBsGe9/uN+kfIx1B0FW4D65Kg3NPAWI4YC8iWCB+bHDWGj7E+vUCELHy0alH08NdsJwvkMRyE/fiRjnJrloditGoYerAP4l06UhDpPNt7BkyIDjK7nNKgkMVmFo1UFo2D0BJigjxEVfX9E4Q2EmHR77llkucR0pklQvz1uT/5UAkIaslnA8/dn+XucqXxS8YrKYZkhU8GBYXVhl2QtoO+XJ0hea7XmzMngj4jO1K7KdC9SqwGAfIW4O6mQNtGLIyqPRJBQcRb0dnTwY96kRdYLH+7TIoEjSgkpE+PpHvGFlWeGVSwya14kojHpQ8DjdYJtxeP3M9yaWid3IGSooYebnp0P/LokYU4kfsmii8syGSG+5SbN2wADSNle/FodOfiNKGuE+YoThkZF8kbqQRZAkYaHzzXSPkzKX6BwB256g+4UbCgtaZhk3QwXrBr2ohASQ4sH5zg+A5xnTpHmDZvVVpSnkONUJUoa7x ice costs since the Portside Intake. A national average of 'net positive' is therefore compatible with three towns being fiscally underwater while the rest of the country notices nothing. This is not an argument for lower admissions — the national ledger genuinely balances — it is an argument that admissions policy and cost-distribution policy are being treated as the same question when they are not. Kowalik's shortage data suggests demand for labour is itself unevenly distributed across the country; a transfer mechanism that moved reception funding towards wherever capacity and need actually align, rather than wherever a reception centre happened to be sited in an emergency, would address the imbalance without touching admission numbers at all.”","citation":"Reyburn, T. (2025). The Distributional Fiscal Ledger: Who Actually Pays for Reception? Journal of Public Finance and Local Government, 19(3), 201–226.","offers":[{"id":"a","title":"Another voice, same position","text":"bCBDdMJgXQaaDLlz+kVgjVtotNapmqn8VdO9PT/5vjDW1wdrHTKgHmN2m0lg/6oUSiYTYCpuLPjoUiAenv8Zb/c61kI3ucuPBxsl41VsBGsE0o+i9ktjYhGwDUvaiz/UJzWQkMHF7ddCif6ViHFsZXWNUjY6XiK3S7x7MUMnQoThDkqZMB1BeMwD9o/rARd67+p0IzG1dUPSfazsLOGyAt2Or/HCjM350o4iDkX+kr/oeejH9bLlNeqBLUQZ5xJUxOmD4A3RNIOVuPU+y1zfYL8V2qJ5SDqxOKUPE6A+ik2QTfu3sNzhDN+/SltKqSipqotgc3N97nU7Kh2jrZwo87SU23mMHfv6a/+75bpgQm8pQhRwq1wg7spkKkN8etgpOQgRs2NPw0HJNMjvXumU1iv5wmRQmbCaW/ohNQ+Sx8MjhgV4y8PPJdrKqg8cguM7/ij9WdG2jt9oOESXmrHRcHKzZnC0+cRWwc8nSnFzZNogelNeZe4oPxjDnNHV44ZcQuBWTOqBMqBdt5iGeVvee+3xoSqdnLOVGetTop0MbisnBb6BmZ3ehPWfpcm6Ug0o8eXJYyTz6HcKta9Bl+tl9+UNw/tuuZjUio0deJmKNMCzNmb+0ivH1/evWZJFA3CCcyqFzirjD7XNiAWFlyHbavX31XW3rs1i3gQaihDLojktVWawBXe2IWNLosBm6HygP6Gb5QhS0Ad++duJEop5aqfIXysSDLoA+hiad1JfU1nUzFkRmY1q+/mwZs8sWUdt55ZsofF/koPz5rVgQJyxBpEzDW5lhNAQ8ElWfQtuTU/qQzuIIv2Ld9klg9kb+5IGFRSrxGi29SygyVivj+LzNAzfxZVYyZDipVtS835SZrCYOG6w7MMOwg=="},{"id":"b","title":"A competing angle","text":"4Mckxp0a+W+Kob5jHJKI5v9QSFFgZhM5E+w6q8JcEoSLaTYhck9HtsxxTyKf+EUqrRySLBiqB4 t to stay solvent. Domestic tuition has been capped by statute for over a decade, while the cost of delivering a degree has risen with inflation; international fees are uncapped and now cross-subsidise roughly a fifth of total teaching costs at the country's largest universities. This creates a structural incentive to grow international enrolment that has very little to do with labour-market need and would persist even if every shortage Kowalik documents were solved tomorrow. The two-year post-study work right layered on top of the study visa converts a meaningful share of this flow into labour migration, but not into the labour the shortage sectors actually need: graduates cluster in business, technology and finance, fields with the least overlap with care, construction and agriculture. The result is a policy tool being asked to do two incompatible jobs — fund higher education and relieve sector shortages — and being judged, in public debate, only against the second, which it was never well designed to do. Restricting the post-study work right to address 'too many arrivals' would therefore be a highly visible policy move that inflicts real financial damage on the university sector while barely touching the shortages that dominate the political conversation about numbers in the first place.”","citation":"Marchetti, E. (2025). The Tuition Bind: How University Financing Shapes Migration Policy. Higher Education Policy Quarterly, 12(2), 88–110.","offers":[{"id":"a","title":"Another voice, same position","text":"fyss4oqGXbd/UB03/r5RsxF5Un3iEjA5GUJs06J+Q1M2uPiyeTlAFyaMBEmWmKoO+CvU6T6gPTFWJOvpsoem5rKtf+93pC1No4Hcf00Kwwxh9wjKAcBdP2cVRrz3EbcFQyhmYMz/Jq/VU5T5kUsd2bixHWiEx66n6408GaCfwqwH2E3Su5qv4JcuRhU7pcd677ymA7Xh97okKhulEeWl5BPM48B0loYmobzJtIr5VApGzxiZPFmdxjXRND9PKrQvcmH0Sxx1epu9pUJVCcB1bET5o4h9RSD4H/SzVsZlOoViwvJ76QPm3XOAT8JTMpDM7amQXZAERhfcLJIdo5RTZ54Or7jW1+ezuolr4hWz8aDYWV66Ahmk4wNZ+zhEzTEccJ7lUtmsTIhrme6l/Yz+8GuGRDsudZ7T77iIalcDUzdippogmRdVSmjL1RO+UGuqw5qGIJjiIwSBDCLToO mk4qbPgSWZcf+CoHXUJ+aPudc1mHK0p2KHqTghfMdt"}]}]},{"id":"B","label":"Role B","dept":"Integration & Social Cohesion Research","characters":[{"id":"solheim","name":"Dr. Amara Solheim","title":"Migration Sociologist","subject":"Placement Speed and Integration Outcomes","email":"This is the closest thing we have to a controlled comparison — thought it belonged in front of the Commission directly, not just in my report.\n\nFrom the paper:\n“Solmere has, unusually, run something close to a natural experiment on integration policy. The Bracken Valley pilot pre-matched arrivals to towns with housing, language instruction and an employer partner already arranged, and held people in a reception hub for an average of eleven weeks before placement. The Portside Intake dispersed people within days, often to whichever municipality had vacant housing that week, with language and orientation support arriving, if at all, months later. Two years after arrival, Bracken Valley placements showed markedly higher language proficiency, employment rates and residential stability than Portside placements at the same point, matched for age, origin and household size — the clearest evidence available that front-loaded, capacity-matched settlement outperforms speed. The complication is that eleven weeks is not free: people spend nearly three months in reception-hub limbo, unable to work, which Callahan's research suggests carries its own rights and wellbeing costs, and which only functions politically if the hub itself is well resourced — an under-funded hub produces the worst of both approaches, the wait of centralisation with none of its preparation benefits. The lesson is not simply 'centralise everything' but that the trade-off between speed and quality is real and must be resourced deliberately, not wished away by choosing one extreme or the other under time pressure.”","citation":"Solheim, A. (2026). Placement Speed and Integration Outcomes: Evidence from Two Resettlement Corridors. Journal of Migration and Settlement Studies, 15(4), 301–329.","offers":[{"id":"a","title":"Another voice, same position","text":"nVnNuohmfmeEYy2nZvlvIXGen8vUoOp2bgwJJ5zhkbN/sQdLEjVYUZl5u/EmoqdENAgtFdxCFRO5VVI3sdxw9C+/tVvaKGPQAKrE1KnntcF6hACb9SW9xBECFQguf7d/KJ+FUR0nZ9lwIt1v9SLmZ02oCCi/0M6ip+93RwnGNb1yRD+oSR4k+ius0qhEcwI6F3fAbra/DuKOgqMKE1F29zvIP/8tFmSk4t0dxYdg6RkQCM11Adu75yPiuwFMgpoPIpyLodcNirDmWtWI7Xkqm4w+YOPgER/p66VTVsuUqlA17d3JNiPKqNo/cxlY1YGaGAHWLK6Emls9EKAv9m7k0nWfs9B/TLlJ/JGGtx6szTIVhFmqoMqmiIa4/6OWtELlxTf8cgu9LkA76Q+1SBZuhdy+NdpB1G4rr2rmM9zwCpUtPjAo561+hkYsbSsLy7XMDdUjokapsiH+KAUVPV9ZUaf6Lh1djIrfrFwaaOW1gcfqUC0kMiN6yl7gHj/Q/9CnRQT6EPsWjOQFniGDIbM+4HjA4w77gwHXLn8vLjh6yaLvuws2/JWYtT/fJwA+6OwF48q++P1mocYiKhd13rBWrS3APEcCeeOiKruv0RMN7E9nTxONp0GDCAjIuBYFfiQmxGx3rhf5XxJsJYzPDawBVU5BiL53Zz946inEBgay3iKukhjTn8cWlAm7m5N3xwa7koN2tFdtUgoXAuqJqy05wOtsIPIMOqswf6QYIHBLW7GIeU+HV02bsVXd7SvLDt+M1FZDSRzgqYeaVgJWEUlXghpcX+ibJgfJlyRDk8oDCPbGcTmYl90XOBr91yqI/kOKICd2VFjWJn6LYUWy3bpYnRTVpQ=="},{"id":"b","title":"A competing angle","text":"ICmaYmum6kb1RjRZC5CBlUwlc9PqtkJr8Yla6RA9fMNDCtjUvzL13Va63OOF99IOgYslRVNuJv569ABz3rBniHWG4uHUb2HgFgQbWRTmXbTSDBltK8s5YfnViIz/HYC8CYeB/fi6NI4dN/yMaNrfbNQtzdCFz5u+iRns1QeE9UG59XffmsEERwqW4SZFuaJAi1EmbmP5ujdU2FZwwgU5RmSVwAAGJy94KGVgNwv9KprX8adR9Ltbc1u0c01jAYmB/hT+ayYHfSMIikQc/K1Wl6A8din4h1jyM8zM91Lj9i+wV/2RJy47S6OryD3e3Djl8LSI9YHv7arGR33wCJU82mRBkRpBjq0ZFLmzURMJluufA8hiFu2DTCRFviohfoXScT5uWXcGa0yryTitobEC4VYWtteIed4d1euaEPM2CUmRjbBJduRre6o9fDu/m4aR/hzjwP+/IgJQV/xU98tBHfnQEn5Lle2y4fxUjdbVPtrLYgbzBfldJ4fTMCkKbEr7H0zfBZ+2W24C2Pyrgwhjt3QciZ31Il6Il0lkwrNNmZPmtfN+JwJzhppMgEXmbJoLC21ZRgrz/ZB93lKlbG2k96bL8DveIt6+WdW8PJS1fA6waTwqTXUDFyeDEg9Rhlyo7CdpGH2apwgvYNYuCPOBRFV85qvmRc/KtJyy20QTsMVuhWOAGIHJXhEj2e1zlxsM6jre7Kn27dOfjAGD5b2EzvsCjoCyBOk1TuJSEc+GeTlh7fpeD4q9WFuSpZZaFTsdS8UGug/FG2foCivcVTEpzbRHgn58QCK4b5aIImuWymgJMije9Oc="},{"id":"c","title":"The underlying data","text":"mLgQyES5VJZeGbCz3fvef2hXyEO7YgZfKJssl+GZ0IVRhRV8ZYs4rKnio9XdFAG1322ESAdJQt6houa9RloiqPJPUfb2PeEN0 tact through work, schooling or organised local programmes predicts lower hostility more strongly than density does, in some districts reversing the relationship entirely. This sits awkwardly next to Reyburn's fiscal data, which shows real costs concentrated in exactly the towns nearest the sea route — those residents may be responding to something genuinely different from the rest of the country. None of this implies enforcement visibility is irrelevant to trust — it plainly matters to some residents — but it does suggest that the channel dominating the political conversation is, by the numbers, an unrepresentative sliver of the system being legislated for, and that a framework built to reassure the public about that one channel may leave the actual drivers of local backlash almost entirely unaddressed.”","citation":"Aasen, H. (2025). Concentration, Contact and Trust: What Actually Predicts Local Backlash. Nordic Journal of Social Cohesion, 9(1), 44–71.","offers":[{"id":"a","title":"Another voice, same position","text":"P3tzlj0nV1bmpoWnjY4B/JEZZ0AcL8za5kGcbYUQOuwtIPtp7trsSKo7tznN/QUJM698F8gW4XHmcDwOLOM0KJLTz4n1ZwiUKzv/LF/ELe3SviUC1kwA3px1YAgCrxwjQEXThvjHF3CpVTz4uQaeQpM3UGYm/mtZ6dH1ScFh1ld0aZxoMzzVUpQI8bB3tNYCUbAxsVmrEDo5rPaDnmt2ksmNGxGT0fxJ0Lcyv3qX+iGo5A4d7wzST4wJ4KSuuVh4dC16sl/+sv9zPOJolzSZ8n7wUxDo2qKqghbplULWD1YtA7oy5OXXH9B7dkq7q9QVN+amnOq4GHghoPG2vUF+YPpOeIwqe7EssCl1LivK9e4QkKez4toTx3MfoU6ePcGF7qFGA4OcIkIqMzTD+JPIVMuR1bbputbPo5xfdcdPe97x220I+sw3nnlnCItlgIntiT+J1MfN1yanJft62MbyYs2TLeGpLs9q4N0QkLCyp+8H4PIv6uBGtQDyCv1us9lCiv0SShuwAiipuwybacVkNRUQhRip0k2l4l6PM6Gzgq3vZINZ9gT4uOUNgUnxFrXoW89VfsyTB7Be3UG+FVId6IjwBvuJShM4I85U2CF03V/bB/y51bdWSOkO6XjZ0QZGyRrME8hBR6gVZIIchwopIb1a/biXMyEUTyTwUAV6DiQqFzuyUoThu5kd3lTghn2y/3CMmua3SfnFsSG2hiefkUcEIL5MX4R5yVMIPRV9tJS8QM3J/B8oHwBkag8L4I3gp1ygXr0EkOXD+wQ1sskwaqSLkCb7U+9XOx6W+0Y3as1i5StGLb6DDOcn9lp2iPbhhq3lNaR87E47k/Di4yLSzwE="},{"id":"b","title":"A competing angle","text":"i5c63R7te7WicPllnFt2zoyPsM6YFrIqtOhwnbphLRpNvxjEeysBsCH/6j ions — and the data says we probably should have first.\n\nFrom the paper:\n“School enrolment data functions, in Solmere's two natural experiments, as an early-warning system that outpaces every other capacity indicator. Portside schools received no advance notice of an intake spike; several primary schools saw enrolment rise more than thirty percent within a single term, well before housing or clinic strain became publicly visible, and outcomes suffered on both sides — newly arrived children lacking language support, and existing pupils in classes that had, in some cases, doubled without additional staffing. Bracken Valley schools, notified months in advance as part of the pilot's placement planning, hired additional language staff before the first families arrived and showed no comparable dip in outcomes for either group, a pattern suggesting that front-loaded preparation outperforms reactive dispersal in schools at least as clearly as in any other service. The policy implication is not that migrant children should be limited in number — the data offers no support for that reading — but that school-capacity data is available faster than most other indicators and could function as an automatic early trigger within any capacity-indexed admissions system, flagging local strain months before it becomes a housing or a headline crisis, provided the trigger is tied to funding a response rather than merely to slowing arrivals in the town concerned.”","citation":"Chandrasekaran, P. (2024). School Capacity as a Leading Indicator of Reception Strain. Comparative Education Review, 27(2), 133–158.","offers":[{"id":"a","title":"Another voice, same position","text":"c1jw6RLVDBLPx/KNXI/SY5L6ohNtYb6njhf3DmfzzhdPPaPSB7DfpLihz88IKuuMa8w16bSxukDkTtEM9uydbS+kWuP1OV1Vx9FgnraNPFeeXwfFY2dmxfkpug0uqTwvIYrd7O+Ea2Nt3ka2DEKREyUg7fkMhELQQpGJeSaOlTrWJdrFXb5p9epPEy58RQNPujazQar44o5EE1qx1CoSgksQ1jlTeAoYikQd6ULvmkg0lWPAtomW1GZkEdhyhIbT/BqAuqFUSkS0TKqCN1ZxpGbVFHiXsWY6hJz1JoCLBj+XIDeA68d5lDaxhjg4I9 provisional for as long as their family's status does. The reflex response, adding staff to clear the backlog quickly, carries its own risk: a comparable jurisdiction that tripled caseworker numbers within a single year saw its appeal-overturn rate more than double, evidence that speed without proportionate review capacity simply moves the injustice from delay to error. Timeliness and rigour are not substitutes for one another; a Commission recommendation that treats 'faster' as self-evidently 'better' has misunderstood what a timely decision actually requires.”","citation":"Callahan, I. (2026). The Right to a Timely Decision: Procedural Justice in Mass Asylum Systems. Journal of Refugee and Migration Law, 41(2), 118–142.","offers":[{"id":"a","title":"Another voice, same position","text":"YajHwHaonCr6UuvXWO72CgAoI77/GOMnMplV660YB0QMkjvtxZgm3Twg6Ss2GLKuLOVjxHqSLVyvAugHOXvqS/J7yX+Iw3lZuy43aVZXtZcZRj2rEWTklQT5lqokeRYxXqTDReTH+hyXEooXqr1cIEAUwDa36b9U6WtZcka5QKcDO6MJgkzid6z5MPCsTxyrClNDHhzIG0uq78ss5IndI1V3ChEJU+uU4ZvyK/o5AZhPY6LLLvyCRpvf51/KlzP6QoQEXLPBjosDhdfp9NYxBlH3/1cvBNKogu67DQJeRNQ5sGTFYbNfLpaMDqXLHXThVAukboLqevo3I88t3/LPq7zLPaVjLuylkUoiu62s1FX55v5+4F3DYnIRU+ZU4vstMSJZFN1odpUqfXrCo0K/3xo7HFv1OgDGSE1d5eiFkjHPo+mFPh3Fi8QJIG4dXvusNuJafPRsz/lHWYMK6REHeWqPdaEJk7YO60SffUiZcYo8Vh7UV3ul3XKLhS2Wy44iqMAksEE/+JLpa3QNuNcbU6fvvexiiCRYTtlIGgGpW3gHb8rduSoHoycVUeoOr/7S7z9Z8U0Z1Wfpf7neIRJ3ddC6oITsLySDEV5BmijO5ZRu8Iu6aUAoddnH3RBpVKyaEZwDRTVhJZ9By/B3tPmwfFeHThvsOCXhfJyVYRTShplvNLnBSvDWW3T3ibDWJcAsNS7dcm31l2URu3Y8lqPRVM5nF1nDiBV83fKINUh6PvDaixL7UDKXe86NY+FwKXPNx9DqGECHA+P7PNZHHqYNt5X7H+doVhN+uPwUG5WDEopTLvAYvhHCMr98RYUK8C3J5vi4nBvhsV0AODtglf6goER6MEAn+6H9864iI/lbk2GYSx5wLVjNcezqORQEjnqDzq+kC6amd+rxt8pQsP4veWCxbYoorQWl+hzees7XVz66j1Ug9pLjcEY3ofxrp/p149d3FBw="},{"id":"b","title":"A competing angle","text":"dPlizciFMJzoJ/L7soBmUPJLHnF16EMEXRBn8v24ZJ33p0/7F16iXnD+WcHwNV6uOTPLmViHRyjl0T6ZjJYh4d2e3nmKVKSpY6Whdnp81qeGsHU4zIYtl8Zetd5faLm2DQIdTQ4El6JLFluWo13O+NWgaHhX6cEsVITc7brPVmjHkLMG+LLdu9k st direct lever available for restoring public trust in the system, and it is easy to see why: it looks like enforcement, and enforcement looks like control being reasserted. Cross-national evidence on deterrence, however, complicates this considerably. A review of eleven comparable reception systems finds only a weak and inconsistent relationship between removal capacity and subsequent arrival numbers — people fleeing genuine danger are, unsurprisingly, not strongly responsive to the odds of eventual removal, since the alternative they are weighing it against is rarely attractive. What the same review finds a much stronger relationship with is public perception: removal announcements and visible enforcement operations reliably shift trust and approval measures in the short term, largely independent of whether they measurably change arrival behaviour at all. This lines up closely with Aasen's finding that trust tracks visible process rather than underlying numbers — removal capacity appears to be a genuinely effective lever for the perception problem and a weak one for the volume problem it is usually sold as addressing. None of this argues against removal of claims that fail proper review; it argues against treating expanded removal capacity as the primary tool for a numbers problem it does not, on the evidence, actually solve.”","citation":"Benslimane, Y. (2025). What Deterrence Research Actually Shows: Removal Capacity and Arrival Behaviour. International Journal of Migration Law, 33(1), 55–79.","offers":[{"id":"a","title":"Another voice, same position","text":"Yv1HDx+OS5y7YdOggjzXt3OKEBeba9pdtMx2n98HOL5DcbuHFtk0E7FMPjCAhUMnQPtPpOeW5KK0WCDLnaB+lQg+eE4CADdJ5acB7rEHk+5niR3KRncnRkz4LMimcm2ysBpro0c+YPUvO6JsW+qsnuxOQQMaeRR4xkfnWyk0YSbSY+Zhr9Hx83rz62cntL2LT1QZimOUr6cMhCFZKfLNWOUepXUHb4LFjZ/DPX9R7XU2PMldZ9656aAuV667ZamDE6nGC3gr1mouxluGRYg06cI1/xCFnu0zuj0bRF7appx4xSYK6Hn6/GdAxKoK9Seza94cSF1Jajh21vjfltp62Lkkfo9Cz5ZzX5VYbvL8liYS4fJYGngHfwOdpqycyEAYCdiXhLcPtpKoV06VXbcQ38QV+ wCzKcA/ZnAtmmB9NWe3T/vktowJ3trNopU0Rgsg9i/WrdjLLkkcsKTvwnbkEjLK2OctYoTgsFXSYGpqkeEQfnRtv3kmoYlv99CLBZ+dRoR4cfHuxqQtp2SY4e4kg6UF00JkAJB10ehXCjwsUasGO4fbWMruGmBiddj3IpdmtsTiSF1kCxIoOg7YCi9JXhBvDQb2p7RZgAQba8v47rHUUeddixCWPoljp5XWPSO8vs00vIp71poYMKXVpsCHJjNMrdjjP7qfM4nrgJMvRFtswMVlXFyuhZr+6Lry9WBwHTvGBr5XvMwCB0Rr72RqPAUrNSXPPgEtZ3hzwzSzu/QJXlAs44NjaQLwCy2J3auWRsa2ZGtBKld4H5CVhiOOGbQK+D3MvEJfwOSD"}]},{"id":"thorne","name":"Judge (ret.) Marcus Thorne","title":"Administrative Law Scholar","subject":"Proportionality and the Municipal Burden","email":"Passing this along because the ruling gets misquoted constantly — this is what it actually said, and what it didn't.\n\nFrom the paper:\n“The port municipalities' challenge to the national government, brought eighteen months after the Portside Intake, did not ask the courts to authorise local caps on arrivals, and the ruling did not grant any — a distinction lost in much of the political commentary that followed. What the municipalities argued, and what the court accepted, was narrower and more consequential: that national migration policy imposing substantial, foreseeable costs on specific local governments without a matching funding mechanism fails a basic proportionality test, whatever its merits as national policy. The ruling requires the national government to fund the actual cost its policy creates at the local level — it does not require, and explicitly does not permit, municipalities to refuse or ration arrivals themselves. This nuance matters for the Commission's recommendations: a capacity-indexed system without a resourced funding mechanism behind it would likely fail the same proportionality standard the moment arrival numbers rise, regardless of how sound the underlying admissions logic is, while a system that funds municipalities adequately in advance would satisfy it even without any change to how many people are admitted. Reyburn's fiscal-distribution data gives the court's reasoning empirical teeth: proportionality is not an abstract legal principle in Solmere's case, it maps almost exactly onto the nearly six-hundred-euro per-resident gap documented in Reyburn's fiscal data.”","citation":"Thorne, M. (2026). Proportionality and the Municipal Burden: Unfunded Mandates in Reception Policy. Solmere Law Review, 61(4), 512–540.","offers":[{"id":"a","title":"Another voice, same position","text":"HskkFFQF6q9Owljr/cFGhcidsjGcFtOf+To+M3USPRAmyRFA99JjrqmwIfLslLlonjBRkY0ti1XmGDrN53chyx09coDnujXes09PfaVtheYNLBkAoN/R+IqWp5lBNCKfOMfg6AsYuajcniJESbfuKg9IIVgSgblYE9I9o4LhRxkKVn4AO4Fxg4ENUf+9aZo41bD1g3IGHfK5KwseFslt6lhHRah5GYzOwA/9fz1S853d0+k5vbJz4UDkcyvXFojSjKojQOghSIF0tnr0e8WTISSTjtmwsVoTDiahv/wrrKU3f7rzs5tHKrkSocQF0nndf7yjUE7t5SBpCAG8ZqAnbErJF4dPq6cC+FiglbUfwaQLTl85vzu6zJS5HDv3pWoLW6OAYMFBgQPjrMXf9X6bNYwBHYU4n9xctq+ZlEJnNAzoDePxk97RwVloPwKnuU8VqJEF+FR9aRi0wdrJ6eGG0SmSD2Swn05hEjyiyK6UKez9ktEv5T8wj9op+kcSsSfiHzneJiVqKiRDV9Br3IWpHoT2a5JWtiZ2TFIvgXaOn1lSDYjuFTO8GjfpFPTIvDGyW3n3vPkBaZNlPDL5H88XeitJwSMFbXUiuEmV0F8/I7rLOHbhQ9CIlWojilbeMOfq3yZVsIKLX4PppQsMpCPWCZ+exnokhE5uIMjsqKwsjYgpaHVmIFrJwbNuSgm4DPhqKGsl7lhUYug9ZXr8OPcbcYty1yJEnAwMptz8MQ5ymdcyEd5At3ormFglj9yLcWvfamZxZpmmnJBmul85DbOqTr15bZJAnkcwW39NUYrbyRjHE6QIapUvxcoElkwfM9KyO9mZa/+AtITBrT4="},{"id":"b","title":"A competing angle","text":"HMXExwBQSl1T9gMO1kskYyKvsj0b6QzrxLgvCNKvMRUklVZai8KFJKNAEyulDDuES7hF6ipjXnE66KouWozNDX2znS2aPLQ7zTMsvLkysVyzxbmsm12IssUdtai4A6z1YmvqlVVm1WRZkIT5ZpuOKXyk+XBrFhOEgwYei5J8P5L7Xjc9/GxQJu9u4/4aq9idY/Hy/q8eVpJ5aTMY1PtkN7W3FTkJxPQmAO83UQuj5jA87djGjyuyCCJsDVOoizbZR9c9/D60EqCNCW/wPQri3u0Kgyh/64Zn8pylTl/JPV5h7MH8tvzwwFXoDkb84bNXd0wJxiQy0+mFShEANsmOEWw5YDZ0eVRkS4Q6DLoap7Ez/vTuCBMBW3pGVQmmEl0iJsFiGEgtTPbFVhdKmevcAJaXnddBLfwwI6V70qbljJ00Sa854zvBo2/CKAg/UqVb44fuwJBlHIQ3hU+co3ianK/TJonRvqD0WArFqSrGRY0aDuNSvcvwOYMx+gwkx0XLOWEWBPdWL0aA7y7txuicmLLK3h7waXK55WMRoAZEkwtAczCqo+NHSPq1AAJHwg34toVuruk7BDkFQ7t793Wap/VBgzeIQeESM77isRPWmZbQ7ZPynchh7zh3s5KymH9pB9g9LOYSnVLeMkkcFudKSXwz10y6tN589mQ8RckHRwQO5Cd+b9LqXlcgr4uPHJdwU++YCfHzzft city of the process, more than the measured strain itself.","short":{"A":"Measurable service strain","B":"Perceived loss of control"}},{"id":"F1","title":"How should the Commission recommend setting the pace of admissions?","A":"A fixed annual cap, set below current arrival trends, giving services a predictable ceiling to plan around.","B":"A capacity-indexed system with no fixed ceiling — admissions scale to verified housing and processing capacity, reviewed quarterly.","short":{"A":"Fixed annual cap","B":"Capacity-indexed admissions"}},{"id":"F2","title":"How should integration support be delivered?","A":"Centralised: regional reception hubs provide language training, orientation and job-matching before anyone is dispersed to a placement.","B":"Localised: disperse quickly to municipalities and fund integration support locally after people arrive, keeping processing times short.","short":{"A":"Centralised reception hubs","B":"Fast local dispersal"}},{"id":"F3","title":"Where should additional enforcement resources be directed?","A":"Towards faster, better-resourced asylum-claim verification, to restore public confidence through quicker decisions.","B":"Towards expanded removal capacity for rejected claims, to restore public confidence through visible enforcement.","short":{"A":"Faster claim verification","B":"Expanded removal capacity"}}],"writing":{"type":"policy_brief","label":"policy brief","addressee":"Commissioner Marguerite Voss, Chair of the Solmere National Migration and Reception Commission","words":420,"instructions":["State a clear position on each decision — not just what you chose, but why","Cite specific sources in Harvard style (Author, Year) every time you use a claim, e.g. (Solheim, 2026) — including anything a teammate told you. The full reference is under each paper in the Inbox","Acknowledge the strongest objection to your recommendations and answer it directly (your 'However…' notes are a good start)","Write for a mixed audience: some readers wanted a different outcome — bring them along, don't just announce a verdict"]},"two_player":{"roles":[{"id":"P1","label":"Player 1","dept":"","characters":["kowalik","marchetti","callahan","benslimane","thorne"]},{"id":"P2","label":"Player 2","dept":"","characters":["reyburn","solheim","aasen","chandrasekaran"]}]},"retired":"Replaced by exodus (The Southern Crossing) as AE week 3 on 13 Oct 2026","teacher_url":"https://teacher.lite.simlearn.online/","salt":"b3b744b2"}</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};
  if (str(s.mode)) out.mode = s.mode;
  if (str(s.role)) out.role = s.role;
  if (str(s.hlGroup)) out.hlGroup = s.hlGroup;
  if (typeof s.nbClosed === "boolean") out.nbClosed = s.nbClosed;
  out.choices = map(s.choices, str);
  out.firstLook = map(s.firstLook, str);
  out.mcq = map(s.mcq, str);
  out.decisions = map(s.decisions, v => v === "A" || v === "B");
  out.hl = map(s.hl, v => str(v) && Object.prototype.hasOwnProperty.call(HLC, v));
  out.hlLabels = map(s.hlLabels, (v, k) => str(v) && Object.prototype.hasOwnProperty.call(HLC, k));
  out.nbf = map(s.nbf, str);
  out.opened = map(s.opened, str);
  out.drawOpen = map(s.drawOpen, v => typeof v === "boolean");
  out.budget = map(s.budget, v => typeof v === "number" || (str(v) && /^\d{0,7}$/.test(v)));
  out.tags = map(s.tags, v => v && typeof v === "object" && !Array.isArray(v) && str(v.p || "") && Array.isArray(v.d) && v.d.every(str));
  Object.values(out.tags).forEach(t => { t.p = t.p || ""; });
  return out;
}
function handoverWhen(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-GB", {weekday: "short", hour: "2-digit", minute: "2-digit"});
}
function handoverBox(first){
  return `<div class="handin${first ? " first" : ""}"><b>${first ? "Open a teammate's hand-over" : "Taking over from a teammate who had to leave?"}</b>
    <p class="small">Open the hand-over file they sent you. ${first ? "This tab will show their work; your own stays in your other tab." : "Do this in a new tab, so your own work stays where it is."}</p>

function wireHandoverBox(){
  const pick = $("#hoPick"), file = $("#hoFile");
  if (!pick) return;
  pick.onclick = () => file.click();
  file.onchange = () => {
    const fl = file.files && file.files[0];
    if (!fl) return;
    if (fl.size > HANDOVER_MAX) { $("#hoMsg").textContent = "This file is far too big to be a SimLearn hand-over."; return; }
    const rd = new FileReader();
    rd.onload = () => { const msg = openHandover(String(rd.result || "")); if (msg) $("#hoMsg").textContent = msg; };
    rd.onerror = () => { $("#hoMsg").textContent = "That file couldn't be opened. Try again, or ask for it again."; };
    rd.readAsText(fl);
  };
}

const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }
const CHAR = Object.fromEntries(S.roles.flatMap(r => r.characters.map(c => [c.id, c])));
const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;
const role = () => roles().find(r => r.id === st.role);
const pair = () => st.mode === "2";
const num = n => ["zero","one","two","three","four","five","six"][n] || String(n);
const roleName = r => r.dept ? `${r.label} — ${r.dept}` : r.label;
function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}

/* ---------- budget cartridges: allocate a fixed fund across line items instead of A/B decisions ---------- */
const B = S.budget || null;
const money = n => (B ? B.currency || "£" : "£") + Math.round(n).toLocaleString("en-GB");

// Lives only in this tab (sessionStorage, as the rest of the state). Never part of the submission block.
const HL = [["yellow","Yellow","#FFF176"],["green","Green","#B9F6CA"],["pink","Pink","#F8BBD0"],
            ["blue","Blue","#B3E5FC"],["orange","Orange","#FFE0B2"],["purple","Purple","#E1BEE7"]];
const HLC = Object.fromEntries(HL.map(([k,,c]) => [k, c]));
const HL_HINT = S.format === "ae2" ? ["Supports A","Supports B","Weak spot","Key number","Question","Use in my writing"]
             : ({AE:["Position","Evidence","Reasoning","Counter-argument","Weak spot","Use in my brief"],
                  EFD:["Constraint","User need","Idea","Risk","Question","Use in my pitch"]})[S.course]
                || ["Number","Risk","Opportunity","Deadline","Question","Use in my memo"];

const TAG_PARTS = ["Position","Reasoning","Data","Counter","Concession","Example","Conclusion"];
const decNo = id => S.decisions.findIndex(d => d.id === id) + 1;
// what the sim itself calls a decision: "Decision 2" from "Decision 2 — …", "P1" from "P1 — …", else "Decision n"
const decLabel = id => { const d = S.decisions.find(x => x.id === id); const m = d && d.title.match(/^([^—]{1,20}?)\s*—/); return m ? m[1].trim() : "Decision " + decNo(id); };
const tagsOf = k => (st.tags || {})[k] || {p:"", d:[]};

const hlName = k => { const i = HL.findIndex(x => x[0] === k); return i < 0 ? k : HL[i][1]; };
const hlLabel = k => ((st.hlLabels || {})[k] || "").trim();
const ABBR = new Set("e.g i.e dr prof mr mrs ms st etc vs cf approx no nos fig figs p pp jr sr inc ltd co corp dept est al ca vol vols ed eds op mt ft gen col lt sgt rev govt univ assn bros nr tel ref".split(" "));
const OPEN_Q = "\u201C\u2018\"", CLOSE_Q = "\u201D\u2019\"'", OPEN_B = "([", CLOSE_B = ")]";
// Split text into sentences: returns [{s, gap}] where gap is the whitespace before the sentence (text = all joined).
function splitSentences(text){
  const out = [], n = text.length;
  let start = 0, i = 0, quoteEnd = -1, depth = 0;
  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };
  while (i < n) {
    const ch = text[i];
    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }
    else if (CLOSE_B.includes(ch) && depth > 0) depth--;
    if (i > quoteEnd && (ch === "\u201C" || (ch === '"' && (i === 0 || /[\s(\[]/.test(text[i-1]))))) {
      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";
        const initial = /^[a-z]$/i.test(word) && !/['\u2019\w]/.test(pre);   // "Oduya, B." but not "don't."
        const isAbbr = ch === "." && (ABBR.has(word) || initial || /^([a-z]\.)+[a-z]$/i.test(word));
        if (!isAbbr && (next === "\n" || /[A-Z0-9\u00C0-\u024F\u201C\u2018"(\[\u2014\u2013\u20AC\u00A3$-]/.test(next))) { push(j); let m = j; while (m < n && /[ \t]/.test(text[m])) m++; push(m); i = m; continue; }
      }
      i = j; continue;
    }
    i++;
  }
  push(n);
  return out;
}
const isSentence = s => words(s) >= 3 && (/[.!?\u201D"')\]]\s*$/.test(s.trim()) || words(s) >= 5);
// Sentence registry for everything this student can highlight: context + own contacts' emails + the opened option.
function hlSources(){
  const parts = [], c = S.context;
  c.text.split("\n\n").forEach((p, i) => parts.push({cid:"ctx", part:"p" + i, text:p, src:{name:"Context"}}));
  if (c.scar) parts.push({cid:"ctx", part:"scar", text:c.scar.text, src:{name:c.scar.label}});
  if (c.proof) parts.push({cid:"ctx", part:"proof", text:c.proof.text, src:{name:c.proof.label}});
  if (c.constraint) parts.push({cid:"ctx", part:"clock", text:c.constraint, src:{name:"The clock"}});
  if (EXAM && EX.article) EX.article.text.split("\n\n").forEach((p, i) => parts.push({cid:"art", part:"p" + i, text:p, src:{name:EX.article.title}}));
  const r = st.role && role();
  (r ? r.characters : []).forEach(ch => {
    const src = {name:ch.name, title:ch.title, citation:ch.citation, cid:ch.id};
    parts.push({cid:ch.id, part:"email", text:ch.email, src});
    if (AE2) {   // every drawer can be opened, so every drawer can hold highlights
      ch.offers.forEach(o => parts.push({cid:ch.id, part:"d" + o.id, text:unscramble(o.text, `${S.salt}|${ch.id}|${o.id}`),
                                         src:{name:o.author, citation:o.citation, cid:ch.id, option:o.title}}));
      return;
    }
    const o = st.choices[ch.id] && ch.offers.find(x => x.id === st.choices[ch.id]);
    if (o) parts.push({cid:ch.id, part:"opt", text:unscramble(o.text, `${S.salt}|${ch.id}|${o.id}`), src:{...src, option:o.title}});
  });
  return parts;
}
function hlKey(cid, part, idx, s){ return `${cid}|${part}|${idx}|${fnv(s.trim()).toString(36)}`; }
function hlRegistry(){
  const reg = {}; let order = 0;
  hlSources().forEach(p => {
    let idx = 0;
    splitSentences(p.text).forEach(s => { if (isSentence(s)) { reg[hlKey(p.cid, p.part, idx, s)] = {t:s.trim(), src:p.src, cid:p.cid, n:order++}; idx++; } });
  });
  return reg;
}
// Text -> HTML with each sentence wrapped in a tappable span (the text itself is unchanged).
function hlHTML(text, cid, part){
  let idx = 0;
  return splitSentences(text).map(s => {
    if (!isSentence(s)) return esc(s);
    const k = hlKey(cid, part, idx++, s), col = (st.hl || {})[k];
    const on = col && HLC[col];
    return `<span class="hs${on ? " on" : ""}" role="button" tabindex="0" data-k="${esc(k)}"${on ? ` style="background:${HLC[col]}" aria-describedby="hld-${col}"` : ""}>${esc(s)}</span>`;
  }).join("");
}

function paletteEl(){
  let p = document.getElementById("hlpal");
  if (!p) { p = document.createElement("div"); p.id = "hlpal"; p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "Highlight this sentence"); p.hidden = true; document.body.appendChild(p); }

let hlOpenFor = null, hlPressing = false;
document.addEventListener("pointerup", () => setTimeout(() => { hlPressing = false; }, 0), true);
function openPalette(span){
  const p = paletteEl(), k = span.dataset.k, cur = (st.hl || {})[k];
  if (hlOpenFor) hlOpenFor.classList.remove("sel");
  hlOpenFor = span; span.classList.add("sel");
  const t = tagsOf(k);
  p.innerHTML = HL.map(([key, name, c]) => `<button type="button" class="sw" data-col="${key}" aria-pressed="${cur===key}" aria-label="${esc(name + (hlLabel(key) ? ": " + hlLabel(key) : ""))}"><i style="background:${c}"></i>${esc(hlLabel(key) || name)}</button>`).join("")
    + (cur ? `<button type="button" class="rm" data-col="">Remove</button>` : "")
    + `<button type="button" class="x" aria-label="Close">×</button>`
    + (AE2 ? `<div class="lbl">Part of the argument</div><div class="row">${TAG_PARTS.map(x => `<button type="button" class="tg" data-part="${x}" aria-pressed="${t.p === x}">${x}</button>`).join("")}</div>` : "")
    + (TAGS ? `<div class="lbl">Matters for</div><div class="row">${S.decisions.map(d => `<button type="button" class="tg" data-dec="${d.id}" aria-pressed="${t.d.includes(d.id)}" title="${esc(d.title)}">${esc(decLabel(d.id))}</button>`).join("")}
        <button type="button" class="done">Done</button></div>` : "");
  p.hidden = false;
  if (!matchMedia("(max-width:600px)").matches) {
    const r = span.getBoundingClientRect(), w = p.offsetWidth;
    p.style.top = (window.scrollY + r.bottom + 6) + "px";
    p.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - w - 8)) + "px";
  } else { p.style.left = ""; p.style.top = ""; }
  (p.querySelector('.sw[aria-pressed="true"]') || p.querySelector(".sw")).focus();
  // Safari (macOS and iOS) doesn't focus a button when it is clicked: focus leaves the palette on mousedown, before
  // the click arrives. So a press inside the palette keeps focus where it is, and focusout ignores it.
  p.onpointerdown = () => { hlPressing = true; };
  p.onmousedown = e => { hlPressing = true; if (e.target.closest("button")) e.preventDefault(); };
  p.onfocusout = e => { if (hlPressing) return; if (!e.relatedTarget || !p.contains(e.relatedTarget)) setTimeout(() => { if (!hlPressing && !p.contains(document.activeElement)) closePalette(false); }, 0); };
  p.onclick = e => {
    hlPressing = false;
    const b = e.target.closest("button"); if (!b) return;
    if (b.classList.contains("x") || b.classList.contains("done")) return closePalette(true);
    if (TAGS && !b.classList.contains("rm")) {   // colour and tags: the palette stays open until Done
      const sel = b.dataset.part ? `[data-part="${b.dataset.part}"]` : b.dataset.dec ? `[data-dec="${b.dataset.dec}"]` : `[data-col="${b.dataset.col}"]`;
      if (b.dataset.col) setHighlight(k, b.dataset.col);
      else { toggleTag(k, b.dataset.part, b.dataset.dec); if (!(st.hl || {})[k]) setHighlight(k, "yellow"); else refreshNotebook(); }
      const span = hlOpenFor; if (!span) return;
      openPalette(span); const again = p.querySelector(sel); if (again) again.focus();
      return;
    }
    setHighlight(k, b.dataset.col || null); closePalette(true);

// Harvard in-text citation from a reference: one author (Smith, 2024), two (Smith and Jones, 2024),

function citeOf(citation){
  const y = (citation || "").match(/\((\d{4}[a-z]?)\)/);
  if (!y) return "";
  const who = citation.slice(0, y.index).trim().replace(/,$/, "");
  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;
}

const initials = t => t.trim().split(/\s+/).map(w => w.charAt(0)).join("").toUpperCase();   // "Not given" -> "NG": no need to show the key
function qOptsHTML(it, opts){
  const v = (st.ans || {})[it.id] || "", ent = Object.entries(opts);
  const long = ent.length > 6;   // a long list (e.g. seven headings): a drop-down; otherwise every option stays visible
  if (long) return `<select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">Choose…</option>${ent.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}. ${esc(t)}</option>`).join("")}</select>`;
  const short = ent.every(([, t]) => t.length <= 12);   // in a row only for True / False / Not given and the like
  return `<div class="${short ? "row" : ""}">${ent.map(([k, t]) => `<label><input type="radio" name="q_${esc(it.id)}" data-q="${esc(it.id)}" value="${esc(k)}" ${v === k ? "checked" : ""}><span>${initials(t) === k.toUpperCase() ? "" : `<b>${esc(k)}</b> `}${esc(t)}</span></label>`).join("")}</div>`;

function qPartHTML(p){
  const num = it => QN[it.id];

  if (p.type === "gap") {
    const opts = Object.entries(p.options);
    const sel = id => { const v = (st.ans || {})[id] || ""; return `<select data-q="${esc(id)}" aria-label="Question ${QN[id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`; };
    const ids = Object.fromEntries(p.items.map(it => [it.id.split(".").pop(), it.id]));   // [[2]] in the text = item R4.2
    body = `<div class="prose gaptext">${p.text.split("\n\n").map(par => `<p>${esc(par).replace(/\[\[(\d+)\]\]/g, (m, n) => ids[n] ? `<b>(${QN[ids[n]]})</b> ${sel(ids[n])}` : m)}</p>`).join("")}</div>
      <ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`;
  } else if (p.type === "shared" && Object.keys(p.options).length > 6) {   // e.g. headings: the list once, a letter per item
    const opts = Object.entries(p.options);
    body = `<ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>` + p.items.map(it => {
      const v = (st.ans || {})[it.id] || "";

    }).join("");
  } else {
    body = p.items.map(it => `<div class="qitem"><span class="qq"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
      ${p.type === "short" ? `<input type="text" data-q="${esc(it.id)}" maxlength="80" autocomplete="off" spellcheck="false" value="${esc((st.ans || {})[it.id] || "")}" aria-label="Answer to question ${QN[it.id]}">`

  return `<section class="qpart" id="qp_${esc(p.id)}"><h3>${esc(p.title)}</h3>${p.instructions ? `<p class="inst">${esc(p.instructions)}</p>` : ""}${body}</section>`;

  $("#nbpanel").ontoggle = e => { st.nbClosed = !e.target.open; save(); };
  const rb = $("#rubric"); if (rb) rb.ontoggle = () => { st.rubricOpen = rb.open; save(); };
  $("#consent").onchange = e => { st.consent = e.target.checked; save(); $("#out").innerHTML = ""; };
  $("#make").onclick = makeSubmission;
}

function makeSubmission(){
  const r = role(), W = S.writing;
  const missing = [];
  const openChars = AE2 || EXAM ? [] : r.characters.filter(c => !st.choices[c.id]);
  if (EXAM) {   // unanswered questions: a reminder, not a stop
    const left = ["reading", "listening"].map(sec => [sec, qItems(sec).filter(it => !answered(it)).length]).filter(([, n]) => n);
    if (left.length) missing.push("Not answered yet: " + left.map(([sec, n]) => `${n} ${sec} question${n > 1 ? "s" : ""}`).join(" and ") + ". You can still hand in, but unanswered questions get no marks.");
  }
  if (openChars.length) missing.push(`You haven't chosen what to ask ${openChars.map(c => c.name).join(", ")} yet (Inbox).`);
  const openDec = B ? (budgetOK() ? [] : ["budget"]) : S.decisions.filter(d => !st.decisions[d.id]);
  if (openDec.length) missing.push(B ? `Your group's budget isn't within ${money(B.tolerance)} of ${money(B.target)} yet (Budget).`
                                      : `${EXAM ? "Your" : "Your group's"} answer is missing for ${openDec.map(d => d.title.split(" — ")[0]).join(", ")} (Decisions).`);
  if (words(st.memo) < 50) missing.push("Your text is very short — write your " + W.label + " first.");
  $("#issues").innerHTML = missing.map(m => `<p>${esc(m)}</p>`).join("");
  if (openDec.length || words(st.memo) < 50) { $("#out").innerHTML = ""; return; }

  const ai = st.consent ? "yes" : "no";
  const choices = r.characters.map(c => `${c.id}=${(AE2 ? (st.opened || {})[c.id] : st.choices[c.id]) || "-"}`).join(", ");   // ae2: the drawers opened, e.g. "ac"
  const decisions = B ? B.items.map(it => `${it.id}=${budgetVal(it.id)}`).join(", ")
                      : S.decisions.map(d => `${d.id}=${st.decisions[d.id]}`).join(", ");
  const memoText = st.memo.trim();
  // exam: every choice item in order ("-" = no answer), and the typed answers as one line of JSON
  const answers = EXAM ? [...qItems("reading"), ...qItems("listening")].filter(it => it.part.type !== "short")
                           .map(it => `${it.id}=${String((st.ans || {})[it.id] || "-").replace(/[^A-Za-z0-9]/g, "") || "-"}`).join(", ") : "";
  const shorts = EXAM ? JSON.stringify(Object.fromEntries([...qItems("reading"), ...qItems("listening")].filter(it => it.part.type === "short" && answered(it))
                           .map(it => [it.id, String(st.ans[it.id]).replace(/\s+/g, " ").trim().slice(0, 80)]))) : "";
  const parts = [S.id, S.version, r.id, choices, decisions, ai, ai === "yes" ? norm(memoText) : ""];
  const code = checkCode(EXAM ? [...parts, answers, shorts] : parts);
  const head = [
    "=== SIMLEARN SUBMISSION ===",
    ai === "yes" ? "AI check: ALLOWED" : "AI check: NOT ALLOWED - grade by hand",
    `Scenario: ${S.id} v${S.version} (${S.title})`,
    `Role: ${r.id} (${EXAM ? "exam" : r.dept || "two-player"})`,
    `Info choices: ${choices}`,
    `Group decisions: ${decisions}`,
    ...(EXAM ? [`Answers: ${answers}`, `Short answers: ${shorts}`] : []),
    `Check: ${code}`,
  ];
  let block;
  if (ai === "yes") {
    block = [...head, `--- ${W.label} to ${W.addressee} (${words(memoText)} words) ---`, memoText, "=== END ==="].join("\n");
  } else {
    block = [...head, "=== END ===", "", `My ${W.label} to ${W.addressee} (${words(memoText)} words):`, "", memoText].join("\n");
  }
  $("#out").innerHTML = `
    <h2>Your submission</h2>
    <p>Hand it in the way your <b>Moodle assignment</b> asks for:</p>
    <p><b>A file upload?</b> Download your PDF and upload it to the assignment.</p>
    <p><button type="button" class="btn" id="pdf">Download my submission (PDF)</button> <span id="pdfmsg" class="ok" aria-live="polite"></span></p>
    <p><b>A text box?</b> Copy everything in the box below and paste it in. ${ai==="yes" ? "" : "Your text sits below the SimLearn part, so your teacher can mark it by hand."}</p>
    <textarea class="block" id="block" readonly>${esc(block)}</textarea>
    <p><button type="button" class="btn" id="copy">Copy to clipboard</button> <span id="copied" class="ok" aria-live="polite"></span></p>
    <p class="muted small">If you change your text or your answers later, create your submission again before you hand it in.</p>`;
  $("#pdf").onclick = () => {
    const blockOnly = ai === "yes" ? block : [...head, "=== END ==="].join("\n");   // no text without AI consent
    const cap = W.label.charAt(0).toUpperCase() + W.label.slice(1);
    const today = new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"});
    const blob = makePdf({
      title: `${cap} to ${W.addressee}`,
      subtitle: `${S.title} · ${EXAM ? "Exam" : "Role " + r.id + (r.dept ? " (" + r.dept + ")" : "")} · ${words(memoText)} words · ${today}`,
      body: memoText,
      note: EXAM ? (ai === "yes"
        ? "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers, your decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your exam answers for your teacher's SimLearn tool: your reading and listening answers and your decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.` : (ai === "yes"
        ? "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices, your group's decisions and a copy of your text. You agreed that your teacher may check your text with AI."
        : "This file also carries your SimLearn answers for your teacher's SimLearn tool: your information choices and your group's decisions, but not your text. You did not agree to an AI check, so your teacher will mark your text by hand.")
        + ` Check code: ${code}.`,
      footer: `SimLearn · ${S.title}`,
      block: blockOnly, fileName: "simlearn-submission.txt"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `simlearn-${S.id}-role-${r.id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 120000);
    $("#pdfmsg").textContent = "Look in your Downloads, then upload the file to Moodle. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app), or use the text box below.";
  };
  $("#copy").onclick = async () => {
    const ta = $("#block");
    const done = () => { $("#copied").textContent = "Copied — now paste it into Moodle."; };
    try { await navigator.clipboard.writeText(ta.value); return done(); } catch(e) {}
    // older method: still works in many embedded frames where the modern one is blocked
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    let ok = false; try { ok = document.execCommand("copy"); } catch(e) {}
    if (ok) return done();
    $("#copied").textContent = "Your browser blocked copying. The text is selected — press Ctrl+C (or ⌘C) to copy it.";
  };
  $("#block").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
}
