<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Half Light — The Reissue Deal — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --ink:#1D2733; --ink-2:#4A5562; --paper:#FBFBF8; --panel:#ECEFF3; --line:#D4D9E1;
  --pine:#2C5282; --pine-2:#1F3A5F;   /* navy brand (named pine from the first, green version) */ --amber:#C98A1B; --amber-bg:#FBF1DC; --warn:#9B2C2C;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left))}
h1{font:600 1.55rem/1.2 var(--sans);margin:0 0 .25rem}
h2{font:600 1.2rem/1.3 var(--sans);margin:1.75rem 0 .5rem}
h3{font:600 1rem/1.35 var(--sans);margin:1.25rem 0 .35rem}
p{margin:.5rem 0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.bar .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:4em;flex:1 1 auto}
.bar .right{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.teacher{flex:none;font-size:.8rem;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.teacher:hover{color:var(--ink);border-color:var(--ink-2)}
.who{font-size:.85rem;background:var(--panel);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* phones: the role/player goes on its own line under the title, so neither gets cut off */
@media (max-width:600px){
  .bar .wrap{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px}
  .bar .right{display:contents}
  .bar .title{grid-column:1;grid-row:1;white-space:normal}
  .teacher{grid-column:2;grid-row:1;align-self:start}
  .who{grid-column:1 / -1;grid-row:2;justify-self:start;max-width:100%}
}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pine);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main.wrap{padding-top:24px;padding-bottom:64px}
section[hidden]{display:none}

/* start screen */
.start{padding-top:32px}
.start .lede{font:1.05rem/1.55 var(--serif);color:var(--ink-2)}
fieldset{border:0;padding:0;margin:1.25rem 0}
legend{font-weight:600;margin-bottom:.5rem}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice input{margin-top:4px}
.choice:has(input:checked){border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.grid-groups{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

.btn{display:inline-block;border:0;border-radius:8px;padding:10px 16px;background:var(--pine);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pine-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{background:var(--panel);color:var(--ink)}
.btn.quiet:hover{background:#dfe4dc}
.linkish{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}

/* reading blocks */
.prose{font:1.02rem/1.62 var(--serif)}
.note{border-left:3px solid var(--line);padding:.25rem 0 .25rem 12px;margin:1rem 0}
.note b{font-family:var(--sans)}
.note.scar{border-color:var(--warn)}
.note.proof{border-color:var(--pine)}
.note.clock{border-color:var(--amber)}
.contacts{border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:#fff}
.contacts div{padding:8px 0;border-top:1px solid var(--line)}
.contacts div:first-child{border-top:0}

.switch{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--line)}

/* scenario picture */
.hero{margin:0 0 18px}
.hero img{display:block;width:100%;height:auto;border-radius:12px}

/* inbox */
.mail{border:1px solid var(--line);border-radius:12px;background:#fff;margin:18px 0;overflow:hidden}
.mail>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail>summary::-webkit-details-marker{display:none}
.mail .from{font-weight:600}
.mail .subj{color:var(--ink-2);font-size:.92rem}
.mail .state{font-size:.8rem;white-space:nowrap;color:var(--ink-2)}
.mail .state.todo{color:var(--amber);font-weight:600}
.mail .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.mail .body .prose{white-space:pre-line;margin-top:14px}

/* the three folded notes — the one memorable moment */
.offers{margin-top:18px;background:var(--amber-bg);border-radius:10px;padding:14px}
.offers .ask{font-weight:600;margin:0 0 10px}
.offer{position:relative;display:block;width:100%;text-align:left;border:1px solid #E6D3A6;background:#fff;border-radius:8px;padding:12px 14px 12px 40px;margin:8px 0;cursor:pointer;transition:transform .15s ease,opacity .3s ease}
.offer::before{content:"";position:absolute;left:14px;top:15px;width:14px;height:10px;border:1.5px solid var(--amber);border-radius:2px;background:linear-gradient(to bottom right,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%),linear-gradient(to bottom left,transparent 47%,var(--amber) 48%,var(--amber) 52%,transparent 53%)}
.offer:hover{transform:translateY(-1px);border-color:var(--amber)}
.offer[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.offers.done{background:none;padding:0}
.offers.done .offer{cursor:default}
.offers.done .offer.closed{opacity:.5;transform:none;padding:8px 14px 8px 40px;font-size:.9rem}
.offers.done .offer.closed::before{display:none}
.offers.done .offer.closed{padding-left:14px}
.offers.done .offer.closed::after{content:"Not chosen";display:block;font-size:.75rem;color:var(--ink-2);margin-top:2px}
.opened{border:1px solid var(--amber);border-radius:10px;background:#fff;padding:14px 16px;margin-top:10px;animation:unfold .45s ease-out}
.opened .t{font-weight:600;margin:0 0 6px}
@keyframes unfold{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@media (prefers-reduced-motion:reduce){.opened{animation:none}.offer{transition:none}}

/* decisions */
.dec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;margin:16px 0}
.dec .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.dec .opt input{margin-top:5px}
.dec textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.bud{border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 16px;margin:16px 0}
.bud .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bud .row:first-child{border-top:0}
.bud .row .l{font-size:.95rem}
.bud .row .u{font-size:.8rem;color:var(--ink-2)}
.bud .row input{width:5.5em;text-align:right;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.bud .row .sub{grid-column:1/-1;font-size:.8rem;color:var(--ink-2);text-align:right}
.total{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--pine);padding:10px 0;margin-top:8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.total .off{color:var(--warn)} .total .on{color:var(--pine)}
.flash{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-top:22px;background:var(--amber-bg)}
.flash .prose{white-space:pre-line}
.cite{font-size:.9rem;color:var(--ink-2);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:12px 0 0}
/* new AE format (ae2): the start-screen disclaimer, drawers, decision kinds, tags and note filters */
.paper .ptitle{font:600 1.08rem/1.35 var(--serif)}
.paper .pauth{font-size:.9rem}
.ack{border:2px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.ack p{margin:.4rem 0 .6rem}
.ack label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.ack input{width:18px;height:18px}
.drawers{margin-top:16px;display:grid;gap:8px}
.drawer{border:1px solid #E6D3A6;border-radius:10px;background:var(--amber-bg)}
.drawer>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
.drawer>summary::-webkit-details-marker{display:none}
.drawer>summary::after{content:"Open";font-weight:400;font-size:.8rem;color:var(--ink-2)}
.drawer[open]>summary::after{content:"Close"}
.drawer .dbody{background:#fff;border-top:1px solid #E6D3A6;border-radius:0 0 10px 10px;padding:4px 14px 12px}
.drawer .dbody .prose{white-space:pre-line;margin-top:10px}
.kind{display:inline-block;font:600 .72rem/1 var(--sans);letter-spacing:.02em;border-radius:999px;padding:4px 9px;margin-left:6px;vertical-align:2px}
.kind.bw{background:#1D2733;color:#fff}.kind.grey{background:#D4D9E1;color:#1D2733}
.decgroup{font:600 .8rem/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:26px 0 -4px}
#hlpal .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
#hlpal .lbl{font-size:.75rem;color:var(--ink-2);width:100%;margin-top:4px}
#hlpal .tg{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;cursor:pointer;font-size:.82rem}
#hlpal .tg[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
#hlpal .done{margin-left:auto;border:0;background:var(--pine);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.tags span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff;color:var(--ink-2)}
.nbf{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:.8rem;color:var(--ink-2)}
.nbf select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;max-width:100%}
.nbf label{display:flex;gap:8px;align-items:center;flex:1;min-width:0}

/* listening */
.mcq{margin:14px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mcq b{display:block;margin-bottom:6px}
.mcq label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.mcq label input{margin-top:4px;flex:none}
.mcq label.right span{color:var(--pine);font-weight:600}
.mcq label.wrong span{color:var(--warn);text-decoration:line-through}
.mcq .res{font-size:.9rem;margin:2px 0 0}
.mcq .res.ok{color:var(--pine)} .mcq .res.no{color:var(--warn)}
.score{border:2px solid var(--pine);border-radius:12px;padding:12px 16px;margin-top:18px;font-weight:600}

/* writing + submit */
textarea.memo{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:1rem/1.6 var(--serif);background:#fff}
.count{font-size:.85rem;color:var(--ink-2);text-align:right}
.rubric{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 16px;margin:0 0 16px}
.rubric>summary{cursor:pointer;padding:12px 0;font-weight:600}
.rubric h3{font-size:1rem;margin:12px 0 2px}.rubric .aim{margin:0 0 4px;color:var(--ink-2)}
.rubric ul{margin:0 0 8px;padding-left:20px}.rubric>p:last-child{margin-bottom:14px}
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:20px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--pine);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap}
.ok{color:var(--pine);font-weight:600}
/* exam: sources beside the questions; the questions keep their own scroll on wide screens */
.examgrid{display:block}
.qpanel h2{margin-top:0}
.qpart{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;background:#fff}
.qpart h3{margin:0 0 4px;font-size:1rem}
.qpart .inst{margin:0 0 8px;color:var(--ink-2);font-size:.92rem}
.qitem{margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.qitem .qq{display:block;margin-bottom:4px}
.qitem label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.qitem label input{margin-top:4px;flex:none}
.qitem .row{display:flex;flex-wrap:wrap;gap:6px 16px}
.qitem select,.gaptext select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:100%}
.qitem input[type=text]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:340px}
.gaptext{line-height:2}
.gapopts{margin:8px 0 0;padding-left:0;list-style:none}
.gapopts li{margin:4px 0}
.qcount{font-size:.9rem;color:var(--ink-2)}
.examq{margin:0 0 18px}
.pn{display:inline-block;min-width:1.4em;color:var(--ink-2);font-family:var(--sans);font-size:.85rem}
.examstart .times{margin:12px 0 20px;padding-left:1.2rem}
@media (min-width:1000px){
  .examgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,44%);gap:24px;align-items:start}
  .qpanel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
}
/* hand-over ("parachute"): a leaving student's work, opened by a teammate in another tab */
.handin{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0;background:#fff;color:var(--ink)}
.handin.first{border:2px solid var(--amber);background:var(--amber-bg)}
.handin input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 8px 8px 0}
.handbanner{border:2px solid var(--amber);background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px auto 0;font-size:.92rem}
footer .linkish{margin-right:14px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;font-size:.85rem;color:var(--ink-2)}

/* highlighter: quiet until a sentence is tapped */
.hs{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s ease}
@media (hover:hover){.hs:hover{background:#F1EFE4}}
.hs.sel{background:#F1EFE4;box-shadow:0 0 0 2px var(--amber)}
.hs:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hs.on{padding:0 1px}
.hs.flashy{animation:hsflash 1.2s ease-out}
@keyframes hsflash{0%{box-shadow:0 0 0 4px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hs{transition:none}.hs.flashy{animation:none;outline:2px solid var(--amber)}}
#hlpal{position:absolute;z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 6px 24px rgba(29,39,51,.18);max-width:min(420px,calc(100vw - 24px))}
#hlpal[hidden]{display:none}
#hlpal .sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;background:#fff;cursor:pointer;font-size:.85rem;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hlpal .sw i,.cc i,.nb-card i{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
#hlpal .sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#hlpal .rm{border:0;background:none;color:var(--warn);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:5px 6px}
#hlpal .x{border:0;background:none;cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;color:var(--ink-2);margin-left:auto}
@media (max-width:600px){#hlpal{position:fixed;left:0;right:0;bottom:0;top:auto!important;max-width:none;border-radius:14px 14px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:flex-start}}
.cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0 4px}
.cc>summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink-2)}
.cc>summary::-webkit-details-marker{display:none}
.cc>summary i{width:12px;height:12px}
.cc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;padding:4px 12px 12px}
.cc label{display:flex;gap:8px;align-items:center;font-size:.9rem}
.cc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.9rem}
.decstrip>summary::before{content:"▸";font-size:.8rem}
.decstrip[open]>summary::before{content:"▾"}
.decstrip ol{margin:0;padding:2px 12px 10px 30px;font-size:.92rem;list-style:none}
.decstrip li{margin:3px 0}
.nb{margin-top:28px}
.nb h2{margin-top:0}
.nb .tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem;color:var(--ink-2);margin:0 0 8px}
.nb .tools button[aria-pressed]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:.85rem}
.nb .tools button[aria-pressed="true"]{border-color:var(--pine);color:var(--pine);font-weight:600}
.nb-group{margin:12px 0 4px;font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
.nb-group i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.nb-card{border:1px solid var(--line);border-left-width:6px;border-radius:8px;background:#fff;padding:8px 10px;margin:6px 0}
.nb-card .s{font:.95rem/1.5 var(--serif);cursor:pointer;margin:0}
.nb-card .src{font-size:.8rem;color:var(--ink-2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb-card .citebtn{margin-left:auto;border:1px solid var(--pine);color:var(--pine);background:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;cursor:pointer}
.nb-empty{font-size:.9rem;color:var(--ink-2)}
.writegrid{display:block}
.nbpanel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 12px;margin:12px 0}
.nbpanel>summary{cursor:pointer;padding:8px 0;font-weight:600}
.nbpanel .nb{margin-top:0;max-height:60vh;overflow:auto;padding-bottom:8px}
@media (min-width:1060px){
  #app.wide .wrap{max-width:1100px}
  .writegrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .writegrid textarea.memo{min-height:60vh}
  .writegrid .nbpanel{margin:0}
  .writegrid .nbpanel .nb{max-height:calc(60vh - 40px)}
  .writegrid .nbpanel.sticky{position:sticky;top:112px}
  .writegrid .nbpanel.sticky .nb{max-height:calc(100vh - 180px)}
}
</style>
</head>
<body>

ts to handle it now. Dev Marchetti played guitar, left acrimoniously two years before the split even happened, and has agreed to be involved in this deal only because the money is too large to walk away from. Each of them has sent an agent — you — to represent their interests and reach one shared agreement with the other two agents.\n\nYou meet the other two agents in person to agree four terms: the royalty split, the credits, how future licensing decisions are made, and how the band's story is told. Read your inbox first. Your principal will only sign terms that protect what they really care about.","scar":{"label":"The 1996 band agreement","text":"Signed the week before the album was recorded: every member gets one third of all writing income, whatever they wrote, and every decision about the band's music needs all three to agree."},"proof":{"label":"The fifteen seconds","text":"Three months ago, fifteen seconds of the bridge of the album's closing track appeared under a dance trend. The album went back into the streaming charts overnight, and Meridian's offer is the largest the band has ever had."},"constraint":"Meridian's offer has a real deadline: signed terms are needed within the signing window or the deal reverts to renegotiation from scratch, at a lower valuation."},"listening":{"name":"The Back Catalogue","questions":[{"q":"What brought Fleetwood Mac's \"Dreams\" back into the charts in 2020?","options":{"A":"A TV series","B":"A video of a man skateboarding to work","C":"A new remastered album"}},{"q":"How long after its release did \"Running Up That Hill\" reach number one in the UK?","options":{"A":"Thirty-seven years","B":"Forty-three years","C":"Twenty-seven years"}},{"q":"Why didn't Kate Bush have to share the song's songwriting income?","options":{"A":"She bought the rights back from her label","B":"She owns the master recording","C":"She wrote the song on her own"}},{"q":"According to the podcast, what is \"the master\"?","options":{"A":"The written music and lyrics","B":"The recording itself","C":"The contract between the band members"}},{"q":"What does a sync licence allow?","options":{"A":"Using a song in a film, TV programme or advert","B":"Releasing a song on vinyl","C":"Performing a song live"}},{"q":"How many permissions does a sync use normally need?","options":{"A":"One, from the record label","B":"Three, one from each band member","C":"Two, one for the recording and one for the song"}},{"q":"Why did many 1990s bands split songwriting income equally?","options":{"A":"The law required it","B":"It kept the peace while the money was small","C":"Record labels insisted on it"}},{"q":"What did the courts give Matthew Fisher?","options":{"A":"A share of the music copyright","B":"Ownership of the master recording","C":"A new record deal"}},{"q":"Why can a band lose a sync deal, according to the podcast?","options":{"A":"Its fee is too high","B":"Its song is too old","C":"It is too slow because every member must agree"}},{"q":"According to Fisher and Ury, what is an interest?","options":{"A":"What someone says they want","B":"Why someone wants something","C":"What happens if you walk away"}}]},"roles":[{"id":"A","label":"Role A","dept":"Representing Rosa Alvarez","characters":[{"id":"rosa","name":"Rosa Alvarez","title":"Your principal — songwriter and lead singer","subject":"What I need out of this","email":"I wrote every song on that record. I sang every note. For thirty years nobody cared, and now that it's worth something, I am not signing away my story along with my royalties.\n\nHere's what I want: a bigger share than an even split — I think 45% is fair given I wrote the hooks that are actually going viral, not just \"my third.\" And I want approval rights over how our story gets told publicly. Any liner notes, any press statement, any documentary blurb — it goes through me first. I am not having some label intern write a version of events where I'm a footnote to Dev's comeback narrative.\n\nI know Kit wants this signed fast. I know Dev wants his moment. I am not against either of those things happening — I am against them happening at my expense. Get me a deal that reflects what I actually contributed, and protects how our story gets told, and I'll sign whatever Meridian puts in front of us. Anything less, and I want to know exactly what I'm giving up and why before I agree to it.\n\nI also want a say in which adverts use my songs. What I can't tell you is what Dev really wants out of this. I haven't spoken to him in years. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"Writing the song that went viral","text":"yRS4k51v7zm9YQiA9AmvQAe7lXt1YQnfNrZaVEwgu1y+oOmkN3lirtr2B6D+WRrfxsrx/ruOQQoqEMObjKRiPz8DZ/jmWQcdb/+jZFq6KYnTQ3+kqRZpovZLxvSPApkIY9QcnHOScG8DQOBYDUWj3OZpx21dUbeKfQtmAyvxXGqMCtRncy4uOFldwhCH9L087/hl9HaobOPv/BidVbylgP87GP7fpVBFcu23IKJwSaTGpWcNPPHrnPIr+reZc1BV5oSMOk6Z6ZRx2MYwBT2pLJ+m+UgqE18ecgB1ccmtJ/wAiunBG1v06jQE2RknGt1Qg5zT68MGFKkcyQ42GYW0022+eeeo"},{"id":"o2","title":"What I would sign","text":"yeFMUUsJob8zdTv6t79yLJNkI0kE34JgQAoDdrs1wZfGjTCDsUSXaAgVc/Z+oYUuueKpfRm+jp/IcKfPb98LGUjFJ+nuKRvOpi0ZWmc7iWOSlo8n/ih3vNKKUauCUqZeEMTda9+O6C36AV/3OoRslrxzgj6nrrDUGZhyDe3lYSLs52fO2SVuEGLPEAuF3/e3VRWBTBwbUZ1BecX3Q3Oz+bK8o+dblPnhBqaEVXfiwhpuQ2/e3vyAR4Z1XCPN9WpFo7bzbW5hcHAXEpsFWO74Jqk0xlGOUdiDPz6rsFU/rN0TM5c9vI0e2fO+4Bf5Jq+Ztm/E55DBcljOtQ=="},{"id":"o3","title":"The even split in 1996","text":"ftA7OzalcUaIGcm1wnYsr3wjc7c/Y09mkGKY2lu9KLt/MLpr38jg70DCZGjGXpqgQk5sJa24r+Cx7LdMfKhVK0Td2Nl0LaUIcx3TFJH024iMuAARMT5llRtoAuf2WIUyKVUjPZdjh2qqpez+tjOGgdNIlEWllEmIL+EeCgXHR8qIWw8MKNb3v/j+y1UQEBxoYrWkjpZDLn8s3pky10gm65qeKQBk6zUc8iubmqfY4wcFsSh8H3U6VtoWosftFd5krEiM7+6mLP56uKlZ8iDfasbmk7MN9R6dcLxur+IeSnmUBTr/zcriKir2HEfQJewc7fOMB0hFCg=="}]},{"id":"priya","name":"Priya Shah","title":"Rosa's entertainment lawyer","subject":"Leverage assessment","email":"Rosa asked me to give her agent my view on this deal. I've looked at the original publishing splits and the viral clip itself — it's the hook from the bridge, which Rosa wrote solo. The band's songwriting agreement from '96 was sloppy, frankly: it split everything three ways regardless of actual contribution.\n\nThat gives Rosa more leverage than she might be using. Meridian's entire offer exists because of that fifteen seconds. If I were negotiating this myself, I'd tell you: don't let anyone rush this into an even split just because it's easier to write into a contract. The old agreement was unfair to her the first time around — this is the one chance to correct it. Happy to talk through the actual publishing paperwork if it helps your case with the other agents.\n\nWhat I can't tell you is how much the exact number matters to Kit. That's for his agent to find out. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"How songwriting money is paid","text":"wsnZ20xCaBdJtBSSIs6m3QjKzdsMiwt1q9tCQLeT1Tltrsc+Kpwl+ZKrU0H5MISLuPibTHmK2dEPY4knsZP6VAnyhIEAupAnZmRChPKNzu2Nt/u+XUdAZUHr9ge4dlnbSpa3dnUJzKTSBagV+h6j58ieUHmhTb160iy2CIx31wD8/hr45JR4fyu+9R/Q/ka0zTdiBLGTNIC0mYVoZXF7W81Cbd75FAM08/5xEX49JCRinBjL5ciLGUVM6w2MHM5INBg1WDod8WrEGeuQxVRgVyXq2k5ajr7BlS4ERl3oXs12PnHzSxCgvooPZmyHcnBbssHC28HzPpQoEcNKdeoM2W0s06IZRF8AqwMCsSuScCkCTU6vPYjFMXCvyePC8xg="},{"id":"o2","title":"The 1996 agreement","text":"y414q88+nj0/SY61eZC8uJaW8P3jnc0dAJKiAyQBpEewmMYjabB6SutFhvwb/YUBrKogJeNUm5vrmH2AamoKpTr8PI4PK+MYjM1qoqOYENUfiKdk9+aSWp0I+1sUnoFd+z4Iz5K5tJaEgNvK7QdXbef6Z/ux5SfKRLLUvIParG37agPkSPQKwDXhdsK19lPh6hG52NYe/qVYy2UYNp0DTWTkZ+Ry7aH+EbdMTR9DsS9ZOSJUhQRr3XjVs5o8fIqgSNIZaChcJEnxzy/U/BbNFmntWvtAR0zS82YxpqYjSYpCfYqD7ow0hzqY71OfjVt2gPwzSrZD0b84Gkif/3RQR/f5LbynHkIvjg=="},{"id":"o3","title":"A trade Kit could accept","text":"38gsbRsy3yQK7N7pAsXwbhz8G5CclHnYpd6GtyUM4cxPwmps6EllJxpp+bIYUrTt2M5ONjneI+niqFW8Ntq7NX2WtC0brxLHJw3L4M4I2e8iA5roQ7VAC9D8OUY5ICx7+6kXKkkqjCpmplmUt4DM+DAczWJL6jr3iuiiGRsLLZXQKJppXjQj5QBR4IVpFOj/+ZNghpvmNwJb1MlOj4Dtb9iWnId4B78iaIn5/BBZeChJF2Et0EkZfh9w6Lx+W/jRUpu2rbG9cF5eXW2F/M3TkOIMtEyDPnyfumDDHYKTystN9O1px/tEnOU8d8qAYi2r5xpt7ItMhS44d+6zFouATZCIlYCBG63rpZ2rOtiNO3v6AsmF9tJ110cigRFXUF0s+jfNrZA="}]},{"id":"mateo","name":"Mateo Alvarez","title":"Rosa's son","subject":"can you just talk to her","email":"Hey — I know I'm not really supposed to be emailing you, but Mum gave me your contact and said to be honest with you, so here it is: she is going to talk herself out of this deal if someone doesn't help her see the bigger picture. I love her, but she has spent thirty years being precious about \"the narrative\" of a band literally nobody remembered until three months ago. This is real money. This could help her retire properly.\n\nI'm not saying roll over — I know the songwriting thing is real, she's talked about it my whole life. But if you can get her to see that a good-enough deal now beats a perfect deal that falls apart because Kit and Dev walk away, I think she'd actually listen to you faster than she'll listen to me. She trusts you're on her side in a way she doesn't always trust family advice.\n\nWhat I don't know is how long Meridian will really wait. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"Last night","text":"uVj9yCjJW1pAfeGiQok0+2dQQOAsPyn2kLk3+slgsyK3gi/YRzDWrAgcsLQcxoM+DjWsTuIcPrszYKmW4JhWR4ynrHx09rnneiIuLxJ2KDzLKvhQl9aVmOhhetBRGp4sr8kuQvS4HA3Io1ifAtFndXhFmSIjQ2hVBa6M3pUXB3GlAxZOPm/HmcSy4rp2fG7HuLbWp5keSSLSwyvOWRo8HwCLXeaYqRnNNbY7c4eOythuGTkfk5cI8zHVej1eD+c426b2FbfeWmH7fgRn6oY/9GOIagxeDoL3LbmVhuz8UArqrZ4V+okaEfsHPg8QlHcv"},{"id":"o2","title":"An old magazine page","text":"d3P6KzLFTsL+obWrxAUt+k8j8qbYYtpHJ2Tn/PoxQaSe+GayDSH5vug0okeTtl1bN8mjCAsiTfcTSgnjL473rHs7hsJUqWTp5LbGJ1jPjXTNUdAhsaBjeszUjw0CjLp+qkLpMV9XoJHMNGxmfhzVYQB2jJu580YKE7EOmDgpT8TP8tGgLgn3JTotEgpCfK7l2thGigRDuGpPOXOhux4mvAnk0elT1L5G45qH5KjpQQ6pZYLDcgoCuLG1DIGNcp6qdd97OLBWKG6Tg6Hba/QbJW32ugpxeoHRgiAPHY2l/62AOYIlkWptGASwD7HY5UYqgB0MsOiFflY3oof5pgBmmw=="},{"id":"o3","title":"What the money would mean for her","text":"zWS62YLXyUTnYQx6+q5PlsE6ojObx/lPQlUtnIo2qrNQf3UUvLMBJGzxjz8+LaAORbBrxMVntKaC4giW8zpRHZ0ExgTGdebhqMVJiCURJHsSaSEqA2eresHeMsPHXmSzwxdZkT1ZNh2OQMnoqdFX9km/Do4/KEry6d+o3A3ahptFkMz3Mhuvioa8AovT/FuZdvop/RrameyUYkkk4+js1gMMBAVztDBOeZFEZascXdxfBRGEuMXAz34gksqepllbuc+KVxRI3dAdu12FmZXODsnFiyrppKnF2zftwv0OMDlGjXbpMZB5obb6Vv04oFpTiP7prvU74INHP0PiUg=="}]}]},{"id":"B","label":"Role B","dept":"Representing Kit Okafor","characters":[{"id":"kit","name":"Kit Okafor","title":"Your principal — bass player and the band's business lead","subject":"Let's not overcomplicate this","email":"I ran this band's business in '97 and I'm the only one of us who's run anything since. I want this signed, cleanly, before Meridian's window closes and we lose the number they're offering.\n\nMy position: even three-way split, standard credit, and — this is the important part — a single point of contact (me) for any future licensing requests, not a three-way approval committee every time someone wants to use thirty seconds of a song in a car ad. I've watched enough bands blow deals by turning every decision into group therapy. I don't want that here.\n\nI get that Rosa thinks she deserves more and Dev wants his moment. I'm not trying to shut either of them down out of spite — I just don't think either of those things should slow this down or turn our future into a standing negotiation every time Meridian calls. Get me something clean and fast, and I'll sign.\n\nBetween us: the exact royalty number matters much less to me than speed, and than not being stuck in a three-way committee every time Meridian calls. What I can't tell you is whether Rosa's claim to more is real. I wasn't in the room when she wrote. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"Approving future licences","text":"Exaz6oqzjYMzbzeKMbSlOJHswjHh0Qo91dbCmCWRzpRUtW8ybZy0fQ8hxxkvy4CBMu5KAfWL5ysDwQAIacJfRHVWI1zZ2eJrrx/tazY0xypeR5CalrmnnCtbae2gKaIubQ5T7JZj1XJOg9nJIoCNVRkFsTVyJ2LHKiiLZr26RswZYUVS5G+q3utZA4UNoppWb7cItZAGKrh9erDWnLDNjourdqEIR9blGB8Q+NxU3tstxziML5MuKEL94ImRQ1kShaEiI6G+9kpvdHUpXsAP8X8WZsqvIILYjAJ6pXlpM0rp3HkZbis4EcIo9kDOGgFQUDA5"},{"id":"o2","title":"The film deal we lost in 1997","text":"Nj/0phNKsb33t13yY+kO4QisTzg9TUsHE6XeO1Fc8B5zRXmQGvIpfjppIPxnNY67IEcEQYEOYyY6rNRFUk9l0LMJOAHsKWApp0EvGr46avmlUH3VnjaDjZUH919Tv6OAd+hQ3MgcX1K9RGq8KIdaivXUCQuvPtBlg1ZR4eR4WAbJgxG6HEsOY5MmWKjtKoiVffXQuMLMLB5XZ5PIjenrZwl3V13qtTQLrpmx6dJxVrzgSTePd9K76/4gZap38TYYYWXHLIdUd56CWGYrBH+BDlbQDfcFxQK8GTgBhPOjXihTjQ37AqLbMc5nAM1PGxA5sJPKYOuRHgY="},{"id":"o3","title":"The band's business","text":"kgqerB4Gq3vteCdXhY8vBH/eWHmUCLdh6zh7xX8nARUDFrtHtNGFFy0lXnxySCvHLYXqSS/V+1QpyPSbM303tegweADEVBWajmyLhVk2NC5L6v4Jmz7cJJQBI5GznlX0VuC7nfoMtvoNrS8tzUj6GHhWTSPeO19ZNaogbaG187MTrB4CY7w0nTlM4ROEJkCphly01DG/0RXTvmmxj9zVzSyiWqvfshMw9YFE/BDholr/LqbButNs82A4S54lLF+rWzTeDDMpbAlmBXuHmBvVOqKgPlMZaVBcXdPfQwFpz5ZYzAbxaldyBxQfYmVpOHSNdj02LU1ZxwcIQdV24AMUuNS78DY="}]},{"id":"dana","name":"Dana Whitfield","title":"Deal lead, Meridian Sync & Licensing","subject":"Timeline reminder","email":"Kit asked me to keep his agent informed directly on timing, since I imagine the three of you are working through internal terms. I want to be transparent: our valuation of this deal is directly tied to current streaming momentum, and that momentum is already down noticeably from its peak three weeks ago. We can hold the current offer open until our signing window closes, but after that we'd need to re-run numbers, and I won't pretend that's likely to go up.\n\nI'm not trying to pressure anyone into a bad deal — I'd genuinely rather you three take the time you need to agree on your internal split fairly, since a deal that falls apart later over resentment is worse for everyone, us included. I just don't want anyone to be surprised by the numbers if this runs past the window.\n\nWhat I can't tell you is how the three of them want to tell the story of the split. That's for the band. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"The reissue package","text":"kevApIQVlf8MmHi3mC8JIBP1EF5JPbHKvhrznuF/Q5Ar5fPHAOovVUMWZvTfYlNec+aPQEFU33gtaznl79bZMVueToRL5XSHud9U9gviBVDjrjOHbQDa0jMW+o4+x3w44I7euQBevFezhkC7ho0Loe2wwNuO82oscp+//Q7g7eaVrkTh7oZVeBuKuJ0AwUgpQaG8zn2LbC1hvH1Fpql7bTOdUcTIXSBjQS2a8H0WPp9gv0XiZzUk3ZGs6TzH2Gpg5moCbn0W014xJj35ssdxL/ul2QyZrUU7qBGYlaqSp5I+EfoORzjG6JLbz0N6bZKkLI6w9HIoeIFnbMOGJGYmMtKh814UM7urel6r8duhswMj"},{"id":"o2","title":"How fast sync deadlines really are","text":"JUnxlWbAT9uy+fzsGrO/ubUP3xREWU4fx620EiCxLcAdhWoA9jxaVaJmf++CsmmSq/0jP6IbS2iES2kwxGNID+kU7Fy3/SYrlaDZ4ExZM+AbmyaU7Gr0J29i+k6v+WntJ6z4HDFD5PBbg7S+AUwtOgDbmlqdSpWuWNSTkO/ZtHKhIAdHiAxaOBl9e9ZoheRjT5sTzL7oWkftE8tsuF+SyG3g6EDDFD2HDHCDpP3lIQzXlQ0oIdFJg27ffzOCOqk7PpxvJ1e7O3ZjpfmIXhqS7trbQXpsKPe7v0I6am+jelRHnrTgETXRnf7/BtBa6AdW3qKxxq75lCi8iphCk6Umt4Ub8Wid"},{"id":"o3","title":"One text, signed by all three, before any contract","text":"s2fw09WC1rLPkaQ/LdyHNlSv8TJhXczWjMo6bLUgDHJUWojyETVBNsrzatTlKcvZFgzPdguN4ohOUJ8UokSntqBvIaN3idkpMNjLLZbOLvPAx8HX4lFSwy85/irCpkYnKiX02839LgysprGzVyBPzKHia28xq7n/9xNxq0xvNlg683f9c7ve2p6gTnngsN7brfyjwli18WmpyeQQWj1aHV4EblCA3o1yFaJMnhCJnXWKupe2Fl/eCYUt2alEHSSxJECA7mH8A1DRtIMZYEhbniJv2yUX0HJx2wq8Aw7xfw4wC5mmNLINlZkOthtIvutS3CzSYcvkHGkfQ8o+fu8RsgEF7ThnC4DvObhtYfarzd+wMaLh"}]},{"id":"frank","name":"Frank Osei","title":"Kit's accountant","subject":"Numbers to keep in mind","email":"Kit mentioned you might want a read on his financial picture as it relates to this deal. I'll keep it simple: Kit has two other ventures currently running at a loss, and this deal is a meaningfully larger share of his near-term cash position than he's let on to the others. He's not desperate, but \"let's take our time and get every point of principle exactly right\" is a much easier position for Rosa and Dev to hold than it is for Kit right now.\n\nThat's worth knowing as you negotiate on his behalf — his urgency about speed isn't just temperament, there's real financial pressure underneath it, even if he'd rather present it as \"I just don't like drawn-out negotiations.\"\n\nWhat I can't tell you is whether the other two are under any pressure of their own. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"How the payments would arrive","text":"EC0wJVMknAdpS9edsMycPO+5r3RGPY/wxuWzj+kRRh4jaZ57gN6nUmtea9Zr6h+XevgSfimZgz0KEWJVxAxI8gOT6NBxq8gdsGZ+cJcxpKlXDyBW8SmDNe/dlD7MpiaacFl6tYev+/id8NpWJr4c820+a/62jYVafFheyccxpHBz+8SBCSzWFXG27LgBF4os2r9Jvon8/kJrfghzgzk6kaG/Pgto99hae3WWBj1UZcLd2CCEk6CiVawtOHJgGmMonG9I8PndvhRECT7lMrXIPNABEUVFXiMhcO/oFtqXinSr3RKYnKLXjuN++5eK2iZ82E65f6fQ9X0+zfQ="},{"id":"o2","title":"What Kit could give up","text":"jpV8iMXNWA2JCQdGs2g8eoedkLF+gS0QTA/Fhzp7MVrBqafUKfBZDW75ser9gjbwrR9UG/WMPww14Gg9pbNOGLkrtodXJ4HG7Q2YUnQkRykrIh89rT4y1fy7r/WRnOQK4Z0MNAHlxR3BtdGXMcEznHa8XUmBKm3FQ5mNJdKXM/J3S5peKE4WZqd8sWumCFuk1LQ3GIUke+ouM2QsMdVbpeUoNSQmaWeiZLN4nyIMkfIrcHfRYQ0P9owC16PfCI+Mlpzvi78Lq8rvDwsnYG0LDEBDa3QiptAogWVPzRJMsFTGME9uSwRRnc6Mh3Urar56e6FdA/KDnwbSEzMo7hSwT3/oq38ZKsnNwx8gFLSaxOE="},{"id":"o3","title":"Kit's businesses","text":"b3Oau1ozzsxfQB8nY9ClDKfVOinuDAsIw8GYN9Y/3GAw9hJu/5DD3dhSr0XCVerNefNiB0F4GI2u8bBSXMW1pyOXzlyizjFFXKNtan9FuwDJqVPLhcQdPR8p9ZyxSPiUKvAvFYLTbeav1i4COBKoGmKz54Ba/KPqMRdf0nWmN5R0F0VBZvaRf4K5J8O1JAsky4Ekc7iyHEx2MksmVCblT4yVFYTE7ngDXHIvraa6bzAR5/Tm1zz2HNyjpQgA/p95/6eW8pVQvsvzk55AsbYhKtzhG1aKYBPGoKOxwfJStNSnhUGTe/1JOe+bInbJuJDi694K+TfnjkxhZ/Uc3RjKbM5WYwEajXUcXosmi80="}]}]},{"id":"C","label":"Role C","dept":"Representing Dev Marchetti","characters":[{"id":"dev","name":"Dev Marchetti","title":"Your principal — guitarist, returning member","subject":"One condition, and I mean it","email":"I left this band two years before it even officially ended, and everyone knows why, even if nobody says it out loud. I'm only doing this because the money's real. But I want one thing to be absolutely clear before I sign anything: however this gets told publicly — liner notes, press, whatever documentary nonsense Meridian wants to attach to the reissue — it does not erase why I left or turn my return into some tidy redemption arc that makes Rosa and Kit look good and me look like the guy who came crawling back for a payday.\n\nI want real, binding acknowledgement: my name on the credits the way it should have been the first time, and a joint public statement that tells the actual story honestly, with me signing off on the wording before it goes anywhere. That's not negotiable as far as I'm concerned. Everything else — money, whatever — I genuinely don't care as much about. Get me that, and I'm easy to deal with on the rest.\n\nBetween us: I don't need to approve every press mention forever. What I need is for the story to be told honestly once, and for my credit to be fixed from the start. What I can't tell you is whether Rosa wants the same thing or the opposite. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"What I've been doing since","text":"9xBma1iABw+zjOvYUKLrw10lO5dkplXYJaGDuUmfGx5CM8n3JPocnttLvUVxVKTIF+tCIZZTXpd+Lsl5Nvmp7x8a6jhNnXs+NYgDdxS6JFoWTtlQazrIK7vCgxHeQJtIMw89FdTgrl4hMTYn4AaW8Jsa/PO83wrPMes3pJ5FwyDjRKOTJmZB8L09Qf1KCYQqoQfsJ/IoSyP1KKzhjuQatggR/Ato5BwWYxoJZc5lQucvMm/4+qvF0QjsxN1Q65kGf6oq8azPI6IpSvHwnIe6+//wQXIFkVA6l4DkokI5OZE9eBOWbFeHctU8dvnp2oos"},{"id":"o2","title":"The old sleeve","text":"0k1Hhd1nOdMmpueqiyBXVi+jzrmGykCuwyKRPVv8khucSGDeyRE9dzf79rPm5I7z3yCAdPE5EvzPvKNzfDP61Ab7Jv+6q8vIJKsBPEoICCUekgQ7u06pYyD17phY/y8tdUSavq7fua4/RP/sjss3HS75MycPHx0APND9qD9N6LMKG8OSGFCltQK28ALS4fvtrXgMUmqkWAHUJ6soYyNSDdyl+4glwwlQaifFMt41oN+S6cCVdYl1Pmkof3fP61d72vWuxHqLjroZYZV9UOKyzuooxMgCoHbmvpCbSTaKX0T4VpmBe4mS0d08RXPqeFjSr8S++A=="},{"id":"o3","title":"My credit on the record, and one honest story","text":"htmXKfmI5cXK0MZu7ensW9elzQ7dCGYbX2QDzcWL0evnQdmWZ78ZkT5soNmD9TiOb3QiOincCQxIszv1psTiudwLl8hxu+QlEOn0xtKxauUvcbSUTIBfaKesyz744WCv27R3MMlu3ltP09HPZQTX1T7oKVEWlAg/d60qYA9klo/oF6m6f4QlX6C+D1NuSZd9FHvWGdawDRkxtoNUmfR4eX6yPLD36jEXcYbI+N8bJ6DrPZ3XI+lUeYpzIMlL91kO08A1WipZnGpPdUDwxweFFXwweuo3p/PmlqtZS1joAmzBVf63UL0vD/K8QRN4Iyc6mr9x+24NBVgqxkgeZw=="}]},{"id":"sal","name":"Sal Nakamura","title":"Dev's old friend from the music scene","subject":"you sure about this","email":"Dev gave me your email, said it was fine to be honest with you. So: honest. You know why he left, right? Actually left, not the polite version. If the answer is no, ask him directly, it's his story to tell, but I'll say this much — it wasn't a creative-differences thing, and the idea of Rosa and Kit's people writing some cleaned-up version of events for a press release makes my stomach turn a little, and I wasn't even the one it happened to.\n\nI'm not saying blow up the deal. I'm saying: whatever you're negotiating for him, don't let anyone talk him into softening the acknowledgement thing just because it's the awkward part of the contract. That part isn't administrative to him. It's the actual point.\n\nWhat I can't tell you is who will run the business side this time. I can tell you one more thing before you meet the other agents. Choose carefully.","offers":[{"id":"o1","title":"Business and story apart","text":"EPgVlDfNSsIFb4VFtu6L64jTqheVGIsGrPHTBmcL/2e+S3XVT/Nu5fSwjBqINWqGB5ZXXO4Td1k4288EGEKxUqNy58YzT4LnDmK3Ej2rAKoBCWViMNIZ663bzNFqgzTiI1H7NgMrGrfjFmFI5kYGp9AupXjrVKwarFAqZbqgtY6tDP+zw75S+zgtD1RjVrkeGXvDxX0BWJPVJ+5lTlan9Vamw1SNGcfzzf8h4PL9q6+zCEDVdB5GO7UxWQtzF2tGyfXr1xgqaS4uo/li77CPdjuIebDQrVJaYKZMUvclf6Od/rVAxhksCDZJ2myUw9Ca/JitEzW6fA=="},{"id":"o2","title":"What people in Leeds remember","text":"0o75A3lGGhe/DNAwHSuO6dbn7CdQ86vghQUGqoRgrmglnbIXTHqYRNPTcuq+S98thjzPgBAL0xLqwrpV8Ra1lIqjCNz2/aZWCADxz7/GMl2qwgrFA6/sLEYCX3jeaOhLiEtolzMG/JaVULioQ3vreVs9OtpE9XTGv9/pIgwVvfyiUs4PX41s4d8pAjTVs8GVywgqYucySe/CetHCZxAW00kHzxfrRNkOhe5M6G9XgC 92oS0/8CjHfyc5wMuFCUxMvQGGsIH14568OZt6RUtk5oZv4LGu9K0YVNJO9sYL9qghGgpZnnWJfxGZQuXjLA50MWXJNDJ35N+frAbBnYYYVDePbNeWc5xgpFDCUZmJoms1bRDm86jyulPRt3r4tNuNQiQYs1EACMS2Sb8w5WNzqt+l5GzJup4Q5ZVi4R4QaJgp3pWbtbcTPSPno6S2VSxFU7AcHwxFCAzrysubOOkWPDJts4g1U9wqdV47VAK3BTkHQMt7Zq6o2t4YNpzj+v64cTb1Vmak9RMVkHvr2nYB63N4uZImGMZ+NNLIjjyxAcBaieXy08iImDjeCyEE="},{"id":"o3","title":"How Dev reacts to pressure","text":"JkOrrgtrg174p7KO+TAxnu/KmlgvBqpZAWxQZYUmqEOB+0lMuAGw02rtaLWR5O6tomYs28WDJPN2w5ppf31ixHO/crQpkxsWNkhS++1DYQAJtsJBdh/BdJMDYVjW5Ll1I7ClX/wHbNcx50Gq0oIlcI3s/pgfGkIAXYQFU1RcmYsKg+BL1fJpehLE9feKVu9cCMYEEK5wTPl8xHgETQEmnWTr0KEDQSr1VieW35PE9LnQg6IEN/l+f37kKqR7H+oFqJ+nqPLJwG1TA8qruG/Sf2uvXBMH60ZyPnqSLklkJJG+9XBl"}]}]}],"two_player":false,"decisions":[{"id":"D1","title":"Decision 1 — The Royalty Split","A":"Equal shares: one third each for Rosa, Kit and Dev, as in the 1996 band agreement.","B":"A larger share for Rosa as the songwriter; Kit and Dev share the rest equally.","short":{"A":"Equal thirds","B":"More for Rosa"}},{"id":"D2","title":"Decision 2 — The Credits","A":"Individual credits: Rosa for the songs, Kit and Dev for their parts and arrangements.","B":"One band credit, 'All songs by Half Light', exactly as on the 1997 album sleeve.","short":{"A":"Individual credits","B":"Band credit"}},{"id":"D3","title":"Decision 3 — Future Licensing Decisions","A":"Unanimous: any future licensing request needs the approval of all three members.","B":"Majority: two of the three can approve, and no reply in ten days counts as yes.","short":{"A":"All three agree","B":"Two of three"}},{"id":"D4","title":"Decision 4 — Telling the Band's Story","A":"One joint statement now, signed by all three; later press material is shared for comment.","B":"A veto for each member: nothing about the band's story is published without all three approving it.","short":{"A":"Joint statement","B":"Three vetoes"}}],"newsflash":"NkeLQG6CyPbzoBSwKlb/V8bNDTsEzPlZPRLrMQkXju29D6gkQfnY15ie1nzO+lMYTaFahqvtoITa7Fl06MRxzu0Qcg d a format and tone that suit them","You keep close to the word count"]},{"name":"Using the information","aim":"Choose, combine and report the information that decides the question.","look_for":["You pick the facts, figures and deadlines that matter most for the decision, not just the first ones you read","You combine what different people told you (your contacts, your teammates and any podcast or news) and show how it fits together","You report it accurately, in your own words, and say who it comes from (\"As the finance director points out, …\")","You explain what the information means for the decision, not just what it says"]},{"name":"Building the argument","aim":"Make a convincing case: reasons, evidence and consequences, with the other side answered.","look_for":["Each main point has a reason, the evidence behind it and what follows from it (point, evidence, so what)","You show your priorities: what matters most, and why","You face the strongest objection or trade-off honestly and answer it, rather than just mentioning it","You say what risk remains and how to manage it"]},{"name":"Organisation and flow","aim":"Guide your reader through the text.","look_for":["A logical order for this kind of text (for example: purpose, recommendation, reasons, risks, next steps)","One main idea per paragraph, introduced by a clear opening sentence","Linking words and signposts that show how ideas connect (however, as a result, above all, this means that)","Headings or lists only where they help the reader"]},{"name":"Language","aim":"Say exactly what you mean, accurately and professionally.","look_for":["Vocabulary and structures that let you say exactly what you mean, including the language of the topic","Accurate grammar, word choice and spelling, so mistakes don't distract your reader","Claims that are as strong as the evidence allows (will, is likely to, may)","A consistent professional style: no slang or chatty asides"]}],"salt":"ef4d5b90","lc":"EEPZtH1thcFL+e3RAN569/CBg6cTBW/j6EcaeEWI9PkHG0x9A2VkTJSQg/c9Nt9mt4c="}</script>
<script>
"use strict";
const S = JSON.parse(document.getElementById("scenario").textContent);
const STORE = "simlearn:" + S.id + ":v" + S.version;
const AE2 = S.format === "ae2";   // new AE format: drawers, tags, "which is the better argument?"
const EXAM = S.format === "exam", EX = S.exam || null;   // written exam: one candidate, questions, no answers in the page
const TAGS = !S.budget && (S.decisions || []).length > 0;   // highlights can be tagged with the decisions they matter for

/* ---------- state (kept only in this browser tab, so a reload doesn't lose work) ---------- */
const fresh = () => ({mode:"3", role:null, tab:"context", choices:{}, firstLook:{}, mcq:{}, decisions:{}, however:{}, memo:"", consent:false, notes:"", hl:{}, hlLabels:{}, hlGroup:"colour", budget:{}, rationale:"", ack:false, opened:{}, drawOpen:{}, tags:{}, nbf:{}, ans:{}});
let st = fresh();
try { const raw = sessionStorage.getItem(STORE); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch(e) {}
if (location.hash === "#handover" && !st.handover) {   // opened to take a hand-over: start empty, whatever was copied in
  let reload = false; try { reload = performance.getEntriesByType("navigation")[0].type === "reload"; } catch(e) {}
  if (!reload) st = fresh();
}
function save(){ try { sessionStorage.setItem(STORE, JSON.stringify(st)); } catch(e) {} }

/* ---------- hand-over ("parachute") ----------
   A student who has to leave downloads their work as a small file (no text, no consent); a teammate opens the
   sim in a new tab (link in the footer, or #handover) and loads it there. Nothing goes through a server. */
// Never the student's own writing: not memo, however (objections) or rationale (budget reasoning), and not consent.
const HANDOVER_KEYS = ["mode","role","choices","firstLook","mcq","decisions","hl","hlLabels","hlGroup",
                       "budget","opened","drawOpen","tags","nbf","nbClosed"];
const HANDOVER_OPEN = location.hash === "#handover";
const HANDOVER_MAX = 1000000;   // bytes; a real file is a few KB
function cleanVal(v, d){   // only plain data from a file someone else made: strings, numbers, true/false, small objects
  if (typeof v === "string") return v.slice(0, 20000);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean") return v;
  if (d > 3 || v === null || typeof v !== "object") return undefined;
  if (Array.isArray(v)) return v.slice(0, 500).map(x => cleanVal(x, d + 1)).filter(x => x !== undefined);
  const o = {};
  Object.keys(v).slice(0, 3000).forEach(k => {
    if (k.length > 200 || k === "__proto__" || k === "constructor" || k === "prototype") return;
    const c = cleanVal(v[k], d + 1); if (c !== undefined) o[k] = c;
  });
  return o;
}
function handoverFile(name){
  const state = {};
  HANDOVER_KEYS.forEach(k => { if (st[k] !== undefined) state[k] = st[k]; });
  return JSON.stringify({simlearn_handover: 1, sim: S.id, version: S.version, title: S.title,
                         from: name, made: new Date().toISOString(), state});
}
function openHandover(text){   // returns "" when it worked, otherwise what to tell the student
  const bad = "This isn't a SimLearn hand-over file. Ask your teammate for the file the page downloaded for them.";
  let h; try { h = JSON.parse(text); } catch(e) { return bad; }
  if (!h || h.simlearn_handover !== 1 || !h.state || typeof h.state !== "object") return bad;
  if (h.sim !== S.id) return "This hand-over is for a different simulation" + (h.title ? ` (${String(h.title).slice(0, 80)})` : "") + ". Open it on that simulation's page.";
  const s = handoverShape(cleanVal(h.state, 0) || {});
  const mode = s.mode === "2" && TWO ? "2" : "3";
  if (!(mode === "2" ? TWO : S.roles).some(r => r.id === s.role)) return "This hand-over doesn't fit this version of the simulation.";
  const keep = st;
  st = {...fresh(), ...s, mode, tab: "context", memo: "", consent: false,
        handover: {from: String(h.from || "").trim().slice(0, 40), made: String(h.made || "").slice(0, 40),
                   older: h.version !== S.version}};
  try { render(); }
  catch (e) { st = keep; save(); render(); return "This hand-over doesn't fit this version of the simulation."; }
  save(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  return "";
}
// Keep only what this page knows, each value in the shape the page expects; anything else is dropped.
function handoverShape(s){
  const own = k => typeof k === "string" && !(k in {});   // never "toString", "constructor"…
  const map = (o, ok) => { const r = {}; if (o && typeof o === "object" && !Array.isArray(o)) Object.keys(o).forEach(k => { if (own(k) && ok(o[k], k)) r[k] = o[k]; }); return r; };
  const str = v => typeof v === "string";
  const out = {};
  if (str(s.mode)) out.mode = s.mode;
  if (str(s.role)) out.role = s.role;
  if (str(s.hlGroup)) out.hlGroup = s.hlGroup;
  if (typeof s.nbClosed === "boolean") out.nbClosed = s.nbClosed;
  out.choices = map(s.choices, str);
  out.firstLook = map(s.firstLook, str);
  out.mcq = map(s.mcq, str);
  out.decisions = map(s.decisions, v => v === "A" || v === "B");
  out.hl = map(s.hl, v => str(v) && Object.prototype.hasOwnProperty.call(HLC, v));
  out.hlLabels = map(s.hlLabels, (v, k) => str(v) && Object.prototype.hasOwnProperty.call(HLC, k));
  out.nbf = map(s.nbf, str);
  out.opened = map(s.opened, str);
  out.drawOpen = map(s.drawOpen, v => typeof v === "boolean");
  out.budget = map(s.budget, v => typeof v === "number" || (str(v) && /^\d{0,7}$/.test(v)));
  out.tags = map(s.tags, v => v && typeof v === "object" && !Array.isArray(v) && str(v.p || "") && Array.isArray(v.d) && v.d.every(str));
  Object.values(out.tags).forEach(t => { t.p = t.p || ""; });
  return out;
}
function handoverWhen(iso){
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-GB", {weekday: "short", hour: "2-digit", minute: "2-digit"});
}
function handoverBox(first){
  return `<div class="handin${first ? " first" : ""}"><b>${first ? "Open a teammate's hand-over" : "Taking over from a teammate who had to leave?"}</b>
    <p class="small">Open the hand-over file they sent you. ${first ? "This tab will show their work; your own stays in your other tab." : "Do this in a new tab, so your own work stays where it is."}</p>
    <button type="button" class="btn${first ? "" : " quiet"}" id="hoPick">Open a hand-over file</button>
    <input type="file" id="hoFile" hidden>

function wireHandoverBox(){
  const pick = $("#hoPick"), file = $("#hoFile");
  if (!pick) return;
  pick.onclick = () => file.click();
  file.onchange = () => {
    const fl = file.files && file.files[0];
    if (!fl) return;
    if (fl.size > HANDOVER_MAX) { $("#hoMsg").textContent = "This file is far too big to be a SimLearn hand-over."; return; }
    const rd = new FileReader();
    rd.onload = () => { const msg = openHandover(String(rd.result || "")); if (msg) $("#hoMsg").textContent = msg; };
    rd.onerror = () => { $("#hoMsg").textContent = "That file couldn't be opened. Try again, or ask for it again."; };
    rd.readAsText(fl);
  };
}

const $ = (sel, el=document) => el.querySelector(sel);
// Inbox options and the breaking news are scrambled in the page source (see scramble() in build.py),
// so tools that read the whole page can't see them. Each is unscrambled only when the student reaches it.
function unscramble(b64, label){
  try {
    let x = 0x811C9DC5;
    for (const b of new TextEncoder().encode(label)) x = Math.imul(x ^ b, 0x01000193) >>> 0;
    if (!x) x = 1;
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) {
      x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
      out[i] = bin.charCodeAt(i) ^ (x & 0xFF);
    }
    return new TextDecoder("utf-8").decode(out);
  } catch (e) { return ""; }
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function words(t){ return (t.trim().match(/\S+/g) || []).length; }

const TWO = S.two_player ? S.two_player.roles.map(r => ({...r, characters: r.characters.map(id => CHAR[id])})) : null;
const roles = () => (st.mode === "2" && TWO) ? TWO : S.roles;

function fnv(str){ let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(str)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(parts){
  const A = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
  const s = parts.join("|");
  const four = h => { let n = h % 923521, o = ""; for (let i = 0; i < 4; i++) { o += A[n % 31]; n = Math.floor(n / 31); } return o; };
  return four(fnv(s)) + "-" + four(fnv(s + "#"));
}

const ABBR = new Set("e.g i.e dr prof mr mrs ms st etc vs cf approx no nos fig figs p pp jr sr inc ltd co corp dept est al ca vol vols ed eds op mt ft gen col lt sgt rev govt univ assn bros nr tel ref".split(" "));
const OPEN_Q = "\u201C\u2018\"", CLOSE_Q = "\u201D\u2019\"'", OPEN_B = "([", CLOSE_B = ")]";
// Split text into sentences: returns [{s, gap}] where gap is the whitespace before the sentence (text = all joined).
function splitSentences(text){
  const out = [], n = text.length;
  let start = 0, i = 0, quoteEnd = -1, depth = 0;
  const push = (end) => { const raw = text.slice(start, end); if (raw) out.push(raw); start = end; };
  while (i < n) {
    const ch = text[i];
    if (ch === "\n") { push(i); let j = i; while (j < n && /\s/.test(text[j])) j++; push(j); i = j; continue; }
    if (OPEN_B.includes(ch)) { const close = text.indexOf(ch === "(" ? ")" : "]", i); if (close > i && close - i < 240 && !text.slice(i, close).includes("\n")) depth++; }
    else if (CLOSE_B.includes(ch) && depth > 0) depth--;
    if (i > quoteEnd && (ch === "\u201C" || (ch === '"' && (i === 0 || /[\s(\[]/.test(text[i-1]))))) {
      const close = text.indexOf(ch === "\u201C" ? "\u201D" : '"', i + 1);
      if (close > i && close - i < 200 && !text.slice(i, close).includes("\n")) quoteEnd = close;
    }
    if (".!?".includes(ch)) {
      let j = i + 1;
      while (j < n && (CLOSE_Q + CLOSE_B + ".!?").includes(text[j])) { if (CLOSE_B.includes(text[j]) && depth > 0) depth--; j++; }
      const inside = depth > 0 || (quoteEnd >= j);
      if (!inside && j < n && /\s/.test(text[j])) {
        let k = j; while (k < n && /[ \t]/.test(text[k])) k++;
        const next = text[k] || "";
        const word = (text.slice(Math.max(0, i - 12), i).match(/([A-Za-z.]+)$/) || ["",""])[1].toLowerCase().replace(/^\.+/, "");
        const pre = text[i - word.length - 1] || "";
        const initial = /^[a-z]$/i.test(word) && !/['\u2019\w]/.test(pre);   // "Oduya, B." but not "don't."
        const isAbbr = ch === "." && (ABBR.has(word) || initial || /^([a-z]\.)+[a-z]$/i.test(word));
        if (!isAbbr && (next === "\n" || /[A-Z0-9\u00C0-\u024F\u201C\u2018"(\[\u2014\u2013\u20AC\u00A3$-]/.test(next))) { push(j); let m = j; while (m < n && /[ \t]/.test(text[m])) m++; push(m); i = m; continue; }
      }
      i = j; continue;
    }
    i++;
  }
  push(n);
  return out;
}
const isSentence = s => words(s) >= 3 && (/[.!?\u201D"')\]]\s*$/.test(s.trim()) || words(s) >= 5);
// Sentence registry for everything this student can highlight: context + own contacts' emails + the opened option.
function hlSources(){
  const parts = [], c = S.context;
  c.text.split("\n\n").forEach((p, i) => parts.push({cid:"ctx", part:"p" + i, text:p, src:{name:"Context"}}));
  if (c.scar) parts.push({cid:"ctx", part:"scar", text:c.scar.text, src:{name:c.scar.label}});
  if (c.proof) parts.push({cid:"ctx", part:"proof", text:c.proof.text, src:{name:c.proof.label}});
  if (c.constraint) parts.push({cid:"ctx", part:"clock", text:c.constraint, src:{name:"The clock"}});
  if (EXAM && EX.article) EX.article.text.split("\n\n").forEach((p, i) => parts.push({cid:"art", part:"p" + i, text:p, src:{name:EX.article.title}}));
  const r = st.role && role();
  (r ? r.characters : []).forEach(ch => {
    const src = {name:ch.name, title:ch.title, citation:ch.citation, cid:ch.id};
    parts.push({cid:ch.id, part:"email", text:ch.email, src});
    if (AE2) {   // every drawer can be opened, so every drawer can hold highlights
      ch.offers.forEach(o => parts.push({cid:ch.id, part:"d" + o.id, text:unscramble(o.text, `${S.salt}|${ch.id}|${o.id}`),
                                         src:{name:o.author, citation:o.citation, cid:ch.id, option:o.title}}));
      return;
    }
    const o = st.choices[ch.id] && ch.offers.find(x => x.id === st.choices[ch.id]);
    if (o) parts.push({cid:ch.id, part:"opt", text:unscramble(o.text, `${S.salt}|${ch.id}|${o.id}`), src:{...src, option:o.title}});
  });
  return parts;
}
function hlKey(cid, part, idx, s){ return `${cid}|${part}|${idx}|${fnv(s.trim()).toString(36)}`; }
function hlRegistry(){
  const reg = {}; let order = 0;
  hlSources().forEach(p => {
    let idx = 0;
    splitSentences(p.text).forEach(s => { if (isSentence(s)) { reg[hlKey(p.cid, p.part, idx, s)] = {t:s.trim(), src:p.src, cid:p.cid, n:order++}; idx++; } });
  });
  return reg;
}
// Text -> HTML with each sentence wrapped in a tappable span (the text itself is unchanged).
function hlHTML(text, cid, part){

}

function openPalette(span){

    + (TAGS ? `<div class="lbl">Matters for</div><div class="row">${S.decisions.map(d => `<button type="button" class="tg" data-dec="${d.id}" aria-pressed="${t.d.includes(d.id)}" title="${esc(d.title)}">${esc(decLabel(d.id))}</button>`).join("")}

    if (TAGS && !b.classList.contains("rm")) {   // colour and tags: the palette stays open until Done
      const sel = b.dataset.part ? `[data-part="${b.dataset.part}"]` : b.dataset.dec ? `[data-dec="${b.dataset.dec}"]` : `[data-col="${b.dataset.col}"]`;

// Harvard in-text citation from a reference: one author (Smith, 2024), two (Smith and Jones, 2024),
// three or more (Smith et al., 2024), or a body with no comma (World Bank, 2023).
function citeOf(citation){
  const y = (citation || "").match(/\((\d{4}[a-z]?)\)/);
  if (!y) return "";
  const who = citation.slice(0, y.index).trim().replace(/,$/, "");
  const names = who.split(/\s*(?:&|\band\b)\s*|,\s*(?=[^,]*,)/)
                   .map(s => s.replace(/,\s*([A-Z]\.?\s*)+$/, "").replace(/\s+([A-Z]\.\s*)+$/, "").replace(/,$/, "").trim())
                   .filter(s => s && !/^([A-Z]\.\s*)+$/.test(s));
  if (!names.length) return "";
  const auth = names.length === 1 ? names[0] : names.length === 2 ? `${names[0]} and ${names[1]}` : `${names[0]} et al.`;
  return `(${auth}, ${y[1]})`;
}
function notebookHTML(inSubmit){
  const reg = hlRegistry();
  const items = Object.entries(st.hl || {}).filter(([k, col]) => reg[k] && HLC[col]).map(([k, col]) => ({k, col, ...reg[k]})).sort((a, b) => a.n - b.n);
  const byColour = st.hlGroup !== "source";
  const tools = `<div class="tools"><span>Show by</span><button type="button" data-grp="colour" aria-pressed="${byColour}">colour</button><button type="button" data-grp="source" aria-pressed="${!byColour}">source</button>
    ${items.length ? `<button type="button" class="linkish" data-clear="1" style="margin-left:auto">Clear all highlights</button><span data-clearask hidden>Remove all ${items.length}? <button type="button" class="linkish" data-clearyes="1">Yes, clear them</button> · <button type="button" class="linkish" data-clearno="1">Keep them</button></span>` : ""}</div>`;
  let shown = items, filt = "";
  if (items.length) {   // one filter, in a single grouped list: part of the argument (new AE format), decision, source, colour
    const f = (st.nbf || {}).one || "", names = [...new Set(items.map(x => x.src.name))];
    const [kind, val] = f ? [f.slice(0, 1), f.slice(2)] : ["", ""];
    shown = items.filter(x => { const t = tagsOf(x.k);
      return !kind || (kind === "p" && (val === "-" ? !t.p : t.p === val)) || (kind === "d" && (val === "-" ? !t.d.length : t.d.includes(val)))
          || (kind === "s" && x.src.name === val) || (kind === "c" && x.col === val); });
    const opt = (v, t) => `<option value="${esc(v)}" ${f === v ? "selected" : ""}>${esc(t)}</option>`;
    const grp = (label, opts) => `<optgroup label="${esc(label)}">${opts.join("")}</optgroup>`;
    filt = `<div class="nbf"><label>Show <select data-f="one">${opt("", "all highlights")}
      ${AE2 ? grp("Part of the argument", [...TAG_PARTS.map(x => opt("p:" + x, x)), opt("p:-", "no part tag yet")]) : ""}
      ${TAGS ? grp("Decision", [...S.decisions.map(d => opt("d:" + d.id, decLabel(d.id))), opt("d:-", "no decision tag yet")]) : ""}
      ${grp("Source", names.map(n => opt("s:" + n, n)))}
      ${grp("Colour", HL.map(([k, name]) => opt("c:" + k, hlLabel(k) || name)))}</select></label>
      ${shown.length < items.length ? `<span>${shown.length} of ${items.length}</span>` : ""}</div>`;
  }
  if (!items.length) return tools + `<p class="nb-empty">Tap any sentence in ${EXAM ? (EX.article ? "the Situation, the Article or the Emails" : "the Situation or the Reading tab") : `the Context or ${AE2 ? "Research" : "Inbox"}`} to highlight it. Your highlights collect here${inSubmit ? "" : " and next to your writing"}.</p>`;
  const groups = [];
  if (byColour) HL.forEach(([key, name, c]) => { const g = shown.filter(x => x.col === key); if (g.length) groups.push({head:`<i style="background:${c}"></i>${esc(hlLabel(key) || name)}`, g}); });
  else { const seen = []; shown.forEach(x => { if (!seen.includes(x.src.name)) seen.push(x.src.name); }); seen.forEach(nm => groups.push({head:esc(nm), g:shown.filter(x => x.src.name === nm)})); }
  const card = x => {
    const cite = inSubmit && S.course === "AE" && x.src.citation ? citeOf(x.src.citation) : "";
    return `<div class="nb-card" style="border-left-color:${HLC[x.col]}">
      <p class="s" role="button" tabindex="0" data-jump="${esc(x.k)}" title="Show this sentence where it came from">${esc(x.t)}</p>
      <div class="src"><span>${esc(hlLabel(x.col) || hlName(x.col))}${TAGS ? tagChips(x.k) : ""} · ${esc(x.src.name)}${x.src.title ? ", " + esc(x.src.title) : ""}${x.src.option ? ` (“${esc(x.src.option)}”)` : ""}</span>
        ${cite ? `<button type="button" class="citebtn" data-cite="${esc(cite)}" aria-label="Insert ${esc(cite)} into your text">Cite ${esc(cite)}</button>` : ""}</div>
      ${S.course === "AE" && x.src.citation ? `<div class="src">${esc(x.src.citation)}</div>` : ""}</div>`;
  };
  return tools + filt + (shown.length ? "" : `<p class="nb-empty">No highlights match this filter.</p>`)
    + groups.map(G => `<div class="nb-group">${G.head}</div>` + G.g.map(card).join("")).join("");
}
function refreshNotebook(){
  document.querySelectorAll("[data-nb]").forEach(el => { el.innerHTML = notebookHTML(el.dataset.nb === "submit"); });
  const n = Object.keys(hlRegistry()).filter(k => (st.hl || {})[k]).length, c = document.getElementById("nbcount");
  if (c) c.textContent = n ? ` (${n})` : "";
}
let memoPos = null;   // where Cite inserts: the last cursor position in the memo
function insertCite(cite){
  const m = document.getElementById("memo"); if (!m) return;
  const v = m.value, pos = memoPos == null ? v.length : Math.min(memoPos, v.length);
  const before = v.slice(0, pos), after = v.slice(pos);
  const ins = (before && !/[\s(]$/.test(before) ? " " : "") + cite;
  m.value = before + ins + after; st.memo = m.value; save();
  memoPos = pos + ins.length; m.focus(); m.setSelectionRange(memoPos, memoPos);
  m.dispatchEvent(new Event("input"));
}
function jumpTo(k){
  const tab = k.startsWith("ctx|") ? "context" : "inbox";
  if (st.tab !== tab) { st.tab = tab; save(); render(); }
  const sp = document.querySelector(`.hs[data-k="${CSS.escape(k)}"]`);
  if (!sp) return;
  const d = sp.closest("details"); if (d) d.open = true;
  sp.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
  sp.classList.remove("flashy"); void sp.offsetWidth; sp.classList.add("flashy"); sp.focus({preventScroll:true});
  setTimeout(() => sp.classList.remove("flashy"), 1300);
}
// a folded reminder of the decisions on the Inbox/Research tab, so "Decision 2" means something while reading
const decQuestion = d => d.title.includes("—") ? d.title.replace(/^[^—]*—\s*/, "") : d.title;
function decStripHTML(){
  if (!TAGS) return "";
  return `<details class="cc decstrip" id="decstrip" ${st.decOpen ? "open" : ""}><summary><span>The ${num(S.decisions.length)} decisions you're reading for</span></summary>
    <ol>${S.decisions.map(d => `<li><b>${esc(decLabel(d.id))}:</b> ${esc(decQuestion(d))}</li>`).join("")}</ol></details>`;
}
document.addEventListener("toggle", e => { if (e.target.id === "decstrip") { st.decOpen = e.target.open; save(); } }, true);
function colourCodeHTML(){
  const set = HL.filter(([k]) => hlLabel(k)).length;
  return `<details class="cc"><summary>${HL.map(([,,c]) => `<i style="background:${c}"></i>`).join("")}<span>My colour code${set ? "" : " — tap any sentence to highlight it"}</span></summary>
    <div class="grid">${HL.map(([k, name, c], i) => `<label><i style="background:${c}"></i><span class="sr" style="position:absolute;left:-9999px">${name}</span><input type="text" data-cc="${k}" maxlength="24" value="${esc(hlLabel(k))}" placeholder="${esc(HL_HINT[i])}" aria-label="${name} means"></label>`).join("")}</div></details>`;
}
// One set of listeners for all highlight interactions (click handlers only; no forms).
document.addEventListener("click", e => {
  const p = document.getElementById("hlpal");
  const hs = e.target.closest(".hs");
  if (hs) { e.preventDefault(); openPalette(hs); return; }
  if (p && !p.hidden && !e.composedPath().includes(p)) closePalette(false);   // (the palette may have redrawn under the click)
  const g = e.target.closest("[data-grp]");
  if (g) { const box0 = g.closest("[data-nb]"), grp = g.dataset.grp; st.hlGroup = grp; save(); refreshNotebook();
           const again = box0 && box0.querySelector(`[data-grp="${grp}"]`); if (again) again.focus(); return; }
  const j = e.target.closest("[data-jump]"); if (j) { jumpTo(j.dataset.jump); return; }
  const c = e.target.closest("[data-cite]"); if (c) { insertCite(c.dataset.cite); return; }
  const box = e.target.closest("[data-nb]");
  if (e.target.closest("[data-clear]")) { box.querySelector("[data-clearask]").hidden = false; e.target.hidden = true; box.querySelector("[data-clearno]").focus(); return; }
  const head = () => { const h = document.getElementById("nbhead"); if (h) h.focus(); };
  if (e.target.closest("[data-clearno]")) { refreshNotebook(); head(); return; }
  if (e.target.closest("[data-clearyes]")) {
    st.hl = {}; save();
    document.querySelectorAll(".hs.on").forEach(sp => { sp.classList.remove("on"); sp.style.background = ""; sp.removeAttribute("aria-describedby"); });
    refreshNotebook(); head();
    const live = document.getElementById("nblive"); if (live) { live.textContent = ""; setTimeout(() => { live.textContent = "All highlights cleared."; }, 50); }
    return;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { const p = document.getElementById("hlpal"); if (p && !p.hidden) { closePalette(true); return; } }
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t.classList && (t.classList.contains("hs") || t.dataset.jump)) {
    e.preventDefault();                         // Space would scroll the page
    if (e.key === "Enter") { if (t.classList.contains("hs")) openPalette(t); else jumpTo(t.dataset.jump); }
  }
});
document.addEventListener("keyup", e => {      // Space acts on release, so the palette doesn't catch the same key
  const t = e.target;
  if (e.key === " " && t.classList && (t.classList.contains("hs") || t.dataset.jump)) { if (t.classList.contains("hs")) openPalette(t); else jumpTo(t.dataset.jump); }
});
document.addEventListener("change", e => {   // ae2 note filters
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  const box = e.target.closest("[data-nb]");
  st.nbf = st.nbf || {}; st.nbf[f] = e.target.value; save(); refreshNotebook();
  const again = box && box.querySelector(`select[data-f="${f}"]`); if (again) again.focus();
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.cc;
  if (k) { st.hlLabels = st.hlLabels || {}; st.hlLabels[k] = e.target.value; save(); refreshNotebook(); hlDescs(); }
});

  : [["context","Situation"], ["reading","Reading"], ...(EX.listening ? [["listening","Listening"]] : []), ["decisions","Decisions"], ["submit","Write & submit"]]) : [];

    <div class="wrap"><nav class="tabs" role="tablist">${tabs.map(([k,l]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${st.tab===k}">${l}${k==="inbox"&&pending?`<span class="dot" title="${pending} choice(s) still open"></span>`:""}</button>`).join("")}</nav></div></header>
  ${HO ? `<div class="wrap"><div class="handbanner"><b>Hand-over from ${esc(hoName)}</b> (${esc(roleName(r))})${handoverWhen(HO.made) ? ", saved " + esc(handoverWhen(HO.made)) : ""}.
    This tab shows their ${AE2 ? "papers" : "emails"}, what they chose and their highlights. Use it to tell your group what they found.

  <main class="wrap" id="main"></main>
  <footer class="wrap">${esc(S.disclaimer)}<br>Nothing you type here leaves this browser tab unless you copy it yourself.<br>
    ${HO || EXAM ? "" : `<button type="button" class="linkish" id="hoOut">Leaving early? Hand over your work</button>

    <button type="button" class="linkish" id="reset">${HO ? "Close this hand-over" : EXAM ? "Clear everything and start again" : "Start again (choose a new role)"}</button>
    <span id="resetAsk" hidden> ${HO ? "This clears the hand-over from this tab." : "This clears everything you've done, including your text."} <button type="button" class="linkish" id="resetYes">Yes, clear it</button> · <button type="button" class="linkish" id="resetNo">${HO ? "Keep it" : "Keep my work"}</button></span>
    ${HO || EXAM ? "" : `<div id="hoPanel" class="handin" hidden><b>Hand over your work</b>
      <p class="small">This saves what you've done so far in a small file: the ${AE2 ? "papers you opened" : "information you chose"}, your highlights and colour codes, your answers and your group's decisions. Your own writing isn't included. Send the file to a teammate by email, a chat app or AirDrop. They open it with "Open a teammate's hand-over" at the bottom of their page.</p>

      <p id="hoDone" class="small ok" aria-live="polite"></p></div>`}</footer>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { st.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0); });

    $("#hoDone").textContent = "Look in your Downloads and send the file to a teammate. Your work is still here too. If nothing downloaded, open this page in Safari, Chrome or Firefox (not inside an app) and try again.";

  ({context:tabContext, firstlook:tabFirstLook, listening:EXAM ? tabExamListening : tabListening, inbox:tabInbox, reading:tabReading, article:tabArticle, decisions:tabDecisions, submit:tabSubmit})[st.tab]();
}

function tabListening(){
  const L = S.listening, key = listeningAnswers(), done = !!(st.mcqDone && key);
  const n = L.questions.length, right = done ? L.questions.filter((q,i) => st.mcq[i] === key[i]).length : 0;
  $("#main").innerHTML = `
    <p>Your teacher will play <b>${esc(L.name)}</b>. Answer while you listen${key ? ", then press <b>Check my answers</b>" : " — your teacher will go through the answers afterwards"}.</p>
    ${L.questions.map((q,i) => `<div class="mcq"><b>${i+1}. ${esc(q.q)}</b>
      ${Object.entries(q.options).map(([k,v]) => {

        return `<label class="${cls}"><input type="radio" name="mcq_${i}" value="${k}" ${st.mcq[i]===k?"checked":""} ${done?"disabled":""}><span>${k}: ${esc(v)}</span></label>`;
      }).join("")}
      ${done ? (st.mcq[i] === key[i] ? `<p class="res ok">✓ Correct</p>` : `<p class="res no">✗ ${st.mcq[i] ? "Not quite" : "No answer"} — the answer is ${key[i]}</p>`) : ""}</div>`).join("")}
    ${!key ? "" : done
      ? `<div class="score">You got ${right} of ${n} right.</div>`
      : `<p style="margin-top:18px"><button type="button" class="btn" id="checkL">Check my answers</button>
           <span class="muted small">You can't change your answers afterwards.</span></p><p id="checkMsg" class="small" aria-live="polite"></p>`}`;
  if (done) return;
  $("#main").onchange = e => { if (e.target.name && e.target.name.startsWith("mcq_")) { st.mcq[e.target.name.split("_")[1]] = e.target.value; save(); } };
  const b = $("#checkL");
  if (b) b.onclick = () => {
    const missing = L.questions.map((q,i) => st.mcq[i] ? null : i+1).filter(Boolean);
    if (missing.length && !b.dataset.sure) {
      $("#checkMsg").textContent = `You haven't answered question${missing.length>1?"s":""} ${missing.join(", ")}. Press the button again to check anyway.`;
      b.dataset.sure = "1"; return;
    }
    st.mcqDone = true; save(); tabListening();
  };
}

/* ---------- exam questions (no answers in the page: the teacher tool marks them) ---------- */
const qItems = sec => ((EX && EX[sec] && EX[sec].parts) || []).flatMap(p => p.items.map(it => ({...it, part: p})));
const QN = {};   // question numbers run through each section, as on a paper (reading 1–n, listening 1–n)
["reading", "listening"].forEach(sec => qItems(sec).forEach((it, i) => { QN[it.id] = i + 1; }));
const answered = it => String((st.ans || {})[it.id] || "").trim() !== "";
function qCount(sec){ const a = qItems(sec); return `${a.filter(answered).length} of ${a.length} answered`; }
const initials = t => t.trim().split(/\s+/).map(w => w.charAt(0)).join("").toUpperCase();   // "Not given" -> "NG": no need to show the key
function qOptsHTML(it, opts){
  const v = (st.ans || {})[it.id] || "", ent = Object.entries(opts);
  const long = ent.length > 6;   // a long list (e.g. seven headings): a drop-down; otherwise every option stays visible
  if (long) return `<select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">Choose…</option>${ent.map(([k, t]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}. ${esc(t)}</option>`).join("")}</select>`;
  const short = ent.every(([, t]) => t.length <= 12);   // in a row only for True / False / Not given and the like

function qPartHTML(p){
  const num = it => QN[it.id];
  let body;
  if (p.type === "gap") {
    const opts = Object.entries(p.options);
    const sel = id => { const v = (st.ans || {})[id] || ""; return `<select data-q="${esc(id)}" aria-label="Question ${QN[id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`; };
    const ids = Object.fromEntries(p.items.map(it => [it.id.split(".").pop(), it.id]));   // [[2]] in the text = item R4.2
    body = `<div class="prose gaptext">${p.text.split("\n\n").map(par => `<p>${esc(par).replace(/\[\[(\d+)\]\]/g, (m, n) => ids[n] ? `<b>(${QN[ids[n]]})</b> ${sel(ids[n])}` : m)}</p>`).join("")}</div>
      <ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>`;
  } else if (p.type === "shared" && Object.keys(p.options).length > 6) {   // e.g. headings: the list once, a letter per item
    const opts = Object.entries(p.options);
    body = `<ul class="gapopts">${opts.map(([k, t]) => `<li><b>${esc(k)}</b> ${esc(t)}</li>`).join("")}</ul>` + p.items.map(it => {
      const v = (st.ans || {})[it.id] || "";
      return `<div class="qitem"><label><span class="qq" style="margin:0"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
        <select data-q="${esc(it.id)}" aria-label="Answer to question ${QN[it.id]}"><option value="">–</option>${opts.map(([k]) => `<option value="${esc(k)}" ${v === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label></div>`;
    }).join("");
  } else {
    body = p.items.map(it => `<div class="qitem"><span class="qq"><b>${esc(num(it))}.</b> ${esc(it.q || "")}</span>
      ${p.type === "short" ? `<input type="text" data-q="${esc(it.id)}" maxlength="80" autocomplete="off" spellcheck="false" value="${esc((st.ans || {})[it.id] || "")}" aria-label="Answer to question ${QN[it.id]}">`
        : qOptsHTML(it, p.type === "shared" ? p.options : (it.options || {}))}</div>`).join("");
  }
  return `<section class="qpart" id="qp_${esc(p.id)}"><h3>${esc(p.title)}</h3>${p.instructions ? `<p class="inst">${esc(p.instructions)}</p>` : ""}${body}</section>`;
}

function callName(n){   // "Dr. Elena Whitfield" -> "Dr. Whitfield"; "Freja Lund" -> "Freja"
  const m = n.match(/^(Dr\.?|Prof\.?|Professor)\s+.*\s(\S+)$/);

function mailHTML(c){
  const chosen = st.choices[c.id];
