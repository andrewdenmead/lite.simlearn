<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Ashworth &amp; Vale: The Check Inquiry (Pro) — SimLearn</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Lite-style single column. Plain header, five tabs, a task line on every tab, content as cards and emails. */
:root{
  /* Lite's palette and fonts (studio/template.html), with Pro marked by Lite's amber on tabs and badge. Light only, like Lite. */
  --bg:#FBFBF8; --surface:#ffffff; --sunk:#ECEFF3; --ink:#1D2733; --muted:#4A5562; --line:#D4D9E1;
  --blue:#2C5282; --blue-soft:#EEF3F9; --amber:#C98A1B; --amber-soft:#FBF1DC;
  --good:#2F6B47; --good-soft:#E3F0E7; --bad:#9B2C2C; --bad-soft:#F7E4E4; --warn:#7A5A0E; --warn-soft:#FBF1DC; --proto:#FBF1DC;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

.proto{background:var(--proto);border-bottom:1px dashed var(--line);font-size:13px}
.proto .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:7px}
.proto b{color:var(--amber);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--blue)}
header .wrap{padding-block:18px 0}
.brand{font-weight:800;color:var(--blue);font-size:14px;letter-spacing:.02em}
.brand span{background:var(--amber);color:#fff;border-radius:4px;padding:0 6px;margin-left:4px;font-size:12px}
h1{font-size:clamp(26px,4.5vw,34px);font-weight:800;margin-top:4px}
.whoami{color:var(--muted);font-size:14.5px;margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs button:disabled{opacity:.4;cursor:default}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:6px;vertical-align:middle}

main .wrap{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.task{background:var(--blue-soft);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:baseline}
.task b{color:var(--blue);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:21px;font-weight:800}
.card h3{font-size:17px;font-weight:700}
.step{font-family:var(--mono);font-size:12px;color:var(--blue)}
.muted{color:var(--muted)}
.small{font-size:14px}
.pic{aspect-ratio:16/7;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:6px;padding:8px 12px}
.fact .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.fact .v{font-weight:700}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.role{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.role[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.role b{font-size:16.5px}
.role span{font-size:14px;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.person{border-left:3px solid var(--line);padding:2px 12px}
.person b{display:block}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.choice:disabled{cursor:default}
.choice:disabled:not([aria-pressed="true"]){opacity:.5}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--blue)}
.choice small{color:var(--muted);font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{background:var(--good-soft);color:var(--good);border-radius:6px;padding:8px 12px;font-weight:600}

/* emails */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.mail summary::-webkit-details-marker{display:none}
.mail .from{font-weight:400}
.mail .lbl{color:var(--muted);font-weight:400;margin-right:2px}
.mail.unread .from,.mail.unread .subj{font-weight:700;color:var(--ink)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
.mail .subj{grid-column:1/2;color:var(--muted);font-size:14.5px}
.mail .tag{grid-row:1/3;grid-column:2;align-self:center}
.mail[open] summary{border-bottom:1px solid var(--line);background:var(--bg)}
.mail .body p,.card>p,.attach>p{font-family:var(--serif);font-size:1.02rem;line-height:1.62}
.mail .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sig{color:var(--muted)}
.attach{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.attach .an{font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.fine{font-size:13px;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.rel{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.rel-high{background:var(--good-soft);color:var(--good)}
.rel-medium{background:var(--warn-soft);color:var(--warn)}
.rel-low{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.9em}
svg text{fill:var(--muted);font-family:var(--ui);font-size:12px}
svg .lab{fill:var(--ink);font-size:13px}
svg .val{fill:var(--ink);font-family:var(--mono);font-size:12px}
svg .axis{stroke:var(--line)} svg .zero{stroke:var(--muted)}
svg .neg{fill:var(--bad)} svg .pos{fill:var(--good)}
svg .ring-bg{stroke:var(--sunk);fill:none} svg .ring{stroke:var(--amber);fill:none}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.donuts figure{margin:0;text-align:center;font-size:13.5px}

/* audio placeholder */
.audio{background:var(--blue-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.audio .play{width:36px;height:36px;border-radius:50%;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);cursor:not-allowed}
.audio .t{font-weight:700}
.audio .s{font-size:13px;color:var(--muted)}
.audio details{grid-column:1/-1;font-size:14px}
.audio summary{cursor:pointer;color:var(--blue);font-weight:600}
.script{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.sd{font-style:italic;color:var(--muted);font-size:13.5px}

/* investigate */
.qs{display:flex;flex-direction:column;gap:8px}
.q{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.q[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.q:disabled:not([aria-pressed="true"]){opacity:.45;cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.two>*{min-width:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tc{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:none}
.tc[draggable="true"]{cursor:grab}
.tc.dragging{opacity:.4}
.tc.over{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.tc .n{font-family:var(--mono);color:var(--muted);text-align:center}
.tc .d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--good)}
.tc .arr{display:flex;gap:4px}
.tc .arr button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.tc .arr button:disabled{opacity:.3;cursor:default}
.tl.ok .tc{border-color:var(--good)}
.note-strong{background:var(--amber-soft);border-radius:8px;padding:8px 12px}
.hint{background:var(--warn-soft);border-radius:6px;padding:9px 12px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 12px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{font-size:14.5px}

textarea{width:100%;min-height:200px;resize:vertical;font:inherit;line-height:1.6;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.wc{font-family:var(--mono);font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tile{background:var(--bg);border-radius:6px;padding:10px 12px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.sn{cursor:pointer;border-radius:3px;transition:background .15s}
.sn:hover{box-shadow:inset 0 -2px 0 var(--amber)}
#hlpal{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#hlpal[hidden]{display:none}
#hlpal button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer}
#hlpal .none{background:var(--surface);color:var(--muted)}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#fab[hidden],#nb[hidden]{display:none}
#nb{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:25;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;box-shadow:-6px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.nbhead{display:flex;justify-content:space-between;align-items:center}
.nbhead h2{font-size:18px}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:14px;cursor:pointer}
.cc summary{cursor:pointer;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px}
.cc i,.nbgroup i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.ccgrid{display:grid;gap:6px;margin-top:8px}
.ccgrid label{display:flex;gap:8px;align-items:center}
.ccgrid input{flex:1;font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.nbadd{display:flex;flex-direction:column;gap:6px}
.nbadd textarea{min-height:60px;font-size:14px}
.btn.small{padding:6px 12px;font-size:14px}
.nbgroup{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;margin-top:6px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:8px 10px}
.nbcard p{font-family:var(--serif);font-size:15px;line-height:1.5}
.nbcard .src{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.gate{border:2px dashed var(--amber)}
.coderow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coderow input,.numin{font-family:var(--mono);font-size:18px;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:12ch}
.bigcode{font-family:var(--mono);font-size:34px;letter-spacing:.2em;color:var(--good);border:2px solid var(--good);border-radius:8px;padding:6px 18px;align-self:flex-start}
.pzq{display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--line);padding-top:10px}
.opts2{display:flex;flex-wrap:wrap;gap:6px}
.opts2 .opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.msg{color:var(--bad);font-size:14px}
.sortq{display:flex;flex-direction:column;gap:8px}
.sortrow{display:grid;grid-template-columns:1fr minmax(170px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.sortrow p{font-family:var(--serif);font-size:15px}
.sortrow select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:560px){.sortrow{grid-template-columns:1fr}}
.swipe{display:none}@media (max-width:560px){.lic{font-size:12.5px}.lic th,.lic td{padding:4px 5px}.lic th{font-size:10px}.swipe{display:block}}
.opts2 .opt{text-align:left}
svg .sa{fill:var(--blue)} svg .sb{fill:var(--amber)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sums{width:100%;font-size:14px}
.sums td.num{white-space:nowrap}
.sums tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

/* Lite's hand-in (studio/template.html), added for the Pro hand-in */
.consent{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin:6px 0}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:8px}
.consent input{margin-top:5px;width:18px;height:18px}
.issues{color:var(--warn);font-size:.92rem}
.block{width:100%;min-height:260px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--blue);border-radius:10px;padding:10px 12px;background:#fff;white-space:pre-wrap;box-sizing:border-box}
.ok{color:var(--good);font-weight:600}
#out{display:flex;flex-direction:column;gap:10px}

/* the stop after the role choice and the Who's who tab (_pro_common, 11 Nov 2026) */
.stopc{border:2px solid var(--bad);background:var(--bad-soft)}
.stophead{display:flex;gap:12px;align-items:center}
.stophead h2{margin:0;font-size:1.1rem;line-height:1.35}
.stopsign{flex:none;display:grid;place-items:center;width:58px;height:58px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.ov{display:flex;flex-direction:column}
.ovteam{border:2px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:10px 12px}
.ovteam>b{display:block;font-size:16px}
.ovteam>small,.ovout>small{color:var(--muted);font-size:13px}
.ovdepts,.ovorgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:6px;margin-top:8px}
.ovdept,.ovorg{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;line-height:1.3}
.ovdept.you{border:2px solid var(--amber);background:var(--amber-soft)}
.ovdept small,.ovorg small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ovstem{width:2px;height:20px;background:var(--muted);margin:0 auto}
.ovout{border:1.5px dashed var(--muted);border-radius:10px;padding:8px 12px 12px}
.ovout>b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.worghead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.worghead h2{margin:0}
.wrel{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:1px 9px}
.wteam{border-color:var(--blue)}
.wppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.wp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.wp.dim{opacity:.55}
.av{position:relative;flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wpt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wjob{font-size:13.5px;color:var(--muted)}
.wline{font-size:14.5px;margin-top:2px}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.wtag.mine{background:var(--amber-soft);color:var(--warn)}
.wtag.boss{background:var(--blue-soft);color:var(--blue)}
.wtag.wit{background:var(--good-soft);color:var(--good)}
.walso{margin:0;padding-left:1.1rem}
.walso li{margin:3px 0}

/* Say it simply (_pro_common, 11 Nov 2026) */
#hlpal{flex-wrap:wrap;max-width:calc(100vw - 16px);border-radius:18px}
#hlpal .simpb{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--blue);border-color:var(--blue);color:#fff;font-family:inherit;font-weight:600;font-size:13px;white-space:nowrap}
#hlpal .simpb[hidden]{display:none}
.sn.sopen{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.simp{position:relative;margin:6px 0 10px;padding:8px 36px 8px 12px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:8px;font-size:15px;line-height:1.45}
.simp .simpl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.simp .simpx{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;border-radius:50%}
.simp .simpx:hover{background:var(--surface)}
</style>
</head>
<body>


<header><div class="wrap">
  <div class="brand">SimLearn<span>PRO</span></div>
  <h1>Ashworth &amp; Vale: The Check Inquiry</h1>
  <p class="whoami" id="who"></p>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

/* charts: a line chart with one line per group */
function lines(series,label,ylo,yhi,ticks,marks){
  const W=500,H=200,l=40,r=12,t=12,b=34,w=W-l-r,h=H-t-b,all=series[0].pts,x0=all[0][0],x1=all[all.length-1][0];
  const X=x=>l+w*(x-x0)/(x1-x0), Y=y=>t+h*(yhi-y)/(yhi-ylo);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">`;
  [ylo,(ylo+yhi)/2,yhi].forEach(v=>{s+=`<line class="axis" x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  ticks.forEach(([x,txt])=>{s+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle">${txt}</text>`;});
  (marks||[]).forEach(([x,txt])=>{s+=`<line class="zero" stroke-dasharray="3 3" x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${t+h}"/><text class="lab" x="${X(x)+4}" y="${t+12}">${txt}</text>`;});
  series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.c}" stroke-width="2.5" points="${se.pts.map(([x,y])=>X(x)+","+Y(y)).join(" ")}"/>`;});
  return `<div class="legend">${series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join("")}</div>`+s+"</svg>";
}

    <p>Ashworth &amp; Vale has spent over a century turning a single design into shorthand for quiet British luxury. Since 1911, its navy, bottle-green and black tartan check, still woven at the company's mill in Yorkshire, has appeared on trench coats, scarves and leather goods carried by three generations of loyal customers, who paid a premium precisely because so few other people owned one.</p>

.2", "The money from licences went down before sales went up. It took five to seven years to recover completely."], "The first sign is usually a stockist's order, about a year in.": ["x1.3", "The first sign usually comes from a store's order, after about a year."], "Houses that only added monitoring got reports that nobody was obliged to act on.": ["x1.4", "Brands that only started watching the problem got reports, but nobody had to do anything about them."], "A warning that can be filed away usually is.": ["x1.5", "If people can put a warning away and forget it, they usually do."], "A licence can be ended at renewal, which costs nothing; under a reputation clause, which needs evidence; or by buying the licensee out, usually about a year's royalties.": ["x2.1", "There are three ways to end a licence: when it is renewed, which costs nothing; with a clause about reputation, which needs evidence; or by paying the partner to leave, which usually costs about one year of licence money."], "The evidence licensees accept is a trade partner's: a retailer or stockist saying, in writing, that the goods are hurting the brand.": ["x2.2", "The evidence that partners accept comes from a business partner: a shop or a store that says, in writing, that the products are harming the brand."], "Limits on categories and shops in new contracts are normal.": ["x2.3", "It is normal for new contracts to limit which products can be made and which shops can sell them."], "Counterfeiters copy what is already easy to sell.": ["x3.1", "People who make fake products copy things that are already easy to sell."], "When a pattern is on cheap umbrellas and phone cases in legitimate shops, the designs, suppliers and buyers are ready-made, so heavily licensed patterns are faked far more often.": ["x3.2", "When a real pattern is on cheap umbrellas and phone cases in normal shops, the designs, the suppliers and the buyers are already there. So patterns with many licences are copied much more often."], "In my files, seizures usually start rising a year or two after a licensing push, not before it.": ["x3.3", "In my records, customs usually start finding more fakes one or two years after a company adds many licences, not before."], "Crackdowns stop organised sellers; market stalls are back within weeks.": ["x3.4", "Fighting fakes stops organised sellers, but the market stalls come back within a few weeks."], "Over-45s buy heritage brands for exclusivity and leave last.": ["x4.1", "People over 45 buy old luxury brands because they are exclusive, and they are the last to stop buying."], "Under-30s care more about cultural relevance, and trend buyers usually move on within two or three years.": ["x4.2", "People under 30 care more about what is popular in culture at the moment. People who follow trends usually lose interest after two or three years."], "The first to leave are the aspiring buyers in their late twenties to early forties.": ["x4.3", "The first people to stop buying are people in their late twenties to early forties who would like to own luxury brands but are not rich yet."], "When they see the brand on cheap goods, they quietly stop buying, and the survey numbers fall years before the sales do.": ["x4.4", "When they see the brand on cheap products, they stop buying without saying anything. The survey numbers fall years before the sales numbers fall."], "Investors ask two questions: was the warning clear enough to act on, and was there still time to act?": ["x5.1", "Investors ask two questions: was the warning clear enough to act on, and was there still enough time to act?"], "A “medium-high” rating with a recommendation and a deadline is a clear warning.": ["x5.2", "A “medium-high” rating (between medium and high), with advice about what to do and a deadline, is a clear warning."], "If that deadline passed before the outside events began, “we couldn't have known” rarely survives.": ["x5.3", "If the deadline passed before the events outside the company started, people rarely believe “we couldn't have known”."], "Boards that admit a missed warning early face one hard day of coverage; boards that are found out face months.": ["x5.4", "If a board says early that it missed a warning, there is one bad day in the news. If people find out about it later, there are months of bad news."], "Journalists check the order of events first: they put a company's own numbers next to its explanation.": ["x6.1", "Journalists first check the order of events. They put the company's own numbers next to the company's explanation."], "An “external factors” statement survives only if the outside cause came before the problem.": ["x6.2", "People only believe a statement that blames “things outside the company” if the outside cause happened before the problem."], "Legal approval protects you from being sued, not from being disbelieved.": ["x6.3", "If the lawyers approve a statement, it means nobody can take you to court. It does not mean people will believe you."], "Statements that hold up admit what the company controlled and say what it will change, with dates.": ["x6.4", "Good statements say what the company was responsible for and what it will change, with dates."], "I've sat on the Executive Committee for eleven years, so let me tell you how it looked from the inside.": ["w1.1", "I've been on the Executive Committee for eleven years, so let me tell you how things looked from inside."], "The audit was one input among many.": ["w1.2", "The report was only one piece of information among many."], "It said “medium-high”, not “critical”, and the evidence was early.": ["w1.3", "It said the risk was “medium-high”, not “critical” (very serious), and the evidence was only the first signs."], "Meanwhile the royalties were paying for new looms at the mill.": ["w1.4", "At the same time, the money from licences was paying for new machines at the mill."], "Nobody in that room could have known a streetwear craze was coming.": ["w1.5", "Nobody in that room could know that a street fashion trend would start."], "Hindsight is a wonderful thing.": ["w1.6", "It's easy to know the answer when you look back."], "It recommended a pullback within eighteen months, yes.": ["w1.7", "Yes, it said we should reduce the licences within eighteen months."], "A recommendation, mind you, not an instruction.": ["w1.8", "But remember, it was advice, not an order."], "Committees get dozens of those.": ["w1.9", "Committees get lots of advice like that."], "About a dozen new budget licences the following year.": ["w1.11", "We added about twelve new licences for cheap products in the next year."], "And the licensee audits went to once a year.": ["w1.12", "And we checked the licence partners only once a year."], "Royalties.": ["w1.13", "The money from licences."], "No factories to build, no stock to hold.": ["w1.14", "We didn't have to build factories or store products."], "Every board likes income like that.": ["w1.15", "Every board likes money that comes in like that."], "Kenny Lomax, Pennine Rainwear.": ["w2.1", "I'm Kenny Lomax, from Pennine Rainwear."], "We make the budget raincoats and umbrellas with your check: eleven pounds a raincoat, sold in supermarkets up and down the country.": ["w2.2", "We make the cheap raincoats and umbrellas with your check pattern. A raincoat costs eleven pounds, and supermarkets all over the country sell them."], "We've held the licence for nine years and never missed a royalty payment.": ["w2.3", "We have had the licence for nine years, and we have always paid the licence money on time."], "Your lot came round once a year to check the stitching, and nobody ever asked us to sell less.": ["w2.4", "Your people came once a year to check how we sew the products, and nobody ever asked us to sell less."], "My contract's up for renewal in the spring, by the way.": ["w2.5", "And by the way, my contract must be renewed in the spring."], "Not on our lines.": ["w2.6", "There's no problem with our products."], "Our returns rate never moved.": ["w2.7", "The number of products people sent back never changed."], "To be honest, nobody's complaining about the quality.": ["w2.8", "To be honest, nobody is complaining about the quality."], "They're complaining it's everywhere.": ["w2.9", "They are complaining that the check is everywhere."], "Fewer products, higher prices, fewer shops?": ["w2.10", "Fewer products, higher prices and fewer shops?"], "I'd moan about it.": ["w2.11", "I would complain about it."], "But I'd rather have a smaller licence than none.": ["w2.12", "But I would prefer a smaller licence to no licence at all."], "Spring's your moment.": ["w2.13", "The spring is your chance."], "People in their late twenties and thirties, mostly.": ["w2.14", "Mostly people in their late twenties and thirties."], "The older crowd buy the real thing.": ["w2.15", "The older people buy the real, expensive products."], "Or they used to.": ["w2.16", "Or they did before."], "You've put the licensing programme first.": ["b1.1", "You have said that the licensing programme is the biggest reason."], "Then I'm not spending a penny on anything else until your report is in.": ["b1.2", "So I won't spend any money on anything else until your report arrives."], "I've frozen all new licence deals, and I've asked Rosie to tell our stockists that a plan with dates is coming.": ["b1.3", "I have stopped all new licence deals, and I have asked Rosie to tell our stores that a plan with dates is coming."], "Adrian's freeze has gone down well with the stockists.": ["b2.1", "The stores are happy that Adrian has stopped new licences."], "The buyer at Albion House, who was holding her autumn order, will keep our space in the York store for another season while she waits for the plan.": ["b2.2", "The buyer at Albion House was waiting to place her autumn order. Now she will keep space for us in the York store for one more season while she waits for the plan."], "She asked me one thing: “Will the check still be on phone cases at the station?”": ["b2.3", "She asked me one question: “Will the check still be on phone cases at the train station?”"], "Counterfeits, then.": ["b3.1", "So you think it's the fake products."], "I've approved a proper crackdown: customs alerts in every market, test purchases and court cases against the big sellers.": ["b3.2", "I have approved a serious fight against the fakes: warnings to customs in every market, buying products to test them, and court cases against the big sellers."], "It's £300,000 for the first year, but at least we'll be seen to act.": ["b3.3", "It costs £300,000 for the first year, but at least people will see that we are doing something."], "Seizures have almost doubled in a month, which is what happens when you file alerts everywhere: you find more.": ["b4.1", "Customs have found almost twice as many fakes in one month. That always happens when you send warnings everywhere: you find more."], "The market stalls were back within a fortnight, and no stockist has changed its order.": ["b4.3", "The market stalls came back within two weeks, and no store has changed its order."], "You've put the licensing programme second, so I've asked Meera to look into it as well.": ["b5.1", "You have said that the licensing programme is the second biggest reason, so I have asked Meera to look at it too."], "The trend, then.": ["b6.1", "So you think it's the trend."], "If we can't stop it, we can join it.": ["b6.2", "If we can't stop the trend, we can be part of it."], "I've asked the agency to sign three streetwear creators to wear the check properly: £80,000.": ["b6.3", "I have asked the agency to pay three street-fashion influencers to wear the check in a stylish way. It costs £80,000."], "The three creators have posted, and the under-25s loved it.": ["b7.1", "The three influencers have posted, and people under 25 loved it."], "Second-hand listings rose again; resale prices didn't.": ["b7.2", "More check items were offered second-hand again, but second-hand prices did not go up."], "One of Rosie's buyers rang to ask why we're paying people to make the check look cheaper.": ["b7.3", "One of Rosie's buyers phoned to ask why we are paying people to make the check look cheaper."], "Quality, then.": ["b8.1", "So you think it's the quality."], "I've ordered emergency audits of all 47 licensees this month: £180,000.": ["b8.2", "This month, I have ordered urgent quality checks of all 47 licence partners. It costs £180,000."], "If anyone's cutting corners, we'll know.": ["b8.3", "If anyone is saving money by doing bad work, we will find out."], "The emergency audits are done: 41 of the 47 licensees passed outright, and the other six had minor findings.": ["b9.1", "The urgent quality checks are finished: 41 of the 47 licence partners passed completely, and the other six had small problems."], "Nothing explains a 30% cut in a stockist's order.": ["b9.2", "Nothing here explains why a store cut its order by 30%."], "Quality isn't what the buyers are complaining about.": ["b9.3", "The buyers are not complaining about quality."], "Advertising, then.": ["b10.1", "So you think it's the advertising."], "I've asked the agency for a more premium version of the relaunch film: £120,000.": ["b10.2", "I have asked the agency to make a more luxurious version of the new advertising film. It costs £120,000."], "A new look might be exactly what the check needs.": ["b10.3", "Maybe a new style is exactly what the check needs."], "I showed the buyers the premium film.": ["b11.1", "I showed the more luxurious film to the buyers."], "They liked the look.": ["b11.2", "They liked how it looked."], "Then all three asked the same question: what's the plan?": ["b11.3", "Then all three asked the same question: what is the plan?"], "One called it “a beautiful advert for a check that's on everything”.": ["b11.4", "One buyer called it “a beautiful advert for a check that's on everything”."], "Adrian's first question from investors will be simple: which came first?": ["p1.1", "Investors will ask Adrian a simple first question: what happened first?"], "Ifeoma has written the main events on the office whiteboard, but some have no dates yet.": ["p1.2", "Ifeoma has written the main events on the whiteboard in the office, but some events have no dates yet."], "Put them in order around the moment the streetwear crowd picked up the check.": ["p1.3", "Put the events in order, before or after the time when young people in street fashion started wearing the check."], "Resale crash: about 60%, from early this year.": ["p1.4", "Second-hand prices fell a lot: by about 60%, since the start of this year."], "Prestige score, 25-to-40s: falling for about two and a half years.": ["p1.5", "Score for how special the brand is, among people aged 25 to 40: going down for about two and a half years."], "Stockists' order cuts: over the last two seasons.": ["p1.6", "The stores ordered less: in the last two seasons."], "Still missing: when the streetwear tagging started, the audit, the licensee audits and the seizures.": ["p1.7", "We still don't know when these things happened: when street-fashion fans started posting about the check, the brand report, the quality checks of licence partners, and the fakes found by customs."], "Tariq's audit recommended a pullback of budget-tier licences": ["p1.8", "Tariq's report said we should reduce the licences for cheap products"], "Resale prices crashed by about 60%": ["p1.9", "Second-hand prices fell by about 60%"], "Licensee quality audits were cut to once a year": ["p1.10", "Quality checks of licence partners were reduced to once a year"], "The prestige score among 25-to-40s started to fall": ["p1.11", "The score for how special the brand is, among people aged 25 to 40, started to go down"], "Three stockists cut their standing orders": ["p1.12", "Three stores reduced their regular orders"], "Counterfeit seizures started their steady climb": ["p1.13", "The number of fake products found by customs started to go up steadily"], "The audit's eighteen-month deadline passed": ["p1.14", "The report's eighteen-month deadline ended"], "Legal has cleared the communications team's draft statement for the investor pack, and tomorrow it goes to the company's brokers as an early briefing note.": ["p2.1", "The lawyers have approved the communications team's first draft of a statement for investors. Tomorrow it goes to the company's financial advisers as an early note."], "Before it does, Dot wants every sentence checked against what the whole team knows.": ["p2.2", "Before that, Dot wants someone to check every sentence against what the whole team knows."], "Decide whether each claim is true, misleading or false, and why.": ["p2.3", "For each claim, decide if it is true, misleading or false, and say why."], "Claim 1: The softening in premium sales is a recent development.": ["p2.4", "Claim 1: The fall in sales of our expensive products is a recent change."], "Claim 2: It follows a sudden flood of counterfeit goods across our markets.": ["p2.5", "Claim 2: The fall came after a sudden, large number of fake products in our markets."], "Claim 3: Our licensing programme has been stable for many years.": ["p2.6", "Claim 3: Our licensing programme has not changed for many years."], "Meera has pulled six licences from the full list of 47.": ["p3.1", "Meera has taken six licences from the full list of 47."], "Whatever the Board decides, Adrian wants to know what ending some licences would really involve.": ["p3.2", "Whatever the Board decides, Adrian wants to know what it would really mean to end some licences."], "Work out which licences matter, what clause 9 needs and what it would cost.": ["p3.3", "Find out which licences are important, what clause 9 needs and how much it would cost."], "Swipe the table sideways to see the royalties and renewal dates.": ["p3.4", "Move the table to the side to see the licence money and the dates when the licences must be renewed."], "Clause 9 (in every licence): Ashworth & Vale may end this licence early, with six months' notice, where written evidence from its trade partners shows that the licensed goods are damaging the reputation of the Check.": ["p3.5", "Clause 9 (in every licence): Ashworth & Vale can end this licence early, with six months' warning, if its business partners show in writing that the licensed products are harming the check's reputation."]};   // sentence as the page shows it -> [id, plain-English version]
